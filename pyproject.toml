[project]
name = "autokeeper"
version = "0.4.0"
description = "自动化 CoC 7 版中文跑团：自研 harness 上的多智能体守秘人，Claude / DeepSeek / 本地模型可换，模组导入与生成，彩色 ASCII 终端界面"
authors = [
    { name = "Sato shinji", email = "wwwsatoshinji@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "ddgs>=9.16.0",
    "filelock>=3.15",
    "httpx>=0.27",
    "jieba>=0.42.1",
    "jsonschema>=4.23",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "markitdown[docx,pdf]>=0.1.8",
    "mcp>=1.30.0",
    "networkx>=3.7",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.0",
    "pyfiglet>=1.0.4",
    "pypdfium2>=5.14.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "terminaltexteffects>=0.15.0",
    "textual>=6",
    "textual-canvas>=1.1.0",
    "textual-serve>=1.1.3",
    "typer>=0.27.3",
    "wcwidth>=0.9.2",
]

[project.scripts]
autokeeper = "autokeeper:main"

[project.optional-dependencies]
claude = [
    "claude-agent-sdk>=0.2.168",
]
graphrag = [
    "fastembed>=0.6",
    "lightrag-hku>=1.5.7",
]
art = [
    "ascii-magic>=2.7.5",
    "opencv-python-headless>=5.0.0.93",
    "rembg>=2.0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "skills-ref>=0.1.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Chinese text is full of full-width punctuation; Textual declares BINDINGS as class lists.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008"]
