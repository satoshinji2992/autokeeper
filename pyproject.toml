[project]
name = "autokeeper"
dynamic = ["version"]
description = "自动化 CoC 7 版中文跑团：自研 harness 上的多智能体守秘人，Claude / DeepSeek / 本地模型可换，模组导入与生成，彩色 ASCII 终端界面"
authors = [
    { name = "Sato shinji", email = "wwwsatoshinji@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["trpg", "call-of-cthulhu", "coc7", "tabletop", "llm", "textual"]
classifiers = [
    "Environment :: Console",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "aiohttp>=3.9",
    # Pictures as coloured characters with the library in the wheel; elsewhere the chafa program.
    "chafa.py>=1.2.0; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64') or sys_platform == 'darwin'",
    "ddgs>=9.16.0",
    "filelock>=3.15",
    "httpx>=0.27",
    "ifaddr>=0.2",
    "jieba>=0.42.1",
    "jsonpatch>=1.33",
    "jsonschema>=4.23",
    "langchain>=1.4.6",
    "langchain-core>=1.6.12",
    "langchain-deepseek>=1.1.1",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "markitdown[docx,pdf,xlsx]>=0.1.8",
    "networkx>=3.7",
    "pillow>=10.4",
    "platformdirs>=4.13.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.16.0",
    "pyfiglet>=1.0.4",
    "pypdfium2>=5.14.0",
    "pypinyin>=0.55.0",
    "python-dotenv>=1.0",
    "python-slugify>=9.1.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "skills-ref>=0.1.1",
    "terminaltexteffects>=0.15.0",
    "textual>=6",
    "textual-canvas>=1.1.0",
    "textual-serve>=1.1.3",
    "typer>=0.27.3",
    "wcwidth>=0.9.2",
]

[project.urls]
Homepage = "https://github.com/satoshinji2992/autokeeper"
Source = "https://github.com/satoshinji2992/autokeeper"
Changelog = "https://github.com/satoshinji2992/autokeeper/blob/main/CHANGELOG.md"

[project.scripts]
autokeeper = "autokeeper:main"

[project.optional-dependencies]
claude = [  # the game itself is model-agnostic: the Claude backend is an extra, like the knowledge base
    "claude-agent-sdk>=0.2.168",
]
graphrag = [
    "fastembed>=0.6",
    "lightrag-hku>=1.5.7",
]
art = [
    "ascii-magic>=2.7.5",
    "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/autokeeper/__init__.py"

# The wheel carries the game and what it needs to run from any folder: the bundled modules,
# the shared skills and the dice bridge, under autokeeper/bundle/ (paths.BUNDLE). Never the
# originals of a module (source/), imports, compiled skills, saves or developer output.
[tool.hatch.build.targets.wheel]
only-include = ["src/autokeeper", "modules", "skills", "bridge/bcdice_bridge.mjs", "bridge/package.json", "bridge/package-lock.json"]
exclude = ["/modules/local", "/modules/inbox", "/modules/README.md", "/modules/*/source", "/modules/**/*.pdf", "/skills/module-*", "/src/autokeeper/bundle"]
dev-mode-dirs = ["src"]  # `uv sync` puts src/ on the path; the checkout keeps its own modules, skills and bridge

[tool.hatch.build.targets.wheel.sources]
"src" = ""
"modules" = "autokeeper/bundle/modules"
"skills" = "autokeeper/bundle/skills"
"bridge" = "autokeeper/bundle/bridge"

[tool.hatch.build.targets.sdist]
skip-excluded-dirs = true  # an old checkout's .agents/skills and .claude/skills link to skills/: walked first, they would hide it
exclude = ["/docs", "/dev", "/.github", "/.agents", "/.claude", "/data", "/saves", "/modules/local", "/modules/inbox", "/modules/*/source", "/skills/module-*", "/bridge/node_modules"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
# Chinese text is full of full-width punctuation; Textual declares BINDINGS as class lists.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "RUF012", "B008"]
