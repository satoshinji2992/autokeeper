npcs:
- id: doreen_ratger
  name: 多琳·拉特格
  role: 出租屋的女主人，退休在家
  look: 围裙上永远有面粉，头发挽得一丝不乱
  personality: 热心、话多，用忙碌压住害怕
  voice: 边说边收拾东西，“你们先吃，吃完再说”
  goal: 让客人住得安稳，别在饭桌上谈死人
  knows:
  - 镇上哪家有人病了、哪家刚办完丧事
  - 安特医生的诊所怎么走，能画一张地图
  - 卡洛琳·达维尔小姐和埃里·赫琴斯先生当年“没结婚就那样来往”的旧事
  - 原卡德威尔家那栋破农舍的种种传闻
  secrets:
  - 她自己也咳了两天，瞒着没说
  lies:
  - “我们这儿就是普通流感，年年都有。”
  clues:
  - c_map
  - c_gossip
  - c_cardwell_story
  gates: {}
  location: ratger_house
  portrait: doreen
  stats: {}
  arc: ''
