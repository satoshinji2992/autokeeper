  name: 安娜·伊斯特曼
  role: 邮局职员，萨缪尔·伊斯特曼的遗孀
  look: 黑衣，袖口磨得发亮，头发挽得紧，眼睛红着
  personality: 用工作压住悲痛；一旦开口就停不下来
  voice: 说着说着声音会低下去，“你别笑话我”
  goal: 找个人说说她丈夫临死前究竟怎么了
  knows:
