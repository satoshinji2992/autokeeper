  - 萨缪尔说“他回家了。他本来就在这，但他现在又回来了。”
  - 萨缪尔说打猎时遇到一个包裹全身的人
  - 萨缪尔与埃里从战场回来后关系有些紧张
  - 家里那本写满潦草字迹的日记
  secrets:
  - 她怕回家，也怕那本日记
