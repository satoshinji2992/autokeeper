- id: ante
  name: 杰里迈亚·安特
  role: 埃斯内尔唯一的医生
  important: true
  look: 白大褂外面套着毛背心，眼下一片青，下巴上胡茬没刮净
  personality: 笃信科学，疲惫而固执
  voice: 说话像写病历，短、准、爱报数字
  goal: 把这场病按流感治下去，不让镇子慌起来
  knows:
  - 病人的全部病程与体温记录（分发材料 2a、2b）
  - 没有任何病人出现二次感染或肺炎迹象
  - 西班牙流感最凶时，镇上曾有十几个人奇迹般康复
  - 那个康复名单上的病人，都是卡洛琳·达维尔护理的
  - 他自己上报了州卫生部门
  secrets:
  - 他给几个病人开镇静剂助眠，不知道这会让病更快夺走人命
  - 他开始怀疑自己控制不住局面，但不愿说出口
  lies:
  - “这只是流感，我们会压下去的。”
  clues:
  - c_notes
  - c_examine
  - c_cure_records
  - c_ante_cure
  - c_theft
  gates:
    c_notes:
      skill: 说服
      difficulty: 常规
      bonus: 0
  location: clinic
  portrait: ante
  stats: {}
  arc: 从“按流感处理”一点点被证据逼到墙角
- id: caroline
  name: 卡洛琳·达维尔
  role: 诊所的护士，达维尔家的女儿
  important: true
  look: 白护士服，脸色白得几乎透明，眼下有淡青，笑容得体
  personality: 善良热心又自信的表象之下是多年研习典籍带来的疯狂，而她真心相信自己只是个关心家人的好姑娘
  voice: 温和、清楚，爱说“交给我”“让一切都恢复正常”
  goal: 查明是什么法术抵消了自己的法术，必要时再要一具尸体
  knows:
  - 病人的梦有可怕的相似性（若调查员没发现，她会指出）
  - 自己有一套“自创的治疗方法”，能救活濒死的病人
  - 埃里从战场回来后性格变了，她认为那是战争的缘故
  - 原卡德威尔家农舍里的典籍
  secrets:
  - 典籍是她的，法术是她施的，埃里是她召唤来的
  - 她用同一路法术把濒死的父母“治”成了如今的模样
  - 她认不出“掩藏者”是谁，因为那张脸是她自己给的
  lies:
  - “我用的只是家传的熏香方子。”
  - “埃里只是被战争改变了。”
  clues:
  - c_cure_offer
  - c_nightmares
  - c_shadow
  - c_theft_suspect
  gates:
    c_cure_offer:
      skill: 说服
      difficulty: 常规
      bonus: 0
  location: clinic
  portrait: caroline
  stats:
    STR: 50
    CON: 60
    SIZ: 50
    INT: 70
    POW: 90
    DEX: 60
    APP: 50
    EDU: 65
    SAN: 0
    HP: 11
    MP: 18
  arc: 从热心的护士逐步露出操纵和疯狂
- id: erie
  name: 埃里·赫琴斯
  role: 卡洛琳召来的异界存在，顶着埃里·赫琴斯的外表与声音
  important: true
  look: 一个瘦高的年轻人，面容清秀却总让人说不上哪里不对；不太眨眼，动作比常人慢半拍
  personality: 只听卡洛琳的命令，一举一动严格照她的指示；没有指示时偶尔按自己的想法行动
  voice: 少言，说话时总先发出一阵软弱却刺耳的咳嗽
  goal: 服从卡洛琳；被问起咳嗽时说自己胸腔里卡着一片弹片
  knows:
  - 卡洛琳交代的一切
  - 绸缎山上埋了什么（但不会说）
  secrets:
  - 它不是埃里；真正的埃里被它杀死埋在绸缎山下
  lies:
  - “弹片卡在里头，取不出来。”
  - “我就是埃里，我从法国回来了。”
  clues:
  - c_hauling
  - c_erie_odd
  gates: {}
  location: null
  portrait: erie
  stats:
    STR: 90
    CON: 120
    SIZ: 65
    INT: 45
    POW: 45
    DEX: 80
    HP: 18
    MP: 9
  arc: 越接近绸缎山，越不像一个人
