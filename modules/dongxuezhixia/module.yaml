  text: 雪地上有极细微的差异，非极难侦查不能发现：这里的雪被从下方翻动过。 挖下去，就是“掩藏者”埋尸之处——他并非只施放了一个法术求生，而是多个； 每次吸到生命力就试图爬出这座冰雪坟墓，每次失败，只好再施一次法。
