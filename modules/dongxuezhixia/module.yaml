- id: c_ante_cure
  title: 安特医生证实的事
  text: 安特证实那份康复名单是真的，但他认为那完全是合理护理的功劳。 被追问之下他才想起来：那些病人都是卡洛琳·达维尔护理的。
  where: clinic
  feature: 安特的病历本
  check: null
  npc: ante
