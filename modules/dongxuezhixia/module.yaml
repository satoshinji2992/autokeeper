- id: c_cellar
  title: 地下室那面墙
  text: 地下室远端的墙因为水管爆裂而损坏，长满霉菌，看起来摇摇欲坠。牧师非常震惊， 因为本周早些时候那里还没有任何损坏或爆裂的迹象。停在这里的都是这几天的死者。
  where: church
  feature: 远端那面渗水的墙
  check: null
