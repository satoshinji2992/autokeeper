  text: 一间卧室的地板上铺着一条发霉的野餐毯，还有一个被动物撕碎的野餐篮子；墙角堆着几本被水泡过的中学课本， 最新的一本出版于 1911 年；最有说服力的是一架书柜侧面深深刻着的姓名首字母：“EH
    和 CD”。
