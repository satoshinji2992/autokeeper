  title: 她还要一具尸体
  text: 卡洛琳希望调查员再帮她弄一具尸体以了解更多。她的要求会越来越多：先是要更多的尸体， 最终变本加厉地索要活着的病人，好在仪式中献祭以定位“掩藏者”的位置。
