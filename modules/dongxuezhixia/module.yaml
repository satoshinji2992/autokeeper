- id: c_grimoire
  title: 卡德威尔家的典籍原本
  text: 典籍描述犹格-索托斯以及通神的咒语。即使不懂神话，插图与图示也会让调查员想起卡德威尔家的印记和 萨缪尔的速写。其中有两条值得注意的咒语：一条召唤异界存在并把它固定成特定形态，一条吸取他人生命力
    以恢复伤势。另有一条放逐这种无定形存在的咒语，注明此类存在“会完全篡夺实体的外貌，直至只有一方有此相貌”。 召唤咒旁有卡洛琳手写的注释：要把存在变成特定形态，需要目标亲属的血液或精盐。
  where: darvill_house
  feature: 客厅的笔记
  check: null
  npc: null
  core: true
  handout: h_grimoire
  requires: []
  points_to:
