- id: c_cure_offer
  title: 卡洛琳的请求
  text: “这不是普通的疾病，你能看出来。我需要一具尸体，死于那种病的尸体。我会用它查明疾病的源头。 我能处理好这件事。让一切都恢复正常。你们相信我就是了。”
  where: clinic
  feature: 药柜旁的走廊
