  sanity: null
- id: c_autopsy
  title: 尸检
  text: 无论成败都会发现非常不对劲的地方：死者的内脏器官扭曲变形，看上去退化成了脆弱的果冻状物质； 同样没有任何二次感染的迹象。检定失败意味着失手让内脏裂开，房间里充满腐烂与死亡的气味， 每个人都窒息作呕（在场者理智检定
    0/1D4）。
  where: church
