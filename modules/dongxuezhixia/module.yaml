- id: c_seance
  title: 门后的招魂
  text: 地下室的门没锁，积雪被清理过。贴近门口能清楚听见卡洛琳在向刚复生的魂灵提问。魂灵说： 他们睡梦时“掩藏者”呼唤他们的名字，仿佛很熟悉他们；他在头顶呼唤，也在脚下呼唤， 他们知道他在，却看不见他，他藏在炫目雪白的黑暗里；他要他们为他在黄色峰顶建起血肉的祭坛，
    每次完工祭坛都塌下来，于是他们又劳作，直到黄色峰顶鲜血淋漓。
