- id: c_anna_tale
  title: 安娜的讲述
  text: 安娜说萨缪尔是镇上第一个病死的。他被带回家那晚已经开始胡言乱语，那时他身上还没有任何症状。 他说自己打猎时遇到了一个包裹全身的人，还说：“他回家了。他本来就在这，但他现在又回来了。” 她还低声承认，埃里是她丈夫最长久的朋友之一，但自从埃里从战场回来，两人的关系就变得有些紧张。
  where: post_office
  feature: 安娜的柜台
  check: null
  npc: anna
  core: true
