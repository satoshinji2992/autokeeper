id: dongxuezhixia
title: 冬雪之下
subtitle: 北达科他州的疾病与死亡
system: CoC7
era: 1921 年
setting: 美国北达科他州沃德县，乡下小城埃斯内尔
players: 1-3 人
duration: 约 4-6 小时（游戏内 4-7 天）
source: 《冬雪之下》（Nathan Ross & friends，Stygian Fox）
license: 仅作个人游戏整理使用
plugins:
- winter_disease
hook: 埃斯内尔唯一的医生把警报送到了州府：这个小镇上的人正在以流感般的症状成批倒下， 而且死得比流感快得多。沃德县卫生部门派你们去评估情况、尽可能协助控制扩散。 雪已经下了一个礼拜，去埃斯内尔的路只剩一条。
truth: 多年前，埃里·赫琴斯与卡洛琳·达维尔在原卡德威尔家的废弃农舍里找到一本属于犹格-索托斯的典籍， 一起研习其中的法术，并约定埃里从欧洲战场回来就成婚。战事将尽时卡洛琳收到军方电报， 称埃里阵亡。不肯接受的卡洛琳召来了一个无定形的异界存在，赋予它埃里的外表与声音，
  把它留在身边——对外称作“埃里”。真正的埃里只是重伤，被丢在法国乡下，后来康复并回到埃斯内尔， 撞见那个顶着自己相貌的东西；它杀了他，把尸体埋在绸缎山的积雪下。临死前埃里施法让自己悬停在生死之间， 法术不断吸取埃斯内尔居民的生命力，直到他恢复、挣脱雪墓——这就是这场“病”。
  被埋的那个人（本模组称“掩藏者”）在病人的噩梦里反复出现，要他们为自己在黄色峰顶堆起血肉的祭坛。 卡洛琳在诊所里护理病人，用同一路法术的变体救活过十几个濒死者，却看不见自己的法术正是病源的一部分。
keeper_notes: "【导入】原文推荐并以之为默认的导入：安特医生向沃德县卫生部门上报，调查员作为县政府工作人员前来评估与协助。\n用这个导入时，调查员起初没有理由怀疑超自然因素，也可能根本不知道克苏鲁神话的存在。\n\
  调查员不可是埃斯内尔本地人，但可以是镇上某人的远方朋友、笔友或姻亲。其他可选导入见原文：\n追查毁容归乡者的执法人员、被暴风雪困住的旅人、刚开始成年的本地年轻人（后者需改动展示材料，只建议老练 KP）。\n\
  \n【AutoKeeper 补充】为让玩家有落脚与问路的地方，补了一处“主街”（main_street，公开地标，无新线索、无怪兆、无强制检定）。\n原作开局即从抵达拉特格出租屋开始：开场描述里保留了两具蒙白布的尸体被抬上卡车这一幕，时限与必发事件未改。\n\
  主街只用于问路、歇脚和前往各公开地点，可以在这里打听拉特格家、诊所、教堂、邮局的方向。\n\n【疾病计数器——原文专属规则，现由 winter_disease 插件自动执行】\n1. 开场掷 2D10，用\
  \ 100 减去结果，作为疾病对埃斯内尔影响的计数器（衡量镇子的健康程度）。\n   KP 可以事先掷好并保密，也可以在调查员得知传染状况时公开掷。\n2. 模组过程中定期从计数器减去掷骰结果：第一次\
  \ 1D10，之后每次增加 1D10，最高 3D10。\n   若调查员提出好的治疗或公共卫生主意，可考虑减少投掷的 D10 数目。掷骰频率两选一：\n   按游戏内时间（如一天一次，会把调查限制在\
  \ 4-7 天内），或留到最紧迫的时刻再掷。\n   埃斯内尔毁灭前总共只能掷 4-7 次。\n3. 进程：计数器 81-100 第一阶段；31-80 第二阶段；0-30 第三阶段；0 表示镇子不可避免走向灭亡。\n\
  \   进程决定疾病传播范围与速度、症状严重程度、死亡人数和调查员染病的可能性。\n4. 患病调查员：每当为计数器掷骰，患病的调查员做体质检定。失败则失去体质，数值等于本次掷骰中\n   最高的单个\
  \ D10；即使成功，也失去等于最低单个 D10 的体质。KP 也可对需要身体活动的行为给惩罚骰。\n   每次体质检定失败，该调查员还要做理智检定 0/1D6（噩梦与高烧梦境）。噩梦也可用来给出线索、\n\
  \   法术片段，或增长克苏鲁神话技能。\n5. 建议在计数器进入第二阶段时让一名调查员出现症状，第三阶段时再加一名（可按人数与偏好调整）。\n6. 自动实现：winter_disease 初始化真实骰值计数器，默认每满1440分钟推进；自动感染、体质检定与损失、失败后的理智检定及阶段标记。\n\
  \   原作两种节奏互斥，插件状态 cadence 可为 daily（默认）或 dramatic；后者才允许 dramatic_tick 动作。\n   治疗/公共卫生主意经裁定员判断后调用 mitigate，骰数不低于1D10。原文建议的感染对象按当前调查员顺序选择。\n\
  \   症状在跨阶段后出现，新感染者从之后一次恶化起做体质检定。完整原文和旧版整理档案仍保留在 source/。\n\n【开场必发】调查员抵达拉特格出租屋时，相隔几个房子处正有人把两具蒙白布的尸体抬上卡车。\n\
  安特医生上报得很快，但疾病发作极快，调查员到达时已有多人死亡。\n\n【拉特格夫妇的日常】他们希望调查员宾至如归，每天做早晚饭，可把下列场景当作镇子状况的晴雨表：\n第二阶段某天早饭，多琳尖叫着把牛奶罐摔在地上，牛奶腐坏发臭、凝成块；若调查员手里正拿着线索或文件，\n\
  可能被泼坏。第三阶段调查员坐下吃饭时，会听见屋里痛苦的呻吟和碰撞回声——后廊屋顶被积雪压垮，\n弗朗西斯半个身子埋在里面，失去知觉，医生检查后认为他健康状况堪忧、生命垂危。\n\n【卡洛琳的处理】她从开局就主动插手，无论调查员要不要；若调查员没发现病人噩梦的相似性，她会指出。\n\
  即使被拒绝，她仍会时常出现在调查员周围，因为她要自行调查病源。\n治疗场景（阴影）凡目睹者理智检定 1/1D4+1，阴影散去后半数病人显著恢复、另一半死去。\n她要尸体时，调查员可以拒绝、可以阻止；一旦阻止，她会逃跑并让埃里殿后。\n\
  若调查员过度受她支配，她会乐意牺牲其中一人来完成复活术。\n\n【关于“掩藏者”】原文规定：因为卡洛琳的法术赋予召唤物以爱人的形象，她认不出“掩藏者”是谁。\n调查员若不提醒这一点，可以说服她摧毁“掩藏者”；若不施压，她会纯出于好奇而倾向于帮他复活；\n\
  一旦她得知真相，会不顾一切复活他。\n\n【地图与干扰】分发材料 1 的地图初次给出时只有黑色地名标注，传播圈线应随调查推进逐渐添加，\n不要开场就把完整圈线交给玩家：初始发文字版地名清单（h_map_plain），完成传播路径整理后才给完整原图（h_map_full）。\n\
  地图圈线中心指向绸缎山；东边萨缪尔·伊斯特曼家是干扰信息，KP 不该把从地图得出的传播信息说得含糊。\n\n【地图上的西北农场】原文地图标有“西北农场”而无专门条目，本整理把它视作布鲁彻农场所在的农场区。\n\
  \n\n【编译后人工复核】\n原始 DeepSeek 草稿存于 source/deepseek-draft.yaml，逐页全文和全部提取原图留在 source/；整理稿未替代原始资料。\n原图按用途绑定：封面、诊所与达维尔家场景、地图、两页病历、噩梦画、电报、已揭露的原形和绸缎花参考。\n\
  花卉图仅是原作外观参考，不代表冬季开花；怪物原图必须实际露出原形后解锁，不能从普通肖像中看见。\n地图要先有地图，再实际收集病例整理传播路径；不能只问“给我完整地图”就获得传播结论。\n听见卡洛琳请求不代表调查员同意合作；仅见到地名也不等于到达埋尸点。hill_found\
  \ 只在实际找到埋尸处设置。\n原稿在部分 clues 中写了不支持的 sets 字段。现已删去，原始意图保存在草稿；改由裁定员按已发生的行动判断标记：\nmet_erie、caroline_cure、body_stolen、seance_heard、hill_found\
  \ 只能在对应事实成立时设置，caroline_ally 必须得到明确合作回应。\n牛奶、后廊事件只在对应阶段且出租屋进餐时触发；失窃消息只在原作的隔夜过程真实发生后于次晨给出，不能跳过时间与玩家行动。\n\
  暴风雪不是入场即受伤。驾车需困难驾驶检定；徒步暴露于严寒且体质检定失败才受 1D10 伤害。\n暴风雪条件伤害仍需按原文另作裁定，绝不以无条件 Event.damage 代替。专属疾病数值现由 winter_disease\
  \ 插件自动结算，不得口头重复扣减。\n计数器归零后小镇的命运不可逆，即使随后处理病源也不能套用“及时阻止”的结局。\n临床检查只能确认观察到的症状与不符合普通流感之处，不能一次医学检定就宣告幕后法术真相。\n"
flags:
  met_erie: 调查员已见过负责运送尸体的“埃里”，听过他那软弱刺耳的咳嗽
  nightmares_known: 调查员已确认病人们做着相似的、关于无脸男人的梦
  caroline_cure: 卡洛琳已在诊所施法治疗病人（阴影场景已发生）
  body_stolen: 诊所的一具病人尸体已被盗走
  seance_heard: 调查员听到了地下室招魂的内容
  caroline_ally: 调查员选择与卡洛琳合作
  caroline_fled: 卡洛琳逃走了，让埃里殿后
  chase_erie: 调查员动身追踪“埃里”回达维尔家
  grimoire_found: 已找到卡德威尔家典籍原本
  parents_told: 达维尔夫妇已说出“戴面具的男人”那段话
  hill_found: 已在绸缎山找到埋尸的矮树林
  hidden_destroyed: “掩藏者”被摧毁
  hidden_revived: “掩藏者”被复活
  entity_banished: 异界存在被放逐回原属位面
  disease_phase2: 疾病计数器进入第二阶段（插件在实际跨过阈值时设置）
  disease_phase3: 疾病计数器进入第三阶段（插件在实际跨过阈值时设置）
  counter_zero: 疾病计数器归零，小镇不可避免走向灭亡（不可逆）
  spread_reviewed: 调查员已实际收集病例分布、在地图逐户标出并比较传播路径；仅索要完整版地图不能设置
  entity_revealed: 异界存在已在调查员眼前实际露出非人原形；猜测身份或见到普通外貌不能设置
  breakfast_phase2: 已进入疾病第二阶段，调查员此时在拉特格出租屋吃早饭，才触发牛奶事件
  meal_phase3: 已进入疾病第三阶段，调查员此时在拉特格出租屋吃饭，才触发后廊事件
  theft_discovered: 尸体被盗的那一晚已经过去；调查员次日早上实际到诊所获知失窃，不能因答应合作立刻设置
start: ratger_house
start_time: D1 14:00
opening: 从车站过来只有一条被雪犁开的路。埃斯内尔的房子都压着厚厚的雪帽，烟囱里冒着细烟，街上却没什么人。 你们在弗朗西斯·拉特格和多琳·拉特格夫妇的出租屋前停下——州府的电报里说房间已经订好。
  就在相隔几个房子处，两个男人正把裹着白布的担架抬上一辆卡车的后厢，第三个人在旁边扶着帽子， 风把他嘴里的话吹碎了。
