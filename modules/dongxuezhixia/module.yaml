  name: 安特医生的诊所
  read_aloud: 诊所是一栋改过的宅子，候诊室里坐满了人，有人靠着墙睡，有人低声咳。诊室里有六张床， 都躺着人；床单洗得发白。杰里迈亚·安特医生把听诊器挂在脖子上，抬头看了你们一眼，说： “州里终于来人了。”两名护士在换水盆，其中一位年轻女子动作最利落。
  keeper: 安特医生会把详尽的病历笔记交给来协助的县府人员（分发材料 2a、2b）。 诊所里 6 名患者正在接受治疗，其他患者在家休养；两名护士轮班，其中一位正是卡洛琳·达维尔。 安特笃信科学，即使证据堆积如山也不肯接受超自然的解释。
