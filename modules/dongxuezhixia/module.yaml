  title: 检查活着的病人
  text: 检查只会证实安特的观测：症状像流感，但凶险得多，而且没有任何病人有二次感染或肺炎的迹象。 这很不寻常——二次感染或肺炎才是流感的主要致死因素。想用拭子采样培养，需要时间， 而这段时间里病还会继续杀人。
  where: clinic
  feature: 六张病床
  check:
    skill: 医学
    difficulty: 常规
    bonus: 0
  npc: null
  core: false
