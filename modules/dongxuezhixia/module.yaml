  sanity: null
- id: c_samuel_diary
  title: 萨缪尔的日记与速写
  text: 萨缪尔死前疯狂涂写，用难以辨别的潦草字迹写满了一整本日记，其中一页画着速写： 中央是一个涂黑的无脸人形，背景是许多重叠的圆圈与涂线。成功的克苏鲁神话检定能辨认出 这些图像与犹格-索托斯有关。
