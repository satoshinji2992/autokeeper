  title: 靠近时的幻象
  text: 越靠近埋尸处，法术的影响越重：已经患病的调查员开始出现幻觉，看见梦里那个“掩藏者”为他们指路； 未患病的调查员开始咳嗽，觉得自己发起烧来。就这样，一行人被引到一小片矮树林。
