conclusions:
- id: k_disease
  text: 这场病不是细菌或病毒引起的，而是法术在吸取埃斯内尔居民的生命力——所以隔离、消毒、培养病源都没有用
- id: k_nightmare
  text: 病人在梦里被同一个没有脸的男人索取；顺从他的恶化快，拒绝他的恶化慢
- id: k_method
  text: 卡洛琳的熏香“治疗”与全镇的病是同一路法术，她救活过的那十几个人正是她施法的对象
- id: k_erie_false
  text: 现在这个“埃里”不是真正的埃里·赫琴斯；真正的埃里被杀死，埋在绸缎山下
- id: k_buried
  text: “掩藏者”的尸体埋在绸缎山的矮树林下，那里是全镇苦痛的中心
- id: k_caroline
  text: 卡洛琳从卡德威尔家的典籍里学会了法术，召唤了那个无定形存在并给了它爱人的形象；她一边救人也一边是病源的一部分
- id: k_antidote
  text: 无论摧毁“掩藏者”还是复活他，都能让埃斯内尔摆脱这场病
handouts:
- id: h_map_plain
  title: 分发材料 1a——埃斯内尔地图（黑字地名版）
  kind: 手绘地图
  text: '弗朗西斯用铅笔画的埃斯内尔，黑字地名包括：

    出租屋 / 学校 / 邮局 / 教堂 / 安特医生的诊所 / 达维尔家 / 绸缎山 / 西北农场 / 伊斯特曼家（原卡德威尔家）。

    此时地图上只有这些地点，没有传播圈线。'
  images: []
- id: h_map_full
  title: 分发材料 1——埃斯内尔地图（完整）
  kind: 手绘地图
  text: '地图上补全了第一阶段、第二阶段、第三阶段的传播圈线。

    一圈套一圈，中心指向绸缎山。东边的伊斯特曼家落在圈外。'
  images: []
- id: h_notes
  title: 分发材料 2a、2b——安特医生的病历
  kind: 病历
  text: "病历 2a：\n01/12/21：患者男，37 岁，感到浑身乏力，伴有咳嗽。开了少量威士忌，无痰或其他感染症状。\n01/14/21：病人抱怨肌肉酸痛、严重抽筋，离开诊所时摔倒在地，留其过夜观察。夜里睡眠不安稳，\n\
    \          没有醒来但常有活动，数次尖叫出声。开始发烧（101°F）。\n01/15/21：发烧程度加重（103°F），身体过于虚弱无法起床。第二剂威士忌。无肺炎迹象。\n01/16/21：只能偶尔醒过来，精神错乱、语无伦次，对外界刺激无应答、无法叫醒。下午\
    \ 2:19 去世。\n\n病历 2b：\n01/15/21：患者女，54 岁，胸口发紧，有束缚感，呼吸困难，无淤血或炎症迹象。想留她过夜观察，\n          被坚持回家的病人拒绝。\n\
    01/16/21：丈夫打来电话，病人时常严重反胃、呕吐；她仍拒绝到诊所过夜。丈夫和此前就诊的两子没有症状。\n          指导如何避免感染。\n01/18/21：病人脸色苍白、浑身发冷，肌肉力量下降，咳嗽带血，难以集中注意力；丈夫说前两晚睡眠不佳。\n\
    01/21/21：病情明显恶化，睡眠不超过 30 分钟，害怕入睡，发现幻觉。开镇静剂帮助休息。\n          丈夫称自己的胸闷气短、偶尔咳嗽。\n01/22/21：患者昨晚去世。\n"
  images: []
- id: h_nightmare
  title: 分发材料 3——萨缪尔的速写
  kind: 速写
  text: '一页潦草的画：中央是一个涂黑的无脸人形，背景是许多重叠的圆圈与涂线，

    圈线的中心隐约指向某个更高的地方。

    '
  images: []
- id: h_telegram
  title: 分发材料 4——军队电报
  kind: 电报
  text: '致赫琴斯先生及夫人：

    美国远征部队 439571 号一等兵埃里·赫琴斯不幸身亡。在敌人一次突袭炮击中，他闯入无人区

    拯救被围困的中队，为保护战友战斗到最后一刻，挽救数人生命。指挥官记得他深情提起家人

    及等在家中的未婚妻；信中表达沉痛哀悼与慰问。

    中尉马修·海德福斯，来自第 4 师指挥官 L.A.P. 普拉格少将与美国远征部队指挥官约翰·J·潘兴将军办公室。

    '
  images: []
- id: h_grimoire
  title: 卡德威尔家的典籍（关键部分摘抄）
  kind: 典籍
  text: "书页被水浸过又干，插图上画着令人不安的无定形生物和怪异的球状物。\n· 通向犹格-索托斯的咒语与图示。\n· 召唤异界存在、并将其控制、固定成特定形态的咒语。旁有卡洛琳手写的注释：\n\
    \  要让它化成某个人的形态，需要那个人亲属的血液或精盐。\n· 吸取他人生命力以恢复自身伤势的咒语。\n· 放逐上述无定形存在的咒语，注明此类存在“会完全篡夺实体的外貌，直至只有一方有此相貌”。\n"
  images: []
- id: h_entity_form
  title: 它本来的样子
