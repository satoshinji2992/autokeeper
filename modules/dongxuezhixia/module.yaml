- id: cardwell_farm
  name: 原卡德威尔家
  read_aloud: 农舍被雪压得微微倾斜，门没有锁，一推就开。屋里积着厚厚的灰，墙壁和地板都已腐朽， 能看到动物筑过巢的痕迹。空气里除了霉味，还有某种更冷的、像土一样的气味。
  keeper: 世纪之交废弃的老宅，被传成鬼屋、常有怪异的光、有撒旦教徒出没。事实是这家族长崇拜犹格-索托斯， 本身也小有法力；他曾奇迹般从重伤中恢复，同时儿媳死于重病，于是儿子杀了他，尸体丢进壁炉。
    正是从这位族长的日记和书籍中，卡洛琳和埃里开始接触法术。屋内更近的活动痕迹是多年前两人留下的。
  features:
  - 铺在卧室地板上的野餐毯
  - 墙角泡过水的课本
  - 刻着字母的书柜
  - 剥落墙皮的墙面
  - 壁炉
  exits:
  - eastman_house
  travel_minutes: {}
  art: cardwell_farm
  public: false
  weather:
  - snow
  - dust
- id: darvill_house
  name: 达维尔家
  read_aloud: 房子属于卡洛琳的父母，院子里没人扫雪。窗后没有灯，但屋后雪地上有一道被清理过的痕迹，通向地下室的门。 客厅里堆着许多古怪物件，地上散落着关于咒语、符文和药剂的笔记。
  keeper: 卡洛琳大部分法术都在地下室进行，包括死者复活。房子里住着卡洛琳的父母——他们被卡洛琳试图分享典籍知识后发疯， 又染上西班牙流感，被卡洛琳“治疗”之后成了眼神呆滞、洋洋自得、流口水的模样。
    证据齐全：典籍原本、床畔的信件与军方电报、父母那番关于面具的话。
  features:
  - 客厅的笔记
  - 地下室的门
  - 卡洛琳的床畔
  - 楼上的房间
  - 地下室里的香炉
  exits:
  - main_street
  travel_minutes: {}
  art: darvill_house
  public: false
  weather:
  - snow
  - flicker
- id: brucker_farm
  name: 布鲁彻农场
  read_aloud: 农场在镇外西北方向，雪把栅栏埋了半截。牛棚里传出断断续续的哀叫，几头牛躺在地上起不来， 肋骨一根根支出来。雷吉·布鲁彻拎着一只酒瓶走过来，问你们是不是也来看他倒霉的。
  keeper: “掩藏者”的法术不只影响人。雷吉把牛的病和镇上人的病联系起来，称这是对城镇全部弊病的神圣超自然审判； 他以酗酒应对，这个人醉醺醺的恶劣状态正是埃斯内尔未来的预示。征得他同意查看牛只，能证实牛的症状与镇民相似。
    地图上的“西北农场”即这一带的农场区。
  features:
  - 牛棚
  - 病倒的牛
  - 雷吉的威士忌瓶
  exits:
  - main_street
  - satin_hill
  travel_minutes: {}
  art: brucker_farm
  public: true
  weather:
  - snow
- id: satin_hill
  name: 绸缎山
  read_aloud: 山坡上只有雪、风和一丛丛矮树。风把脚印抹平，往上看是一片白，往下看是整个埃斯内尔， 烟囱的细烟像插在雪里的针。走到这里，连呼吸都像在喝冰水。
  keeper: 绸缎山因春夏山坡盛开大片黄色绸缎花而得名；这是“掩藏者”埋尸之处，也是埃斯内尔苦痛的中心。 地图上的传播路径圈线、萨缪尔·伊斯特曼的描述、魂灵提到的黄色峰顶、卡洛琳的法术都指向这里。
    确切地点很难找，只有极难侦查检定能发现雪中埋尸地的微小差异；靠近时法术影响加重（见线索）。 除非调查员尽力阻止，否则他们抵达埋尸地点的同时或不久后，卡洛琳和“埃里”会前来，但不立即引发冲突。 卡洛琳此时也显出明显病状，“埃里”完全不受影响。
  features:
  - 那片矮树林
  - 被从下方翻动过的雪
  - 山脊
  exits:
  - main_street
  - brucker_farm
  travel_minutes: {}
  art: satin_hill
  public: false
  weather:
  - snow
