- id: c_nightmares
  title: 相似的噩梦
  text: 还能说话的病人和家属都说，发烧时做的梦相似得可怕：梦里有一个说不清哪里迷人的男人，从不出声， 意愿却直接刻进脑子里，他在向病人索取什么，醒来却记不得要的是什么。每个病人都坚持说这个人没有脸。
    格外敏锐的人会注意到：在梦里拒绝过他的病人恶化得慢，顺从他的病人恶化得快。
