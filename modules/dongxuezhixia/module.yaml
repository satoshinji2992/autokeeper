  title: 床畔的信与电报
  text: 一沓埃里从战场写给她的信，都磨得起了毛，显然常被翻阅。其中夹着一封军方电报： 一等兵埃里·赫琴斯在敌人突袭炮击中阵亡，指挥官记得他提起家人和等在家中的未婚妻。
