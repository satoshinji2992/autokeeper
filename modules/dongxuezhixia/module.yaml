- id: c_shadow
  title: 阴影下的治疗
  text: 卡洛琳用香炉烧一种混合粉末，让病人深吸入厚重辛辣的烟雾。几分钟后病人开始激烈地翻来覆去， 四肢在白床单上扭动。房间中央出现一道黑暗而夺目的阴影，里面传来低声的咒语。 阴影停留数小时后散去，半数病人显著恢复，另一半死去。
