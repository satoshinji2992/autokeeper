- id: h_grimoire
  title: 卡德威尔家的典籍（关键部分摘抄）
  kind: 典籍
  text: "书页被水浸过又干，插图上画着令人不安的无定形生物和怪异的球状物。\n· 通向犹格-索托斯的咒语与图示。\n· 召唤异界存在、并将其控制、固定成特定形态的咒语。旁有卡洛琳手写的注释：\n\
    \  要让它化成某个人的形态，需要那个人亲属的血液或精盐。\n· 吸取他人生命力以恢复自身伤势的咒语。\n· 放逐上述无定形存在的咒语，注明此类存在“会完全篡夺实体的外貌，直至只有一方有此相貌”。\n"
  images: []
  paper: book
