- id: h_telegram
  title: 分发材料 4——军队电报
  kind: 电报
  text: '致赫琴斯先生及夫人：

    美国远征部队 439571 号一等兵埃里·赫琴斯不幸身亡。在敌人一次突袭炮击中，他闯入无人区

    拯救被围困的中队，为保护战友战斗到最后一刻，挽救数人生命。指挥官记得他深情提起家人

    及等在家中的未婚妻；信中表达沉痛哀悼与慰问。

    中尉马修·海德福斯，来自第 4 师指挥官 L.A.P. 普拉格少将与美国远征部队指挥官约翰·J·潘兴将军办公室。

    '
