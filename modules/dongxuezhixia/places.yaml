  public: true
  weather:
  - snow
- id: ratger_house
  name: 拉特格出租屋
  read_aloud: 门廊的木板被踩得发亮，屋里烧着炉子。多琳·拉特格一边擦手一边迎出来，说房间收拾好了， 晚饭六点。弗朗西斯把一只搪瓷壶放在桌上，说这阵子镇上不太平，你们来得不是时候。
  keeper: 开局地点。务必让调查员一到这里就注意到几个房子外抬上卡车的两具蒙白布尸体。 拉特格夫妇终生住在这里，退休后靠出租房间贴补，认识几乎所有受影响的家庭，能把调查员介绍过去， 也能手绘一张地图指路到安特医生的诊所（分发材料
    1）。
  features:
  - 客厅的餐桌
  - 弗朗西斯的抽屉
  - 后廊
  - 楼上的客房
  exits:
  - main_street
  - clinic
  travel_minutes: {}
  art: ratger_house
  public: true
  weather:
  - snow
- id: clinic
  name: 安特医生的诊所
  read_aloud: 诊所是一栋改过的宅子，候诊室里坐满了人，有人靠着墙睡，有人低声咳。诊室里有六张床， 都躺着人；床单洗得发白。杰里迈亚·安特医生把听诊器挂在脖子上，抬头看了你们一眼，说： “州里终于来人了。”两名护士在换水盆，其中一位年轻女子动作最利落。
  keeper: 安特医生会把详尽的病历笔记交给来协助的县府人员（分发材料 2a、2b）。 诊所里 6 名患者正在接受治疗，其他患者在家休养；两名护士轮班，其中一位正是卡洛琳·达维尔。 安特笃信科学，即使证据堆积如山也不肯接受超自然的解释。
  features:
  - 六张病床
  - 安特的病历本
  - 药柜里的威士忌
  - 护士的值班记录
  exits:
  - main_street
  travel_minutes: {}
  art: clinic
  public: true
  weather:
  - snow
  - flicker
- id: church
  name: 埃斯内尔的教堂
  read_aloud: 教堂不大，长椅上还留着上一场礼拜的赞美诗本。牧师迎接你们时手上还带着灰，说地下室出了点麻烦， 这几天的死者都停在那里等雪停了下葬。
  keeper: 镇上唯一一座教堂，死者停放在地下室。地下室远端的墙壁因水管爆裂而损坏，长满霉菌，看起来摇摇欲坠； 牧师非常震惊，因为本周早些时候还没有任何损坏或爆裂的迹象。
  features:
  - 地下室
  - 远端那面渗水的墙
  - 停放的棺木
  exits:
  - main_street
  travel_minutes: {}
  art: church
  public: true
  weather:
  - snow
