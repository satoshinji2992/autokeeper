- id: church_cellar
  name: 教堂地下室
  read_aloud: 地下室又冷又潮，几具棺木并排停着，等雪停了下葬。远端那面墙水迹斑斑，长满霉菌，墙面鼓起，看起来摇摇欲坠。空气里是霉味和石灰的气味。
  within: church
  keeper: 这几天的死者都停在这里等待下葬。远端墙壁因水管爆裂而损坏、长满霉菌，牧师很震惊，因为本周早些时候还没有任何损坏迹象。开棺尸检进行医学检定，无论成败都发现内脏扭曲成果冻状、没有二次感染；失败则失手使内脏裂开，房间里每个人都要理智检定（0/1D4）。
