    label: 远端渗水的墙
    features:
    - 远端那面渗水的墙
    prompt: 地下室尽头那面墙水迹斑斑，灰泥鼓起、开裂，墙脚湿了一片，地上积着一小滩水，空气里是霉味和石灰味。
- id: darvill_cellar
  name: 达维尔家地下室
  read_aloud: 地下室低矮昏暗，空气里有辛辣的烟味。屋后通院子的那扇门透进冷风，门前的积雪被清理过。
  within: darvill_house
  keeper: 卡洛琳大部分法术都在地下室进行，包括死者复活；尸体被盗后，她在这里拷问死去病人的魂灵，埃里也和她一起待在地下室。屋后有直通院子的地下室门，没有上锁，积雪被清理过；前门锁着，敲门无人应答。目睹刚复生的魂灵须理智检定（1/1D6+1）。
  features:
  - 地下室里的香炉
  - 屋后通院子的地下室门
  art: darvill_cellar
  outdoors: false
  ground: building
  views:
  - key: darvill_cellar_censer
    label: 地下室里的香炉
    features:
    - 地下室里的香炉
    prompt: 低矮昏暗的地下室里，一只铜香炉搁在矮凳上，炉膛里积着灰白的粉末和几块没烧尽的黑色碎屑，炉壁熏得发黑，旁边的地上散着几只小碟和一盒火柴。
- id: darvill_caroline_room
  name: 卡洛琳的卧室
  read_aloud: 一间收拾得还算整齐的卧室，床头边放着一沓被翻得起毛的信。
  within: darvill_house
  keeper: 卡洛琳的床畔有一沓埃里从战场写给她的信，夹着美国军方的阵亡电报（分发材料 4），信都磨损了，显然常被翻阅。
  features:
  - 卡洛琳的床畔
  art: darvill_caroline_room
  outdoors: false
  ground: building
- id: ratger_back_porch
  name: 后门廊
  read_aloud: 屋后的门廊不大，木顶棚上压着厚厚的积雪。
  within: ratger_house
  keeper: 疾病进入第三阶段后，调查员坐下吃饭时，后门廊的屋顶被积雪压垮，弗朗西斯半个身子被埋在里面，毫无知觉；医生检查后认为他生命垂危。
  features:
  - 后廊的顶棚
  art: ratger_back_porch
  outdoors: false
  ground: building
- id: ratger_guest_room
  name: 客房
  read_aloud: 客房已经收拾好，床上铺着厚被子，窗玻璃上结着霜花，屋里比楼下冷一些。
  within: ratger_house
  keeper: 拉特格夫妇在调查员到来之前已为他们安排好的房间，平日租给旅客和季节工。
  features:
  - 床铺
  - 结霜的窗户
  art: ratger_guest_room
  outdoors: false
  ground: building
