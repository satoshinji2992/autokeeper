locations:
- id: main_street
  name: 主街
  read_aloud: 主街只有两个街区长。雪犁推出来的雪墙比人还高，杂货铺的窗玻璃上结着霜花， 马车和一辆卡车停在路边，车辙很快就又被风抹平。诊所的方向有人压着帽子快步走过。
  keeper: AutoKeeper 补充的中转地点，只用于问路、歇脚和辨认方向，不放新线索、怪兆或强制检定。 镇民这时只当是一场凶险的流感，愿意指路，也乐于谈谁家又倒了人。
  features:
  - 杂货铺门口
  - 铲雪的人
  - 街角告示板
  art: main_street
  public: true
  weather:
  - snow
  scene_root: true
  outdoors: true
  ground: street
  looks:
  - when: at:erie:main_street
    change: 街角停着一辆没熄火的卡车，车斗里铺着一条旧毯子，车辙周围的路面被踩得发黑。
- id: ratger_house
  name: 拉特格出租屋
  read_aloud: 门廊的木板被踩得发亮，门内传来炉火声。一位系着围裙的老妇人擦着手开了门。 “我是多琳·拉特格，房间已经备好了。进来暖暖吧。”她扶着门，给门口让出地方。
  keeper: 开局地点。开场素材交代抵达，地点描写交代门口的接待，e_arrival 交代同一时刻几栋房子外两具蒙白布尸体被抬上卡车；把它们接成一个场面，不各自重讲一次。 拉特格夫妇终生住在这里，退休后靠出租房间贴补，事先已为调查员备好客房，希望客人住得舒适，每天做早晚饭。
    开场到门口即可让玩家接话或行动，进屋、放行李、坐下和出发随玩家选择；直接去查搬尸的卡车或前往诊所也可以，不必先完成入住寒暄。 弗朗西斯在屋内，可以在实际接触时由多琳介绍，或自己报上姓名，不把两人的身世和全部消息塞进招呼。
    夫妇认识许多受影响的家庭，能介绍调查员过去，也能手绘地图指路到安特医生的诊所（分发材料 1，初次只有黑色地名）。 原有接待安排是晚饭六点。地图、当地闲话和用餐安排随实际交谈自然带出；他们可以主动提供帮助，但不替调查员接受帮助、取图或决定路线。
    背景改编准备的联系人要有来访依据，并在首次出面时交代身份与来意；不要求每位调查员的私人牵连都在开场同时登门求助，可在相应地点与后续交往中展开。
  features:
  - 客厅的餐桌
  - 弗朗西斯的抽屉
  - 后廊
  - 楼上的客房
  art: ratger_house
  public: true
  weather:
  - snow
  looks:
  - when: flag:sign_porch_stain_1
    change: 后廊天花板的水渍向墙角延伸，下面多了一只接水盆。
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: ratger_back_porch_ceiling
    label: 后门廊的顶棚
    features:
    - 后廊
    prompt: 屋后不大的木门廊，顶棚上压着厚厚一层雪，木板天花板上一圈黄褐色水渍，靠墙放着一只接水的铁盆，地面上结着霜。
- id: clinic
  name: 安特医生的诊所
  read_aloud: 诊所是一栋改过的宅子，候诊室里坐满了人，有人靠着墙睡，有人低声咳。诊室里有六张床， 都躺着人；床单洗得发白。杰里迈亚·安特医生把听诊器挂在脖子上，抬头看了你们一眼，说： “州里终于来人了。”两名护士在换水盆，其中一位年轻女子动作最利落。
  keeper: 安特医生会把详尽的病历笔记交给来协助的县府人员（分发材料 2a、2b）。 诊所里 6 名患者正在接受治疗，其他患者在家休养；两名护士轮班，其中一位正是卡洛琳·达维尔。 安特笃信科学，即使证据堆积如山也不肯接受超自然的解释。
  features:
  - 六张病床
  - 安特的病历本
  - 药柜里的威士忌
  - 护士的值班记录
  art: clinic
  public: true
  weather:
  - snow
  - flicker
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: clinic_six_beds
    label: 诊所里的六张病床
    features:
    - 六张病床
    prompt: 改作病房的屋子里并排挤着六张铁架床，床单洗得发白起褶，被子下的人一动不动，床头小柜上摆着水盆、玻璃杯和叠好的毛巾，窗玻璃结着霜。
- id: church
  name: 埃斯内尔的教堂
  read_aloud: 教堂不大，长椅上还留着上一场礼拜的赞美诗本。牧师迎接你们时手上还带着灰，说地下室出了点麻烦， 这几天的死者都停在那里等雪停了下葬。
  keeper: 镇上唯一一座教堂，死者停放在地下室。地下室远端的墙壁因水管爆裂而损坏，长满霉菌，看起来摇摇欲坠； 牧师非常震惊，因为本周早些时候还没有任何损坏或爆裂的迹象。 开棺解剖并检查内脏时进行医学检定，无论成败都能发现
    c_autopsy。成功只发现脏器异常；失败才因失手使内脏裂开，房间里充满腐烂与死亡的气味，在场者理智检定0/1D4。 这段发现与失败后果来自原文“进行尸检”；普通外观检查不包含替调查员决定解剖，须由玩家声明或接受进一步检查。
  features:
  - 地下室
  - 远端那面渗水的墙
  - 停放的棺木
  art: church
  public: true
  weather:
  - snow
  - flicker
  scene_root: true
  outdoors: false
  ground: building
- id: post_office
  name: 邮局
  read_aloud: 邮局里只有一位职员，安娜·伊斯特曼，正在给一叠信盖戳。炉子忽然“砰”地响了一声， 靠炉子那半边热得发烫，离炉子两步就冷得让人缩脖子。她抬头，问你们要寄什么。
  keeper: 邮局里非常令人不适：炉子时不时发出刺耳响声，屋子温度忽冷忽热。 安娜起初不愿交谈，但调查员的问题很快会让她滔滔不绝——这是她发泄悲伤的出口。
  features:
  - 安娜的柜台
  - 分信格
  - 炉子
  art: post_office
  public: true
  weather:
  - snow
  - flicker
  scene_root: true
  outdoors: false
  ground: building
- id: eastman_house
  name: 伊斯特曼家
  read_aloud: 屋子拉着窗帘，门口堆着没人扫的雪。门厅里有一股久未开窗的气味，安娜的钥匙在锁孔里转了半圈才转动。 马路对面就是那栋破败的农舍，半埋在雪里。
  keeper: 萨缪尔·伊斯特曼是第一个患病的人，在调查员抵达前就已身亡。安娜会尽可能避免回家， 但愿意给调查员一把钥匙去看那本日记。日记并非真正的克苏鲁神话典籍， 翻阅笔记需要理智检定（0/1）；成功的克苏鲁神话检定能在速写中辨认出与犹格-索托斯相关的图像。
  features:
  - 萨缪尔的书桌
  - 那本潦草的日记
  - 卧室
  art: eastman_house
  public: false
  weather:
  - snow
  scene_root: true
  outdoors: false
  ground: building
- id: cardwell_farm
  name: 原卡德威尔家
  read_aloud: 农舍被雪压得微微倾斜，门没有锁，一推就开。屋里积着厚厚的灰，墙壁和地板都已腐朽， 能看到动物筑过巢的痕迹。空气里除了霉味，还有某种更冷的、像土一样的气味。
  keeper: 世纪之交废弃的老宅，被传成鬼屋、常有怪异的光、有撒旦教徒出没。事实是这家族长崇拜犹格-索托斯， 本身也小有法力；他曾奇迹般从重伤中恢复，同时儿媳死于重病，于是儿子杀了他，尸体丢进壁炉。
    正是从这位族长的日记和书籍中，卡洛琳和埃里开始接触法术。屋内更近的活动痕迹是多年前两人留下的。
  features:
  - 铺在卧室地板上的野餐毯
  - 墙角泡过水的课本
  - 刻着字母的书柜
  - 剥落墙皮的墙面
  - 壁炉
  art: cardwell_farm
  public: false
  weather:
  - snow
  - dust
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: cardwell_wall_symbol
    label: 剥落墙皮的墙面
    features:
    - 剥落墙皮的墙面
    prompt: 积灰的房间墙角，一片灰泥墙皮鼓起、裂开，边缘翘起，底下的木板发黑，地板上落着一层碎屑。
  looks:
  - when: knows:players:clue:c_wall_symbol
    change: 墙皮被剥掉一块，露出的木板上有一道用火烧出的怪异符号，焦痕深黑，边缘的木纹扭成不像人手的弧线。
    'on': cardwell_wall_symbol
- id: darvill_house
  name: 达维尔家
  read_aloud: 房子属于卡洛琳的父母，院子里没人扫雪。窗后没有灯，但屋后雪地上有一道被清理过的痕迹，通向地下室的门。 客厅里堆着许多古怪物件，地上散落着关于咒语、符文和药剂的笔记。
  keeper: 卡洛琳大部分法术都在地下室进行，包括死者复活。房子里住着卡洛琳的父母——他们被卡洛琳试图分享典籍知识后发疯， 又染上西班牙流感，被卡洛琳“治疗”之后成了眼神呆滞、洋洋自得、流口水的模样。
    证据齐全：典籍原本、床畔的信件与军方电报、父母那番关于面具的话。
  features:
