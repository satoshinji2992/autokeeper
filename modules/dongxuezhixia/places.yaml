- id: post_office
  name: 邮局
  read_aloud: 邮局里只有一位职员，安娜·伊斯特曼，正在给一叠信盖戳。炉子忽然“砰”地响了一声， 靠炉子那半边热得发烫，离炉子两步就冷得让人缩脖子。她抬头，问你们要寄什么。
  keeper: 邮局里非常令人不适：炉子时不时发出刺耳响声，屋子温度忽冷忽热。 安娜起初不愿交谈，但调查员的问题很快会让她滔滔不绝——这是她发泄悲伤的出口。
  features:
  - 安娜的柜台
  - 分信格
  - 炉子
  exits:
  - main_street
  - eastman_house
  travel_minutes: {}
  art: post_office
  public: true
  weather:
  - snow
  - flicker
- id: eastman_house
  name: 伊斯特曼家
  read_aloud: 屋子拉着窗帘，门口堆着没人扫的雪。门厅里有一股久未开窗的气味，安娜的钥匙在锁孔里转了半圈才转动。 马路对面就是那栋破败的农舍，半埋在雪里。
  keeper: 萨缪尔·伊斯特曼是第一个患病的人，在调查员抵达前就已身亡。安娜会尽可能避免回家， 但愿意给调查员一把钥匙去看那本日记。日记并非真正的克苏鲁神话典籍， 翻阅笔记需要理智检定（0/1）；成功的克苏鲁神话检定能在速写中辨认出与犹格-索托斯相关的图像。
  features:
  - 萨缪尔的书桌
  - 那本潦草的日记
  - 卧室
  exits:
  - post_office
  - cardwell_farm
  travel_minutes: {}
  art: eastman_house
  public: false
  weather:
  - snow
- id: cardwell_farm
  name: 原卡德威尔家
  read_aloud: 农舍被雪压得微微倾斜，门没有锁，一推就开。屋里积着厚厚的灰，墙壁和地板都已腐朽， 能看到动物筑过巢的痕迹。空气里除了霉味，还有某种更冷的、像土一样的气味。
  keeper: 世纪之交废弃的老宅，被传成鬼屋、常有怪异的光、有撒旦教徒出没。事实是这家族长崇拜犹格-索托斯， 本身也小有法力；他曾奇迹般从重伤中恢复，同时儿媳死于重病，于是儿子杀了他，尸体丢进壁炉。
    正是从这位族长的日记和书籍中，卡洛琳和埃里开始接触法术。屋内更近的活动痕迹是多年前两人留下的。
  features:
  - 铺在卧室地板上的野餐毯
  - 墙角泡过水的课本
  - 刻着字母的书柜
  - 剥落墙皮的墙面
  - 壁炉
  exits:
  - eastman_house
  travel_minutes: {}
  art: cardwell_farm
  public: false
  weather:
  - snow
  - dust
- id: darvill_house
  name: 达维尔家
  read_aloud: 房子属于卡洛琳的父母，院子里没人扫雪。窗后没有灯，但屋后雪地上有一道被清理过的痕迹，通向地下室的门。 客厅里堆着许多古怪物件，地上散落着关于咒语、符文和药剂的笔记。
  keeper: 卡洛琳大部分法术都在地下室进行，包括死者复活。房子里住着卡洛琳的父母——他们被卡洛琳试图分享典籍知识后发疯， 又染上西班牙流感，被卡洛琳“治疗”之后成了眼神呆滞、洋洋自得、流口水的模样。
    证据齐全：典籍原本、床畔的信件与军方电报、父母那番关于面具的话。
  features:
  - 客厅的笔记
  - 地下室的门
  - 卡洛琳的床畔
  - 楼上的房间
  - 地下室里的香炉
  exits:
  - main_street
  travel_minutes: {}
  art: darvill_house
  public: false
