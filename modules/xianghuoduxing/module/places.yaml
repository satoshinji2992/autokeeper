locations:
  - id: hometown_stop
    name: 家乡汽车站
    art: hometown_stop
    aliases: [奥斯本药店, 普利茅斯车站]
    public: true
    read_aloud: 奥斯本药店门口的车站，对面是一家烟草店。山坡顶上是你看厌了的教堂尖顶。灰色的小长途车停在路边，车顶有行李架。
    keeper: |
      §1/§263/§8/§23/§38/§233：司机（西拉斯）从烟草店回来，搓着烟卷问“去哪儿？”，看过车票后说“行李架在上边”。调查员要把箱子搬上车顶：体型 40 的由司机帮忙（“小不点，包可够大的”），体型更高的自己举上去。司机弹掉烟卷上车，调查员是唯一的乘客。
      奥西皮之后的路线：罗切斯特、朴次茅斯，再沿海岸到纽伯里波特，最后到阿卡姆；调查员也许买得起部分火车票。原作这几段同时引导建卡。
    features: [随身的车票, 车顶行李架, 烟草店]
    scene_root: true
    outdoors: true
    ground: street
    views:
    - key: stop_roof_rack
      label: 车顶行李架
      features:
      - 车顶行李架
      prompt: 灰色小长途车的车顶,铁条行李架高高架在车身上,一只沉重的旧皮箱靠在车尾,路边尘土,烟草店的招牌在背景里
  - id: coach
    name: 长途车上
    art: bus
    read_aloud: 车厢窄小，座椅硬邦邦的，发动机一路咳嗽。窗外是溪流、白山和果园，偶尔有一头白尾鹿从林边抬起头。
    keeper: |
      §128/§134：一路窒闷、晕车，中途有体格粗壮的女人上下车。§71：司机自称西拉斯，没听说过阿卡姆，只去过一次波士顿；问起调查员的职业时各有不同反应（文物学家§102、医生§226“医生，哈？人们总是需要这些家伙”、记者§239“写文的？给报纸？”、私家侦探§249 眯眼不语、教授§265“我小时候就把书读够了”）。
      §261/§59 拖拉机事件见 events。傍晚到烬头村见 e_breakdown。调查员没上车，西拉斯照常开走，模组就此无从展开，由守秘人按原作把调查员带回车上的开局。
    features: [司机座位, 窗外风景]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: coach_window
      label: 窗外风景
      features:
      - 窗外风景
      prompt: 长途车窗外掠过的深秋景色:溪流、白色山脉的轮廓、黄红相间的果园,林边一头白尾鹿抬起头,车窗玻璃有灰尘和震动的痕迹
  - id: village_edge
    name: 村口空地
    art: village_edge
    aliases: [长途车停车处, 红石住宅旁]
    public: true
    read_aloud: 坡顶的小村，第一座粗糙的红石低矮住宅旁有一片空地，长途车就停在路边。四周的建筑阴郁沉默，小巷里没有灯。
    keeper: |
      §144：车在这里熄火，西拉斯打开发动机舱查看。调查员只能选一项、只试一次：汽车驾驶（常规）成功看出噪声像选错档或离合问题，老司机不会搞错，是诡计（§174，打勾）；困难心理学成功看出西拉斯在演戏（§162，打勾）；失败或不试则直接听他解释（§194）。
      §194：西拉斯说可能是油压，也可能摔坏了，得等两个气缸凉下来，今晚只能在这儿过夜：“这里叫烬头村，别的村子要走好几里，我每星期来两次。梅·莱德贝特有空房，顺着这条巷子右转左边第一间。明天早上八点回来找我。”问他住哪（§251）：村里有熟人，有地方睡、管早饭；调查员取下行李。当面质疑故障（§257）：西拉斯大怒，扯下包裹摔在调查员脚边，走进黑暗。
      §192：D2 早上调查员带行李来时（还早二十分钟），长途车已经不见；过路村民说“他天刚亮就走了，三四天后才回来，梅·莱德贝特那有房间”。§212：知道崖壁梯子也来不及在开车前用。
    features: [熄火的长途车发动机舱, 停车的空地]
    outdoors: true
    ground: street
    looks:
    - when: at:silas:village_edge
      change: 空地上停着一辆灰色小长途车，发动机舱盖掀开，车头前扔着一块擦手的油布
    views:
    - key: edge_engine
      label: 掀开的发动机舱
      features:
      - 熄火的长途车发动机舱
      prompt: 傍晚的光里,长途车的引擎盖掀开,发动机舱里油污斑斑,黑色的机器静止着,旁边是第一座粗糙红石头砌成的低矮住宅
  - id: central_street
    name: 中央大街
    art: central_street
    aliases: [锡尔伯里街, 大街, 村子]
    public: true
    read_aloud: 烬头村五分钟就能走完。中央大街笔直地指向村子东北角三条路交汇处那座黑色的金属建筑。锡尔伯里街从这里分出去，西边是西盘山路，南边的路转向东下坡，四面都是悬崖。
    keeper: |
      §6 村貌：西南草地上有坍圮的教堂和悬崖边的墓地；东北角是灯塔。§75：夜里散步时梅会借给调查员一盏沉重的提灯；窄巷右边是锡尔伯里街，左边篱笆桩后面是黑暗的悬崖。
      §86（D1 夜）：身后二十码有个漆黑的身影，被发现后冲进小道。回梅家（§100）或直面（§121）：它退进两屋之间的小巷，追踪检定成功见线索 c_watcher_face，失败它在尘土院子里悄无声息地消失（§130）。
      §131（D2 夜看星空）：一个漆黑身影贴在房后，一块石头飞过调查员身后，另一个黑影在小巷里盯着；直面也追不上（§163）。
      §3（D2 中午）：调查员饿了，梅带着露丝在街上碰见他，邀他回家吃饭。
      §98：D3 暗中调查过三处后，光头缺一只耳朵的村民、机警的少年、凶神恶煞的中年主妇和扛棍的男人四人逐渐围拢。绕建筑甩掉（§158 潜行，成功打勾→试出村§7，失败§170被扳倒制服）；直接逃（§164）：东盘山路口有四个守卫，逃进教堂。
    features: [通向灯塔的大街, 锡尔伯里街, 两屋之间的小巷, 尘土院子]
    scene_root: true
    outdoors: true
    ground: street
    views:
    - key: street_to_beacon
      label: 笔直指向灯塔的大街
      features:
      - 通向灯塔的大街
      prompt: 一条笔直的土路穿过阴郁的低矮房屋,尽头是村东北角一座漆黑的熟铁建筑,孤零零直指天空
    looks:
    - when: flag:sign_fs_street_windows_2
      change: 大街上多了许多抱着柴捆的村民，排成一线，朝大街尽头走去。
  - id: ledbetter_house
    name: 莱德贝特家
    art: ledbetter_house
    aliases: [梅家, 莱德贝特住宿, 住宿]
    public: true
    read_aloud: 一座朴素的石板色房顶小楼，房前挂着“莱德贝特”的名牌，下面一块洁净的铜牌写着“住宿”。屋里厨房兼作起居室，炉火上烧着水。
    keeper: |
      §4/§267：梅爱尔兰口音、卷发、穿粗糙便服，收留调查员过夜，请他喝茶。可谈西拉斯（§14）、节日（§21）、她的生活（§31 取悦检定：成功§39，失败§51 她转而像导游一样介绍村子）。§63：撞门声，露丝在偷听，“很高兴见到你”；露丝今夏十岁，梅说她是“既快乐又痛苦的孩子”，跟梅睡一间。
      §138（D2 晚洗碗时）：问西拉斯在村里的朋友，梅说他认识村那头的特洛伊，两人是欢喜冤家，昨晚可能在特洛伊家过夜。说服梅出门去问：按调查员的方式选取悦、说服或话术之一，成功梅出门（设 ruth_alone，§145），失败梅说明早再找、要管教露丝（§151）。
      §64（早晨）：厨房空着，有面包鸡蛋，梅留纸条说带露丝出门几个小时。§166：D2 早餐后七点半付钱打点行李；§218：发现车已走，梅在洗衣服，让调查员寄存行李，说村里没人有汽车，可以问村会堂的文特斯或工匠（工坊在锡尔伯里街左边第一个门），“不管你有没有钱，我都不会让你睡在马路上的。”
      §107：知道崖壁梯子的，可在独处时顺小巷溜到屋后，从二十英尺高的悬崖爬下去（通往 cliff_foot）。
      §13：在林中昏倒的调查员被农夫后半夜在路上发现，送回这里，醒来回复 1 点生命。
    features: [厨房餐桌, 壁炉, 屋后的小巷, 屋后北面崖边]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: kitchen_table
      label: 厨房餐桌
      features:
      - 厨房餐桌
      prompt: 低矮厨房里的木餐桌,桌上有茶壶和杯子,旁边炉火上烧着水,小窗外望得见群山
  - id: guest_room
    name: 客房
    within: ledbetter_house
    art: guest_room
    read_aloud: 客房很冷，一张床、一个壁炉、一扇门。门没有锁闩。
    keeper: |
      §154（D1 夜）：梦见炉火蔓延，醒来壁炉是冷的；受过伤回 1 点生命。§58：被脚步声吵醒，受过伤回 1 点生命。
      §157（D2 夜）：客房像牢房。睡下（§224）：又梦见壁炉里悬浮的、没有燃料的火焰，蓝黄红紫，火舌刷过皮肉→§26 醒来腹痛、空气芳香馥郁，当天技能检定带惩罚骰。不睡（§230）：门把手慢慢转动，见事件 e_may_night。
      §52：彻夜不眠，日出是病态的橙色，梅在厨房，前门开开关关；体质检定，失败当天技能检定带一颗惩罚骰。
      §248：拉开门后可搬厨房椅子顶住房门安心小睡（§58）。
    features: [壁炉, 床, 房门]
    outdoors: false
    ground: building
    views:
    - key: guest_fireplace
      label: 客房壁炉
      features:
      - 壁炉
      prompt: 冷清客房里的石砌壁炉,炉膛里是冰冷的灰烬,旁边是一张铺着洁净床单的床
    looks:
    - when: knows:players:clue:c_powder
      change: 壁炉角落里多了顶针大小的一撮黑色粉末,带着一缕细烟
      'on': guest_fireplace
  - id: may_bedroom
    name: 梅的卧室
    within: ledbetter_house
    art: may_bedroom
    read_aloud: 卧室里堆着脏衣服、露丝的课本和廉价小说，床下露出一个旧洋娃娃。
    keeper: |
      §83：侦查。成功（§95）见活板门；失败（§89）只在抽屉里找到结婚照，可孤注一掷重掷侦查，成功§95，失败§101：梅回来了，“那么，你明白的。”一大群村民从她身后涌出制服调查员（设 captured）。大失败不能孤注一掷。
    features: [抽屉, 床下地毯, 脏衣和课本]
    outdoors: false
    ground: building
    views:
    - key: bedroom_rug
      label: 床下的地毯
      features:
      - 床下地毯
      prompt: 凌乱的卧室,脏衣服堆在地上,课本和廉价小说散落在被褥上,床下露出一个旧洋娃娃和一角地毯,地板上有一道浅浅的拖痕
    looks:
    - when: knows:players:clue:c_trapdoor
      change: 床被拉开,地毯掀起,露出一扇通向黑暗的木活板门
      'on': bedroom_rug
  - id: cellar
    name: 地窖
    within: ledbetter_house
    art: cellar
    read_aloud: 活板门下是阴冷的地窖，靠墙摞着一大堆旅行箱和公文包。
    keeper: §114：看完后退回去，把床推回原位（§120）。
    features: [旅行箱和公文包]
    outdoors: false
    ground: building
    views:
    - key: cellar_luggage
      label: 摞起的行李箱
      features:
      - 旅行箱和公文包
      prompt: 阴冷昏暗的地窖,靠墙摞着一大堆各种尺寸的旅行箱和公文包,落满灰尘
    looks:
    - when: knows:players:clue:c_luggage
      change: 许多箱子的提手上挂着行李标签,写着各不相同的名字
      'on': cellar_luggage
  - id: general_store
    name: 杂货店
    art: general_store
    public: true
    read_aloud: 大街拐角、南边下坡前的杂货店，货架上是日用品，柜台后站着一个体形硕大、系着浆硬围裙的女人。
    keeper: |
      §16：每星期两辆长途车；隔周星期二有卡车送货，下星期才来。可以买日用品；能买到的武器只有一把积着灰的狩猎小刀。徒步出村前可在这里或梅家备好钱、水和三明治（§28）。
      §156（D3 晚）：村民都聚到灯塔，路上空了，南路杂货店墙边靠着一辆自行车（调查员在普罗维登斯学过骑车）。
    features: [柜台, 货架, 墙边]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: store_counter
      label: 杂货店柜台
      features:
      - 柜台
      prompt: 杂货店的木柜台,后面货架上摆着日用品,柜台上有一把积着灰的旧狩猎小刀,浆硬围裙的人影站在后方
  - id: village_hall
    name: 村会堂
    art: village_hall
    public: true
    aliases: [会堂]
    read_aloud: 村会堂在北面较低的山脊上，锡尔伯里街东头，背靠悬崖，是村里最大的建筑。大厅连着配楼，东边面朝灯塔的一扇窗被砖砌死了。右边一扇门上写着“私用”，左边房间里摆着长凳和一块布告板。
    keeper: |
      §84：上午锁门，灰衣女人说文特斯上午不开门，下午再来；问电报，她说“不知道，我们要拍给谁？”。§11/§24/§37：下午敲“私用”门，或看布告板时，克莱德·文特斯出来请调查员喝咖啡。
      §126（D3 白天潜入）：绕北边崖壁从后面接近，最西边一扇窗的百叶松弛可以钻进去，进的是集会室，外面村民正兴奋地议论；推开“私用”门进 private_room。§207/§213/§190：在暗室逗留后听到大门钥匙声，冲向窗户做敏捷检定，成功跳窗未被发现，失败村民涌入，文特斯说“原来您在这里”（设 captured）。
    features: [布告板, 被砖砌死的窗下地板, “私用”门]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: hall_board
      label: 布告板
      features:
      - 布告板
      prompt: 明亮的集会室墙上并排挂着两块布告板,一块贴着旧广告和泛黄的价目表,另一块钉满孩子们五颜六色的涂鸦
    looks:
    - when: knows:players:clue:c_board
      change: 孩子那块板上有一张少了图钉、倒吊着的画,画着一只巨鸟扑向一个小村
      'on': hall_board
  - id: private_room
    name: “私用”房间
    within: village_hall
    art: private_room
    read_aloud: 房间里有书架和文件柜，一角堆着食品，桌上放着一台电报机。书架上分门别类：数学科学、文史、文学、通俗小说，还有一摞破烂的《幻丽诡谭》。
    keeper: |
      §62：文特斯说牌子只是防集会时有人随便进出，书其实属于全村。§68：一个下午只够读一类书，选一条（本地历史/节日/科学/怪诞小说）。§99：下午流逝，文特斯看窗外起身，信用评级检定：成功（§111）再留半小时，“没有借书卡不要带走书”，可做侦查（§118）；失败（§105）他说天黑前有差事，请明天下午再来，一同离开。
      §133（D3 潜入）：屋里昏暗；侦查（已检查过书架的给一颗奖励骰），成功见 c_secret_shelf，失败只找到书间夹着的地图（§140）。
    features: [文史书架, 阿尼奥洛夫斯基博士手稿, 天文书, 《幻丽诡谭》, 墙上黏着的书, 靠砖窗的书架, 书间夹着的地图, 电报机]
    outdoors: false
    ground: building
    views:
    - key: room_manuscript
      label: 手写的手稿
      features:
      - 阿尼奥洛夫斯基博士手稿
      prompt: 桌上摊着一盒泛黄的手写稿纸,字迹密密麻麻,纸边卷曲发脆
    - key: room_shelf_window
      label: 靠砖窗的书架
      features:
      - 靠砖窗的书架
      prompt: 昏暗房间里一排挨着北墙的高书架,书脊整齐,有些书套看着像是粘在架子上的
    looks:
    - when: knows:players:clue:c_manuscript
      change: 手稿读到末页戛然中断,最后一页的句子只写了一半
      'on': room_manuscript
    - when: knows:players:clue:c_secret_shelf
      change: 一只书套被向左拉开,一段书架向外敞开,后面露出黑暗的缝隙
      'on': room_shelf_window
  - id: hidden_alcove
    name: 书架后的壁龛
    within: village_hall
    art: hidden_alcove
    read_aloud: 书架后面是一个仅容一人的壁龛，两边是隐蔽的书架，黑得几乎看不清。
    keeper: |
