      §34：中央大街笔直地指向灯塔，似乎不是巧合。教堂另一侧的门长着青苔、锁着。
      §164/§176：被追进教堂时，两人爬窗、两人走正门，男人用棍子敲着手掌说“投降吧”。可以投降（§108）或抓住一根弯曲的木柱弄塌屋顶：困难力量，失败被压制夺棍（§183，关押）；成功屋顶坠落，再过幸运检定：成功屋顶砸倒追兵，从石墙裂口挤出，在墓碑和杂草间爬到路口，从东盘山路逃走（§204，设 escaped_village）；失败被屋顶砸死（§196）。
      §259：阿博加斯特约的“另一边的坟地”就是这里（原文只说“另一边的坟地”，AutoKeeper 按原书地图上唯一的墓地对应）。
