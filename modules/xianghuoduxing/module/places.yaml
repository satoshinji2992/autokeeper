  - id: beacon
    name: 灯塔
    art: beacon
    public: true
    read_aloud: 村子东北角三条路交汇处立着一座熟铁铸成的灯塔，外面烤着黑漆。头顶高处是一个巨大的弧形平台，撑架像蛇一样蜿蜒汇聚到中心，上面的雕刻都熔化变形了。旁边堆着成捆的木头。
    keeper: |
      §57（D2）：一个红肿老眼、拄手杖的老绅士在附近。侦查成功见 c_beacon_houses。
      §78/§61（D3 早上）：村民把木柴搬到灯塔，两个人在上层平台搭建三角形的篝火结构；村民的表情顺从、冷漠，也有恐惧。§29：从房子背面往村东潜行观察灯塔，右侧是断崖，窄处要扶墙；敏捷高于体型直接到达（§42），否则敏捷检定（相等也要检定），失败断崖崩落（§36）：攀爬成功爬上约二十英尺断崖（§48，打勾），失败摔下岩地受 2D6 伤害（§55）；伤害达最大生命一半以上为重伤，过体质检定，失败或生命归零即坠崖失血而死（§67/§73/§92），否则被两个村民扶回、处理伤口后锁门关押（§82）。
      灯塔仪式见 e_procession、e_ignite。
    features:
    - 成捆的木头
    - 四周房屋
    - 通往高台的黝黑铁阶梯
    scene_root: true
    outdoors: true
    ground: street
    looks:
      - when: flag:beacon_lit
        change: 灯塔高台上燃起冲天大火，橘黄的火光照亮整片夜空，浓烟里火星四溅
      - when: at:winters:beacon
        change: 灯塔脚下的空地被黑脸村民和成排的火把围满，人人左眼画着红三角，铁阶梯两侧站着披黑长袍的高大身影
      - when: flag:sign_fs_beacon_warmth_1
        change: 灯塔脚下的草地多出一圈枯黄卷曲的草叶，都朝塔身倒伏。
