    - key: beacon_wood
      label: 成捆的木柴
      features:
      - 成捆的木头
      prompt: 漆黑的熟铁灯塔脚下堆着一捆捆整齐的木柴,头顶的弧形平台和蛇形撑架在天空下轮廓粗重
  - id: old_church
