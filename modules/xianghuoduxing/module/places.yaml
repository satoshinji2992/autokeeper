    public: true
    aliases: [教堂, 墓地, 坟地]
    read_aloud: 西南边草地上是一座坍圮的教堂，尖塔已经没了，前半截塌了，后半截还完整。长椅上长着霉斑，看样子废弃了二十年左右。教堂外的悬崖边是墓地，墓碑埋在茂盛的杂草里。
