  - id: east_road
    name: 东盘山路
    art: east_road
    public: true
    read_aloud: 南边的路转向东，一路下坡。低地里是庄稼和牲畜，却看不到一匹马。越过一道山脊，坡下散落着几间棚屋。
    keeper: |
      §115（D2）：一个上了年纪、穿破烂外套、扯块布当头巾裹着头的男人看见调查员，愣住了。幸运检定：成功（§127）他仰望村子的悬崖顶，转身走远，慢慢招手示意，跟上去（§142）见他在两块岩石间消失；失败（§135）他一瘸一拐、发狂般地逃跑，追（§150）是对抗敏捷，他的敏捷 38，胜（§172）他说“你这混账……你能离开我吗？……我们不能在这里说话，跟我来”，负（§87）跟丢，困难侦查成功找到岩缝（§181）。
      §7（D3）：南边和西边村口各有四个村民持农具和棍棒把守。话术（§119）：说灯塔需要他们，伸手去拿干草叉，猿猴眉的村民说“你和我们一起走”，极难话术成功（§132）拿着干草叉站哨，等他们去灯塔后扔掉草叉下山（设 escaped_village）；化装（§125）：拿梅家晾衣绳上的旧衣，弓腰驼背拖着脚，困难乔装，成功（§146，打勾）守卫点头放行；失败（§139）被抓回村中心关押。知道崖壁梯子的可改走崖下（§107）。
      §152：逃出村时落日，东行入林，约两小时后天黑，身后传来两匹马的蹄声（见 e_carts）。§160：去奥西皮至少六七英里，沿途没有村庄和车马，需要补给。
