      fingerprint: f3542d3eaf7608085991bc6e8e50f1b68e23cdfec6bd5a38b8c5d66bc3fcc491
      source: 8bc1bde32ec99f42e272fd64ddd13079d2f8f187e5ee477c66393ab28e6430cd
      reason: §223：调查员一个人在山顶回望燃烧的灯塔和移动的星星，没有 NPC 在场。
history:
- when: 四十年前
  text: 据阿博加斯特所说，烬头村在四十年前就已被来自群星的火焰毁灭、被星星吞噬；火焰被“送走”，此后必须的牺牲一年又一年地推迟，演变成每年的火焰节。村民的父母辈知道这个真相。这是阿博加斯特的说法，原作没有第二个来源。
  who:
  - arbogast
  where: beacon
- when: 多年前（原作未写具体年份）
  text: 阿博加斯特原是村里的“中转者，也是解密者”，后来文特斯用花言巧语改变了仪式，夺走了他的位置。村里人对他说要么滚要么死，他带走了古老的咒语，躲进崖下山洞。他自己试过用咒语，因此失去了集中力。
  who:
  - arbogast
  - winters
  where: arbogast_cave
  known_by:
  - winters
- when: 多年前（原作未写具体年份）
  text: 梅的丈夫被村里人带走，这是露丝的原话；原作没有说明他是否也是在节日上被献祭。梅对外只说自己是寡妇、没有丈夫。
  who:
  - may
  - ruth
  where: ledbetter_house
  known_by:
  - may
  - ruth
- when: 历年（西拉斯跑这条线已十五年）
  text: 西拉斯故意让长途车在节日前夕抛锚，把孤身旅客留在烬头村。梅收留这些旅客、寄存行李，行李堆进卧室床下活板门通往的地窖，现有二十来件，标签上有八九个不同的名字；这些前人都没能离开。
  who:
  - silas
  - may
  where: cellar
  known_by:
  - silas
  - may
  - winters
- when: 今年一月到八月
  text: 三名村民先后死去：本杰明·克拉默（1月19日）、亚伯拉罕·霍林斯沃思（4月22日）、玛利安·菲普斯（8月6日）。遗体被防腐、用绷带裹好，脚趾挂着标签，藏在村西北角上锁的工坊里，红布盖着，留作今年节日仪式用。工匠说他们是自然死亡。
  who:
  - craftsman
  where: locked_workshop
  known_by:
  - craftsman
  - winters
agendas:
- npc: may
  goals:
  - 把外来人安顿在家里，平平稳稳留到节日那天
  - 护住露丝，也管住她的嘴
  steps:
  - id: may_take_in
    text: D1 傍晚调查员按西拉斯指的路来敲门，她应门，请他进屋喝茶，报个公道的价钱留宿，顺着话头聊西拉斯、节日；问到节日时直说是后天晚上的火把游行与灯塔
    meet: true
    once: true
    only_if: 调查员来到她家门口
    source: ledbetter_house §4/§14/§21/§267
  - id: may_hospitality
    text: 调查员想多聊时，她热情应对：谈自己是寡妇、有点积蓄、欢迎旅客；取悦成功才说出村里“不排斥任何人，只刨掉自己选择离开的人”；取悦失败她转成导游式介绍村子（工坊、面包），然后打呵欠去睡
    meet: true
    once: false
    only_if: 调查员与她闲谈；取悦检定的结果由守秘人裁定
    source: ledbetter_house §31/§39/§51；c_may_life
  - id: may_morning_out
    text: D2 早晨她留纸条带露丝出门几个小时；调查员带行李回来时她在洗衣服，让他寄存行李，说村里没人有车，可问文特斯或工匠，“不管你有没有钱，我都不会让你睡在马路上”
    when: D2 05:30
    meet: true
    once: true
    only_if: 调查员D2早上回到她家
    source: ledbetter_house §64/§166/§218
  - id: may_lunch
    text: D2 中午在街上碰到饿了的调查员，邀他回家吃饭，说文特斯下午才在会堂，“房门没有锁”，把话岔开不让露丝多说
    when: D2 12:00
    meet: true
    once: true
    source: e_lunch §3
  - id: may_go_out_ruling
    text: D2 晚洗碗时调查员以西拉斯朋友特洛伊为由请她出门：取悦、说服、话术择一，成功她半信半疑地出门（设 ruth_alone），失败她说明早再说并要管教露丝
    meet: true
    once: true
    only_if: 调查员当面向她提出，并选定一种交涉方式
    source: ledbetter_house §138/§145/§151
  - id: may_go_out_result
    text: 该次交涉检定成功后，梅出门几分钟，露丝可单独说话
    only_if: 调查员当面提议后，守秘人裁定取悦/说服/话术成功
    ruling: true
    source: ledbetter_house §145
  - id: may_powder
    text: D2 夜她到客房壁炉点燃含莨菪的黑色粉末让客人昏睡；调查员不睡并撞见，她说“怕你冷想生个火”，被堵住时说那是帮助睡眠的东西、“明天对你很重要”、“我还要照顾女儿，我没有丈夫”；被吓住失败则大怒，说街上住着十八个人
    when: D2 23:00
    meet: false
    source: e_may_night §157/§230/§254/§260/§19/§32；c_may_drug_claim
  - id: may_at_beacon
    text: D3 晚她涂黑脸，随游行到灯塔，站在人群里看调查员被烧
    when: D3 20:00 & flag:captured
    does: at:may:beacon
    source: e_procession §33
- npc: ruth
  goals:
  - 让外来人在节日前逃走
  - 自己几年后也会被带走，怕母亲
  steps:
  - id: ruth_overheard
    text: D1 夜梅起身时她在门后偷听，被叫出来问好，说“很高兴见到你”后被打发回屋
    meet: true
    once: true
    source: ledbetter_house §63
  - id: ruth_street_warning
    text: D2 中午在街上先高兴地跑向调查员，又忽然收起笑容，低声要他节日前就走，随后躲到母亲身后，用眼神恳求他别说；调查员当面问她，她只说节日又亮又热到处是火
    when: D2 12:00
    meet: true
    once: true
    source: e_lunch §3/§9；c_ruth_warning；c_ruth_fire
  - id: ruth_truth_alone
    text: 只有梅不在场时才从门缝后低声说实话：是明天（D3晚）、每年都有、他们带走了她爸，也会带走你，你一来就被盯上，过几年轮到她
    when: flag:ruth_alone
    meet: true
    once: true
    only_if: 调查员当面与她单独说话，梅确实不在
    source: c_ruth_truth §145
  - id: ruth_third_dancer
    text: D3 晚她扮第三个舞者亲吻调查员并耳语：外貌检定成功时说已放松锁链、火高到能藏住你之前别逃（设 chain_loosened）；失败时只听见祝福的套话
    when: D3 20:00 & flag:captured
    only_if: 调查员被押到灯塔前，外貌检定由守秘人裁定
    ruling: true
    source: e_procession §10/§148
- npc: silas
  goals:
  - 把孤身乘客留在烬头村，天亮就走
  steps:
  - id: silas_breakdown
    text: 在村口假装故障，说是油压或摔坏，要等气缸凉，让他去梅家过夜、明早八点回来；被质疑就大怒摔下行李走进黑暗
    when: flag:breakdown_done
    meet: true
    once: true
    source: village_edge §194/§251/§257；c_silas_stay
  - id: silas_leaves
    text: D2 天刚亮独自开车离开，三四天后才回
    when: D2 05:30
    source: e_bus_leaves §192
    meet: false
  - id: silas_at_beacon
    text: D3 晚他站在梅身旁，涂黑脸出现在灯塔前的人群里
    when: D3 20:00 & flag:captured
    does: at:silas:beacon
    source: e_procession §33
- npc: winters
  goals:
  - 让节日照常举行，把外来人稳在村里
  steps:
  - id: winters_closed_morning
    text: D2 上午会堂锁门，由灰衣女人打发调查员下午再来
    meet: true
    once: false
    source: village_hall §84
  - id: winters_coffee
    text: D2 下午调查员敲“私用”门或看布告板时他出来，请喝咖啡，聊村子是“交易”、父亲留下的责任、夕阳后看星空；问到电报就说线坏了两周、后天或有人来修、长途车三天后往西走，可托维修队捎人
    meet: true
    once: true
    only_if: 调查员下午来会堂
    source: village_hall §11/§24/§37/§49/§56；c_telegraph；c_winters_trade
  - id: winters_library
    text: 被问藏书室时说书属于全村，“私用”牌只防集会时进出；允许调查员选一类书读一个下午；太阳将落时站起，信用评级成功再留半小时（不带书走），失败则请次日再来并一同离开锁门
    only_if: 调查员询问藏书室；信用评级由守秘人裁定
    ruling: true
    source: private_room §62/§68/§99/§105/§111
  - id: winters_speech
    text: D3 晚在灯塔高台上致辞，感谢拯救村庄的人，称调查员将代替村民被从天而降者带走
    when: D3 20:00 & flag:captured
    does: at:winters:beacon
    source: e_procession §33
- npc: arbogast
  goals:
  - 找一个能把咒语念出来的人，结束烬头村
  steps:
  - id: arbogast_cave_meet
    text: D2 白天在东盘山路被调查员撞见，或招手或逃跑；进洞后拉下头巾，自称阿博加斯特，听调查员说来意后讲四十年前的毁灭、阿布纳基人、旧日支配者、村民父母知道真相；情绪突变时可能抓石头砸人
    meet: true
    once: true
    only_if: 调查员在D2与他相遇并跟进山洞；是否追上由幸运/对抗敏捷裁定
    source: east_road §115/§127/§135；arbogast_cave §191/§199/§221
  - id: arbogast_appointment_offer
    text: 他看出调查员“有以前那些人没有的东西”，约晚九点在另一边的坟地见面，要他别被跟踪、别想逃走
    meet: true
    once: true
    source: c_appointment；arbogast_cave
  - id: arbogast_pickup
    text: D2 21:00 他不在坟地，等十分钟后从门里伸手拉住调查员，带他去学校后的壁凹
    when: D2 21:00 & flag:arbogast_appointment
    meet: true
    once: true
    only_if: 调查员在约定时间到过教堂墓地
    source: e_arbogast_night §200/§169
  - id: arbogast_teach
    text: 在壁凹讲控制的仪式，并教咒语；咒语核心要连念三遍，叮嘱“只要你还有活路就别念”；调查员拒绝则憎恨地说“记得我曾给你触碰永恒的机会”，往东盘山路离去
    meet: true
    once: true
    only_if: 调查员已在晚间与他会合
    source: school_alcove §169/§175/§182；c_control_ritual；c_chant
  - id: arbogast_killed
    text: 咒语课结束后被村里派来的刺杀者袭击身亡
    meet: false
    source: e_assassination §188–§236
foreshadow:
- id: fs_edge_glance
  hint: 西拉斯掀开发动机舱盖，嘴里骂着，眼睛却先朝巷口瞟了一下，才低头看机器。
  where: village_edge
  pays_off: k_silas
- id: fs_street_windows
  hint: 低矮的窗后总有人影站着不动，你一抬头，窗帘便落了下来。
  where: central_street
  pays_off: k_trap
  stages:
  - hint: 街上的人比昨天少，可每扇窗后的目光都更重了，没有人和你对视。
    when: D2 12:00
  - hint: 一早街上满是人，个个抱着柴捆，脚步安静而整齐，都朝同一个方向走。
    when: D3 06:00
    flag: sign_fs_street_windows_2
- id: fs_house_footsteps
  hint: 夜里，门外的木地板偶尔轻响，有人在你的房门外站了一会儿，才慢慢走开。
  where: ledbetter_house
  pays_off: k_may
  stages:
  - hint: 梅洗碗时把同一只盘子擦了很久，目光总落在你的鞋和放行李的角落。
    when: D2 17:00
- id: fs_beacon_warmth
  hint: 秋天的傍晚冷风刺骨，那座黑铁的灯塔远看却像比四周的空气暖一些，站近了，耳边有极轻的嗡鸣。
  where: beacon
  pays_off: k_fire
  stages:
  - hint: 灯塔脚下的草叶一圈枯黄卷曲，朝塔的方向倒伏。
    when: D3 06:00
    flag: sign_fs_beacon_warmth_1
- id: fs_east_road_voice
  hint: 风从崖下带上来断断续续的低语，像有人在反复念着什么，听不清字句。
  where: east_road
  pays_off: k_fire
- id: fs_workshop_drag
  hint: 那扇关着门的工坊门前，尘土被拖出几道宽宽的印子，又被人用扫帚匆匆抹过。
  where: workshops
  pays_off: k_trap
