mechanics:
  - name: 阿博加斯特的咒语
    runs: 守秘人
    why: §40/§50/§270
    rules: 只有学会了咒语（learned_chant）、被锁在灯塔上且火已点燃时才可以念。连呼三遍 “Ph'nglui mglw'nafh Cthugha Fomalhaut n'ghaghaa naf 'l thagn! Iä! Cthugha!”，不掷骰，必定生效：火舌停在半空，第二颗太阳升起，方圆十六英里被毁，调查员也死去（§270，设 chant_cast）。
  - name: 召唤天之火
    runs: 守秘人
    why: §80/§197
    rules: 抄记了“召唤天之火”的调查员（knows_fire_rituals）在灯塔上念诵约二十秒；它只在“群星归位时”有效，此时不是，不掷骰：村民同声吟诵，群星坠落，调查员被烧死（§80，设 summon_cast）。
  - name: 号令天之火
    runs: 守秘人
    why: §90/§198/§209
    rules: 抄记了“号令天之火”的调查员在灯塔上念诵约二十秒，自选消耗魔法值，最多 10 点；魔法值不足可用生命值代替，但生命值不能降到 0。成功率为每点 10%，掷出 96–100 必定失败。失败按 §65 处理（1D6 火伤，归零烧死，否则力量检定）。成功（§209）群星看见他，失去 1D3 理智，理智归零即 §220（设 star_madness）；否则他可选择号令群星返回原位（§255）、放他解脱（§243）或烧尽村民（§231），三者都以他的死亡告终。
  - name: 惩罚骰之日
    runs: 守秘人
    why: §26/§52
    rules: 吸入莨菪烟醒来，或彻夜不眠且体质检定失败，当天所有技能检定加一颗惩罚骰；幸运、理智和伤害骰不受影响。设 drugged，第二天清除。
  - name: 暗中调查三处后被围
    runs: 守秘人
    why: §120/§98
    rules: D3 白天在搜梅卧室、独去村会堂、工匠工坊、窥探灯塔四项中做过三项后，四个盯梢村民围拢上来（设 suspicion_high）。调查员可绕建筑甩掉（潜行），或直接逃往教堂。

ties:
  - id: t_arkham_job
    hook: 调查员在阿卡姆的新工作有确定的报到日期，耽误不得
    fits: [职业]
  - id: t_ruth_child
    hook: 露丝的年纪和神情让调查员想起家里的某个孩子
    npc: ruth
    fits: [重要之人]

relations:
  - {a: may, b: ruth, kind: 亲属, value: 70, why: 女儿，要护着她，也要管住她的嘴}
  - {a: ruth, b: may, kind: 恐惧, value: -30, why: 妈妈，怕她，也替她难过}
  - {a: arbogast, b: winters, kind: 敌对, value: -80, why: 认定他是只会花言巧语的蠢材，夺走了自己的位置}
  - {a: may, b: silas, kind: 盟友, value: 40, why: 开车太快的老相识，村子唯一的对外联系}
