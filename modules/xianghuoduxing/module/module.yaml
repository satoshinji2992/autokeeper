id: xianghuoduxing
title: 向火独行
subtitle: 《克苏鲁的呼唤》介绍性单人冒险
system: CoC7
era: 1927 年（秋）
setting: 美国新罕布什尔州北部，北面白山山脉、南面温尼伯索基湖之间的山顶小村烬头村（Emberhead）
players: 1 人
duration: 约 2 小时
source: Chaosium《Alone Against the Flames》（加文·英格利斯著），七宫涟个人汉化本
license: Chaosium 免费发布的入门冒险，仅供个人游戏
cover: cover
hook: 你要去阿卡姆开始新的工作和新的生活。家乡车站没有亲友来送你，你独自登上拉赫曼与科斯特洛车行的长途车，这只是漫长换乘的第一站。
truth: |
  烬头村每年秋天举行“火焰节”：全村涂黑面孔、在左眼画红三角，举火把游行到村东悬崖上的熟铁灯塔，把一个外来人锁在灯塔高台上烧死。
  长途车司机西拉斯每星期来村里两次，他故意在节日前夕让车“抛锚”，把孤身旅客留在村里；梅·莱德贝特收留旅客、寄存行李、夜里在客房壁炉里点莨菪粉末让人昏睡，地窖里堆着八九个前人的行李。村会堂的克莱德·文特斯主持仪式。
  村民相信这是把村庄从“虚空之火”中拯救出来的仪式。被逐出村子的老人威拉德·阿博加斯特说：四十年前烬头村曾被来自群星的火焰毁灭；这不是人祭，而是“控制的仪式”，文特斯只懂咒语、不懂召唤的是什么（克图格亚，来自北落师门的活火焰）。阿博加斯特保存着古老的咒语，会教给调查员，但当晚就被村里的刺杀者杀死。
  村会堂书架后的暗室藏着记有“召唤天之火”“号令天之火”两个仪式的典籍。三种咒语都不能救命，只会导向不同的火焰结局。真正的生路是在节日前离开烬头村，或在灯塔上挣脱后趁乱骑车逃走。
keeper_notes: |
  【原作与换算】原作是 CoC7 单人游戏书，270 个编号段落，检定、数值、理智损失都是 CoC7 原值，照抄即可。原作的“在技能左边方框打勾”即 CoC7 的技能成长标记，按核心规则处理。“在条目号上加 N”的秘密跳转改为知识条件：调查员知道某条秘密（崖壁梯子、咒语、仪式）才可选相应行动。下文 §N 指原作第 N 段。
  【时间线】D1 白天乘车，傍晚长途车在烬头村“抛锚”（§144），夜宿梅家。D2 天刚亮西拉斯开车离开（§192），白天可探村、找文特斯、遇阿博加斯特；D2 晚九点可赴阿博加斯特之约；D2 夜梅在客房下药。D3 白天全村准备节日、出村路口有人把守（§7）；D3 晚火焰节，调查员被锁上灯塔。梅 D1 晚说节日在“后天晚上”（§21），灯塔边老人 D2 说“明天晚上点亮”（§57），一致为 D3 晚。评测也说冒险在三天内完成。
  【AutoKeeper 补充】开局钟点（D1 09:00）、抛锚钟点（D1 17:30，原文为“傍晚”）、西拉斯离开（D2 05:30，原文“天刚亮”）、D3 18:00 村民抓人、D3 20:00 游行、D3 21:00 点火，这些具体钟点都是补充，依据是原文的“傍晚”“天黑”“晚上”。原作抓人的途径有很多（§2、§82、§101、§139、§170、§183、§190 等），都把调查员送进囚室（§108）；D3 傍晚仍留在村里就被抓，这一条是把原作各分支归并后的处理。
  【原作检定较多】译者建议只在关键节点掷骰，社交先扮演；守秘人可以按规则书第 10 章取舍。原作提供的检定和结果保留在各地点 keeper。
  【白天 D2 探村】原作允许上午任选四处（§6/§25）：杂货店、村会堂（上午锁门）、东盘山路、灯塔、教堂、找有车的居民（工匠大院），中午梅带露丝请吃午饭（§3），下午可徒步出村（§28）或找文特斯（§11）。
  【徒步出村 D2】§28→树林（博物学）→§54 三条路：上山（§60）、小径（§85 幸运）、沿路遇熊（§103）。天黑前到不了下一个村子（§79），夜里林中或者爬树（§208）做火焰之梦，或者继续走遇到燃烧的兽群（§264）。这些分支最终都会昏倒（§13），被农夫在后半夜路上发现送回梅家，回复 1 点生命，进入 D3 早晨（§64）。
  【D3 秘密调查】§120 枢纽：搜梅卧室（§83）、独去村会堂（§126）、工匠工坊（§219）、窥探灯塔（§29）、东盘山路下山（§7）。原作规定试过三项后被四个村民围拢（§98），用标记 suspicion_high 表示，由守秘人在调查员第三次暗中调查后设上。
  【咒语与仪式】见 mechanics。阿博加斯特的咒语只在被绑上灯塔、火已点燃时可用（§40）。“召唤天之火”只在“群星归位时”有效，调查员在灯塔上念诵必然失败：群星坠落，被烧死（§80）。“号令天之火”：每消耗 1 点魔法值有 10% 成功率，最多 10 点，魔法值不足可用生命值代替但不能降到 0，掷出 96–100 必定失败（§90/§198）；成功后失去 1D3 理智（§209），归零即 §220；之后可号令群星返回原位（§255）、放你解脱（§243）、烧尽村民（§231），三者都是在灯塔上死去的结局。
  【惩罚骰】被莨菪烟熏过夜醒来（§26），或彻夜不眠且体质检定失败（§52），当天所有技能检定加一颗惩罚骰（不影响幸运、理智、伤害骰）。
  【原文矛盾】熊的爪击伤害：§167（逃跑失败）写 3D6，§173（正面搏斗）写 2D6。creatures 按 §173 战斗规则写 2D6；逃跑失败被追上时按 §167 用 3D6。车夫敏捷原为 32，汉化本修正为 31。
  【原文缺页】§81 阿尼奥洛夫斯基博士手稿在第 28 页末戛然而止，后页丢失，原作就是这样，不补写。
  【冒险后】§171：带走德比诗集《阿撒托斯及其他》的，冒险结束后可花一星期读：理智检定，成功失 1 点、失败失 1D4，克苏鲁神话 +4。
