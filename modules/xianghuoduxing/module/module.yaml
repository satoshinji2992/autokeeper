start: hometown_stop
start_time: D1 09:00
opening: |
  1927 年秋天。你站在家乡普利茅斯奥斯本药店门口的汽车站，手里攥着去奥西皮的长途车票。没有家人或朋友来车站送你，这反倒让你下定了决心：去阿卡姆，开始新的工作和新的生活。
  一辆灰色的小长途车开到站前，车身上写着“拉赫曼与科斯特洛长途车行”。两个面有愠色的年轻男人走下车，其中一个从头到脚打量了你一遍才走开。司机也下了车，瞟了你一眼，穿过马路进了烟草店。
