history:
- when: 两个月前
  text: 政府与海洋渔业局联合发布公告，要求一个月内清退石坡尾内所有渔船，渔民全部上岸，以便清淤改造、规划商区。
  where: shipowei
- when: 一个月前
  text: 石坡尾的渔船被回收，阿宝的小渔船也在其中；她仍每天清晨来工地边查看。
  who:
  - abao
  where: shipowei
- when: 8 月 4 日凌晨
  text: 施工人员在排洪箱涵的地下排水通道里清出一道未标记于任何图纸的老旧闸门，闸板一侧脱轨倾斜，海水和淤泥从缝隙涌入排水设施（据《石头屿晚报》报道）。
  who:
  - chen_gong
  where: shipowei
- when: 开局前一天
  text: 工地附近工人养的几条狗喝了排水通道里冒出的水，当晚就喘不上气。
  where: shipowei
- when: 开局前一天
  text: 阮施宁和黄懿一起写作业时握笔的手在抖；她在图书馆魂不守舍，在家门口盯着排水沟里的水看了很久；她把日记本交给黄懿保管。
  who:
  - ruan_shining
  - huang_yi
- when: 开局前一夜
  text: 月亮升过石坡尾废弃船厂的烟囱时，阮施宁按约先进了海洋乐园，随后爬了出来，独自走进排水通道。
  who:
  - ruan_shining
  known_by:
  - ruan_mother
  - ruan_father
