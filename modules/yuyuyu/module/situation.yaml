ties:
- id: tie_ruan_friend
  hook: 阮施宁是他从小一起长大的好朋友，她从来都会告诉他要去哪里；日记本里那幅“好朋友们！”的涂鸦里也画着他（原作明示有这幅画，画里有谁按本局调查员补全）。
  npc: ruan_shining
  fits:
  - 重要之人
- id: tie_raccoon_cards
  hook: 他的小浣熊卡片收集册还差最稀有的那几张，阮施宁答应今天拿来交换；这些卡片最后会湿透着留在闸门口（原作 rare_cards，要等 ruan_gone 之后才能找到）。
  npc: ruan_shining
  fits:
  - 宝贵之物
- id: tie_park_seahorse
  hook: 废弃海洋乐园是他们从侧门缺口爬进去的秘密基地；园里那只褪了色的黄色小海马是他最喜欢的塑像，可以当作他的关键玩具的来历或寄托（补全；关键玩具规则照原作）。
  place: ocean_park
  fits:
  - 意义非凡之地
  - 宝贵之物
- id: tie_huang_classmate
  hook: 他和黄懿同班，常看她在楼梯口学阿嫲甩袖子、学小锣“锵锵”；这只是熟人关系，日记本密码仍须说服、话术、零食贿赂或智力检定才能拿到（照原作条件）。
  npc: huang_yi
  fits:
  - 重要之人
- id: tie_gaojia_troupe
  hook: 他家逢年过节去看黄懿阿嫲那个高甲戏班的戏，记得她扮戏时那身鱼鳞纹戏服（补全；阿嫲的混血身份不因此透露）。
  npc: huang_grandma
  fits:
  - 意义非凡之地
  - 思想与信念
- id: tie_close_windows
  hook: 他自家的老人也总说“夜里的潮声不该放进屋子”、不许他靠近海，和黄懿阿嫲的叮嘱一模一样（补全；原作说调查员带极稀薄血统、本地远亲里可能有深潜者，但这位老人是否混血属未知，守秘人不得事先透露）。
  npc: huang_grandma
  fits:
  - 思想与信念
  - 重要之人
- id: tie_sick_neighbor
  hook: 出门前听说邻居胸闷、喘不上气、耳道流东西（原作可选开场），这位邻居可以就是夜市塑料玩具摊的女摊主，她坚持说只是中耳炎（合并为补全；她的耳朵线索仍须夜市开市后、侦查成功才能看清）。
  npc: toy_vendor
  fits:
  - 重要之人
- id: tie_shrimp_cake
  hook: 他常跟阮施宁一起去夜市缠着大人买建福阿伯的虾饼，阿伯认得这几个孩子（补全；建福给工具和嘱咐仍须孩子表现出要阻止感染或找到阮施宁的意图，且他不会同行）。
  npc: jianfu
  fits:
  - 重要之人
  - 意义非凡之地
- id: tie_spring_rolls
  hook: 妈妈出门前嘱咐他晚上回家前去夜市买春卷（原作可选开场）——妈妈一向光顾的正是丽英的春卷摊（补全）。
  npc: liying
  fits:
  - 重要之人
- id: tie_fisher_family
  hook: 他家祖上在石坡尾打鱼，阿公和阿宝曾在同一片避风坞停船，一个月前渔船被一起收走（补全，原作渔民常见姓张、黄、阮、欧；阿宝带路仍须说服，讲闽南语得 1 颗奖励骰）。
  npc: abao
  fits:
  - 重要之人
  - 职业
- id: tie_lost_boat
  hook: 小时候家里的小渔船就泊在石坡尾，他在船上睡过午觉；如今那里只剩一坞黑泥和警戒线（补全，依据原作两个月前的清退公告）。
  place: shipowei
  fits:
  - 意义非凡之地
  - 宝贵之物
- id: tie_parent_worksite
  hook: 他的爸爸或亲戚在清淤工地当小工，回家抱怨过陈工吹哨骂人（补全；这层关系不替代 yang_joined，陈工见到孩子照样驱赶，还可能触发告状风险）。
  npc: chen_gong
  fits:
  - 职业
  - 重要之人
- id: tie_library_regular
  hook: 少儿图书馆是他和阮施宁每周借《冒险小虎队》的地方，管理员认得他们，也会对他们“嘘”（补全；深海绘本仍须图书馆使用检定）。
  place: library
  fits:
  - 意义非凡之地
- id: tie_reporter_dream
  hook: 他梦想当记者，家里订《石头屿晚报》，见过“记者 杨纵溪”的署名，听说报社有小记者班（补全；两人此前没见过面，她的邀请照原作在被接近时提出）。
  npc: yang_zongxi
  fits:
  - 思想与信念
  - 职业
- id: tie_square_evenings
  hook: 夏天傍晚大人常带他去音乐广场，坐在喷泉水池边乘凉、玩水（补全；那里的喷泉和水池仍按转变规则算水源）。
  place: music_square
  fits:
  - 意义非凡之地
- id: tie_home_computer
  hook: 那台装着 Windows XP 的老台式机就在他家，是全家攒钱买的，原定下午大家来他家玩黄金矿工和泡泡堂（原作只写“其中一位调查员家中”，具体是谁按本局定）。
  place: player_home
  fits:
  - 宝贵之物
  - 意义非凡之地
- id: tie_lucky_stone
  hook: 每次去找阮施宁，他都要摸一摸门口写着“幸运石”的石椅，直到有狗在上面拉屎；门口剥豆的阿婆们也认得他（原作写了石椅；阿婆认得他是补全）。
  place: ruan_home
  fits:
  - 意义非凡之地
foreshadow:
- id: fs_park_watcher
  hint: 收拾东西准备钻出侧门缺口时，巷口电线杆的阴影里好像有个大人站着，一直朝乐园这边看，看了很久都没走开。
  where: ocean_park
  pays_off: k_hybrids
- id: fs_ruan_ditch
  hint: 阮家门前的排水沟积着一汪浑水，大热天的巷子里，凑近闻却有一股像退潮时海边那样的咸腥味。
  where: ruan_home
  pays_off: k_seawater
  stages:
  - hint: 沟里的水比上次来时涨高了一截，水面浮着一层灰白的细泡沫，咸腥味已经飘到幸运石石椅那边了。
    when: flag:outbreak_seen
- id: fs_huang_window
  hint: 这么闷热的天，阿嫲摇椅旁那扇朝海那边的窗却关得死死的，插销插着，缝里还塞了布条。
  where: huang_home
  pays_off: k_hybrids
- id: fs_city_cough
  hint: 阅览处有个大人一边翻报纸一边揉耳朵，隔一会儿就停下来，张大嘴深深吸一口气，像怎么也吸不够。
  where: library
  pays_off: k_infection
  stages:
  - hint: 阅览处那几张椅子上捂着胸口、喘得发急的大人多了好几个，有人拿纸巾一直往耳朵里擦，管理员也没心思嘘人了。
    when: flag:outbreak_seen
    flag: sign_fs_city_cough_1
  - hint: 夜市人堆里到处是这种喘气声，排队的、摆摊的，好几个人说着话就停下来张嘴吸气，旁边的人也只当是天太闷。
    when: flag:outbreak_seen
    where: night_market
- id: fs_culvert_seep
  hint: 排洪箱涵入口那圈临时围挡底下，有一道细细的水一直往外淌，坞底的潮水明明都退光了，它还是不停。
  where: shipowei
  pays_off: k_gate
  stages:
  - hint: 天黑以后，围挡底下淌出来的水变急了，在淤泥上冲出一道发亮的小沟，腥臭味比白天浓得多，围挡里面隐约有水声。
    when: D1 20:00
    flag: sign_fs_culvert_seep_1
  - hint: 快到半夜了，水不是在淌而是在往外涌，围挡的底边被冲得一鼓一鼓，能听见里面的水一阵比一阵响。
    when: D2 00:00
