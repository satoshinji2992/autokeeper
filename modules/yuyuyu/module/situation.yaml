agendas:
- npc: yang_zongxi
  goals:
  - 晚上七点多在石坡尾采访陈工
  steps:
  - id: invite
    text: 被调查员接近时，邀请他们一起去石坡尾看看，并提起小记者班
    meet: true
    once: true
    source: yang_zongxi
  - id: treat
    text: 前往工地之前，请同行的孩子在夜市吃点小吃
    when: flag:yang_joined
    meet: true
    once: true
    source: yang_zongxi
  - id: cover
    text: 孩子们被成年人怀疑时，以“报社小记者实习”为由替他们解围
    when: flag:yang_joined
    meet: true
    once: false
    source: yang_zongxi
  - id: go_interview
    text: 赶去石坡尾赴约
    when: D1 19:00
    does: at:yang_zongxi:shipowei
    meet: false
    source: yang_zongxi
mechanics:
- name: 深潜者血统转变
  rules: 调查员每次接触喷泉、井水、潮湿的地下水道或任何食物与水源时进行体质检定，失败则增加 1 级转变。1 级起出现难以解释的征兆（皮肤长时间保持湿润），并视为“已开始转变”；3 级时开始听到大海的呼唤。已开始转变的调查员在闸门口收到阮施宁的邀请。守秘人事先不让调查员知道自己有血统。
  why: 原书第 5 页“回家的诱惑”
  plugin: transformation
  runs: 插件
- name: 异变触发
  rules: 调查员探索任意 2-3 个地点之后遭遇异变事件；插件在到过两个不同的调查地点后设 outbreak_ready。
  why: 原书第 7 页“拄着麻烦”
  plugin: transformation
  runs: 插件
- name: 闸门失败尝试
  rules: 每轮失败的封堵尝试额外损失 1 小时；可选每三次失败暗骰 1D3，结果为 1 时遭遇 1 只巡逻深潜者。时间推进由守秘人执行。
  why: 原书第 13 页
  plugin: transformation
  runs: 插件
- name: 小学生调查员规则
  rules: 关键玩具、一起上、小个子、不被当回事、疯跑、告状风险，见守秘人须知全文。
  why: 原书第 15-16 页
  runs: 守秘人
