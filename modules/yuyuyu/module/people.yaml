creatures:
- id: deep_ones
  name: 深潜者
  called: 积水里扑腾的湿滑东西
  description: 4 个正在巡查排水通道的深潜者。鱼类般的头部，硕大的眼球向外突出，几乎无法完全闭合；湿润的皮肤覆着黏液，脖颈两侧的鳃不断开合；指间连着半透明的肉蹼，末端是长而弯曲的指爪，既能在水中移动，也能抓住湿滑的石壁攀爬。
  sanity: 0/1D6
  pursues: true
  stats:
    力量: 90
    体质: 60
    体型: 80
    敏捷: 45
    智力: 65
    意志: 55
    生命: 13
    移动: 8
    闪避: 25
    攀爬: 30
    聆听: 40
    侦查: 40
    潜行: 40
    游泳: 90
  attacks:
  - 格斗（爪击、啃咬、武器）45%，伤害 1D6+DB
  notes: 共 4 只一起行动；护甲 1（带鳞皮肤）；伤害加值 +1D4；体格 1；移动 8；魔法值 10；每轮攻击 1 次；能熟练使用标枪和三叉戟。孩子们不可能在正面对抗中存活。追到点 10 的侧向裂隙前为止，调查员挤进裂隙后它们放弃追击。
creation:
  summary: 本模组的调查员都是十岁左右的小学生。力量、体型、教育不超过 50，其余属性不超过 70，幸运取两次掷骰中较高的一次；本职技能点为教育×4，家庭信用评级 0 至 49。不能把点数投入需要成年人的专业训练、执照或资格才能掌握的技能。须选一件关键玩具，写入背景。
  age:
    low: 10
    adjust: false
  caps:
    each: {力量: 50, 体型: 50, 教育: 50}
    rest: 70
  luck: best_of_two
  only: true
  occupations:
  - name: 小学生
    points: [教育×4]
    credit: [0, 49]
    credit_note: 家庭信用评级，不是个人收入
    skills:
    - 侦查
    - 聆听
    - 母语
    - {pick: 1, of: [魅惑, 话术, 说服], note: 三项交涉技能三选一}
    - {pick: 2, of: [图书馆使用, 计算机使用, 心理学, 博物学, 艺术与手艺(任一), 科学(任一), 历史, 外语(任一)], note: 考虑学校生活和个人兴趣}
  skill_caps:
    occupation: 70
    interest: 55
  barred_skills: [会计, 法律, 医学, 精神分析, 汽车驾驶, 驾驶, 操作重型机械, 射击]
  credit_label: 家庭信用评级
  connection_label: 关键玩具
