id: yuyuyu
title: 鱼！鱼！鱼！
subtitle: 石头屿的夏天，十岁的我们去找阿宁
system: CoC7
era: 2009 年夏（原作融合 00 年代与 10 年代的时代风貌）
setting: 中国闽南沿海小城石头屿（原型为福建厦门），老城区、夜市与正在清淤的避风坞石坡尾
players: 2-4 人（原文未写人数）
duration: 约 4-6 小时（原文未写，按各地点时长估算）
source: 《鱼！鱼！鱼！》，作者 莫妮卡博士的魔鬼欲望机器
license: 免费模组，禁止任何形式的商用（原作声明）
hook: 2009 年 8 月 7 日，一个闷热的夏天。你们约好在废弃的海洋乐园交换小浣熊卡片、互抄暑假作业，可一向准时的阮施宁一直没来。下午一点，你们决定自己去找她。
truth: '石头屿散居着混血深潜者的家庭。石坡尾避风坞的清淤工程在排洪箱涵的地下排水通道里重新打开了一道被遗忘的闸门：一端通向城市地下废弃的排水设施，另一端通向深海里的深潜者定居所。闸门打开后，古老的呼唤顺着石缝传来，呼唤混血儿入海；倒灌的海水还随潮带进了来自更深海渊的未知存在。它们让混血者体内潜藏的变化更快显现，却让普通人感染：耳道出粘稠物、肺积液、胸闷气喘，最后颈侧生出鳃状裂口，数小时内死亡。

  阮施宁是混血儿。前一天夜里，月亮升过石坡尾废弃船厂烟囱时，她按约先进了海洋乐园，随后以爬行的样子离开，独自走进排水通道。她的父母乐见这一变化，计划不久后也入海。

  8 月 8 日凌晨 2:24 涨潮时，台风风暴潮将带来前所未有的倒灌；若不在此前封死闸板缝隙，城市地下水和淡水系统将被不可逆地污染。调查员自己也带着极稀薄的深潜者血统，他们不知道这一点。

  '
keeper_notes: '【规则系统】原作即为 CoC 7 版模组，另附原创“小学生调查员”规则（原书第 15-16 页），所有调查员为十岁左右的小学生。数值、检定、理智损失均照抄原文，未做换算。

  【时间】开局 D1 13:00（原文：8 月 7 日下午 13 时）。原文列出各地点最少调查时长：海洋乐园 40 分钟、阮施宁家 40 分钟、黄懿家 90 分钟、少儿图书馆 60 分钟、异变事件 10
  分钟、音乐广场 90 分钟、夜市 90 分钟、石坡尾 60 分钟、排水通道 60 分钟。各地点之间穿小巷步行约 10 分钟。夜市约 18:00 亮灯；杨纵溪与陈工约晚上七点多在石坡尾碰面；工人只在白天进坞底施工，夜里只留看守老张。

  【涨潮时限】原书第 4 页写“8 月 8 日凌晨两点”风暴潮，第 6、16 页与报纸潮汐表写满潮 02:24，阿宝的口诀推算约为 2:20。本模组以 D2 02:24 为时限：此后排水通道被完全淹没，仍在通道内的调查员溺亡或被困窒息；闸门未封则进入失败结局。

  【转变】守秘人事先不让调查员意识到自己也有稀薄的深潜者血统。每当调查员接触喷泉、井水、潮湿的地下水道或任何食物与水源时，调用插件 transformation 的 contact_water 动作（体质检定，失败加
  1 级转变）。征兆先是皮肤长时间湿润；3 级时开始听见大海的呼唤；已开始转变的调查员（标记 pc_transforming）在闸门口会收到阮施宁的邀请：回到海中，与“家人”一同归去。原书第 7 页另写海洋乐园的幻象只针对“祖上也是本地人”的调查员，是否适用由守秘人判断。

  【异变事件】调查员探索任意 2-3 个地点后遭遇异变（插件在到过两个不同地点后设 outbreak_ready）。场面按当时所在处选择：前方人群骚动、夜市摊主倒下、或工地一名工人当众倒地。守秘人可推迟到第三个地点。调查推进时城中带症状的人越来越多，症状随调查深入加重。

  【开局引入】原书可选的出门前情节，守秘人可选用：某位调查员听说邻居最近有胸闷、喘不上气、耳道分泌物的症状；妈妈嘱咐晚上回家前去夜市买春卷；妈妈在读报并给调查员解释报道（即《石头屿晚报》，见手稿）；邮箱收到学校防范台风的通知。守秘人可在导入时提及调查地点（阮施宁家、黄懿家、少儿图书馆、音乐广场、夜市），随调查深入引向石坡尾。

  【报纸】图书馆可以找到报纸；如果调查员没去图书馆，可让他们在路边报刊亭获得同一份报纸（原文）。成功的智力检定可从报道中得知排水通道和闸门的位置（原文）。

  【电脑游戏】距夜市开市尚早时，调查员可按原计划去某位调查员家，用 Windows XP 台式机玩几局游戏（黄金矿工、泡泡堂、拳皇、闪翼双星无敌版……）。守秘人按游戏类型给一枚相关奖励骰，例如玩了森林冰火人，后续需要敏捷或协调的行动获得
  1 枚奖励骰。

  【小学生调查员规则】力量、体型、教育不超过 50，其余属性不超过 70，幸运取两次掷骰较高者；本职技能点为教育×4，家庭信用评级 0-49。本职 6 项：侦查、聆听、母语（必选），交涉技能三选一，再从图书馆使用、计算机使用、心理学、博物学、艺术/手艺、科学、历史、其它语言中选二；本职上限
  70，兴趣上限 55；不能投成年人才有的专业技能；任选一个非职业技能获得 1 颗奖励骰。家庭信用评级只用于判断家庭能否提供某样普通物品、费用或资源。

  【关键玩具】替代关键连接，使用关键连接的全部规则。守秘人不能在不给保护或挽救机会的情况下直接摧毁、夺走或永久移除关键玩具；最终失去时理智检定 1/1D6。理智检定时可借关键玩具获得精神支持（紧抱玩具、回忆安全感），获得
  1 颗奖励骰；成功则恢复 1D6 理智并可从不定性疯狂中恢复；失败则玩具失去关键背景条目的地位，按关键连接规则修改背景。

  【一起上】两个或更多小学生对付同一目标时可协同攻击，按通常合作规则掷骰，伤害按该攻击的正常规则。

  【小个子】追逐中有大个子难过、小学生能过的空间（建筑间隙、矮栅栏、窄门洞、灌木丛、窗口）时，守秘人认为明显有利，则相关敏捷、攀爬、跳跃、潜行等检定获得 1 颗奖励骰；追逐者体型过不去则不能沿此路线追赶。海洋乐园侧门下的缺口即成年人难过、小学生可轻松爬过之处。

  【不被当回事】成年人没有理由认为调查员在调查、跟踪或准备逃跑时，小学生对他潜行、偷听、跟踪、观察或接近获得 1 颗奖励骰。

  【疯跑】追逐中小学生可把全部 2 点行动点用于奔跑并做敏捷检定：成功额外前进 1 个地点；困难成功另在下一次处理障碍时得 1 颗奖励骰；普通失败只完成正常移动；大失败则摔倒或以适合环境的方式失去行动，后果由守秘人定。

  【告状风险】行为引起成年人怀疑时，对方可能“告诉家长”或“告诉老师”。调查员可用取悦、话术、说服等检定解释或掩饰；失败则家长或老师可能禁止外出、没收玩具或限制其继续参与调查，具体后果由守秘人定。杨纵溪可以“报社小记者实习”为由替他们解围。

  【夜市看柜台】想看柜台上的东西、摊主表情或桌后的东西，必须踮脚（视野更好但无法同时观察周围），或站上摊位旁的椅子（位置更高，但立即引起附近成年人注意）。长时间在路中央逗留会被人群碰撞，须过敏捷检定保持平衡。夜市各摊的线索守秘人可视调查情况改变设置（原文）。

  【追逐】见地点“排水通道”的 chase 与事件 e_tunnel_chase。共 10 个点，调查员起始于点 4，深潜者起始于点 1。参与者先过体质：失败 MOV-1，成功不变，极难成功 MOV+1；逃离者调整后
  MOV 高于追逐者即成功逃走。之后按敏捷高低行动；每回合 1 个行动点，每比 MOV 最低者高 1 点多 1 个行动点。调查员可运用聪明才智拖延深潜者。点 2 碎石堆积（攀爬，失败停在点 2）；点 6
  湿滑路面（敏捷，失败停在点 5）；点 9 危险气体（体质，失败眩晕，本回合行动点 -1）；点 10 安全点，即逃脱。在抵达点 10 前被抓住时，守秘人可给一次逃脱机会，失败者被拖入冰冷漆黑的海中，迎来最终命运（设
  pc_taken）。调查员看得出自己不可能在正面对抗中活下来。

  【封堵闸门】见地点“闸门口”。每轮失败的尝试使调查员额外损失 1 小时（调用插件 gate_fail 动作提醒，并由守秘人推进时间）。可用规则书“超越人体极限”的多人协作检定，闸门 SIZ 120。守秘人可酌情调整或完全取消这一机制；想加难时，每三次失败暗骰
  1D3，结果为 1 时调查员遭遇 1 只巡逻中的深潜者（插件 gate_fail 的 patrol 参数）。

  【原文含糊与取舍】日记本密码的具体数字原文没给，由守秘人自定。夜市“危险”一段的回归派成员原文只写“该成员/她”，未点名，可由丽英或别的混血者担任。原书 p6 说报纸“见第 17 页”，实际在书末附页。原书名为《鱼！鱼！鱼！》（据封面与报纸页脚），目录首章为“石头屿”。

  【AutoKeeper 补充】两名预设调查员；“有电脑的伙伴家”这一地点（原文只写“其中一位调查员家中”）；各 NPC 的说话方式；各地点之间的通路按原书地点连接图，伙伴家的连接为补充；石坡尾看守室、箱涵入口等可调查物的分项。

  '
flags:
  outbreak_ready: 调查员已到过两个调查地点，异变可以发生
  outbreak_seen: 调查员已目睹有人倒地异变
  pc_transforming: 有调查员开始转变（转变至少 1 级）
  yang_joined: 杨纵溪与调查员同行
  abao_guiding: 阿宝答应带路去排水箱涵入口
  chase_done: 调查员已逃到点 10，摆脱了排水通道里的深潜者
  pc_taken: 有调查员被深潜者拖入海中
  ruan_gone: 阮施宁已挤过闸门跃入海中
  gate_sealed: 闸门缝隙已被封死（复位旧闸板或临时封堵成功）
  end_all: 闸门封死且无人被拖走，调查员全员回到地面
  end_loss: 闸门封死，但有调查员被深潜者拖入海中
  sign_fs_city_cough_1: 伏笔 fs_city_cough 第 1 步露出了，场景图换成：阅览处的桌边多出两三个弯着腰、手按在胸口上的大人身影。（露出时由引擎设置）
  sign_fs_culvert_seep_1: 伏笔 fs_culvert_seep 第 1 步露出了，场景图换成：围挡底下的湿痕扩大成一滩反着光的水，一路漫到坞壁边上。（露出时由引擎设置）
start: ocean_park
start_time: D1 13:00
opening: '你们生活的这座城市，它到底有多大呢？在你们记忆里它永远就那么大。

  妈妈说房价涨了，爸爸说鱼价涨了，开始有一些背着巨大背包的人来到这里，他们说着你们听不懂的口音，在巷子里拿着相机拍你们每天路过却不曾认真看过的墙，而你们家的日子还是一样的窄，一样的酱油水鱼，一样的凉席上午觉醒来，窗外是正在奔跑的世界，而你们躺在那里，听着电风扇咔嗒咔嗒的声音，觉得时间好像并没有跑起来。

  正是这样一个夏天，闷热的夏天，非常非常热，树上有知了在尿尿。

  你们约好了上午在废弃海洋乐园集合，一起交换小浣熊方便面的卡片，下午再去其中一位家里玩电脑。大家在乐园玩了很久，一直到中午，阮施宁都始终没有出现。她家里管得很宽松，而且她一向准时。

  更重要的是，她手里有最最稀有的小浣熊卡片。还有，你们约好了一人写一部分暑假作业，之后换着抄，阮施宁手里的作业正是你们完成暑假作业的拼图之一。

  你们开始讨论她是不是出事了，是不是被那条正在修的路吞进去了，是不是掉进夜里被挖开的坑里没有人发现，是不是去了对面的岛屿。

  可她没有告诉你们她要去，她从来都会告诉你们的。这个念头落下来的时候你们其实有点害怕，因为你们从来没有走过那么远。但你们想象着她可能在某个地方等着，在某个还没去过的地方，坐在某个台阶上。

  下午一点，你们还待在秘密基地——废弃的海洋乐园里。你们决定自己去找她。

  '
plugins:
- transformation
