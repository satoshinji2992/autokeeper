interior_reviews:
  ocean_park:
    fingerprint: aec0e6f186bcf98b0a4065d421d0bf96408cac2f84fbcd5d024fc59f1741a916
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 露天的烂尾乐园，侧门缺口、井盖、旋转木马、长椅、售票亭都是同一片园区里的陈设，作为可调查项就够了，不需要分房间。
  ruan_home:
    fingerprint: d6e22fbe5c726f41bb2544e3a48c306bdea18eb6cfe39d5fe35f5c5cbd8d7e90
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 原文虽然写是二层自建房，但整场戏都在门口：阮母堵住门缝，调查员进不去，门随后锁上，阿婆们也在门外巷子里。没有可以进入的室内空间，保持单一地点。
  library:
    fingerprint: 89a3e48c15c1f3579da8d1dda75681cd50a7b0abace1d6ac58931ded9cda87ec
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 原文只写了借阅台、书架和报刊架，是同一个馆内空间，没有分区、上锁或私下交谈的需要。
  music_square:
    fingerprint: 9e5830aa5eb0aec0f712f3fa608f8dd72ae8e40fa2b46ea56fbc5bc95497c3a2
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 露天的下沉式广场，喷泉、水池和北侧台阶都在同一片视野里，杨纵溪还可能正和流浪汉说话，不需要拆分。
  drain_tunnel:
    fingerprint: 18b01f4a2ba8dba1e751f25f2d2926b12f32f8a3312801a2150b0a0a649616e6
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 通道内部按原书 10 个追逐点由追逐机制处理，闸门口已经是独立地点 drain_gate，已有通路 drain_tunnel__drain_gate，现有结构完整。
  drain_gate:
    fingerprint: 2b2dc3885bce030058a3c71cb274bed255959ce7bc5a236f4a8b48a8843c6eb5
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 闸门口是通道深处的单一空间，阮施宁、闸板缝隙和卡片纸条都在同一处，不再细分。
  player_home:
    fingerprint: 2bb380c45bda9c228ea0f43546a114ab73d0c2a91c32db82be4238304419a888
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: AutoKeeper 补充的伙伴家只用来玩电脑，电脑、电风扇、冰箱都在同一个房间，不需要拆分。
  huang_home:
    fingerprint: f2aff979a30facf8eae0dac164ffab6de30f5176c8f0ea3438317fe0e057ea32
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 原文只写了一处会客空间：墙上的戏服、蝴蝶盔、书柜，阿嫲在摇椅上读书招待孩子，黄懿从楼梯口出场。原文提到楼梯口，但没写楼上有什么，也没有哪个人物、物件或线索放在别的房间。日记本跟着黄懿走，偷看只要求“趁黄懿不备”，不需要换房间。楼梯口已经是可调查项，单独拆一间楼上房间不会带来新的调查或通行，所以保持单一空间。
  night_market:
    fingerprint: 91dcaf82d4e8ec40fe20dc0d4fefe93ef9e747b4a09929b9b2f1774a18e5f19e
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 夜市是街面上的露天摊区，不是建筑。塑料玩具摊、虾饼海蛎饼摊、扁食拌面摊、春卷摊、柜台、椅子和路中央的人流都是同一片摊区里的局部陈设，原文写它们“挨在一起”，所以都作为可调查项保留。“危险”一段说的狭窄通道是人群中的偶发拦路，不是固定房间。不按建筑拆分。
  shipowei:
    fingerprint: 6a4c8005262d3e012544aaa3d803b23419f4bd5be45261045c53a3ae8b997c28
    source: c7d55fc850b99bf211dcb5d40cb27b6e8b3e513f6cffb9d790470a4a3f5ea74e
    reason: 现有平面图已经有石坡尾工地和老张的看守室，看守室里放着沙袋、水泥袋和老张。坞底、北侧石台阶、东岸坍塌的驳岸和箱涵入口围挡都是露天工地的一部分，原文给的是进入方法和检定（敏捷、潜行、攀爬），已作为可调查项和通往
      drain_tunnel 的现有通路保留。原文没写别的室内空间，现有平面图已经覆盖。

