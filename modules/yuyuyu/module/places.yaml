- id: shipowei
  name: 石坡尾
  aliases:
  - 石坡尾工地
  - 避风坞
  - 清淤工地
  art: shipowei
  public: true
  scene_root: true
  outdoors: true
  ground: water
  read_aloud: 石坡尾旁的街道只剩下几家老旧的杂货铺和理发店还在营业。整个坞底的黑色淤泥随着潮水退去彻底暴露在空气里，散发着浓烈的海腥与腐臭味。工地外围拉起了警戒线，施工区域内部，排洪箱涵的入口处被临时围挡遮掩起来。工地边缘独自站着一位上了年纪、皮肤黝黑的渔民。
  keeper: '调查时长 60 分钟。工人只在白天进坞底施工，夜里现场只留看守老张。工地上散落着几根撬棍和钢筋，老张的看守室里堆着几袋水泥和沙袋；天黑之后拿这些东西不难，但要避免被人发现。

    没有杨纵溪陪同时，陈工第一次发现调查员出现在工地附近会驱赶他们，态度刻薄；阿宝会主动提供帮助。与杨纵溪同行时（yang_joined），杨纵溪出示记者证后陈工才肯停下来讲话。

    靠近排水通道的方法 1：北侧有一条石砌台阶直通坞底，台阶完好，但施工队把木板、管子和一箱机器零件堆在上面，占了大半路面，只能侧身挤过。下到坞底后沿坞壁边缘蹚过约二十米浅水淤泥区才到排水箱涵入口，须过敏捷检定，以免踩进深坑或脚底打滑摔进泥水。阿宝认识看门的老张；若调查员说服她带路（使用闽南语交谈获得优势，即
    1 颗奖励骰），她会拿上手电筒陪同前往（设 abao_guiding），到达入口后可在外面望风，或在调查员被困时帮忙找人求救。

    靠近排水通道的方法 2：无法说服阿宝或希望秘密进入时，从坞区东岸绕行。东岸一段驳岸年久失修坍塌，形成约四米高的缺口。须避开老张的视线（潜行检定），从缺口攀爬下到坞底（攀爬检定）；攀爬失败会滑落跌入下方淤泥，受
    1D8 点伤害，并须额外花时间清理身上的污泥。下到坞底后同样要沿坞壁横向移动约二十米才到箱涵入口。

    '
  features:
  - 警戒线
  - 排洪箱涵入口的围挡
  - 北侧石台阶
  - 东岸坍塌的驳岸
  - 坞底淤泥
  - 散落的撬棍和钢筋
  - 旁街的杂货铺和理发店
  looks:
  - when: at:chen_gong:shipowei & hour:8-18
    change: 坞底淤泥里有几个戴安全帽的工人在施工，挖掘机械伸着长臂在泥里作业
  - when: flag:sign_fs_culvert_seep_1
    change: 围挡底下的湿痕扩大成一滩反着光的水，一路漫到坞壁边上。
  views:
  - key: shipowei_north_steps
    label: 北侧石台阶
    features:
    - 北侧石台阶
    prompt: 一条石砌台阶直通坞底，台阶上堆着木板、管子和一箱机器零件，占去大半路面，只剩侧身能过的缝
  - key: shipowei_east_bank
    label: 东岸坍塌的驳岸
    features:
    - 东岸坍塌的驳岸
    prompt: 坞区东岸一段塌掉的驳岸，形成约四米高的缺口，碎石块乱堆，下方是黑色的淤泥
  - key: shipowei_culvert
    label: 箱涵入口的围挡
    features:
    - 排洪箱涵入口的围挡
    - 坞底淤泥
    - 警戒线
    prompt: 警戒线后，退潮露出的整片黑色淤泥泛着水光，坞壁边一处排洪箱涵入口被临时围挡遮住，远处浅水洼连成一片
  - key: shipowei_crowbars
    label: 散落的撬棍和钢筋
    features:
    - 散落的撬棍和钢筋
    prompt: 工地泥地上横七竖八散着几根撬棍和钢筋，沾着干泥
- id: drain_tunnel
  name: 排水通道
  aliases:
  - 排水箱涵
  - 地下排水通道
  - 排水巷路
  art: drain_tunnel
  scene_root: true
  outdoors: false
  ground: building
  weather:
  - torch
  read_aloud: 排水通道在排洪箱涵里。最开始它看起来确实像一处废弃的排水设施，越往里走，就越不像现代工程能留下来的东西：下半部分是粗糙的石砌结构，石缝里长满白色的贝壳和某种已经硬化的海洋生物残骸，墙壁上没有现代排水系统该有的编号和检修标记。通道的尺寸也不寻常，有些地方高得出奇，有些地方又突然变得低矮。前方有好几处积水。
  keeper: '调查时长 60 分钟。第一次进入时，调查员只会以为那些声音来自自己的脚步和水流回声；随着前进，回声没有随距离消失，反而始终跟在身后，越来越近；回头时，昏暗的手电光只能照亮一截湿润的石壁。拐过一处低矮的弯道后进入追逐（事件
    e_tunnel_chase）。

    追逐路线照原书 10 个点排列，调查员起始于点 4，深潜者起始于点 1；点 10 是一条狭窄的侧向裂隙，通向闸门，抵达即逃脱。D2 02:24 后通道被完全淹没。

    '
