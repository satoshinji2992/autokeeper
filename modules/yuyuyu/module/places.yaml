    label: 旧闸门
    features:
    - 旧闸门
    - 闸板与轨道的缝隙
    prompt: 黑暗里横着一道锈蚀的旧闸门，闸板歪斜，周围石壁湿漉漉的，海腥味很重
  - key: gate_ruan_seat
