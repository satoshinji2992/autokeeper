locations:
- id: ocean_park
  name: 废弃的海洋乐园
  aliases:
  - 海洋乐园
  - 秘密基地
  - 乐园
  art: ocean_park
  public: true
  scene_root: true
  outdoors: true
  ground: street
  read_aloud: 海洋乐园所在的地块是个跨世纪烂尾工程。售票亭窗口玻璃上贴着一张残破的价目表，边角卷起，被雨水浸透后模糊了大部分数字，只留下“成人”“儿童”几个字还能辨认。脏兮兮的游乐设施被藤蔓爬满，各种废弃物、铁架、底盘、柱子和铁皮丢在一起。乐园的各个角落散布着海洋生物塑像，海豚、八爪鱼、海豹，还有你们最喜欢的黄色小海马。它们被日晒雨淋了太久，从鲜艳褪成黯淡，从黯淡褪成斑驳，最后变成一种难以描述的颜色。入园口已被封锁，你们一向从侧门下方那个缺口爬进爬出。
  keeper: '调查时长 40 分钟。入园口封锁；侧门下方有一处长期无人维护的缺口，成年人弯腰也难以通过，小学生能轻松爬过（小个子规则）。

    园区地面为水泥地，园内找不到脚印。真相：阮施宁昨夜在残存人类理智时按约先走进乐园，又以某种方式爬了出来，朝石坡尾方向离开。

    井盖有海水倒灌痕迹和几条死鱼（无须检定）；聆听成功听见粘稠的咕嘟声。

    接触园内仍较完整的设施（登上旋转木马平台、坐上长椅等）：理智检定 0/1D4。成功只感到短暂不适；失败时眼前出现昏暗、泛着水光的幻象，游乐设施被隔绝到遥远的地方；视线适应后，调查员意识到那是一座庞大得无法估量的城市，建筑物在暗流中投下变幻的倒影，无数交错如迷宫、缠满海藻的街道向前延伸，街道上有身影缓缓移动。原文限定为“祖上也是本地人的调查员（可能有极其稀薄的混血深潜者血统）”。

    调查员准备离开时，会感到有人正从乐园外注视着他们——那是夜市春卷摊的丽英。她不现身搭话，只是远远看着。

    '
  features:
  - 侧门附近的泥地
  - 侧门下方的缺口
  - 井盖
  - 旋转木马平台
  - 长椅
  - 售票亭价目表
  - 海洋生物塑像
  - 伙伴们商量的去处
  views:
  - key: park_side_gate_mud
    label: 侧门下的泥地和缺口
    features:
    - 侧门附近的泥地
    - 侧门下方的缺口
    prompt: 锈迹斑斑的铁皮侧门底部有一处豁开的缺口，只够孩子弯腰爬过；门外是一片晒得半干的泥地，杂草稀疏，远处是被封锁的入园口
  - key: park_manhole
    label: 乐园的井盖
    features:
    - 井盖
    prompt: 水泥地上一块圆形铸铁井盖，四周有海水漫过后留下的白色盐渍和水痕，几条死鱼翻着白肚躺在井盖边上
  - key: park_carousel
    label: 旋转木马平台
    features:
    - 旋转木马平台
    - 长椅
    prompt: 爬满藤蔓的旋转木马平台，彩漆褪成斑驳难辨的颜色，木马和顶棚积着灰；旁边一张还算完好的长椅，午后强光照得一切发白
  - key: park_ticket_booth
    label: 售票亭和海洋塑像
    features:
    - 售票亭价目表
    - 海洋生物塑像
    prompt: 售票亭窗玻璃上贴着一张边角卷起、被雨泡烂的价目表，只认得出“成人”“儿童”几个字；亭子旁立着褪色斑驳的海豚、八爪鱼、海豹和一只黄色小海马塑像
  looks:
  - when: knows:players:clue:c_park_tracks
    change: 泥地上多出两组痕迹：一串孩子的鞋印通向入口，另一道拖长的爬行痕迹从入口延伸出去，上面挂着半干的黏液
    'on': park_side_gate_mud
- id: ruan_home
  name: 阮施宁的家
  aliases:
  - 阿宁家
  - 阮家
  scene_root: true
  outdoors: true
  ground: building
  read_aloud: 阮施宁的家是一栋普通的二层自建房。窄巷两侧的老墙壁近得几乎要贴在一起，墙面灰水泥剥落的地方露出里面的砖石。你们记得这里石头椅子上曾经被人写上“幸运石”三个字，你们每次来找阮施宁玩都会摸一摸。但自从有狗在上面拉屎之后，你们就不再摸了。几个阿婆坐在矮凳上聊天，她们的手指熟练地掰开绿色的豆壳，让饱满的豆粒滚落进膝上的铁盆里。
  keeper: '调查时长 40 分钟。按下门铃约两分钟后，门才打开一条缝。阮母垂着眼帘，目光落在孩子们头顶上方的空气里，一只手扶着门框；她太高了，身体和双腿把门后挡得严严实实，孩子们只能从她身边或胳膊下往里看。屋里飘出湿湿的、闷闷的味道，像淋雨后没晒干的衣服、柜子里放久的东西，还混着饭煮过头的焦糊味。

    问阮施宁去向：阮母说阿宁回家了，回奶奶那里了。阮父从屋内出现，光线从他身后照来，看不清脸，告诫调查员近段时间不要再来找阮施宁玩。无论是否追问，对话都会被强行终止。若调查员抵住门板或继续提问，阮母低头反复说“不行。不行。你们走吧。”阮父向门口走近几步，不带感情地重复“走吧。”之后门被完全关上，传来门锁转动声，再按多少次门铃都无人应答。

    真相：阮母阮父都是深潜者混血种，乐于见到女儿的变化，计划不久后也入海，他们知道阮施宁确实“回家了”。观察他们（心理学）可发现两人语气非常平静，似乎真的相信自己说的是实话。

    门口的阿婆们会说出昨天见到阿宁的情形，并指点去夜市问卖虾饼的阿伯（建福）。

    '
  features:
  - 门铃
  - 门缝里的屋子
  - 幸运石石椅
  - 剥豆的阿婆们
  - 门前的排水沟
  views:
  - key: ruan_door_gap
    label: 开了一条缝的家门
    features:
    - 门铃
    - 门缝里的屋子
    prompt: 窄巷里一栋二层自建房的门只开了一条缝，一个高得几乎占满门框的女人一只手扶着门框，身体把门后挡得严严实实，屋里光线昏暗，看不清里面
  - key: ruan_lucky_stone
    label: 幸运石石椅和剥豆的阿婆
    features:
    - 幸运石石椅
    - 剥豆的阿婆们
    prompt: 贴得很近的两面老墙，灰水泥剥落露出砖石；墙根一张写着“幸运石”三个字的石头椅子，旁边几个阿婆坐在矮凳上，膝上铁盆里堆着剥好的绿豆粒
  - key: ruan_drain_ditch
    label: 门前的排水沟
    features:
    - 门前的排水沟
    prompt: 门前一条窄窄的露天排水沟，水泥沟沿发黑长着青苔，沟里一层浑浊的积水
- id: huang_home
  name: 黄懿的家
  aliases:
  - 黄懿家
  - 阿懿家
  art: huang_home
  scene_root: true
  outdoors: false
  ground: building
  read_aloud: 黄懿家里和附近的人家没有太大的区别，但墙上挂着一件平直展开的戏服，背后有四面靠旗，下摆的飘带和战裙垂落，衣服用金银彩线绣出鱼鳞纹，腹部位置有着双凤牡丹图案的圆形绣片，旁边放着一顶华丽的蝴蝶盔。柜子里塞满了书，多是古白话小说和武侠小说，有些封面已经字迹模糊。一位阿嫲正戴着老花镜，坐在摇椅上读书；她额头狭窄，眼睛有些奇特且突出。
  keeper: '调查时长 90 分钟。阿嫲（原文称姥姥，注：石坡尾口语一般直接称阿嫲）是地方高甲戏戏班成员，也是深潜者混血种。她问“你们是阿懿的同学吧？”得到肯定回答后露出笑容，招呼调查员坐下，端来冰粉、仙草冻、西瓜、菠萝和阿达子招待；不介意调查员多待一会儿。部分书页里的文字字形与当下通行写法不同。

    黄懿出场时站在楼梯口，双手缩进上衣前襟，把多余布料捏起来向两侧甩出又收回，嘴里煞有其事地模仿小锣的拟声，带着等待认可的表情看向阿嫲；阿嫲脸上的笑会慢慢淡下来——她不希望黄懿留在这里继承衣钵。

    调查员准备离开时，阿嫲会说出她对黄懿的期望，并建议他们近期不要靠近海边、夜间尽早回家。

    日记本：阮施宁失踪前交给黄懿保管。黄懿知道密码，只有调查员通过说服或话术检定，或者用啤酒豆、辣条等零食贿赂，她才愿意透露（贿赂视为成功）。若失败，守秘人应当允许调查员通过智力检定回忆起密码，趁黄懿不备时查看（线索
    c_diary_peek）。密码数字原文未给。

    '
  features:
  - 墙上的戏服
  - 蝴蝶盔
  - 书柜
  - 摇椅上的阿嫲
  - 楼梯口
  - 阮施宁的日记本
  - 日记本最后一张涂鸦
  views:
  - key: huang_opera_costume
    label: 墙上的戏服和蝴蝶盔
    features:
    - 墙上的戏服
    - 蝴蝶盔
    prompt: 墙上平直展开一件高甲戏戏服，背后四面靠旗，金银彩线绣着鱼鳞纹，腹部一块双凤牡丹圆形绣片，飘带和战裙垂下；旁边摆着一顶华丽的蝴蝶盔
  - key: huang_bookcase
    label: 塞满旧书的书柜
    features:
    - 书柜
    prompt: 一个塞得满满的书柜，多是古白话小说和武侠小说，不少封面年久字迹模糊，书脊发黄卷边
  - key: huang_diary
    label: 阮施宁的日记本
    features:
    - 阮施宁的日记本
    - 日记本最后一张涂鸦
    prompt: 一本硬质塑料封皮的密码日记本，右侧固定着一排 8 个按钮和一个中央解锁键，本子合着锁住
  - key: huang_rocking_chair
    label: 摇椅和关着的窗
    features:
    - 摇椅上的阿嫲
    prompt: 一张旧藤摇椅上坐着一位戴老花镜读书的老人，额头狭窄，眼睛有些奇特、向外突出；身旁小桌上摆着几碗冰粉、仙草冻，还有切好的西瓜、菠萝和阿达子；摇椅旁那扇朝海那边的窗关得死死的，插销插着，窗缝里塞着布条
  looks:
  - when: knows:players:clue:c_diary
    change: 日记本打开，一页画满几个孩子的简笔像写着“好朋友们！”，后面是人鱼、被大鱼围住的孩子、一条布满怪符号通向洞口的路的涂鸦
    'on': huang_diary
- id: library
  name: 少儿图书馆
  aliases:
  - 图书馆
  - 囡仔图书馆
  art: library
  public: true
  scene_root: true
  outdoors: false
  ground: building
  read_aloud: 从热闹的街角折入侧巷，灰白色的外墙，方方正正的建筑，一座刚投入使用没几年的现代馆舍出现在眼前。借阅台后的管理员正低头为几册图书加盖日期戳。《冒险小虎队》《鸡皮疙瘩》和《皮皮鲁历险记》的封面已经有些破破烂烂，《丁丁历险记》的书脊裂开了好几道口子，你们好不容易才把注意力从这些书身上移开。《中外神话传说》和《伊索寓言精选》紧紧地挤在一处，再过去是《纳尼亚传奇》和国际大奖小说书系，最边上斜靠着《黄冈小状元达标卷》和《小学生必背古诗
    70 篇》。
  keeper: 调查时长 60 分钟。阮施宁常来这里。管理员昨天见过她。阅览处有当天的《石头屿晚报》。图书馆使用成功可找到几本崭新的深海绘本。
  features:
  - 借阅台
  - 书架
  - 新到的绘本
  - 报刊架
  views:
  - key: library_bookshelf
    label: 少儿书架
    features:
    - 书架
    - 新到的绘本
    prompt: 一排少儿书架，《冒险小虎队》《鸡皮疙瘩》《皮皮鲁历险记》封面破破烂烂，《丁丁历险记》书脊裂了口子，最边上斜靠着练习卷和古诗本
  - key: library_newspaper
    label: 报刊架上的晚报
    features:
    - 报刊架
    prompt: 阅览处的报刊架上夹着当天的《石头屿晚报》，头版标题写着石坡尾清淤发现老旧闸门渗漏，版面角落有天气栏和潮汐表
  - key: library_desk
    label: 借阅台
    features:
    - 借阅台
    prompt: 借阅台上摞着几册待还的书，一枚日期戳和印泥盒放在一旁，台后的管理员正低头盖戳
  looks:
  - when: knows:players:clue:c_picture_book
    change: 书架间多出几本崭新的深海绘本，封面是深蓝靛紫的海和一群圆滚滚、大眼睛的鱼形小生物
    'on': library_bookshelf
  - when: flag:sign_fs_city_cough_1
    change: 阅览处的桌边多出两三个弯着腰、手按在胸口上的大人身影。
- id: music_square
  name: 音乐广场
  aliases:
  - 广场
  - 喷泉广场
  art: music_square
  public: true
  scene_root: true
  outdoors: true
  ground: street
  read_aloud: 音乐广场是一个下沉式广场，中央设有圆形喷泉，水流从中心雕塑底部涌出，沿石质坡面逐级流下，最终汇入底部的环形水池，水池边缘可供人坐下休息。喷泉边有个流浪汉在弹唱，面前打开的琴盒里散落着几张皱巴巴的纸币和硬币。广场北侧台阶上方站着一位挎着相机的青年女子，手里攥着一本卷了边的笔记本，正低头翻看。
  keeper: '调查时长 90 分钟。喷泉、水池属于转变规则中的水源。

    流浪汉：调查员和他搭话，他会停下弹唱；否认见过阮施宁模样的小孩，但说最近几天广场上多了些深夜逗留的人。说话时他一边掏耳朵，从耳道里带出一大团混浊的黏稠物；因他本身卫生差，旁人不觉得异常。侦查成功还能注意到他唱歌时频繁中断喘息，每次都剧烈张嘴、急促费力。

    北侧台阶上的是《石头屿晚报》要闻部编辑杨纵溪。如果调查员没和流浪汉搭话，杨纵溪可能正在和流浪汉说话，并把信息转述给调查员。

    '
  features:
  - 圆形喷泉
  - 环形水池
  - 弹唱的流浪汉
  - 琴盒
  - 北侧台阶
  looks:
  - when: at:busker:music_square & hour:23-24
    change: 喷泉水池边坐着几个一动不动的人，都把手伸进水里
  views:
  - key: square_fountain
    label: 圆形喷泉和水池
    features:
    - 圆形喷泉
    - 环形水池
    prompt: 下沉式广场中央的圆形喷泉，水从雕塑底部涌出，沿石坡逐级流下汇入环形水池，池沿可以坐人，水面在阳光下晃动
  - key: square_busker
    label: 弹唱的流浪汉和琴盒
    features:
    - 弹唱的流浪汉
    - 琴盒
    prompt: 喷泉边一个衣服很脏的流浪汉抱着吉他弹唱，面前打开的琴盒里散着几张皱巴巴的纸币和硬币
- id: night_market
  name: 夜市
  aliases:
  - 鱼市
  - 夜市仔
  public: true
  scene_root: true
  outdoors: true
  ground: street
  read_aloud: 夜市在通往石坡尾的必经之路上。清晨这里是个普通的鱼市，白天空无一人；傍晚六点左右，摊位的照明灯一盏盏点亮。收纳盒、水杯、衣架、脸盆，还有时下流行的牛仔裤和 T 恤，以无限的种类和有限的颜色组合占据着每一个角落。空气里混着烧烤摊的油烟味和炸物的香气，楼上住户窗户里透出的零碎灯光，和楼下五光十色的灯箱招牌交织在一起。人群里，塑料玩具摊、虾饼海蛎饼摊、扁食拌面摊和春卷摊挨在一起。
  keeper: '调查时长 90 分钟。约 18:00 亮灯开市，此前摊位不在；清晨为鱼市。摊位见下列 NPC 与线索。小吃：扁食拌面（扁食形似馄饨，馅里有荸荠丁，拌面加花生酱和石头屿特有的甜辣酱）、蚵仔糋（海蛎炸饼）与虾饼、薄饼（春卷）、芋包、花生汤、沙茶面、姜母鸭、炸五香、韭菜盒、面线糊。

    零碎谈话透露混血种内部冲突：“变化”“回归”“留下”“选择”。回归派认为身体变化是血脉觉醒，支持排水通道保持开启，“只要过了今晚两点……”；留下派认为变化不意味着必须放弃现有生活，担心通道开放会加速所有人的异化，让尚未准备好的人失去选择权。

    危险：调查员在未经引导的情况下过于深入地询问，可能引起回归派混血种的注意。若调查员单独行动，该成员可能突然出现在道路前方，用身体挡住狭窄通道，低声问他们为什么要打听这些；调查员试图离开时，她可能跟随一段距离，用含糊的话暗示“有些事情不是孩子应该知道的”；若调查员带着笔记本、关键玩具或调查物品，她可能趁混乱破坏其中一件并威胁他们（关键玩具须先给保护或挽救的机会）。原文未点名此人，可由丽英担任。

    '
