npcs:
- id: zhang
  name: 老张（张福海）
  role: 乘风破浪888号的船长，调查员租船的船家
  called: 穿蓝工装的敦实船长
  important: true
  look: 身材敦实，皮肤晒成古铜色的中年男人，穿一身沾了些油污的蓝色工装，牙齿因抽烟而泛黄。随身带着保温杯。
  personality: 热情豪爽，服务粗手粗脚但足够到位；渔民世家，把出海冒险看得坦然。
  voice: 一口烟台腔，嗓门大，爱吆喝“好嘞”“来来来”；说到得意处会带点炫耀，被问到不想提的事就摆摆手说“小事小事”。
  goal: 带游客钓上大鱼，今天非得钓个大的（实际是潜意识里的感召：把新的祭品带回深海）。
  knows:
  - 出了海手机就没信号，全靠短波电台跟别的船和岸上联系或求救；今天天气预报说海况不错
  - 驾驶室的木雕小像是祖上传下来、保平安的“海神”，他爹说过名字，他记不得了，只知道照着供
  - 钓上来的第一条鲅鱼要现场片几片，加姜片和海水煮汤才鲜
  - 家里世代渔民；爷爷说过出海最怕的不是风浪而是大雾，雾里分不清东南西北，还容易藏东西
  - 爷爷年轻时在大雾里听见船底下有人游泳的水声，点了三炷香念“龙王爷保佑”，水声没了，雾也散了
  - 当地说法：那是海和尚在巡海，习性不定，有时帮渔民把船推回岸边，有时把船往深海里带，所以船上供像、嘴上客气
  - 海市在这里不罕见，多半是远处的岛屿城市倒映在天上；他亲眼见过一次邪乎的：一片红彤彤、像珊瑚一样往天上戳的树林
  - 爷爷寿终正寝；父亲几年前出海失踪，没找到尸体，他猜是追大鱼误入海流被卷进深海
  secrets:
  - 小时候随父亲出海遇过蜃气和其中的海和尚，侥幸逃出，但年纪小、记忆被身体本能压住，记不清遇袭经过；船舷那道爪痕与此有关
  - 他不自知地被蜃气感染；日出的蜃气唤醒了他的烙印，此后他会一心要去远海礁石滩
  lies:
  - 船舷上的深划痕只是“船嘛，难免刮到蹭到，小事小事”
  - 看到日出蜃气后安抚调查员：“这段时间换季，海市也是正常现象。”
  clues:
  - c_radio
  - c_statue_zhang
  - c_grandpa_fog
  - c_monk_patrol
  - c_red_forest
  - c_father_missing
  portrait: zhang
  stats:
    力量: 65
    体质: 70
    体型: 60
    敏捷: 50
    智力: 55
    意志: 40
    外貌: 45
    教育: 40
    生命: 13
    闪避: 25
    格斗(斗殴): 40
    游泳: 60
    侦查: 50
    聆听: 60
    导航: 45
    驾驶(小型船舶): 65
    机械维修: 40
    自然学(海洋/鱼类): 50
    移动: 8
  attacks:
  - 格斗(斗殴) 40%，伤害 1D3+DB
  looks:
  - when: flag:zhang_overboard
    change: 浪头里浮起一颗湿漉漉的脑袋，嘴巴大张，直勾勾地盯着船上
- id: auntie
  name: 早餐铺大姨
  role: 码头入口三轮早餐车的摊主
  called: 围花头巾的摊主大姨
  look: 围着花头巾，笑容满面，手里拿着漏勺。
  personality: 热情爽利，见人就招呼。
  voice: 地道胶东口音，说话又快又亮，偶尔一句“宁可信其有”。
  goal: 让出海的人吃饱了再上船。
  knows:
  - 今年鲅鱼很肥，但这几天海上天变得快，多多少少得小心
  - 出海讲究多；前两天刚有天狗吃了月亮（月全食），连着好几天海上龙王爷脾气不顺，风浪说来就来
  - 前几天有渔民在远海看到“海市”：远处岛上凭空盖起一排排挂红灯笼的大红房子；还有几个外地游客非说听见房子里有姑娘唱歌
  - 海上的事宁可信其有，见着不对劲就赶紧返航准没错
  clues:
  - c_auntie_fish
  - c_auntie_mirage
  - c_auntie_advice
  location: breakfast_cart
  portrait: auntie
- id: old_man
  name: 渔具铺老头
  role: 码头入口摆地摊卖渔具的老人
  called: 抽旱烟的老头
  look: 坐在小马扎上抽旱烟，面前一块油腻的蓝布，身边一个红布蒙口的陶罐和一个旧木盒。
  personality: 懒洋洋的，推销起来却不含糊；对大海心存敬畏。
  voice: 慢悠悠的，吧嗒一口烟再说话；常挂在嘴边“来都来了，空军回去多可惜”。
  goal: 把渔具卖出去；叮嘱出海的人守老规矩。
  knows:
  - 老规矩：海上起了大雾看不清道儿，就在船头点三炷香、念叨念叨，请海和尚尝尝香火，受了供奉就不会多纠缠
  - 海和尚是龙王的使者，专门在海上巡逻；长啥样没人知道，“反正就是个念想，求个心安”
  clues:
  - c_incense
  - c_monk_lore
  location: tackle_stall
  portrait: old_man
