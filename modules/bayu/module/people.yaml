creatures:
- id: sea_monk
  name: 海和尚
  called: 水里探出的浮肿光头
  description: 身体肿胀泛白，皮肤光滑没有毛发，身上缠着纠结的海藻、贝壳和类似袈裟的深色腐烂纹理；漆黑的眼睛，手上生蹼。没有思想，只守护沉睡之地，袭击未被感染的入侵者。
  pursues: true
  stats:
    力量: 75
    体质: 75
    体型: 65
    敏捷: 50
    智力: 20
    意志: 50
    外貌: 5
    生命: 13
    魔法: 10
    闪避: 25
    移动: 8
    游泳: 75
  attacks:
  - 格斗(斗殴) 45%，伤害 1D4+DB
  - 抓取/拖拽 50%，伤害 0
  notes: 护甲 2；伤害加值 +1D4；水下敏捷为 75。抓取成功后，下一轮尝试以力量对抗把目标拖入水中。登船的一只只要受到超过 5 点伤害就跳回海中。点燃渔具铺送的香、或把驾驶室的木雕小像扔下海，周围的海和尚迟疑、停止行动
    1 轮（每种方式各一次）。逃生时按调查员人数由守秘人定 1-3 只爬上甲板，海里还有更多。
