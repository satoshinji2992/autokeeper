interior_reviews:
  boat:
    fingerprint: 7a614ca859f3ccc19a475274a016dc11083c7b6018bb2b6e2a09b6ea2d809de4
    source: c67a70ab2cf87594c26d05e3485f4a083b5f9df2086494e438d8f095c7c71d1c
    reason: 原文：“船舱分为上下两层，下层是休息和放置杂物的空间，上层则是驾驶室。船尾的开放式甲板……”。船已有入口 boat_deck（船尾甲板），以它为主厅；驾驶室在上层、底舱在下层，按原文分层。甲板与两处船舱之间的梯子或舱口为
      AutoKeeper 补充的通行方式，沿用现有通路 id。船的位置（码头/近海/礁石滩）和跳板、登礁的通行条件仍按 keeper_notes【船的位置】，不在此改动。
  wharf:
    fingerprint: 193f56f9fd6d584de66d8e6387e1fdcd859795dfa709a6a1c3aded133a7fd53f
    source: c67a70ab2cf87594c26d05e3485f4a083b5f9df2086494e438d8f095c7c71d1c
    reason: 露天码头，不是建筑；原文只写了泊位上的一排渔船和入口处的两个铺子，两个铺子已经是单独的地点（breakfast_cart、tackle_stall），不需要再拆，也不能把户外区域改成楼。
  breakfast_cart:
    fingerprint: cb336c0a2dfd9a82f03d6acabda0b8eda868bab9189fadd15f8d02981efb74e0
    source: c67a70ab2cf87594c26d05e3485f4a083b5f9df2086494e438d8f095c7c71d1c
    reason: 这是一辆三轮小餐车，摊主大姨和菜单、锅都在同一处露天摊位上，没有内部空间可分。
  tackle_stall:
    fingerprint: 50dd29bc98dea0af3dc90580f896640c80ea2fd5493a7c697389866acf845b8b
    source: c67a70ab2cf87594c26d05e3485f4a083b5f9df2086494e438d8f095c7c71d1c
    reason: 地摊：老头、蓝布、陶罐和旧木盒都摆在同一块地方，可调查的东西作为 features 已经齐全，没有房间可分。
  reef_rock:
    fingerprint: 1e415b0f9d482000aa37004b45912897b42f60e1f89183427fb687acc8a081f4
    source: c67a70ab2cf87594c26d05e3485f4a083b5f9df2086494e438d8f095c7c71d1c
    reason: 远海礁石滩上的一块露天礁石，不是建筑；脚下的礁石、礁石缝隙和海水作为 features 已经齐全，能否从甲板登上由 at_reef 决定。

