history:
- when: 几十年前
  text: 老张还小时随父亲出海，遭遇蜃气和藏在其中的海和尚，侥幸逃出，船舷留下爪痕；他记不清经过，却成了不自知的感染者。
  who:
  - zhang
- when: 几年前
  text: 老张的父亲出海“追大鱼”失踪，实为受烙印暗示，已转化为海和尚。老张以为他被海流卷走。
  who:
  - zhang
- when: 开局前两天
  text: 月全食（天狗吃月亮），格拉基碎片的精神波动变活跃，蜃气加剧，海和尚躁动；远海有人看见挂红灯笼的海市。
  known_by:
  - auntie
relations:
- a: zhang
  b: players
  kind: 雇佣
  value: 50
  why: 调查员租了他的船，他想让客人钓个痛快
agendas:
- npc: zhang
  goals:
  - 带客人钓上大鱼（实为感召：把祭品带回深海）
  steps:
  - id: welcome
    text: 带调查员上船，介绍船上设施，帮第一次挂饵、煮鱼汤、闲聊旧事
    meet: true
    once: false
    source: zhang
  - id: chase_fish
    text: 船底被撞后兴奋地要开往远海礁石滩追大鱼
    when: flag:bumped
    meet: true
    once: true
    source: 前往远海
  - id: cast_net
    text: 大鱼拉不动时撒下拖网，抱住主绳不放，阻挡调查员割绳，可能把人推下海
    when: flag:hooked
    meet: true
    once: false
    source: 大鱼上钩
  - id: leap
    text: 若无人干涉阻拦，在礁石滩跳入海中
    when: flag:net_cast
    meet: false
    only_if: 调查员没有制服或有效限制他的行动；被制服或限制住时不做
    does: flag:zhang_overboard
    source: 真相
mechanics:
- name: 晕船
  rules: 近海停船时全员体质检定，有出海经验或渔民背景给一个奖励骰；失败者所有动作一个惩罚骰直到好转，大失败当场呕吐；晕过船的人在礁石上休息片刻，下一次晕船检定额外一个奖励骰；返航时体质未过者被颠得呕吐。
  why: 近海-休息玩耍环节、远海-礁石滩、返航
  plugin: bayu_sea
  runs: 插件
- name: 钓鱼
  rules: 幸运检定决定咬钩，成功后力量或投掷与鱼对抗（鲅鱼 25、鲈鱼 40、鲅鱼王 60、神秘的大力 75）；可选钓鱼事件表 1-6。
  why: 活动二：近海垂钓
  runs: 守秘人
- name: 礁石滩逃生
  rules: 每轮约 12 秒，4-5 轮内须切断绳索并启动渔船，否则船沉；3 处网绳需锋利工具与敏捷检定；至少 2 处断后可驾驶检定启动，每 2 次检定耗 1 轮；香与小像各令海和尚停 1 轮，各一次。
  why: 逃生与追逐
  plugin: bayu_sea
  runs: 插件
