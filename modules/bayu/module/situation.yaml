ties:
- id: tie_auntie_hometown
  hook: 调查员祖籍胶东或小时候在烟台住过，大姨一听口音就认出是老乡，问起他家老街坊，聊着聊着更愿意把海上的传闻多说几句（AutoKeeper 补全：原作没写调查员和本地有关系；情报仍按原作，问到近期怪事才讲海市）。
  npc: auntie
  fits:
  - 意义非凡之地
  - 重要之人
- id: tie_dumpling_memory
  hook: 菜单上的鲅鱼水饺，是调查员已故的长辈每年春天都会包的家乡味，站在三轮餐车前，他想起了那个人（AutoKeeper 补全，只用来做气氛和角色扮演）。
  place: breakfast_cart
  fits:
  - 宝贵之物
  - 重要之人
- id: tie_folk_belief
  hook: 调查员是研究或信仰沿海民俗的人（比如民俗学者、家里供龙王妈祖），老头讲的“船头点三炷香”跟他家乡老人的说法很像，所以愿意认真听（AutoKeeper 补全；线香仍然要买了东西才送，c_incense
    的前置不变）。
  npc: old_man
  fits:
  - 思想与信念
  - 职业
- id: tie_fisher_trade
  hook: 调查员当过海员、渔民，或者在胶东跑过船，跟老张算半个同行，聊起渔船行当很投机，老张也乐意拿他家世代打鱼的事来吹（AutoKeeper 补全；这层背景只按原作规则给晕船检定一个奖励骰，不给别的检定加成）。
  npc: zhang
  fits:
  - 职业
  - 意义非凡之地
- id: tie_lost_at_sea
  hook: 调查员有亲友这几年在黄海出海后下落不明，喝鱼汤时老张说起父亲失踪，两人同病相怜（AutoKeeper 补全：只写有这么一位失踪的亲友，不点明他的去向，也不说他和海和尚有关）。
  npc: zhang
  fits:
  - 重要之人
- id: tie_wharf_childhood
  hook: 调查员小时候被父母带来芝罘湾码头看过渔船回港，这次旅游有一半是想回来看看，眼前这一排排渔船和记忆里的样子已经不大一样了（AutoKeeper 补全）。
  place: wharf
  fits:
  - 意义非凡之地
  - 重要之人
- id: tie_carver_eye
  hook: 调查员是木雕、文物或宗教造像方面的行家，一进驾驶室，那尊磨得油亮的小像就把他的目光吸了过去（AutoKeeper 补全；要看出它不是龙王也不是妈祖，仍须通过原作的<侦查>或<艺术/手艺(雕刻)>检定）。
  place: boat_cabin
  fits:
  - 职业
  - 思想与信念
- id: tie_radio_ham
  hook: 调查员玩业余无线电或者干通讯这一行，看见老式短波电台就忍不住想上手摆弄，有话题跟老张聊（AutoKeeper 补全；c_radio 和 c_radio_bubbles 仍按原作检定拿，判定没过也可以照原作去问老张）。
  place: boat_cabin
  fits:
  - 职业
- id: tie_marine_science
  hook: 调查员学的是海洋生物、海洋地质或潜水，凭专业知识就明白，一块礁石上连一个贝壳、一只藤壶都没有，实在不正常（AutoKeeper 补全；c_reef_smooth 原作就是搜到即得，这条只是给他一个理由去留意）。
  place: reef_rock
  fits:
  - 职业
  - 思想与信念
- id: tie_own_longevity_lock
  hook: 调查员身上一直戴着长辈给的长命锁；要是钓鱼事件5拉上来那团旧渔网，网里那把带抓痕的黄铜长命锁会让他心里一沉（AutoKeeper 补全：原作没交代这把锁是谁的，这里只写触动，不认定锁的主人）。
  place: boat_deck
  fits:
  - 宝贵之物
  - 重要之人
foreshadow:
- id: fs_zhang_thermos
  hint: 老张手边总不离那只保温杯，张罗的空当就拧开喝一口，一早上续了好几回。
  where: boat_deck
  pays_off: k_zhang
  stages:
  - hint: 日出以后老张喝得更勤了，往往刚拧上杯盖，没说两句话又拧开。
    when: flag:mirage_risen
  - hint: 往远海去的路上，老张晃了晃保温杯，已经空了；他没再续茶，顺手把甲板上那桶矿泉水拎到了自己脚边。
    when: flag:to_reef
- id: fs_zhang_far_gaze
  hint: 日出过后，老张干活时总不自觉地停下手，朝远海那个方向望上一会儿，回过神来又接着忙。
  where: boat_deck
  pays_off: k_zhang
  stages:
  - hint: 老张一边招呼大家钓鱼，一边望着远海出神，望的时间一次比一次长，有人叫他也要喊两声才应。
    flag: sign_fs_zhang_far_gaze_1
  - hint: 开往礁石滩时，老张把油门推到底，眼睛死盯着前方海面，仪表一眼都没看，嘴里低声念叨着什么。
    when: flag:to_reef
    where: boat_cabin
- id: fs_radio_static
  hint: 驾驶室里那台老电台时不时“滋啦”响一声，没有人说话，只有一阵杂音，响完又安静下来。
  where: boat_cabin
  pays_off: e_bump
  stages:
  - hint: 日出以后，电台的杂音来得比先前频繁，有一回像是有人按下通话键又什么都没说，杂音拖了好几秒才断。
    when: flag:mirage_risen
    flag: sign_fs_radio_static_1
