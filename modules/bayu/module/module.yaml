id: bayu
title: 鲅鱼？鲅鱼！
subtitle: 谁还不是个钓鱼佬了！
system: CoC7
era: 现代（2025 年春）
setting: 中国山东烟台芝罘湾渔人码头，以及黄海近海与远海的礁石滩
players: 2-5 人
duration: 3-5 小时（线上文字团）
source: 《鲅鱼？鲅鱼！》，作者九拾、右将，封面九拾，校对右将
license: 原作者所有
hook: 春天的鲅鱼汛期，你们恰好来烟台旅游，一时兴起合伙租了一艘渔船出海钓鱼。凌晨四点半，大家在芝罘湾渔人码头集合，目标只有一个：鲅鱼！
truth: '远古时，旧日支配者格拉基乘陨石来到地球，陨石着陆前碎裂，一片碎片坠入黄海某处海沟沉睡。它沉睡中无意识散发的精神能量与海面水汽结合，形成诸多幻象（海中不存在的岛屿、怪异的星辰、深海传来的歌声或低语），沿海居民称之为“蜃”，视作能吐气成楼台的蛟龙、龙王而祭祀。

  蜃气是格拉基精神能量的具现，长期接触的人会被植下烙印。受感染者平时与常人无异，特定时期会受到强烈感召，产生“必须到达母体所在地”的冲动，并自我暗示将其合理化（渔民会觉得远海礁石滩的鱼最多最肥）。抵达格拉基沉睡之地后，烙印爆发，他们跳入海中，几日内异变为“海和尚”：肿胀泛白、光滑无毛、身上布满海藻贝壳和类似袈裟的深色腐烂纹理，没有思想，只守护沉睡之地、袭击一切未被感染的入侵者。

  近期月全食令碎片的精神波动更活跃，蜃气加剧，海和尚躁动。船长老张（张福海）几十年前随父亲出海时遭遇蜃气，侥幸生还，却成了不自知的感染者。他主观上以为自己在带游客钓大鱼，实际在执行潜意识中的指令：带上新的祭品，回归深海。老张的父亲几年前出海“追大鱼”失踪，实际也是受烙印暗示，已变成海和尚。

  日出时的蜃气会唤醒老张的烙印；之后他把调查员带往远海礁石滩，受到第二次感召，若无人干涉，他将在礁石滩跳海，异化为海和尚。

  '
keeper_notes: '原作规则：CoC 7 版，2-5 人，可用旧卡；原作没有车卡限制，也没有预设调查员。原作是“茶番”（轻松向）团建旅游模组，lost 率低，前半段以海上日出、垂钓、鱼汤闲聊为主，守秘人可自由引导这些活动的顺序。

  【船的位置】乘风破浪888号是一组房间（船尾甲板、驾驶室、底舱），船随剧情从码头开到近海、再开到远海礁石滩。位置由标记表示：未设 set_sail 时船停在码头，可经跳板上下；set_sail 后在近海（at_nearshore）；to_reef
  后开往礁石滩（at_reef）。离开码头后“码头—甲板”的通路不能走；只有 at_reef 成立后才能从甲板登上礁石。守秘人据此判断能否上下船。

  【时间】原文明示：4:30 集合；4:40 左右老张到；开船约 20 分钟后在近海停船；约 5:40 日出；约 9:00 近海活动结束、船底被撞；20 分钟到礁石滩；到达约 15 分钟后大鱼上钩。AutoKeeper
  据此推算礁石滩到达约 9:20、大鱼上钩约 9:35，事件钟点按此填写。开船时间由玩家行动决定（老张到达、登船后由守秘人设 set_sail）。

  【晕船】近海停船时全员<体质>检定，有出海经验或渔民背景的给一个奖励骰。成功很快适应；失败头晕恶心、脸色苍白、脚步虚浮，所有动作承受一个惩罚骰，直到状况好转（何时好转由守秘人判，喝鲅鱼汤时“晕船的不适似乎都烟消云散”可作契机）；大失败当场扶船舷呕吐（角色扮演）。晕过船的调查员在礁石上休息片刻后，下一次晕船检定额外获得一个奖励骰。返航时油门推到底，<体质>未过的被掀得左滚右撞、大吐特吐。用插件
  bayu_sea 的 seasick、rest、recover 动作记录。

  【钓鱼机制】先<幸运>检定判断鱼是否咬钩；成功后以<力量>或<投掷>与鱼对抗。普通鲅鱼/黑头鱼 力量25 体型10（对抗值25）；大个头鲈鱼 力量40 体型20（对抗值40）；鲅鱼王（大成功钓上的）力量60
  体型40（对抗值60）；神秘的大力（事件5）对抗值75。成功：钓上鲅鱼/黑鱼/其他本地鱼；失败：线一松鱼跑了；大成功：潇洒地甩上一条个头惊人的“大家伙”；大失败：脚下一滑（或因晕船）差点被鱼拽进海里，或鱼线断裂连鱼竿也甩出去（怎么捞回来由调查员自己想办法）。

  守秘人可加钓鱼事件表（rd 决定，可自由添加）：1 色彩斑斓的海星（无对抗）；2 骂骂咧咧死死夹着铅坠的梭子蟹（对抗值20）；3 塞满淤泥的旧胶鞋，倒出几枚老旧硬币（无对抗）；4 海鸥俯冲抢走即将出水的鱼（无对抗）；5
  神秘的大力：鱼竿被巨力猛地下拽，拉上来是一大团缠在一起的渔网，在老张帮助下拖上甲板，网里有长命锁（对抗值75，设 net_snag）；6 丰收，一杆两条（对抗值35）。

  老张只帮第一次挂饵，之后调查员自己挂；他不带一次性手套，不想徒手抓虫饵的要自己想办法。

  【日出蜃气】见过日出幻象（侦查成功）的调查员：前往远海时会对大鱼产生急切渴望，积极响应去礁石滩；大鱼上钩时额外 sc0/1，失败则喉咙深处涌起难以忍受的干渴，连船边的海水都想喝；若最终只有调查员幸存，此后留下后遗症：每当靠近海边，都会无端升起再去一次远海的渴望。守秘人逐人记录谁看到了幻象。

  【逃生机制】（原文全文）此环节有时间限制，以轮计（每轮约 12 秒）：4-5 轮内未能切断绳索并启动渔船，船只被拖翻、沉没（轮数由守秘人在 4 与 5 中定）。要解决：①老张的干扰：他已被烙印控制，若不限制，他会阻挡调查员，甚至可能在混乱中把调查员推入海中；用<力量>/<敏捷>等对抗可制服，但要避免后续干扰必须有效限制其行动。若把老张推入海中，他会愣一瞬，不挣扎，直直沉下；一个浪头后脑袋再度浮起，直勾勾盯着调查员，嘴巴大张任海水灌入，直到再被大海吞没视线都不离开调查员；他会在海中变为海和尚，但异变需要时间，暂时不再干扰。②渔网的束缚：网绳
  3 处，船舷两侧的挂钩和船尾的固定栓，要用锋利的工具切割；船剧烈倾斜，船上行动需<敏捷>检定，合理的行为可加奖励骰。③击退登船的海和尚：割绳过程中有 1-3 只海和尚（按人数由守秘人酌定）顺网绳爬上甲板，试图把人拖入水中；任何可行方式反击，只要对一只造成超过
  5 点伤害，它就跳回海中。④启动引擎：至少 2 处绳索切断后船的倾斜缓解，可进驾驶室用<驾驶>检定启动引擎（没有相应技能也可用相关知识类技能；小型渔船启动不复杂，推油门即可）；每 2 次检定消耗一轮；成功后引擎轰鸣，螺旋桨绞断剩余网绳，渔船冲出礁石滩。上述任何时候，点燃渔具铺老头送的香，或把驾驶室的木雕小像扔下海，都能让周围海和尚迟疑一轮、停止行动
  1 轮；每种方式仅一次。用插件 bayu_sea 记录轮数、割断的绳、启动检定次数和香/小像的使用。

  【落水】任何调查员落水（被拖下、被推下或船沉）：冰冷海水灌入口鼻，却没有窒息，只有解脱般的清凉，干渴的喉咙终于平息；水下他看见指间长出近乎透明的薄膜，头发自头皮脱落漂散……调查员不会死亡，而是逐渐转化为海和尚，此后一切数值与海和尚一致。其余调查员若逃脱，结局照常判定。

  【提前回航】若调查员觉得不妙提前返航，守秘人可考虑在返航路上安排一次海和尚袭击；因未深入礁石滩，老张不受异变影响，也不会干扰调查员。具体由守秘人决定。原作没有为此写结局，AutoKeeper 补充“提前返航”结局，不给理智奖励。

  【渔具铺沙蚕】掀开陶罐红布看沙蚕时，可让比较胆小的调查员进行一次 0/1 理智检定，纯为吓唬、增加趣味，可选。

  AutoKeeper 补充：两名预设调查员；海和尚与老张的闪避（敏捷一半）、海和尚移动 8（参照规则书深潜者类）；码头抵达后的日常接触只按原文铺子写法展开；剖鱼刀作为“锋利的工具”放在甲板（原文写老张拿刀片鱼）。

  '
