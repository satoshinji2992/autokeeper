start: wharf
start_time: D1 04:30
opening: '凌晨四点半，你们起了个大早，带着些许困意来到芝罘湾渔人码头集合。春日拂晓前的空气带着凉意，掺着海水的咸腥涌入鼻腔。天还没亮，墨蓝色天幕下只能瞧见隐约的码头轮廓。几盏昏黄路灯下，早起的钓客搓着手等船家；码头入口处，几个挂着小灯泡的早餐、渔具铺子已经支了起来。海浪一下一下拍着堤岸和停靠齐整的渔船，哗啦哗啦地响。

  你们租的渔船叫“乘风破浪888号”，船长姓张，此刻还没见人影。船就停在码头这一排渔船里。

  '
