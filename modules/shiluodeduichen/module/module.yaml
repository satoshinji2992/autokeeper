id: shiluodeduichen
title: 失落的对称
subtitle: Lost Symmetry
system: CoC7
era: 1920 年代
setting: 美国马萨诸塞州波士顿的一所大学（原文为波士顿大学，守秘人可换成任何合适的大学），以及佛蒙特州勒德洛镇边缘的一栋小房子
players: 1-4 人
duration: 约 3-4 小时
source: Lost Symmetry © 2019 Benjamin Schäfer（Miskatonic Repository），中文个人汉化
license: 免费模组，仅供学习，版权归原作者所有
hook: |
  明天就要考试了。你们的同学、数学系最有前途的学生之一詹姆斯·布莱恩特，在考前最后一堂课上没有出现。
  詹姆斯痴迷数学，不善交际，却是可靠、忠实、值得信赖的朋友。他很少谈自己，唯一提起过的“家人”是住在佛蒙特州的科拉阿姨。
truth: |
  詹姆斯通过图书管理员助理凯莱布·莫罗买下了欧几里得的伪作手稿（宿舍段称《失落的原理》，凯莱布段称《失落的对称》，原文前后叫法不一，是同一份手稿），之后又攒钱买下极罕见的神话典籍《缟玛瑙石板》英译本。这些书出自已故埃德加·摩尔收藏在摩尔家族波士顿附近宅邸地下墓穴（地下保险库）里的藏书，凯莱布一家几代人看管那处房产，他私下复印、售卖书中段落乃至整本书。
  詹姆斯认为阿姨科拉·韦布在佛蒙特州勒德洛的房子足够隐蔽，就去那里学习并完成了书中的一个跨维度对称仪式。读书让他的思维脱离了人类的道德枷锁；仪式打破了现实的边界，某种饥饿之物从裂缝中溜了出来。它利用詹姆斯的身体维持与另一边世界的联系（詹姆斯赤裸着悬浮在地下室血绘的图形上方，胸口刻着同样的图形，只剩 3 点生命，几乎无法动弹），并把科拉阿姨的尸体变成与这个世界互动的工具——“门之守卫者”。
  科拉死于钝器造成的暴力外伤，身上遍布对称形状的深切口；原文没有写明是谁下的手。地下室桶里的血多到一个人不可能失去这么多而存活。
  把詹姆斯拉出图形中央，或毁掉他胸口的图形，能关闭裂隙：守卫者倒下，蓝光消失，詹姆斯（不可挽回地）丧失行为能力或死去。但进入过这间裂隙房间的调查员已经被带进了一个陌生的现实：警察赶到、把他们带回警局时，他们会发现世界明显变得不同。能否回去，由守秘人决定。
keeper_notes: |
  【规则系统】原作就是 CoC 7 版模组，检定、理智损失与数值都照原文，未做换算。
  【开局】原文要求开局前让每位玩家描述调查员与詹姆斯的关系（方框“你对詹姆斯的了解”可作启发），并问清詹姆斯一失踪就立刻去找他的动机，最好在开团前在元层面解决。第一场景从中间开始：考前最后一堂课刚开始，调查员已经落座，哈特曼教授走进教室。开课钟点 D1 09:00 为 AutoKeeper 补充；原文只写“明天考试”。
  【教室】几分钟后詹姆斯的缺席对调查员变得明显，侦查成功可确认；除调查员外似乎没人注意或在乎。中途离开：潜行成功不被哈特曼觉察；失败则他暂停讲课，以审视的神态看着他们离开；大失败则他停下来，对离开时闹出动静的调查员说话：点名讽刺“如果我的课让你无聊了，我很抱歉。但你们最好别打扰那些真正想要到这里学东西的学生。”并要求他们明早第一件事就去他办公室见他（设 hartman_summoned）。留下听课的，守秘人用“技术呓语”词表轰炸：无穷小，抽象，倒数，派，矩阵，算法，系数，因子，对数，二项式，非欧几里德，排列，序列，无理数，子集，演绎推理，三角，逻辑，正交，系数，张量，复杂动力学，悖论，向量，模，算术，微分，取幂，期望值。宿舍和图书馆是着手调查唯一有价值的选择，玩家想不到时可用智力检定点明。
  【宿舍进门】敲门无人应。一直敲：集体幸运检定，失败则隔壁伯纳德·富勒开门（见伯纳德条目）。门可以用力量或锁匠（开锁）检定打开；开锁或力量大失败时再做集体幸运检定，看伯纳德是否听见并出来查看。伯纳德被说动后会说出门卫在地下办公室有备用钥匙；取钥匙需要潜行检定，守秘人应给有创造力的做法一个奖励骰。进门尝试失败后、调查员准备离开公寓时，要求一次侦查：成功则注意到詹姆斯房间的窗户微微开着，紧挨着常春藤覆盖的排水管；爬进去是潜行与敏捷的组合检定，等到天黑潜行获得一个奖励骰。房里门边挂着第二把钥匙，可从里面开门。
  【宿舍内部】扮演数学学生的调查员免检认出墙上草图是古希腊几何研究；非学生要教育检定。
  【图书馆】守秘人用低声（原文：用霍尔科姆夫人禁止的方式——不在桌上大声说话）营造图书馆的气氛；玩家大声喧哗、凌乱或不敬时，霍尔科姆夫人威胁把他们赶出去。她不认识手稿和便条，心理学成功可确认她说的是实话。
  【凯莱布】对质时先否认（明显在撒谎）。任何社交技能（话术、说服、取悦、恐吓）成功都能让他吐露实情，恐吓获得一个奖励骰（他讨厌冲突）。他讲完后，心理学成功可确认他没撒谎。他也许会补充詹姆斯提到阿姨家的事。
  【学生档案】秘书鲁比·托伦斯重视隐私，说服、话术（甚至取悦）成功可让她破例一次；恐吓无效，她会把调查员赶出去并以纪律处分威胁。
  【去佛蒙特】困难信用评级成功：家境足够富裕，可自己叫车。否则坐巴士，或搭家在那边的同学的便车（幸运检定成功）。无论哪种方式路程都要 5-6 小时（通路按 330 分钟）。守秘人要强调：詹姆斯竟自愿错过最后一课乃至考试，一定出了大问题——调查员若追查到底，也可能如此。冒着错过考试的风险去佛蒙特要过 0/1 的理智检定（事件 e_risk_exam；若调查员考完才走，守秘人设 exam_taken 免掉）。用毕业的风险吓唬他们：事先能提供病假条才能补考，而补考出了名地难。
  【科拉的房子】房子隐蔽，除枪声和大火外镇上居民不会注意。门没锁。一楼起初没有可疑之处。四处看过一会儿后，侦查成功指出恶臭来自通往二楼的楼梯。发现尸体后调查员注意到奇怪的嗡嗡声，被引向地下室楼梯。
  【门之守卫者】调查员在主地下室调查时，楼梯上会响起窸窸窣窣、笨拙而响亮的脚步声（不需侦查，事件 e_guardian）。去查看的人看见科拉阿姨复活的遗体跌跌撞撞下楼（理智 1/1D8，已由事件算入）。躲进杂乱的地下室获得一个奖励骰（潜行）。不久它进入地下室，袭击平视范围内的调查员；若所有人都躲好了，它攻击成功等级（或技能）最低的调查员。它是非常强健的外壳，很难在战斗中打败。原文没有写明战斗打倒它能否关闭裂隙。
  【关闭大门】最佳机会是把詹姆斯拉出图形中央，或摧毁他胸口的图案。是否把这一点提示给玩家由守秘人决定，可作为智力检定成功的奖励（线索 c_gate_hint）。①拉出詹姆斯：困难力量检定，多人合力获得一个奖励骰；成功也有代价：把他的身体从维持他漂浮的力量中拉出时，调查员拉着的那部分（他的关节或肢体）会脱臼或骨折，理智 0/1。②毁掉胸口图形：守秘人要强调其中的道德困境。任何开刃的武器都能做到；用不锋利的武器需要困难成功。攻击无助的詹姆斯理智 0/1D3，意外杀死他理智 1/1D6。他此时只剩 3 点生命（调查员不知道）。原文此处写“毁掉图形不可能对詹姆斯造成伤害”，与紧接着的生命值和“意外杀死他”的理智损失相矛盾，疑为翻译或排版错误；整理时保留原文两种说法，由守秘人按实际手段裁定伤害。任一方式成功：守秘人设 gate_closed，科拉的尸体倒下，蓝光消失；詹姆斯不可挽回地丧失行为能力，或已死（死了设 james_dead）。
  【后果】调查员还在弄清发生了什么时，警笛声接近。警察会问很难回答的问题；说服是唯一能让警官相信他们没有犯下这些暴行的社交技能，但他们仍会被带回警局问话（守秘人设 taken_to_station）。侦查成功会发现警察的制服看起来奇怪地陌生。无论通过警车车窗还是别的方式，他们意识到周围的世界明显陌生：进入詹姆斯制造的裂隙房间之后，有些事物改变了。守秘人自由描述另类现实——可以是细微改变（美元钞票上印着不同的总统），也可以与我们的现实差异巨大（原子能反重力汽车、喷气背包、嗜血的亚马逊人领主）。着重强调陌生感，以及意识到詹姆斯的仪式把科拉的房子变成了传送门、自己身处陌生现实的迷失与绝望，理智 1/1D8。能否回去由守秘人决定。
  【《缟玛瑙石板》（英译本）】描述跨维度对称的仪式，能唤起巨大能量打破现实边界。理智损失 1D6（阅读时科学(数学)检定成功则为 1D10）；克苏鲁神话 +4/+8%；神话等级 20；学时 46 周（科学(数学)检定成功 24 周）；推荐咒语：命令星之步旅者（召唤/控制维度蹒跚者）。线索 c_onyx_read 的理智栏写 1D6，科学(数学)成功时由守秘人改为 1D10。
  【原文含糊与取舍】卧室尸体原文作“躺在创伤”，按上下文理解为躺在床上。德文名一节（柏林洪堡大学版）未采用。原文的门卫只被提到，没有名字和资料，未单列 NPC，由守秘人临场扮演。原作没有预设调查员，pregens 两人为 AutoKeeper 补充。原文没有写调查员逃离房子或放弃调查的结局，不另设，由守秘人临场处理。
flags:
