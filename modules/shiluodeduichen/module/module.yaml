  bernard_threatened: 伯纳德威胁要告诉门卫有人想闯进詹姆斯的房间
  exam_taken: 调查员已经参加了考试，去佛蒙特不再冒错过考试的风险
  guardian_risen: 门之守卫者已经下到地下室
  gate_closed: 詹姆斯被拉出图形或胸口图形被毁，裂隙关闭
  james_dead: 詹姆斯已死
  taken_to_station: 调查员被警察带往警局
  party_fallen: 调查员在地下室被门之守卫者全部击倒
