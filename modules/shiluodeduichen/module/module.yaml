  sign_fs_blue_under_door_1: 伏笔 fs_blue_under_door 第 1 步露出了，场景图换成：门缝底下那一线淡蓝色的光没有了，走廊暗了下来。（露出时由引擎设置）
start: classroom
start_time: D1 09:00
opening: |
  考试就在明天。这是考前的最后一堂课，你们已经在阶梯教室里落座，摊开笔记。
  门开了，一个矮小、头发乱糟糟的人走了进来——哈特曼教授。全班瞬间安静下来。他没有问好，也不做任何导入，以平和的语调从上次停下的地方接着讲：概率与逻辑的关系。
