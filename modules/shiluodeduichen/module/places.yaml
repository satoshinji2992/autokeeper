locations:
  - id: campus
    name: 大学校园
    art: campus
    read_aloud: 红砖楼舍围着草坪，学生夹着书本在小径上匆匆来去。图书馆的大楼立在一侧，校园东边是几栋较新的寄宿公寓。
    keeper: 波士顿大学校园（守秘人可换成别的大学）。各教学楼、图书馆、行政楼都从这里走。
    features: [校园小径, 公告栏]
    public: true
    scene_root: true
    outdoors: true
    ground: street
  - id: classroom
    name: 数学系教室
    within: campus
    art: classroom
    read_aloud: 阶梯教室里坐满了考前来听最后一课的学生，黑板上写满公式。哈特曼教授站在讲台前，声音平和而不停顿。
    keeper: 开局地点。詹姆斯平时和调查员坐在一起，座位空着。问周围同学：最近没人见过他；有人建议去图书馆找。离开教室的潜行规则见守秘人须知。
    features: [詹姆斯常坐的座位, 周围的同学, 黑板]
    public: true
    outdoors: false
    ground: building
    views:
    - key: classroom_empty_seat
      label: 空着的座位
      features:
      - 詹姆斯常坐的座位
      prompt: 1920年代大学阶梯教室里一排木制连排座椅，中间一个座位空着，桌板上什么也没放，左右两边的座位上摊着笔记本和钢笔，远处黑板上写满数学公式
  - id: hartman_office
    name: 哈特曼教授的办公室
    within: campus
    art: hartman_office
    read_aloud: 狭小的办公室里书和讲义堆到窗台，墙上的黑板留着擦了一半的推导。
    keeper: 哈特曼下课后回到这里。被点名的调查员要在 D2 早上第一件事来这里见他。他除了对詹姆斯缺席感到惊讶外提供不了别的信息。
    features: [堆满讲义的书桌, 黑板]
    public: true
    outdoors: false
    ground: building
  - id: library
    name: 大学图书馆
    within: campus
    art: library
    read_aloud: 高大的阅览室里只有翻书声，一排排长桌上亮着绿罩台灯。借阅台后面坐着一位腰板笔直的女士，正抬眼扫视每一个进门的人。
    keeper: 玛杰里·霍尔科姆的地盘。她讨厌凌乱、噪音和不敬；遵守就没事，否则她威胁赶人。后台办公室在借阅台后面。
    features: [借阅台, 阅览室长桌, 书架]
    public: true
    outdoors: false
    ground: building
    scene_root: true
  - id: library_office
    name: 图书馆后台办公室
    within: library
    art: library_office
    read_aloud: 借阅台后面的小办公室里堆满待整理的书和推车，一盏台灯下有人正在给书贴标签。
    keeper: 凯莱布·莫罗经常在这里整理书籍。
    features: [待整理的书堆, 凯莱布的工作台]
    outdoors: false
    ground: building
  - id: registrar
    name: 大学行政办公室
    within: campus
    art: registrar
    read_aloud: 柜台后面是一排排档案柜，打字机的声音一下一下地响。柜台后的秘书抬起头。
    keeper: 秘书鲁比·托伦斯在这里。学生档案里登记着詹姆斯的近亲属。
    features: [柜台, 学生档案柜]
    public: true
    outdoors: false
    ground: building
  - id: dorm_yard
    name: 寄宿公寓门前
    art: dorm_yard
    read_aloud: 校园东侧一栋较新的寄宿公寓，砖墙上爬满常春藤，一楼的窗户一字排开。
    keeper: 詹姆斯的房间在一楼。进门失败、准备离开时要求一次侦查，成功会注意到他房间的窗户微开（线索 c_window），旁边是常春藤覆盖的排水管。
    features: [公寓正门, 一楼的窗户, 常春藤覆盖的排水管]
    scene_root: true
    outdoors: true
    ground: street
    views:
    - key: dorm_ivy_window
      label: 常春藤旁的一楼窗户
      features:
      - 一楼的窗户
      - 常春藤覆盖的排水管
      prompt: 砖砌寄宿公寓的一楼外墙，一排木框上下推拉窗，其中一扇紧挨着一根爬满茂密常春藤的铸铁排水管
    looks:
    - when: knows:players:clue:c_window
      change: 紧挨排水管的那扇窗户下沿留着一道窄缝，窗扇微微开着
      'on': dorm_ivy_window
  - id: dorm
    name: 寄宿公寓
    art: dorm_hall
    entry: dorm_hall
    read_aloud: 一栋较新的寄宿公寓。
    keeper: 建筑容器，正常从正门进入一楼走廊。
    features: []
    scene_root: true
    outdoors: false
    ground: building
  - id: dorm_hall
    name: 公寓一楼走廊
    within: dorm
    art: dorm_hall
    read_aloud: 一楼走廊安静而昏暗，两侧是一扇扇编了号的房门。詹姆斯的房门紧闭着，旁边就是邻居的门。通往地下的楼梯在走廊尽头。
    keeper: 敲詹姆斯的门不会有人应。一直敲则要集体幸运检定，失败引来隔壁的伯纳德。
    features: [詹姆斯的房门, 隔壁的房门, 通往地下的楼梯]
    outdoors: false
    ground: building
  - id: bernard_room
    name: 伯纳德的房间
    within: dorm
    art: bernard_room
    read_aloud: 窗帘拉着，屋里一股隔夜的酒气，床上的被子乱成一团。
    keeper: 伯纳德在里面睡觉解宿醉。他不会请调查员进来。
    features: [凌乱的床]
    outdoors: false
    ground: building
  - id: james_room
    name: 詹姆斯的宿舍
    within: dorm
    art: james_room
    read_aloud: 整个房间一片狼藉，乱得离奇。你们知道詹姆斯有点不爱收拾，却从没想到会乱成这样。混乱似乎都是从书桌开始的：书本、纸页堆成小山，桌子背后的墙上贴满了图形和草图。
    keeper: 门边挂着第二把钥匙，可从里面开门。书桌上的逾期通知来自霍尔科姆夫人。草图辨认、侦查线索见 clues。搜房几分钟即可免检找到一封旧信和科拉阿姨的地址。
    features: [书桌, 墙上的图形和草图, 书桌边的乱堆, 一封旧信, 门边的钥匙钩]
    outdoors: false
    ground: building
    views:
    - key: james_desk
      label: 堆满纸页的书桌
      features:
      - 书桌
      prompt: 凌乱不堪的学生书桌，书本和写满算式的纸页堆成小山，几张印着图书馆抬头的逾期通知压在上面，纸堆正中一张纸上用钢笔画着一个圆形里的奇怪几何图形
    - key: james_wall_sketches
      label: 墙上的几何草图
      features:
      - 墙上的图形和草图
      prompt: 书桌背后的墙上密密麻麻贴满纸张，画着古典风格的几何作图：圆、三角形、直线构造，许多图形一层套一层地缩小重复，边上写满细小的注释
    looks:
    - when: knows:players:clue:c_postcard
      change: 图形纸页底下露出半张风景明信片的一角
      'on': james_desk
  - id: janitor_office
    name: 门卫的地下办公室
    within: dorm
    art: janitor_office
    read_aloud: 地下室里一间小办公室，墙上的木板挂着一排排钥匙，桌上放着工具和半杯冷掉的咖啡。
    keeper: 门卫的备用钥匙在这里。取得詹姆斯房间的备用钥匙需要潜行检定，有创造力的做法给一个奖励骰。门卫原文没有资料，由守秘人临场扮演。
    features: [挂钥匙的木板, 门卫的桌子]
    outdoors: false
    ground: building
    views:
    - key: janitor_key_board
      label: 挂钥匙的木板
      features:
      - 挂钥匙的木板
      prompt: 地下室小办公室的墙上钉着一块木板，一排排铁钉上挂着黄铜钥匙，每把钥匙下面系着写了房号的小挂牌，旁边桌上有工具和半杯冷咖啡
  - id: ludlow
    name: 勒德洛北街
    aliases: [勒德洛, 佛蒙特州勒德洛]
    art: ludlow
    read_aloud: 佛蒙特州的小镇勒德洛，北街两旁是木板房和店铺。街道尽头转入一条没有铺砖的土路，通往镇子边缘。
    keeper: 从波士顿坐巴士要 5-6 小时。顺北街很快转入土路，科拉阿姨的房子在镇子边缘。
    features: [北街, 通往镇外的土路]
    public: true
    scene_root: true
    outdoors: true
    ground: street
  - id: cora_house
    name: 科拉阿姨的房子
    art: cora_house
    entry: cora_ground
    aliases: [科拉家, 韦布家]
    read_aloud: 土路尽头，一栋小房子孤零零地立在镇子边缘，四周很安静。
    keeper: 房子足够隐蔽，除了枪声和大火，镇上居民不会注意。门没有上锁。
    features: [前门]
    scene_root: true
    outdoors: false
    ground: building
  - id: cora_ground
    name: 一楼起居室与厨房
    within: cora_house
    art: cora_ground
    read_aloud: 屋里收拾得很整洁，但家具上蒙着一层薄灰。起居室里摆着沙发和圆桌，厨房在后面。
    keeper: 起初没有可疑之处。四处看过一会儿后，侦查成功发现恶臭从通往二楼的楼梯传来。一侧有通往地下室的楼梯。
    features: [起居室, 厨房, 冰箱, 通往二楼的楼梯, 通往地下室的楼梯]
    outdoors: false
    ground: building
    views:
    - key: cora_icebox
      label: 厨房里的冰箱
      features:
      - 冰箱
      prompt: 1920年代乡间小屋整洁的厨房，一台老式木制冰箱（冰柜）门关着，旁边台面上落着一层薄灰，果盘里的水果颜色发暗
    looks:
    - when: knows:players:clue:c_spoiled_food
      change: 冰箱门打开，里面一块用保鲜膜包着的自制烘肉卷长满了霉斑
      'on': cora_icebox
  - id: cora_landing
    name: 二楼楼梯口
    within: cora_house
    art: cora_landing
    read_aloud: 二楼很小，八字形的斜坡天花板压得人要低头。一间极小的浴室，一间卧室。苍蝇的嗡嗡声从卧室门后传来。
    keeper: 恶臭的源头是卧室。
    features: [卧室的门]
    outdoors: false
    ground: building
  - id: cora_bath
    name: 二楼浴室
    within: cora_house
    read_aloud: 一间极小的浴室，和楼下一样落满灰尘。
    keeper: 没有任何不寻常的地方。
    features: [浴缸, 洗手池]
    outdoors: false
    ground: building
  - id: cora_bedroom
    name: 二楼卧室
    within: cora_house
    art: cora_bedroom
    read_aloud: 味道令人难以忍受。苍蝇在床上盘旋，床上躺着一个从头到脚盖着毯子的人形，毯子好几处被体液和血浸透，渗出的痕迹古怪地左右对称。
    keeper: 科拉·韦布高度腐败的尸体。揭开毯子见线索 c_corpse（理智 0/1D4）。
    features: [床上盖着毯子的尸体]
    outdoors: false
    ground: building
    looks:
      - when: flag:gate_closed
        change: 床上空了，毯子掀落在地，只剩浸透的污渍
      - when: knows:players:clue:c_corpse
        change: 毯子被掀开，露出一位高度腐败的老妇人遗体，身上布满左右对称排列的深切口
        'on': cora_blanket_bed
      - when: flag:sign_fs_blanket_shifted_1
        change: 床上的人形不见了，毯子半拖在地上，床边到门口的地板上多了一道污迹。
    views:
    - key: cora_blanket_bed
      label: 毯子下的人形
      features:
      - 床上盖着毯子的尸体
      prompt: 斜顶低矮的小卧室，苍蝇在一张旧床上方盘旋，床上躺着一个从头到脚盖着毯子的人形，毯子好几处被深色液体和血浸透，渗出的污痕左右对称
  - id: cora_basement_hall
    name: 地下室走廊
    within: cora_house
    art: cora_basement_hall
    read_aloud: 楼梯通向一条狭小的走廊，尽头一扇门。嗡嗡声在这里愈发强烈，好像就是从门后发出的。
    keeper: 满是尘土的楼梯井上有脚印（侦查）。
    features: [满是尘土的楼梯, 通往主地下室的门]
    outdoors: false
    ground: building
    views:
    - key: cora_dusty_stairs
      label: 积满尘土的楼梯
      features:
      - 满是尘土的楼梯
      prompt: 通往地下室的窄木楼梯，台阶上积着厚厚的灰尘，下面是一条狭小的走廊和一扇关着的门，门缝里透出一点淡蓝色的光
    looks:
    - when: knows:players:clue:c_footprints
      change: 尘土覆盖的台阶上清楚地印着一串上下往来的脚印
      'on': cora_dusty_stairs
    - when: flag:sign_fs_blue_under_door_1
      change: 门缝底下那一线淡蓝色的光没有了，走廊暗了下来。
  - id: cora_basement
    name: 主地下室
    within: cora_house
    art: cora_basement
    weather: [flicker]
    read_aloud: 中等大小的房间，空气潮湿。所有架子和橱柜都被拉到一边，中间空出一片。整个房间被淡蓝色的光照亮。空地中央，詹姆斯赤裸的身体悬在半空，下面的地上是一个用血涂成的亵渎图案。旁边放着一本古老的书和一个桶。
    keeper: 詹姆斯似乎在呼吸；唯一能看出他意识到处境的迹象，是他的眼神会聚焦到任何叫他名字的人身上，此外无法动弹。到达后不久守卫者下楼（事件 e_guardian）。杂乱的地下室可供躲藏（潜行奖励骰）。关闭大门的办法见守秘人须知。
    features: [悬浮的詹姆斯, 地上的血绘图案, 古老的书, 桶, 拉到一边的架子和橱柜]
    outdoors: false
    ground: building
    looks:
      - when: flag:gate_closed
        change: 蓝光熄灭，地下室只剩昏暗，空地上的人形瘫在血绘图案旁的地上
      - when: knows:players:clue:c_chest_sigil
        change: 他胸口刻着一个血淋淋的图形，和地上的血绘图案一模一样
        'on': basement_floating_body
      - when: knows:players:clue:c_bucket
        change: 桶里装着满满的暗红色血液
        'on': basement_bucket
    views:
    - key: basement_floating_body
      label: 悬在半空的人
      features:
      - 悬浮的詹姆斯
      prompt: 潮湿的地下室被淡蓝色光照亮，一个赤裸消瘦的年轻男子悬浮在半空，身体微微起伏像在呼吸，下方地面上是用血涂成的几何图案
    - key: basement_blood_sigil
      label: 地上的血绘图案
      features:
      - 地上的血绘图案
      prompt: 地下室中间清空的水泥地面上，用暗红的血涂出一个巨大的几何图形，圆、交叉的基准线和锯齿形折线，四周的架子和橱柜被推到墙边，一切笼罩在淡蓝色的光里
    - key: basement_old_book
      label: 图案旁的旧书
      features:
      - 古老的书
      prompt: 血绘图案旁边的地上放着一本古老厚重的书，皮面磨损，书页发黄卷边，被淡蓝色的光照着
    - key: basement_bucket
      label: 图案旁的桶
      features:
      - 桶
      prompt: 血绘图案旁边放着一只旧木桶（或铁皮桶），桶沿上挂着暗红色的干涸痕迹

