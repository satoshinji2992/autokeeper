history:
  - when: 开局前几个月
    text: 凯莱布·莫罗把摩尔家族藏书中的欧几里得手稿卖给詹姆斯，后来又卖给他《缟玛瑙石板》英译本。
    who: [caleb, james]
  - when: 开局前几天
    text: 詹姆斯去了科拉阿姨家，在地下室完成了《缟玛瑙石板》中的仪式，裂隙打开，科拉惨死并被做成门之守卫者。
    who: [james, cora]
    where: cora_house

agendas:
  - npc: hartman
    goals: [让学生守规矩、好好考试]
    steps:
      - id: summon
        text: 被点名的调查员早上来办公室时，冷着脸训诫他们，对詹姆斯的缺席只表示惊讶
        when: flag:hartman_summoned & D2 08:00
        meet: true
        once: true
        source: 原文“在教室”“与哈特曼教授交谈”

mechanics:
  - name: 关闭大门
    runs: 守秘人
    why: 主地下室，门之守卫者袭击期间
    rules: 把詹姆斯拉出图形中央：困难力量检定，多人合力获得一个奖励骰；成功后调查员拉着的部分脱臼或骨折，理智 0/1。毁掉他胸口的图形：开刃武器即可，不锋利的武器需困难成功；攻击无助的詹姆斯理智 0/1D3，意外杀死他（他只剩 3 点生命）理智 1/1D6。任一成功设 gate_closed，守卫者倒下、蓝光消失；詹姆斯死了另设 james_dead。
