  - {a: hartman, b: james, kind: 师生, value: 20, why: 尊重他的才智，却抵触他不守学术程序}
  - {a: holcomb, b: james, kind: 不满, value: -20, why: 他总是逾期不还书}
  - {a: holcomb, b: caleb, kind: 轻视, value: -40, why: 认为这个助手毫无用处}
  - {a: caleb, b: james, kind: 生意, value: 10, why: 詹姆斯是他偷卖藏书的买主}
