locations:
- id: huochezhan
  public: true
  name: 阿诺兹堡火车站
  art: huochezhan
  read_aloud: |
    小站的木站台被行李车磨出了两道白痕，蒸汽从车厢底下散开。站务员把牛奶罐往檐下挪，
    站外街口的小食铺刚开张，窗上蒙着热气。出站的路通往阿诺兹堡镇中心。
  keeper: |
    AutoKeeper 补充的开局地点，调查员刚抵达，尚未拜访托马斯。站务员知道镇上的路，不知道偷书案和失踪事件。
    问路无需检定：穿过镇中心，沿艾尔斯伯里大街一直走，218 号在小镇尽头的公墓旁；步行约四十分钟。
    玩家愿意买早饭、寄存行李、找车或聊天就自然接住；小食铺是站外的日常营生，没有案情线索。
  features:
  - 站务员
  - 时刻表
  - 行李寄存处
  - 站外小食铺
  - 通往镇中心的路
  scene_root: true
  outdoors: true
  ground: street
  looks:
  - when: hour:7-9
    change: 站台边停着一列刚到的早班车，车头还冒着白汽，行李车横在站台中间。
- id: jinboer_jia
  name: 金博尔家
  aliases:
  - 托马斯家
  - 218 号
  art: jinboer_jia
  read_aloud: |
    艾尔斯伯里大街走到头，218 号是一栋 L 形的旧木屋，红褐色的屋顶，门廊的油漆起了皮。
    屋后隔着一道矮墙就是公墓，老树和灌木把墓碑遮得影影绰绰。透过门上的玻璃，看得见一条收拾得很干净的走廊，
    尽头有扇门关着。
  keeper: |
    托马斯已经搬进了除书房之外的所有房间，东西摆满了客厅和卧室，唯独走廊尽头的书房关着。
    他替调查员留的空卧室窗户正对着屋后的公墓。调查员的落脚处就在这里。
    第一次到访时从敲门和认人演起：托马斯先让客人歇脚、问旅途，玩家愿意再安顿行李、谈委托。
    日常寒暄没有检定门槛，不急着把全部调查方向一次说完；跟着玩家问的事展开。
    若调查员找到隧道却没下去、当晚又在熟睡（没有设岗），道格拉斯会来到调查员的房间唤醒他，想和他交谈。
  features:
  - 托马斯·金博尔
  - 客厅
  - 调查员的空卧室
  - 屋后通往公墓的小路
