  - id: shufang
    name: 道格拉斯的书房
    within: jinboer_jia
    art: shufang
    read_aloud: |
      书房里四壁都是书，从地板一直顶到天花板，大小不一、形制各异，从园艺手册到异国游记，什么都有。
      每一本都包着书皮，书脊擦得干干净净——主人显然花了很多心思保养它们。
      一面书架上空出了好几格，像缺了牙。窗下是一张旧书桌，窗外就是公墓的树影。
    keeper: |
      这里是了解失踪叔叔的关键。托马斯很乐意让调查员检查书房和叔叔的所有物。
      书架上少了大约六本书。没有痕迹显示窃贼如何进来；检查窗户的调查员可能发现窗锁年久松动，从外侧用力就能打开。
      搜索整个书房至少要一天，侦查成功找到日记。
      孤注一掷成功：花了更久终于找到，或者托马斯进来问“找到叔叔的日记了吗？我知道它就在这间屋子里”，帮忙指出位置。
      孤注一掷失败：仍然找到日记，但碰倒一摞书、摔碎了一只花瓶之类的精致物件，托马斯很不悦，警告要小心，并说会从报酬里扣 5 美元。
    features: [书架上的空档, 书房窗户, 旧书桌, 藏书, 花瓶]
    exits: [jinboer_jia]
    looks:
    - when: flag:sign_f_mud_on_sill_1
      change: 窗台原有的浅色干土上多了几粒深色湿泥。
  - id: jiefang
    public: true
    travel_minutes: {zhenzhongxin: 15, jinboer_jia: 15}
    name: 艾尔斯伯里大街
    art: jiefang
    read_aloud: |
      街道冷清，梧桐叶子在人行道上打着旋。离墓地最近的只有金博尔家，步行五分钟内另有几所房子，
      窗帘都拉得严严实实。一位穿戴整齐的老妇人挎着篮子，正沿着人行道慢慢走过来。
    keeper: |
      邻居们所知甚少，也没见过任何可疑行迹；提起道格拉斯，有一位邻居记得他是个和蔼的人。
      走动时会遇见老妇人莉拉·奥黛尔。她很看重外表：让调查员在外貌或信用评级中任选其一（取较高者）检定一次，
      只有一次机会；失败的话，她不喜欢调查员的样貌，快步走开。去镇中心从这里走。
    features: [莉拉·奥黛尔, 邻居们, 通往镇中心的路]
    exits: [jinboer_jia, mudi, zhenzhongxin]
  - id: mudi
    name: 公墓
    art: mudi
    read_aloud: |
      墓地周围植被茂盛，但打理得还不错，墓穴与墓碑之间点缀着许多高大的灌木和古老的树木，
      这片墓地显然已经存在好多年了。一条土路弯弯曲曲穿过墓碑。公墓另一头，一个园艺工正弯腰清理杂草，
      听见你走近，他转过身来挥了挥手。
    keeper: |
      守墓人梅洛迪亚斯·杰弗逊在这里干活。先要过魅惑或说服检定他才肯聊；失败可孤注一掷（换做法：
      恭维用魅惑、讲道理用说服、咄咄逼人用恐吓、欺骗用话术），再失败则他发火、赶人、扬土或喊“警察！警察！”跑开，
      之后与他沟通须困难成功。墓地深处是道格拉斯最喜欢的那块墓碑，再往里有几座陵墓。
      夜里若调查员被熏昏，会在晚上醒来，道格拉斯就坐在一旁的墓碑上。
    features: [梅洛迪亚斯·杰弗逊, 杰弗逊的外套口袋, 道格拉斯最喜欢的墓碑, 墓碑周围的地面, 陵墓群]
    exits: [jinboer_jia, jiefang, lingmu]
