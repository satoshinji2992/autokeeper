    change: 陵墓的石门被推开了，门缝里的泥掉了一地，门后是一片漆黑
  - when: knows:players:clue:c_tunnel
    change: 地中央露出一条徒手挖出的隧道口，边缘全是一道道爪痕，往底下黑得看不见底。
