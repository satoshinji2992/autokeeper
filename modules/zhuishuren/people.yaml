npcs:
  - id: zhanwuyuan
    name: 值班站务员
    role: 阿诺兹堡小站的站务员
    look: 制服袖口沾着煤灰，腰间挂着一只旧怀表
    personality: 忙碌、随和，习惯边干活边答话
    voice: 说话实在，指路时爱拿店铺和路口作参照
    goal: 搬完牛奶罐，赶在下一班车来前喝口热咖啡
    knows:
      - 出站沿路到镇中心，再沿艾尔斯伯里大街走，218 号金博尔家在公墓旁，步行约四十分钟
      - 镇中心有图书馆、警察局和《阿诺兹堡广告报》报社
      - 站外小食铺早上卖热咖啡和煎面包，行李可以暂存在站里
    location: huochezhan
    portrait: zhanwuyuan
    called: 搬牛奶罐的站务员
  - id: thomas
    name: 托马斯·金博尔
    role: 委托人，道格拉斯的侄子，房子的继承人
    important: true
    look: 三十来岁，衬衫袖子挽到手肘，梳得一丝不苟的头发，说话时爱搓手
    personality: 客气、务实，有点小气；在意家里的东西，但真心想知道叔叔的下落。对请来的调查员愿意提供力所能及的帮助；担忧与恐惧会影响他的反应，不总能维持体面
    voice: 礼貌的中西部口音，爱说“说实在的”“您尽管查”
    goal: 协助调查员抓住偷书贼，追回书，弄清叔叔是死是活；履行承诺，提供住处、已知情况和合理的调查协助
    knows:
      - 叔叔道格拉斯一年前神秘失踪，没留下任何踪迹
      - 叔叔白发、秃顶、中等身高、戴圆框眼镜
      - 书房架子上少了几本书，他认为是六本，但说不清是哪几本
      - 叔叔写日记，日记就在书房里，但他自己没翻到过，不知道放在哪
      - 他还没报警，丢几本书不够让警察上心
    secrets: []
    lies: []
    clues: [c_shelf_gap]
    location: jinboer_jia
    portrait: thomas
    called: 应门的衬衫男子
  - id: odell
    name: 莉拉·奥黛尔
    role: 附近的老住户
    look: 七十上下，帽子上别着一枚珍珠针，手套一尘不染，挎着一只藤篮
    personality: 体面、挑剔，非常看重人的外表；和气，但不爱跟邋遢的人说话
    voice: 慢条斯理的老派腔调，爱说“亲爱的”“愿上帝保佑你”
    goal: 买完东西回家；顺便打量一下这个陌生人体不体面
    knows:
      - 她在这里住了很久
      - 道格拉斯还住在墓地旁那栋屋子时，她大多数日子都能看见他胳膊下夹着书走向墓地，“他总是在读书”
      - 她好多年没见过老金博尔了
      - 她觉得他侄子继承了那栋房子
    secrets: []
    lies: []
    clues: [c_odell]
    gates:
      c_odell: {skill: 外貌}
    location: jiefang
    called: 挎着篮子的老妇人
    portrait: odell
  - id: jefferson
    name: 梅洛迪亚斯·杰弗逊
    role: 公墓的守墓人，干了二十多年
    look: 58 岁，身高中等，粗人模样，穿着打补丁的衣服，外套口袋里露出一截瓶子
    personality: 好斗、粗鲁；聊开了倒也健谈，提到墓地怪事就闭嘴
    voice: 粗声粗气，句子短，爱用铁铲杵地；不耐烦时说“我还有活要干”
    goal: 干完活，别惹上麻烦，也别去深究墓地里的事
    knows:
      - 过去常在墓地看见道格拉斯·金博尔，那时金博尔常陪他聊天，从天气聊到政治，还讲异国他乡的故事
      - 道格拉斯最喜欢坐在哪块墓碑上读书
    secrets:
      - 最近深夜在道格拉斯常坐的那块墓碑旁见过人影，他相信那是金博尔的鬼魂，太害怕没敢上前
      - 他口袋里揣着一瓶违禁的酒
    lies:
      - 墓地里没什么怪事，我还有许多活要干，得马上走
    clues: [c_jefferson_tomb, c_jefferson_hiding, c_jefferson_ghost]
    gates:
      c_jefferson_tomb: {skill: 魅惑}
      c_jefferson_hiding: {skill: 心理学}
      c_jefferson_ghost: {skill: 恐吓}
    location: mudi
    portrait: jefferson
    called: 清理杂草的园艺工
    attacks:
      - 格斗(斗殴) 30%，伤害 1D3
      - 铁铲 30%，伤害 1D6
    stats: {力量: 45, 体质: 65, 体型: 60, 敏捷: 50, 智力: 70, 外貌: 55, 意志: 60, 教育: 65, 理智: 60, HP: 12, 移动: 8, 斗殴: 30, 铁铲: 30, 闪避: 25, 艺术与手艺(园艺): 80, 信用评级: 32, 恐吓: 45, 机械维修: 55, 博物学: 70}
  - id: jingguan
    name: 值班警官
    role: 阿诺兹堡警察局的值班警官
    look: 四十来岁，制服领口敞着，桌上一杯凉掉的咖啡
    personality: 忙得团团转，不耐烦，但对同行和记者还算客气；爱开冷笑话
    voice: 说话又快又冲，“下一个！”“明天再来”
    goal: 把手头的事打发完
    knows:
      - 这一带已经有一段时间没有入室盗窃报案，最近一桩在一年前，罪犯已落网
      - 被捕者是著名飞贼杰克·“六指”·汤普森，至今还在狱中服刑
      - 最近没有关于怪家伙或长相奇怪的人的报告
      - 公墓在僻静的街区，没有什么特别传闻；六七年前有人报告深夜传出怪声，巡警巡了几周，什么也没看见、听见
      - 道格拉斯·金博尔失踪时发过寻人启事，照片也广为传播，但始终没找到人
    secrets: []
    lies: []
    clues: [c_police_burglary, c_police_cemetery, c_police_douglas]
    gates:
      c_police_burglary: {skill: 法律}
      c_police_cemetery: {skill: 法律}
      c_police_douglas: {skill: 法律}
    location: jingju
    portrait: jingguan
    called: 领口敞开的警官
  - id: bianji
    name: 广告报编辑
    role: 《阿诺兹堡广告报》的编辑，掌管资料室
    look: 五十岁，衬衫袖口别着袖箍，嘴里叼着一支没点的雪茄，手指被墨染黑
    personality: 对同行热情，对外人警惕；嫌人碍事
    voice: 报人腔，“你是哪家报馆的？”“别弄乱我的档案”
    goal: 赶在截稿前把版面排完
    knows:
      - 资料室里有过期旧刊和记者们留下的笔记
    secrets: []
    lies: []
    location: baoshe
    portrait: bianji
    called: 叼雪茄的编辑
  - id: douglas
    name: 道格拉斯·金博尔
    role: 失踪的叔叔，如今是半食尸鬼——那个“偷书贼”
    important: true
    look: 曾经白发秃顶、戴圆框眼镜；如今皮肤像胶皮，双足呈蹄状，脸长出犬科的吻部和巨大的犬齿，手指变成利爪，浑身沾着泥土和霉菌，脸却依然像极了从前的他
    personality: 友善，坚守着残存的人性；彬彬有礼，只要对方礼貌就有问必答
    voice: 含混、带着低低的呜咽，但措辞仍是老派读书人的文雅；说话前会先等对方冷静下来，开口第一句是“你好。”
    goal: 在食尸鬼隧道永久封闭之前，把自己的书取回去，搭起自己的图书馆
    knows:
      - 他厌倦了人类社会的种种俗事，只想随时随地读书、不被打扰，但其他人类一直在侵占他的人生
      - 作为食尸鬼的生活甚合他意：不再需要金钱、不必为晚餐着装、除用餐时间外不必与人相见，白天黑夜随心读书
      - 其他食尸鬼正要关闭这处出入口，今晚是他能回来取书的最后一晚
      - 地下世界有太多可看、可体验的事，他计划依据自己的经历写一本新书
      - 书房那扇窗的锁松了，从外面一用力就开
    secrets:
      - 他不希望侄子知道他还在人世（不如说还没死透）
    lies: []
    clues: [c_douglas_truth]
    location: suidao
    portrait: douglas
    called: 佝偻的人影
    stats: {力量: 55, 体质: 65, 体型: 60, 敏捷: 40, 智力: 80, 意志: 65, 教育: 85, HP: 12, 移动: 5, 爪击: 50, 撕咬: 50, 闪避: 30, 攀爬: 85, 潜行: 70, 跳跃: 75, 聆听: 70, 侦查: 50}
creatures:
  - id: douglas_ghoul
    name: 食尸鬼道格拉斯·金博尔
    npc: douglas  # 这张卡就是道格拉斯打起来的样子：同一个人，同一条命（12 HP）
    pursues: false  # 他只想赶走或打倒拦路的人，带书逃回墓地
    called: 犬脸的佝偻身影
    description: 曾经是人类，如今正转变为皮肤呈胶状、生有蹄状双足、带犬科特征、利爪代替手指的生物；脸仍与道格拉斯惊人地相似
    sanity: 0/1D6
    stats: {力量: 55, 体质: 65, 体型: 60, 敏捷: 40, 智力: 80, 意志: 65, 教育: 85, HP: 12, 移动: 5, 闪避: 30}
    attacks:
      - 每回合 1 次（原文：入门模组在此简化，正常食尸鬼每回合 3 次）
      - 爪击 50% (25/10)，伤害 1D6
      - 撕咬 50% (25/10)，伤害 1D6
    notes: 伤害加值 0，体格 0。枪械伤害减半（向下取整）。HP 降到 0 死亡；只被拳头打时损失 6 点即被击晕。目标只是赶走或打倒拦路的人，然后带书逃回墓地。
  - id: ghouls
    name: 食尸鬼群
    called: 一群犬脸的人形
    pursues: false  # 原文：调查员逃跑，食尸鬼群不追
    description: 几十只皮肤像胶皮、蹄足犬面、身披墓地苔藓的人型生物，说话含混，像呻吟和哭泣，从夜幕中缓缓现身
    sanity: 0/6
    # 原文没给食尸鬼群的数值：攻击按《守秘人规则书》的食尸鬼（每回合 3 次，格斗 40%，1D6+DB，伤害加值 1D4）；整群仍当一个对手
    attacks:
      - 每回合 3 次
      - 爪击 40%，伤害 1D6+DB
    notes: 伤害加值 +1D4，体格 1。枪械和抛射武器伤害减半（向下取整）。数量多到无法对抗：即便调查员击中若干只，也会被淹没、带回地下洞穴。调查员逃跑则它们不追，只带走道格拉斯返回墓地，从此一去不返。
