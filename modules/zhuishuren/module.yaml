  called_name: 调查员喊出了“道格拉斯·金博尔”，人影引他到墓碑旁
  attacked_douglas: 调查员攻击了人影
  douglas_escaped: 道格拉斯躲开或打倒了调查员，带着书逃回墓地
  douglas_down: 道格拉斯被杀死或被击晕
  unmasked: 调查员凑近看清了倒地人影的脸
  recognized: 调查员认出这头食尸鬼正是道格拉斯
  horde_arrived: 几十只食尸鬼从夜幕中现身
  temp_insane: 调查员陷入了临时性疯狂
  asylum: 调查员疯狂昏倒，被送进阿诺兹堡疗养院
  taken_by_ghouls: 调查员与食尸鬼群搏斗，被制服带走
  fled_ghouls: 调查员从食尸鬼群面前逃走
  talked_douglas: 调查员与道格拉斯交谈过，听到了真相
  followed_douglas: 调查员跟随道格拉斯下到了地底
  told_thomas: 调查员把道格拉斯的真相告诉了托马斯
start: jinboer_jia
start_time: D1 09:00
opening: |
  1922 年的阿诺兹堡是个安静的小城。艾尔斯伯里大街走到头，218 号是一栋不大的旧屋，
  屋后隔着一道矮墙就是公墓，高大的灌木和老树把墓碑遮得影影绰绰。
  托马斯·金博尔把你领进一间空卧室，放下你的行李，搓着手说：“书房我一直没动过，都是叔叔的东西。
  您想从哪儿查起都行——邻居、墓地、图书馆、警局、报社，我都可以给您指路。”
locations:
  - id: jinboer_jia
    name: 金博尔家
    art: jinboer_jia
    read_aloud: |
      一栋 L 形的旧木屋，红褐色的屋顶，门廊的油漆起了皮。屋里收拾得井井有条，托马斯的东西摆满了客厅和卧室，
      唯独走廊尽头那扇门关着——那是叔叔的书房。你住的空卧室窗户正对着屋后的公墓。
    keeper: |
      托马斯已经搬进了除书房之外的所有房间。调查员的落脚处就在这里。
      若调查员找到隧道却没下去、当晚又在熟睡（没有设岗），道格拉斯会来到调查员的房间唤醒他，想和他交谈。
    features: [托马斯·金博尔, 客厅, 调查员的空卧室, 屋后通往公墓的小路]
    exits: [shufang, jiefang, mudi]
  - id: shufang
    name: 道格拉斯的书房
    art: shufang
    read_aloud: |
      书房里四壁都是书，从地板一直顶到天花板，大小不一、形制各异，从园艺手册到异国游记，什么都有。
      每一本都包着书皮，书脊擦得干干净净——主人显然花了很多心思保养它们。
      一面书架上空出了好几格，像缺了牙。窗下是一张旧书桌，窗外就是公墓的树影。
    keeper: |
      这里是了解失踪叔叔的关键。托马斯很乐意让调查员检查书房和叔叔的所有物。
      书架上少了大约六本书。没有痕迹显示窃贼如何进来；检查窗户的调查员可能发现窗锁年久松动，从外侧用力就能打开。
      搜索整个书房至少要一天，侦查成功找到日记。
      孤注一掷成功：花了更久终于找到，或者托马斯进来问“找到叔叔的日记了吗？我知道它就在这间屋子里”，帮忙指出位置。
      孤注一掷失败：仍然找到日记，但碰倒一摞书、摔碎了一只花瓶之类的精致物件，托马斯很不悦，警告要小心，并说会从报酬里扣 5 美元。
    features: [书架上的空档, 书房窗户, 旧书桌, 藏书, 花瓶]
    exits: [jinboer_jia]
  - id: jiefang
    name: 艾尔斯伯里大街
    art: jiefang
    read_aloud: |
      街道冷清，梧桐叶子在人行道上打着旋。离墓地最近的只有金博尔家，步行五分钟内另有几所房子，
      窗帘都拉得严严实实。一位穿戴整齐的老妇人挎着篮子，正沿着人行道慢慢走过来。
    keeper: |
      邻居们所知甚少，也没见过任何可疑行迹；提起道格拉斯，有一位邻居记得他是个和蔼的人。
      走动时会遇见老妇人莉拉·奥黛尔。她很看重外表：让调查员在外貌或信用评级中任选其一（取较高者）检定一次，
      只有一次机会；失败的话，她不喜欢调查员的样貌，快步走开。去镇中心从这里走。
    features: [莉拉·奥黛尔, 邻居们, 通往镇中心的路]
    exits: [jinboer_jia, mudi, zhenzhongxin]
  - id: mudi
    name: 公墓
    art: mudi
    read_aloud: |
      墓地周围植被茂盛，但打理得还不错，墓穴与墓碑之间点缀着许多高大的灌木和古老的树木，
      这片墓地显然已经存在好多年了。一条土路弯弯曲曲穿过墓碑。公墓另一头，一个园艺工正弯腰清理杂草，
      听见你走近，他转过身来挥了挥手。
    keeper: |
      守墓人梅洛迪亚斯·杰弗逊在这里干活。先要过魅惑或说服检定他才肯聊；失败可孤注一掷（换做法：
      恭维用魅惑、讲道理用说服、咄咄逼人用恐吓、欺骗用话术），再失败则他发火、赶人、扬土或喊“警察！警察！”跑开，
      之后与他沟通须困难成功。墓地深处是道格拉斯最喜欢的那块墓碑，再往里有几座陵墓。
      夜里若调查员被熏昏，会在晚上醒来，道格拉斯就坐在一旁的墓碑上。
    features: [梅洛迪亚斯·杰弗逊, 杰弗逊的外套口袋, 道格拉斯最喜欢的墓碑, 墓碑周围的地面, 陵墓群]
    exits: [jinboer_jia, jiefang, lingmu]
  - id: lingmu
    name: 墓地深处的陵墓
    art: lingmu
    read_aloud: |
      一座半埋在土坡里的石砌陵墓，门楣上的字早已被苔藓吃掉。石门紧闭，门缝里塞满了泥，
      门前的泥地上踩得乱七八糟。
    keeper: |
      墓碑旁的蹄状足迹一路通到这里。开门要过力量检定；失败可取铲子或其他工具撬门再试（孤注一掷）。
      门一开就涌出一股积蓄已久的可怕腐臭：调查员若没有特别说明要屏住呼吸，就会被熏昏（转“调查员陷入昏迷”，晚上醒来时道格拉斯坐在一旁）。
      否则他会在里面找到一条徒“手”挖掘、通向地底的隧道。下去转“探索隧道网”；不下去则当晚道格拉斯会出来进入金博尔家。
    features: [石门, 门前的足迹, 陵墓内部, 隧道口]
    exits: [mudi, suidao]
  - id: suidao
    name: 食尸鬼隧道网
    art: suidao
    read_aloud: |
      泥土通道又低又窄，四壁留着一道道爪痕，空气又湿又冷，带着一股甜腻的腐味。
      岔路一条接一条，似乎铺满了整个公墓的地下。手电的光只能照出前面几步。
    keeper: |
      让调查员做一次导航检定，看他是否迷失方向；失败则兜兜转转直到精疲力竭，必须停下休息。
      无论哪种情况，时间都已流逝，夜晚正要降临。在找路返回地面的途中，他会与道格拉斯·金博尔不期而遇
      （照“如果调查员试图和人影交谈”处理，信息不变，只是前提换成在隧道里相遇）。
    features: [爪痕累累的土壁, 岔路, 通往地面的出口]
    exits: [lingmu]
  - id: zhenzhongxin
    name: 阿诺兹堡镇中心
    art: zhenzhongxin
    read_aloud: |
      主街两旁是砖砌的店面，汽车和马车挤在一起。街角有图书馆的石阶，对面是警察局，
      再过去一点，《阿诺兹堡广告报》的招牌挂在二楼窗外。
    keeper: |
      想弄酒的话在这里找：知识检定（= 教育）成功，2 美元买到一品脱烈酒；失败则过幸运检定避免被捕，96–00 必被捕，
      在牢里关一夜，第二天早上无罪释放。
    features: [图书馆, 警察局, 广告报报社, 私酒门路]
    exits: [jiefang, tushuguan, jingju, baoshe]
  - id: tushuguan
    name: 阿诺兹堡公共图书馆
    art: tushuguan
    read_aloud: |
      图书馆不大，长桌上方吊着绿罩台灯，旧报纸夹在木杆上挂成一排。图书管理员从眼镜上方瞥了你一眼，示意小声。
    keeper: |
      图书馆使用成功会把调查员引向《阿诺兹堡广告报》的一篇旧报道。
      失败可孤注一掷（花更长时间，或请管理员帮忙）；孤注一掷再失败，依然找到信息，但错过闭馆时间被锁在馆里，
      要等到第二天早上八点管理员来开门。他可以用机械维修或锁匠开正门的锁、用力量撞破门窗，
      或视情况给一次幸运检定，看巡逻警察是否听见呼救来帮他脱困。
    features: [旧报合订本, 图书管理员, 阅览长桌]
    exits: [zhenzhongxin]
  - id: jingju
    name: 阿诺兹堡警察局
    art: jingju
    read_aloud: |
      值班室里电话铃响个不停，墙上贴满了通缉令和寻人启事。值班警官一手按着话筒，一手冲你比划：“有事快说。”
    keeper: |
      私家侦探、记者，或之前与警方有“专业”往来的调查员，可直接获得信息；其他人须过法律、魅惑或说服检定，
      失败的话警官太忙，打发他们明天再来。根据问话内容告诉他们对应的信息。
    features: [值班警官, 寻人启事墙]
    exits: [zhenzhongxin]
  - id: baoshe
    name: 《阿诺兹堡广告报》报社
    art: baoshe
    read_aloud: |
      楼下印刷机轰隆作响，楼上的编辑部里烟雾缭绕。走廊尽头一扇门上写着“资料室”，里面堆满了一捆捆旧刊。
    keeper: |
      记者或作家可以直接查看旧刊；其他职业须过魅惑、说服或话术检定说服编辑放行。进了资料室再做图书馆使用：
      普通成功花三小时、困难成功一小时、极难成功只要几分钟；失败可孤注一掷（后果同图书馆，也可自行设计）。
      若调查员在图书馆没找到那篇旧报道，也可以让他在这里找到——剪报就夹在沃德女士的那份笔记上。
    features: [编辑, 资料室, 旧刊, 记者的笔记]
    exits: [zhenzhongxin]
npcs:
  - id: thomas
    name: 托马斯·金博尔
    role: 委托人，道格拉斯的侄子，房子的继承人
