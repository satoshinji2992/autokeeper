start: huochezhan
start_time: D1 08:15
opening: |
  1922 年，早班火车在阿诺兹堡停下。你带着行李踏上站台，身后的车轮还在吱呀作响。
  托马斯·金博尔的信放在你衣袋里，信封上的地址是艾尔斯伯里大街 218 号；他愿意为找书的事付十美元，
  也答应替你留一间房。那栋屋子在小镇尽头，紧挨着公墓，眼下还得走上一段路。
  站外飘来煎面包的香气。一名站务员正把两只牛奶罐搬下手推车，抬头看见你手里的信封。
