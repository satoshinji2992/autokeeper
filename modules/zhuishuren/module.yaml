id: zhuishuren
title: 追书人
subtitle: 一桩偷书案，一位失踪一年的叔叔
system: CoC7
era: 1922 年，美国禁酒令时期
setting: 密歇根州阿诺兹堡市，艾尔斯伯里大街 218 号的金博尔家及其毗邻的公墓
players: 1-2 人（为一名守秘人加一名调查员设计，可容纳两名）
duration: 一次游戏聚会（约 2–4 小时）
source: 《克苏鲁的呼唤》第七版入门套组第三卷《追书人》（中文版第 7–17 页）
license: 原书版权归出版方所有，仅供本地个人跑团使用
hook: |
  密歇根州阿诺兹堡一位名叫托马斯·金博尔的人联系了你——他从一位共同的熟人那里听说了你
  （或者，他联系了未解之谜探索协会 SEU，协会派你前去协助）。
  他家里似乎遭了贼，被盗的是一些他叔叔最喜欢的书。这个谜团有些不同寻常，因为这位叔叔早在一年前
  就神秘失踪了，没有留下任何踪迹。托马斯希望你找到偷书的贼人，尽可能追回这些书，
  并调查他的叔叔道格拉斯·金博尔的去向，以及他是否尚在人世。
  他愿意承担各类花销，并支付整整 10 美元作为报酬（大约相当于如今的 240 美金）。
  他还没有报警——丢几本书，不足以让警方投入资源。
  他这样描述叔叔：“白发，秃顶，中等身高，戴着圆框眼镜。”他请你住进家中空置的房间，作为调查期间的落脚处。
truth: |
  道格拉斯·金博尔一生中大部分时间住在艾尔斯伯里大街 218 号的小屋里，是个离群索居的中年人，书籍和阅读是他生命的全部意义。
  他养成了在家附近的坟地读书的习惯，总坐在一块特定的低矮墓碑上，一坐就是若干小时。
  某个满月之夜，墓中一扇门嘎吱打开，一头奇怪的生物（食尸鬼）探出头来，发出轻轻的叫声（“咪噗”）。
  这段奇妙的友谊持续了五年。直到有一天晚上，道格拉斯跟随他的新朋友走进了食尸鬼的昏暗世界，从此满足地定居在那里。
  一年过后，他的样貌起了变化，饮食口味大异于常人，读书时间也挪到了晚上——他正在变成食尸鬼。
  同一批书无法永远满足一位爱书人。一天晚上，道格拉斯从书房那扇窗锁松动的窗户闯入旧居（如今归侄子托马斯所有），
  取回了大约六本他心爱的书。如今他夜里坐在那块低矮的墓碑上静静读书，并计划去取回更多藏书。
  其他食尸鬼正要关闭这处出入口、废弃这片墓地；调查员撞见他取书的那一夜，就是他能回来取书的最后一晚。
  他想在隧道永久封闭之前搭起自己的图书馆，还打算依据自己在地下的经历写一本新书。
  他并无恶意，只想赶走或打倒拦他的人，带着书逃回墓地。
keeper_notes: |
  起始：调查员已住进托马斯家的一间空卧室。询问玩家想从哪里开始，可提示这几个方向：
  询问附近居民、查看墓地周边、在图书馆调查本地消息、询问警方、查阅《阿诺兹堡广告报》旧刊、查看金博尔家（书房）。顺序随意。
  线索应足够让调查员把注意力集中到金博尔家和墓地上。之后可以采取的行动有三种：检查道格拉斯最喜欢的墓碑、
  调查墓地中的隧道、监视屋子或墓地。若玩家没有想到监视，托马斯会请调查员说说进展，并建议监视屋子，抓窃贼现行。
  孤注一掷：首次检定失败、玩家要再努力时，让他说明换了什么做法，并在掷骰前讲清失败后果。
  两名调查员：需要检定时两人都可尝试；建议让他们待在一起，若坚持分头行动，就一次推进一个场景。
  人影的真身（道格拉斯）先不要告诉玩家。调查员如果在任何时刻攻击道格拉斯，转入战斗：
  调查员先手；斗殴对道格拉斯闪避 30% 比成功等级，调查员更高则命中 1D3，书掉在地上；否则落空，他冲向墓地。
  用手枪时：道格拉斯先掷闪避（寻找掩体），成功则调查员的射击(手枪)带一枚惩罚骰；命中 1D10，枪伤对他减半（向下取整）。
  他没逃掉就在书掉落后反击：爪击 50%，调查员选闪避（成功等级更高或相同即躲开）或反击（斗殴，须更高）；
  被击中扣 1D6 HP 并被打倒，他捡起书逃进墓地。道格拉斯共 12 HP；降到 0 死亡；只用拳头时损失 6 点即被击晕。
  单次损失 5 点或更多理智时要做智力检定：成功则陷入临时性疯狂（本模组假定在 1D10 轮中纵声尖叫），失败则震惊但保持理智。
  用水泥封闭坟墓对食尸鬼没有影响，它们本就要废弃这处墓地。是否把真相告诉托马斯由玩家决定。
  禁酒令：在镇上找酒须过知识检定（= 教育），成功则 2 美元一品脱烈酒；失败则过幸运检定避免被捕，掷出 96–00 必被捕，
  被捕者在牢里关一夜、挨一顿训，第二天早上无罪释放。
flags:
