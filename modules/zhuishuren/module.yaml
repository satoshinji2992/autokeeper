id: zhuishuren
title: 追书人
subtitle: 阿诺兹堡的偷书案
system: CoC7
era: 1922 年
setting: 美国密歇根州阿诺兹堡，公墓旁的金博尔家
players: 1-2 人
duration: 约 2-4 小时
source: 《追书人》，选自《克苏鲁的呼唤》第七版入门套组第三卷
