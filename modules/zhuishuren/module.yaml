  has_liquor: 调查员弄到了一瓶私酒，可以用来贿赂杰弗逊
  jailed: 买酒时被警察抓走，要在牢房里过一夜
  locked_in_library: 图书馆检定孤注一掷失败，调查员被锁在图书馆里过夜
  broke_vase: 搜书房的孤注一掷失败，打碎了贵重物件，托马斯要扣 5 美元报酬
  window_locked: 调查员锁上或加固了书房窗户
  tomb_opened: 陵墓的门被打开了
  fainted: 调查员没屏住呼吸，被陵墓的恶臭熏昏
  tunnel_found: 调查员在陵墓里找到了通向地底的隧道
  in_tunnels: 调查员下到了隧道网里
  tunnel_ignored: 调查员找到隧道但没有下去
  watching: 调查员在金博尔家和（或）公墓外设岗监视
