clues:
  - id: c_neighbor
    title: 邻居的印象
    where: jiefang
    feature: 邻居们
    points_to: [k_reader]
    text: 附近的邻居们所知甚少，也没见过可疑的人。有一位邻居记得道格拉斯·金博尔：“是个和蔼的人。”
  - id: c_odell
    title: 奥黛尔夫人的回忆
    where: jiefang
    feature: 莉拉·奥黛尔
    npc: odell
    points_to: [k_reader]
    text: |
      奥黛尔夫人在这里住了很久。她记得道格拉斯·金博尔还住在墓地旁那栋屋子时，大多数日子都胳膊下夹着本书走向墓地。
      “他总是在读书。”她好多年没见过他了。“他是过世了吗？我想他侄子继承了那栋房子。”
  - id: c_jefferson_tomb
    title: 道格拉斯最喜欢的墓碑
    where: mudi
    feature: 梅洛迪亚斯·杰弗逊
    npc: jefferson
    core: true
    points_to: [k_reader]
    text: |
      守墓人想念道格拉斯：那时金博尔常陪他聊天，从天气聊到政治，还讲异国他乡的故事。
      他指给你看一块低矮的旧墓碑——道格拉斯过去读书时常坐的就是那一块。
  - id: c_jefferson_hiding
    title: 守墓人有所隐瞒
    where: mudi
    feature: 梅洛迪亚斯·杰弗逊
    npc: jefferson
    points_to: [k_figure]
    text: 一问起墓地里的怪事或可疑的人，杰弗逊就收住话头，推说活多要走。他知道的比他说的更多。
  - id: c_flask
    title: 外套口袋里的酒瓶
    where: mudi
    feature: 杰弗逊的外套口袋
    check: {skill: 侦查}
    points_to: [k_figure]
    text: 杰弗逊的外套口袋里微微露出一截瓶子——禁酒令下，那多半是酒。这可以拿来要挟他，或者以后带瓶酒来贿赂他。
  - id: c_jefferson_ghost
    title: 墓碑旁的人影
    where: mudi
    feature: 梅洛迪亚斯·杰弗逊
    npc: jefferson
    points_to: [k_figure]
    text: |
      杰弗逊终于承认：最近深夜，他在道格拉斯·金博尔以前常坐的那块墓碑旁见过人影。
      他相信那是金博尔的鬼魂，太害怕了，没敢上前。“这类事最好别去深究。”他言尽于此。
  - id: c_library_article
    title: 十多年前的旧报道
    where: tushuguan
    feature: 旧报合订本
    check: {skill: 图书馆使用}
    handout: h_article
    points_to: [k_creatures]
    text: |
      一篇十多年前《阿诺兹堡广告报》的报道：有人声称看见一群明显未着寸缕的人在毗邻金博尔宅的墓地里狂欢嬉戏。
      警察赶到搜遍公墓，始终没找到这批怪人，但形状怪异的脚印无言地证明他们确实存在过。
  - id: c_police_burglary
    title: 警方：附近的入室盗窃
    where: jingju
    feature: 值班警官
    npc: jingguan
    points_to: [k_not_burglar]
    text: |
      这一带已经有一段时间没有入室盗窃报案了。最近一桩在一年前，罪犯杰克·“六指”·汤普森是个著名飞贼，已落网，至今还在狱中服刑。
      最近也没有关于怪家伙或长相奇怪的人的报告。
  - id: c_police_cemetery
    title: 警方：公墓的情况
    where: jingju
    feature: 值班警官
    npc: jingguan
    points_to: [k_creatures]
    text: |
      公墓在僻静的街区，没什么特别的传闻。大约六七年前，有人报告那里深夜传出怪声，巡警把公墓纳入巡逻好几周，
      什么也没看见、没听见。“那里安静得就像是座坟墓！”警官打趣道。
  - id: c_police_douglas
    title: 警方：失踪的道格拉斯
    where: jingju
    feature: 值班警官
    npc: jingguan
    points_to: [k_not_burglar]
    text: 警官记得道格拉斯·金博尔失踪时发过寻人启事，照片也广为传播，但始终没有找到这个人。
  - id: c_ward_notes
    title: 希尔达·沃德的陈述
    where: baoshe
    feature: 资料室里记者的笔记
    check: {skill: 图书馆使用}
    npc: bianji
    handout: h_ward
    points_to: [k_creatures]
    text: |
      一位记者留下的笔记，记着一段从未发表的陈述，来自 64 岁、患失眠症的邻居希尔达·沃德女士：
      二十多年来她时常看见“魔鬼的子嗣”出没于墓地附近——轮廓像人，却有犬类的特征，足部呈蹄状，浑身沾满腐烂的泥土。
      记者写道，沃德女士已搬去底特律，其他邻居谁也不曾见过、或不承认见过这些东西。
  - id: c_shelf_gap
    title: 书架上的空档
    where: shufang
    feature: 书架上的空档
    npc: thomas
    core: true
    points_to: [k_not_burglar]
    text: 书架上少了好几本书（托马斯认为是六本），空档很显眼。托马斯说不清丢的是哪几本。屋里其他值钱的东西一样没少。
  - id: c_window
    title: 松动的窗锁
    where: shufang
    feature: 书房窗户
    points_to: [k_not_burglar]
    text: 书房窗户的锁因为年久已经松了。从外侧用足力气，就能轻松把这扇窗打开——而窗外正对着公墓。
  - id: c_diary
    title: 道格拉斯的日记
    where: shufang
    feature: 旧书桌
    check: {skill: 侦查}
    core: true
    handout: h_diary
    points_to: [k_underground, k_joined]
    text: |
      一本道格拉斯·金博尔的日记。最后一条写于他失踪的前一天，隐晦地提到他已经“做出决定”，要加入“我在地下的朋友们”。
      更早的条目似乎暗示公墓地下有一个隧道网络，里面住着他晚上在墓地周边看见的神秘“生物”。
  - id: c_footprints
    title: 墓碑旁的怪足迹
    where: mudi
    feature: 墓碑周围的地面
    check: {skill: 侦查}
    points_to: [k_tunnel, k_creatures]
    text: |
      那块旧墓碑饱经风雨，表面光滑，墓主身份已无法辨认。墓碑周围有若干奇怪的足迹，
      像是脚趾处呈偶蹄状的成年人赤足留下的。足迹穿过墓地，通向一座陵墓的门前。（追踪检定也可发现）
  - id: c_tunnel
    title: 陵墓里的隧道
    where: lingmu
    feature: 陵墓内部
    check: {skill: 力量}
    points_to: [k_tunnel, k_underground]
    text: 石门打开，一股积蓄已久的可怕腐臭扑面而来。陵墓里有一条徒“手”挖掘、通向地底的隧道。
  - id: c_douglas_truth
    title: 道格拉斯的自白
    where: mudi
    feature: 道格拉斯最喜欢的墓碑
    npc: douglas
    core: true
    sanity: 1D4/1D4
    points_to: [k_ghoul, k_last_night, k_joined]
    text: |
      他说，他只是厌倦了人类社会的种种俗事。他唯一的诉求是随时随地读书、不被打扰，可其他人一直在侵占他的人生。
      作为食尸鬼的生活甚合他意：不再需要钱，不必为晚餐打扮，除了用餐时间不必与人相见，白天黑夜想读就读。
      但其他食尸鬼正要关闭这处出入口，今晚是他能回来取书的最后一晚。地下有太多可看、可体验的事，他打算据此写一本新书。
      他请你不要告诉他的侄子，他还在人世（不如说，还没死透）。
      （听取这令人不快的真相损失 1D4 理智；克苏鲁神话技能 +3%）
  - id: c_unmasked
    title: 人影的脸
    where: jinboer_jia
    feature: 倒地的人影
    sanity: 0/1D6
    points_to: [k_ghoul]
    text: |
      一头丑陋的人型生物，浑身赤裸，满身结块的泥土和霉菌，长着野兽般的脸和巨大的犬齿，本该是鼻子的地方是犬科一样的吻状突起。
      最令人惊恐的是——它的脸与道格拉斯·金博尔惊人地相似。
conclusions:
  - id: k_reader
    text: 道格拉斯生前总在墓地里一块特定的低矮墓碑上读书
  - id: k_creatures
    text: 多年来墓地一带一直有犬面蹄足、浑身泥土的怪人出没
  - id: k_not_burglar
    text: 偷书的不是寻常窃贼：只拿了道格拉斯的书，从朝向公墓的书房窗户进出
  - id: k_figure
    text: 最近深夜有人影在道格拉斯最喜欢的墓碑旁出没
  - id: k_underground
    text: 公墓地下有隧道网，住着道格拉斯所说的“地下的朋友们”
  - id: k_joined
    text: 道格拉斯是自己“做出决定”，去地下加入了那些生物
  - id: k_tunnel
    text: 墓碑旁的蹄状足迹通向一座陵墓，陵墓里有挖向地底的隧道
  - id: k_ghoul
    text: 偷书贼就是正在变成食尸鬼的道格拉斯·金博尔本人
  - id: k_last_night
    text: 食尸鬼们要封闭这处出入口，道格拉斯不会再回来
handouts:
  - id: h_diary
    title: 道格拉斯·金博尔的日记（节选）
    kind: 日记
    text: |
      （AutoKeeper 依原文大意补写）

      ……又是满月。我照旧坐在那块老碑上读书，读到看不清字。那扇门又开了，我的朋友探出头来，轻轻叫了一声。
      它们住在下面——比我想的深得多，也大得多。它说，整片墓地底下都是路。

      ……它们不问我挣多少钱，不问我为什么不结婚，不问我为什么总是一个人。它们只问我今天读了什么。

      （最后一条，失踪前一天）
      我已经做出决定。明晚，我要去加入我在地下的朋友们。书房的书，我会想念的。
  - id: h_article
    title: 《阿诺兹堡广告报》旧报道
    kind: 报纸
    text: |
      （AutoKeeper 依原文大意补写）
      【本报讯】昨夜有居民报告，在艾尔斯伯里大街金博尔宅毗邻的公墓中，看见一群明显未着寸缕之人狂欢嬉戏。
      警员接报赶到并搜索了整片公墓，未能找到任何人。现场仅留下若干形状怪异的脚印。
  - id: h_ward
    title: 记者笔记：希尔达·沃德的陈述（未发表）
    kind: 笔记
    text: |
      （AutoKeeper 依原文大意补写）
      受访人：希尔达·沃德女士，64 岁，墓地附近住户，长年失眠。
      “二十多年了，我夜里睡不着，总看见它们——魔鬼的子嗣，在墓地附近转悠。样子像人，
      可脸像狗，脚是蹄子，浑身都是烂泥。”
      附记：沃德女士已经搬去底特律市，而其他哪位邻居谁也不曾见过，或者承认曾见过希尔达所谓的“魔鬼子嗣”。
creatures:
  - id: douglas_ghoul
    name: 食尸鬼道格拉斯·金博尔
    description: 曾经是人类，如今正转变为皮肤呈胶状、生有蹄状双足、带犬科特征、利爪代替手指的生物；脸仍与道格拉斯惊人地相似
    sanity: 0/1D6
    stats: {力量: 55, 体质: 65, 体型: 60, 敏捷: 40, 智力: 80, 意志: 65, 教育: 85, HP: 12, 移动: 5, 闪避: 30}
    attacks:
      - 每回合 1 次（入门模组简化，正常食尸鬼每回合 3 次）
      - 爪击 50% (25/10)，伤害 1D6
      - 撕咬 50% (25/10)，伤害 1D6
    notes: 伤害加值 0，体格 0。枪械伤害减半（向下取整）。HP 降到 0 死亡；只被拳头打时损失 6 点即被击晕。目标只是赶走或打倒拦路的人，然后带书逃回墓地。
  - id: ghouls
    name: 食尸鬼群
    description: 几十只皮肤像胶皮、蹄足犬面、身披墓地苔藓的人型生物，说话含混，像呻吟和哭泣，从夜幕中缓缓现身
    sanity: 0/6
    notes: 数量多到无法对抗：即便调查员击中若干只，也会被淹没、带回地下洞穴。调查员逃跑则它们不追，只带走道格拉斯返回墓地，从此一去不返。
events:
  - id: e_thomas_suggests
    title: 托马斯的建议
    when: D2 18:00
    text: |
      若调查员到这时还没想到监视屋子或墓地，托马斯会请他们说明一下迄今为止发现了什么，并在谈话中建议监视屋子，
      万一窃贼再来书房偷书，就能抓个现行。（时间点为 AutoKeeper 补充，可视进度提前或推后）
    read_aloud: 晚饭后，托马斯给你倒了杯咖啡：“说实在的，查到哪一步了？要不……今晚咱们守着书房，看那贼还来不来？”
    sets: []
  - id: e_jailed
    title: 牢房里的一夜
    when: flag:jailed
    move_to: jingju
    text: 调查员因找私酒被捕，整晚关在牢房里，挨一顿严肃训话，第二天早晨无罪释放。
    read_aloud: 铁门咣当一声关上。隔壁的醉汉打起了呼噜。
    sets: []
  - id: e_locked_in
    title: 被锁在图书馆
    when: flag:locked_in_library
    move_to: tushuguan
    text: |
      调查员找到了那篇报道，但错过闭馆，被锁在馆里，要到第二天早上八点管理员来开门才能出去。
      可用机械维修或锁匠开正门，用力量撞破门窗，或给一次幸运检定看巡逻警察是否听见呼救。
    read_aloud: 你抬起头，台灯一盏一盏都灭了，大门那边传来钥匙转动的声音——然后是一片寂静。
    sets: []
  - id: e_fainted
    title: 墓碑上的身影
    when: flag:fainted
    move_to: mudi
    text: 被恶臭熏昏的调查员在晚上苏醒，道格拉斯就坐在一旁的墓碑上。照“如果调查员试图和人影交谈”处理。
    read_aloud: 你在冰冷的草地上醒来，天已经黑透了。月光下，旁边那块矮墓碑上坐着一个人，膝上摊着一本书。
    sanity: 0/1D4
    sets: []
  - id: e_tunnel_maze
    title: 迷宫中的相遇
    when: visit:suidao
    text: |
      导航检定决定是否迷路；失败则兜转到精疲力竭必须休息。无论如何，时间流逝，夜晚降临。
      调查员在返回地面途中与道格拉斯·金博尔不期而遇（照“如果调查员试图和人影交谈”处理）。
    read_aloud: 手电的光圈里，前方拐角处有什么东西停住了。它抱着一摞书，慢慢转过头来。
    sanity: 0/1D4
    sets: []
  - id: e_night_visit
    title: 深夜来客
    when: flag:tunnel_ignored
    move_to: jinboer_jia
    text: |
      调查员找到隧道却没下去，当晚道格拉斯会来到地面进入金博尔家。若调查员设岗监视，转“监视屋子或墓地”；
      若调查员正在熟睡，道格拉斯会来到他的房间唤醒他，因为他想和调查员交谈。
    read_aloud: 有什么东西轻轻碰了碰你的肩膀。你睁开眼，床边站着一个弯腰的黑影，一股泥土味。“你好。”
    sanity: 0/1D4
    sets: []
  - id: e_figure
    title: 离开公墓的人影
    when: flag:watching
    text: |
      设岗监视时，调查员每晚做一次幸运检定。成功的那一夜，一条人影离开公墓，径直走向金博尔宅，从书房窗户进屋；
      若窗户被锁上，它会用肩膀撞开，顶坏木条、撞碎玻璃，响动可能惊醒熟睡的调查员。
      几分钟后它满载着书本重新现身，返回公墓。调查员若正面拦截、追赶或攻击，它会试图带着书逃进墓地。
      只是大声呼喊，它最多回头瞥一眼；喊出“道格拉斯·金博尔”，它会停顿一下，再缓缓走向墓地，像是希望调查员跟上。
    read_aloud: 午夜过后，墓地那边的树影动了一下。一个佝偻的身影翻过矮墙，径直朝书房的窗户走来。
    sets: [figure_seen]
  - id: e_hello
    title: “你好。”
    when: flag:called_name
    move_to: mudi
    text: |
      人影走到道格拉斯最喜欢的墓碑前，高坐其上，开口说：“你好。”调查员看清这个食尸鬼般的人形、认出他就是道格拉斯·金博尔，
      须过理智检定，失败损失 1D4 并发出一声尖叫（强制行动）。道格拉斯等他冷静下来，之后回答任何礼貌的问题。
      他说完后矮身钻进陵墓、下到隧道，拖动一块巨大石板封住入口。调查员若想跟随他去地下，可以，但也会从此失踪。
    read_aloud: 那身影在矮墓碑上坐下，把书摞在膝头，抬起一张不该属于人的脸。圆框眼镜的位置上，是一双温和的眼睛。“你好。”
    sanity: 0/1D4
    sets: [talked_douglas]
  - id: e_unmasked
    title: 熟悉的脸
    when: flag:douglas_down
    text: |
      调查员杀死或击晕人影后凑近观察它的脸，要做两次理智检定。第一次（遭遇食尸鬼的震惊）：成功无损失，
      失败失去 1D6 并做一个守秘人决定的强制动作（扔下武器或手电、放声尖叫）。随后进入“认出道格拉斯”的第二次检定。
    sanity: 0/1D6
    sets: [unmasked]
  - id: e_recognized
    title: 是他
    when: flag:unmasked
    text: 第二次理智检定（意识到这头食尸鬼正是失踪的道格拉斯）：成功损失 1 点，失败损失 1D4 并做强制动作（如尖叫）。
    sanity: 1/1D4
    sets: [recognized]
  - id: e_horde
    title: 细碎的脚步声
    when: flag:recognized
    text: |
      调查员站在死去或昏迷的道格拉斯身旁，听见周围传来细碎的脚步声，几十只食尸鬼从夜幕中缓缓现身逼近，再做一次理智检定。
      失败：失去 6 点，须做智力检定；智力成功则陷入临时性疯狂，尖叫后昏倒——进入“疗养院”结局。
      理智成功（或智力失败、震惊但保持理智）：告诉玩家一群食尸鬼正扑向他，问他怎么做。搏斗或开枪会被数量淹没、带走（“人间蒸发”）；
      逃跑则它们不追，带走道格拉斯返回墓地（“空墓”）。
    read_aloud: 四周的灌木里响起细碎的脚步声，一下，又一下，越来越多。月光里，一张又一张犬一样的脸从墓碑后面探了出来。
    sanity: 0/6
    sets: [horde_arrived]
endings:
  - id: asylum
    title: 疗养院
    condition: flag:asylum
    text: |
      一段时间之后，你在阿诺兹堡疗养院醒来。你被发现时正昏迷不醒，周围没有任何食尸鬼或道格拉斯·金博尔留下的痕迹。
      托马斯听到一声尖叫，找到了正语无伦次地叫嚷着墓地里有一群怪物的你，叫了救护车。你在疗养院享受了一周的护理。
      此后再也没人闯入金博尔家，一切归于平静。托马斯认为你一定是赶走了那个窃贼，很乐意为这出色的工作支付酬金。
      是否把叔叔的真相告诉他，由你决定。
    reward: 托马斯支付 10 美元（损坏过贵重物品则减 5 美元）；曾陷入临时性疯狂，克苏鲁神话 +5%；为用过的技能做成长检定
  - id: vanished
    title: 人间蒸发
    condition: flag:taken_by_ghouls
    text: |
      你挥拳、开枪，打中了一只、两只——可它们太多了。无数只胶皮般的手把你按倒在泥里。
      你被带回食尸鬼的地下洞穴，从此人间蒸发。
    reward: 无（调查员失踪）
  - id: below
    title: 地下的图书馆
    condition: flag:followed_douglas
    text: |
      你跟着道格拉斯矮身钻进陵墓，石板在身后轰然合拢。地下有太多可看、可体验的事。
      地面上的人再也没有见过你——在《克苏鲁的呼唤》里，有时就连调查员自己都会失踪。
    reward: 无（调查员从外界失踪）
  - id: farewell
    title: 最后一晚
    condition: flag:talked_douglas
    text: |
      道格拉斯说完，矮身爬进陵墓，下到隧道之中，最后拖动一块巨大的石板封住了入口。
      食尸鬼们封闭了这处隧道，一去不返。托马斯·金博尔又可以安然入睡，不用担心再有盗窃发生。
      是否把叔叔的真相告诉他，由你决定。
    reward: 听取真相时损失 1D4 理智、克苏鲁神话 +3%；得知它不会再回来，恢复 1D6 理智；托马斯支付 10 美元（损坏过贵重物品则减 5 美元）；曾陷入临时性疯狂则克苏鲁神话 +5%；为用过的技能做成长检定
  - id: emptied
    title: 空墓
    condition: flag:fled_ghouls
    text: |
      你转身就跑，身后没有追赶的声音。它们带走了道格拉斯·金博尔——无论是死是活——回到了墓地。
      第二天早晨你回来时，所有痕迹都已不见。食尸鬼们离开了，一去不返，再没人来打扰托马斯·金博尔。
    reward: 托马斯支付 10 美元（损坏过贵重物品则减 5 美元）；曾陷入临时性疯狂则克苏鲁神话 +5%；为用过的技能做成长检定
  - id: unsolved
    title: 未解之谜
    condition: 以上都没有发生（例如道格拉斯带着书逃回了墓地）
    text: |
      那个身影抱着书消失在墓碑之间。没人干扰的情况下，道格拉斯和食尸鬼群封闭了这处隧道入口，一去不返。
      此后再也没有书从书房里丢失，可你始终没弄清那是什么——并不是每一个谜团都会揭开面纱。
    reward: 托马斯支付 10 美元（损坏过贵重物品则减 5 美元）；曾陷入临时性疯狂则克苏鲁神话 +5%；为用过的技能做成长检定
sketches:
  - id: footprint
    ask: 把你在墓碑旁泥地上看到的那种足迹画出来
    target: 一个成年人大小的赤足脚印，脚掌像人，但脚趾处分成两瓣，像偶蹄动物的蹄子；一串脚印从墓碑通向远处的一座陵墓
    threshold: 0.6
    after: c_footprints
  - id: douglas_face
    ask: 画出托马斯描述的叔叔道格拉斯·金博尔的样子，好拿去问人
    target: 一个中年男人的头像：白发、秃顶、中等身材、戴圆框眼镜
    threshold: 0.5
