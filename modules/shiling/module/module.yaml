id: shiling
title: 失灵
subtitle: Glitches · 一场关于黄衣之王的单人调查
system: CoC7
era: 2008 年（现代）
setting: 美国加利福尼亚州奥克兰
players: 1 人
duration: 约 3–5 次团（原作未写时长，按篇幅估计）
source: 《失灵》（Glitches）v2.0.0，作者 Josep_h；原作为绿色三角洲（Delta Green）单人模组，AutoKeeper 换算为 CoC 7 版
license: 原作者所有，仅供本地游玩整理
hook: 2008 年 2 月 15 日午夜，绿色三角洲的联络人敲开你家的门，交给你一份名为“停机行动”的任务：你的老队友亚当森·考克斯精神崩溃，请求组织“处理”他，并指名由你来完成。
truth: '亚当森·考克斯早已于 2007 年 12 月 24 日在“黑线行动”中牺牲。这两个月里真正追踪先锋艺术团体“芝诺悖论”的人是特工自己：2 月 11 日特工用钓鱼程序黑进皮特·戴维斯的电脑，得到闹钟酒吧的地址；2
  月 12 日夜在准备不足时闯入酒吧，目睹了舞蹈《St. Illness》（SI，静止病）的预演，与“剧院”建立联系，并以保护性失忆把这段调查记忆嫁接到了亚当森身上。15 日凌晨的“坎蒂来访”与“停机行动”都是黄衣之王的幻象。

  悖论由吉姆·格林伍德、他的母亲兼情人约瑟芬·莱特和鹿角传媒的电器维修员皮特·戴维斯组成。1995 年 11 月，10 岁的吉姆借《黄衣之王》与自己的绘本《瓦普内克剧院》找到通往卡尔克萨的“剧院”，在密室中枪杀父亲马里亚诺，随后失踪。他在卡尔克萨长途旅行后创造了兄弟“达夫·格林伍德”（黄衣之王概念的一角），2007
  年 12 月 25 日回到现实。2 月 18 日晚 8 点 18 分，SI 将在海滨公园（前身夜间水上公园 Nocte Waterpark）正式演出，并经皮特改过的程序转播到奥克兰中央广场的四块大屏：现场之人会从现实所有人的认知中消失，进入永远“即将抵达王的宴会”的“彼岸”。

  只有在被腐蚀之地以外杀死吉姆（“在子宫之外切除脐带”），或在演出最后半小时之前于现场将他击杀，才能终止仪式；关闭中央广场转播只能救下广场上的人。

  '
keeper_notes: '【内容警示（原作 p2）】本模组含性、血腥暴力与宗教影射内容，开场前须告知玩家并确认可以接受。

  【原作规则与换算】原作为绿色三角洲（DG），AutoKeeper 按 CoC 7 版换算，依据如下：

  - DG 属性 ×5 即 CoC 属性：意志→意志（POW），魅力→外貌，力量、体质、敏捷、智力同名。DG 的“毅力”（WP）换作魔法值。DG 理智直接沿用为 CoC 理智。

  - “属性*5”检定＝对应属性检定（常规）；“意志*5-20”＝意志检定加一个惩罚骰；“意志*5-40”＝意志困难检定；“智力*5-20”＝智力检定加一个惩罚骰；“智力*5”＝灵感。

  - 技能对应：警觉→侦查/聆听；搜寻→侦查；人源情报→心理学；行政→说服（出示文件后的官方交涉）；计算机科学、信号情报→计算机使用；“计算机科学-20%”→计算机使用（困难）；法证学→科学(司法科学)；工艺(电工)→电气维修；工艺(锁匠)→锁匠；工艺(机械)→机械维修；工艺(微电子)→电子学；艺术(音乐)→艺术与手艺(音乐)；非自然知识→克苏鲁神话。原文“某技能≥X%才能”照写为技能门槛：技能值达到
  X 才能尝试或直接成功。

  - 原文的理智损失照抄；DG 的“任一艺术(专攻)+5%”照给调查员一项艺术与手艺技能 +5；“非自然知识+5%”换为克苏鲁神话 +5（写在线索 mythos）。

  - 原作的黄衣之王、卡尔克萨、哈利湖设定与 CoC 常见设定不同，以本模组为准；有翼仆从按原文数值，近似规则书的拜亚基，但不受召唤咒文控制、只受演出支配。

  【腐化值】原作核心机制，由插件“腐化值”追踪（个体＋环境＋时间）。对玩家不可见，直到原作所说的“末期”（如抵达海滨公园时）才明示。

  - 个体初值 1；调查本案每过一天 +3；第一次目击黄印 +4；第一次向他人传递黄衣之王 +2，之后每次 +1；第一次进入剧院 +6；成功识破幻象 -2，失败 +2；服用精神抑制类药物临时 -5。各处原文写的“腐化+X”由守秘人调用插件
  add 动作记入。

  - 环境：亚当森住所 3、皮特办公室 3、闹钟酒吧及地窖 5、格林伍德宅邸 10、吉姆的卧室 15、剧院与彼岸 30（剧院与彼岸不提供时间腐化）；其余现实地点 0，演出当晚中央广场和海滨公园的环境腐化原文只写“陡升”，由守秘人用
  env 动作临时设定。

  - 时间：夜晚 +10（原文未写起止，AutoKeeper 补充为 18:00–06:00）。

  - 区间：1–5 几乎无幻象；6–20 偶尔出现；21–40 持续出现，见到幻想人物，开始注意到剧院；41–60 开始造访彼岸并与现实混淆；更高则难以离开彼岸。各幻象“阈值”指此刻腐化值的最低要求，标记
  corr_10 等只表示“曾经达到”，守秘人仍按此刻的数值判断。

  - 识别幻象：腐化 <40 用意志检定加一个惩罚骰（原文意志*5-20），≥40 用意志困难检定（原文意志*5-40）。腐化值检定：掷 D100 不超过此刻腐化值为成功。

  - 心想事成：腐化之地中，简单愿望不需检定，主动或困难的愿望（如离开剧院）要过检定，技能值＝腐化值；须持续想象。无论成败魔法值 -1D6、理智 0/1D2、腐化 +2。前期特工尚未意识时守秘人暗中代掷，成功则隐晦实现并伴随乏力眩晕，只扣魔法值；中期特工主动请求，仍由守秘人掷骰但公示点数，不解释成败直接描述结果，完整惩罚；末期腐化值明示后由特工自己检定，完整惩罚。争夺叙事权时双方以“意志＋腐化值”对抗，特工总受完整惩罚。插件结算结果会显示一行公开提示，守秘人照原作分阶段叙述。

  【叙述性诡计】诡计不提供错误信息误导调查，只在无关紧要的角落浮现；特工问出难以回避的问题时如实回答。幻象物品可在某时变成乱涂乱画的废纸（例如发票抬头写的是特工自己）。家人会被深夜出门吵醒，可能看到特工对着空气比划，宽容地说“不会有事的，但你需要休息”；多次目睹会偷偷联络心理医生。

  【给亚当森打电话】是否接通、谁接（可以是骂人拨错号的陌生人）由守秘人定，事后可发现拨向了错误号码或根本没拨通。

  【可选温和导入（原作）】亚当森没发邮件，组织发现他失踪，派特工寻找；住宅里不会见到“亚当森”，书桌上的字条仍指明方向。默认用“杀死亚当森”版本。

  【运行建议】闹钟酒吧是核心场景，分层揭露，不要一股脑给出；特工不愿离开时可用外界突发事件引出。叙诡“二月十二日之夜”尽量放在接近结束时。终幕视角在现实、剧院、彼岸之间切换，只调彼岸与剧院事件的顺序，现实按客观时间走，在彼岸或剧院行动照样消耗现实时间（“走神”）。

  【附录C 突发事件（强烈建议少量引入打乱节奏）】黄衣之王在网上扩散（更多 YouTube 视频出现节奏和符号，生活中出现受影响的人）；上司来电责问旷工；家人偷偷联系的心理医生傍晚来电“您明天有时间吗？或许我们可以聊聊。”，反馈反映腐化程度；特工做出费解之事或严重伤害亲密关系时，在街上发现伴侣背着自己做某些事；身边人手指关节习惯性敲出那种节奏。

  - 联系三角洲：须有适当证据；可以 YouTube 视频和被修改的中央广场屏幕代码为由申请网络管理权限（说服检定）；可从坎蒂处要到大部分黑线行动资料，包括亚当森已死。若表明自己“正在执行某项行动”，会引起最高等级怀疑，遭监视甚至处决。

  - 特工被三角洲怀疑：怪异行径（旷工太久）或主动联络暴露可能被腐化，3D4 小时内外地调来的小队盯上；离开建筑时侦查检定发现跟踪；小队几乎不干涉，发现“反常”的危险举动时镇压。终幕前已被监视的，终幕请求帮助时坎蒂立刻同意挂断，整装队伍出现但拒绝交流。试图甩掉或敌对：坎蒂开新简报会暗中评估，必要时当场击杀；逃出则要避开组织已掌握的地点，不久小队可能闯入酒吧。

  - 当患者被拘束：借警方或精神病院拘束约瑟芬、皮特、吉姆，不超过两天，他们会在夜里打开新的剧院通道（窗户或门）消失，消息经官方传给特工；在监视或摄像头里看到仿佛穿过媒介消失 SAN 0/1D3；腐化≥30
  看见通道生成过程 SAN 0/1D6，腐化 +3。

  【附录B 幻象（括号为腐化区间）】幻象不真实存在但影响功能（幻象里手被割伤，现实中仍握不稳枪）；腐化 20 起部分幻象常驻（街边黑色巨石、上涨的湖水、天空光带）。意识流叙事，切换的生硬程度和频率随腐化升高，但保持自然逻辑。

  - 错误的对象(6-20)：弄混人或物，看见不存在的人，把规律噪声听成敲门声。听筒和花洒(6-20)：电话与淋浴混淆，意识到后 SAN 0/1D3。空转(6-20)：对方话说一半停下看着自己（走神跳过了时间）。串线(10-20)：另一段对话的声音叠进来，可借此切换场景。错误印刷(10-20)：别人难以理解特工，常人眼中特工的语法措辞很怪。

  - 幻听(10+)：安静处（如卫生间）墙壁里传出浓重混响的声音，是剧院中婴儿床里马里亚诺尸体的声音，传达过去或未来的警告，可塑造成引导特工的友人；交流不会很顺利；之后真正见面时冲击更大、理智损失更高。

  - 巴特、巴特和巴特(10-20)：闹钟酒吧、剧院“渐淡的伤疤”、彼岸摩天大楼三处可遇巴特，可糅合跳转。

  - 阻路巨石(20-40)：出门时头痛，撞上一块摩天黑色巨石，周围人熟视无睹；SAN 0/1，HP 0/1。入梦(20-40)：梦与剧院相连，往事与黄印节奏萦绕；可在梦中进入“渐淡的伤疤”，醒来身在剧院。

  - 积水与彼岸(30-60)：持续下雨、积水上涨淹没城市，死去的水生生物划过脸颊；腐化>30 注意到雨且不再消失；部分景象被彼岸代替，可能认不出行人与飞驰的汽车，极其危险。深入交流(30-60)：与幻想人物迷醉接触，结束时魔法值
  -1D6、SAN 1/1D6，甚至 HP 下降。被造梦机弹出(30-60，须见过造梦机)：视线扭曲，发现自己在使用造梦机，来到彼岸但丁面前或剧院中。

  - 无意识的行径（括号为最低腐化）：特工的房间(6) 冒出难辨字迹的纸条或莫名手稿；灰袍、面具与手稿(10) 衣柜里出现灰袍和苍白面具，墙上出现黄印 SAN 0/1；垃圾堆中惊醒(15) 在古怪地方醒来，衣冠不整、物品丢失；陌生的床伴(15)
  SAN 0/1D3，腐化 +2；成为扩散者(20) 主动给身边人发黄衣之王相关消息，可招致三角洲怀疑（尤其给坎蒂发带黄印的图片）；臭气熏天(20) 垃圾堆中被粗暴撕碎的动物尸体 SAN 0/1D3。

  【原文不一致，照录】伯莎“一个月前”调任与她自述“一两周”；亚当森办公室“清理一空”又列出物品；宅邸监视听到主卧鞭打声而主卧床两周未用（仪式在娱乐室）；油漆厂衰败年份 1975/1976 与 1992；吉姆的玩偶达夫正文为狮子、附录写小熊，以正文狮子为准；p73
  酒吧平面大图写“地窖”、小图写“储物间”，给玩家的是小图。开场示范小说（附录E p76）多出队友肯特、凌晨 1 点，与正文不一致，不纳入。附录小说《回响》只作彼岸氛围参考，不作模组事实。

  【多人】原作不建议多人；如要多人，原作给的办法是多个单人时空在闹钟酒吧、宅邸、剧院、彼岸四地交汇，或把马蒂亚、伯莎类角色改为玩家。

  【AutoKeeper 补充】特工的家、警署档案室作为可到达地点由 AutoKeeper 补充（原文写到“警署可查”“城市记录”“自己的家”）；夜晚时段 18:00–06:00；演出日皮特白天在中央广场最后检查的时刻定为
  12:00；预设调查员诺拉的教育、体型、幸运。

  '
