start_time: D1 00:00
opening: '绿色的火焰在你身后翻卷，你背着亚当森·考克斯在废弃的工业园区里狂奔。他伏在你肩上，断断续续地说着这次行动：坐标、毒贩、那批黑色粉末。远处有救护车的声音，若有若无。你回头看了一眼——倒塌的厂房废墟下面，隐隐伸出一只手。

  短促的敲门声。

  你睁开眼。是自己家的卧室，枕边是丈夫阿尔伯特平稳的呼吸声。床头的电子钟显示 2008 年 2 月 15 日，00:00。黑线行动的结尾还清清楚楚：化工厂的爆炸，有毒的烟，你和亚当森一起被救了出去。

  楼下的敲门声又响了一次，不轻不重。

  '
