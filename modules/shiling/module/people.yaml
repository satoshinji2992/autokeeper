- id: jim
  name: 吉姆·格林伍德
  role: 《瓦普内克剧院》的作者，SI 主演之一，卡尔克萨的旅客
  called: 戴牛仔帽的围巾男子
  look: 黑红方格围巾，滑稽的牛仔帽，风尘仆仆的皮夹克；看上去至少 30 岁，无法凭童年照认出。夜里带着平静的微笑独坐吧台旁喝酒。
