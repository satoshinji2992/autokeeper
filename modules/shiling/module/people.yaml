- id: peter
  name: 皮特·戴维斯
  role: 鹿角传媒的电器维修员（中央广场技术顾问），悖论的技术顾问
  called: 戴贝雷帽、抖腿的中年男人
  look: 白天戴着皱褶的贝雷帽，裹着咖啡色毛毯窝在酒吧小角落；脸部松弛，皱着眉，神经质地抖腿，食指关节在桌面上敲着节奏；耳机连着攥在手里的破旧 WM-EX422 随身听；桌上一摞磁带和一杯苏打水；腰上的钥匙扣别着地窖钥匙。
