  name: 伯莎·史密斯
  role: NPPD 第九区现任负责人
  called: 穿细条纹西装的女士
  look: 黑色短卷发，没有涂口红，白色细条纹的黑西装套装。
  personality: 第八区时就干练规矩；想在岗位上令人敬佩、保护无辜；新教信仰。与三角洲和非自然事件无关。
