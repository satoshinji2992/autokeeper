  voice: 声音闷闷的，谓词错位，会蹦出不明的名词；称特工为“在这里的你”“在此时的你”。
  goal: 创造理想的彼岸：用大量人的思想共鸣改变剧院，把它推向无限趋近黄衣之王舞会、却永远无法抵达的时刻。
  knows:
  - 问马里亚诺怎么死的：毫不犹豫承认是自己杀的
  - 问是否对约瑟芬性虐：点头，“当我施加或感受到疼痛的时候，我感觉我回到了一致。”并非常细节地描述，像正在做
