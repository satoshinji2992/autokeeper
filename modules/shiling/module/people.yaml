  - 模组开始前在夜里的混乱中点开了特工的钓鱼邮件；白天觉得犯了错，侥幸地把作为服务器的网站电脑草草藏进酒吧地窖
  - 每天下午两点左右进地窖检查中央广场程序，其余时间在大厅；每天远程检查一次屏幕，发现端倪立刻去广场维修
