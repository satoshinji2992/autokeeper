  backstory:
    个人描述: 1971 年生，普渡大学计算机与数学博士，读博时与丈夫阿尔伯特闪婚；1997 年毕业被军方招入国防部计算机应急响应小组，2002 年调入国土安全局，派往 NPPD 第九区分部奥克兰办公室至今。游戏开始时，她认为自己是亚当森在
      NPPD 的同事。
    加入组织: 一次 NPPD 行动中涉入非自然事件，被时任上司亚当森所救；一个酷似女儿的受害者成了契机。她成为亚当森的同组成员，专攻监控网络上的非自然事件。此前多做远程协助（搜索查询、破译密码、扫除痕迹）；外勤经历都不愉快——金发小姑娘消失在兔子洞口、亚当开着吉普狂飙、湖底沉默的男人、开枪打爆自己脑袋的老头、变成“史莱姆”果冻被关在隔离门后的家伙……她记不清他们头发的颜色。
    日常: 回家摘下帽子、大衣和墨镜，吃阿尔伯特的创意美食，听他讲研究进展，抱起爱丽丝看她的乐高植物。
    重要之人: 亚当森（可靠的战友，与温妮也熟，喜欢温妮烤的小甜饼）；阿尔伯特·道金森（丈夫，斯坦福社会学系副教授，常年在奥克兰大学任客座教授，幽默、热爱生活）；爱丽丝·道金森（6 岁的女儿）。
    动机: 对未知天然好奇；保护亲友远离非自然；守护阿尔和爱丽丝的幸福；给自己一个“安稳”的晚年。
    精神疾病: 睡眠障碍。
    换算说明: 原作 DG 数值（力量12 体质11 敏捷13 智力16 意志14 魅力11 毅力14 理智53）×5 换算；教育、体型、幸运为 AutoKeeper 补充，魔法值取原作毅力 14。原作技能“警觉”拆为侦查、聆听，“人源情报”为心理学，“信号情报/计算机科学”为计算机使用，“法证学”为科学(司法科学)，“工艺(微电子)”为电子学，“工艺(机械)”为机械维修，“行政”并入说服。
