- id: kandi
  name: 坎蒂（奥德里奇·莱特福特）
  role: 绿色三角洲的主管，特工的联络人
  called: 戴圆眼镜的驼背男子
  look: 不太高、有点驼背的中年男子，浓重的黑眼圈，圆形眼镜，表情不太愉快；短檐礼帽，深色风衣。
  personality: 文质彬彬，危机意识极强；从不晚到，也从不先离场。
  voice: 声音低沉细小，像一位文质彬彬的老人；偶尔先清一下嗓子再开口。
  goal: 幻象中：让特工完成“停机行动”。现实中：发展人类文明、写自传；不让非自然事件扩大，必要时除掉被腐化的特工。
  knows:
  - 幻象中：两小时前从亚当森处收到专用信道的加密邮件，亚当森请求接受组织处理，并指名由特工完成，组织同意
  - 幻象中：组织近期没有给亚当森新任务，不知道他崩溃的原因
  - 幻象中：组织暂时没有掩护身份或人手；特工提供足够线索后联系他，他会考虑
  - 现实中：亚当森已于黑线行动中牺牲；黑线行动的大部分资料
  secrets:
  - 记忆中他从不在光线明亮或信号良好的地方见面，这次是特例（这次来访是幻象）
  - 现实中的坎蒂：公开身份是 CDC 流行病学实验室服务中心的统计学家；一次行动换一次联络方式，永不公开个人信息，不贸然打开发给他的信息
  - 现实中的坎蒂：特工主动暴露非自然事件并被他得知时，他和伙伴会毫不犹豫地出马歼灭特工
  lies:
  - 幻象中被问邮件真伪时，他保证“真实性”
