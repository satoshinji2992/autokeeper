- id: adamson
  name: 亚当森·考克斯
  role: 特工的老队友，前 NPPD 第九区行动组组长；模组中以幻象出现
  called: 椅子上的憔悴男人
  look: 标志性的格子衫（彼岸中）；卧室幻象里皱巴巴的领带，衬衫沾血，额头一片烫伤，干枯瘦弱，像很久没见。
  personality: 开始时三角洲特工的特征显著；之后逐渐利用性或好奇心引诱特工。他是记忆中的同伴、保护屏障，也是黄衣之王的诱饵。
  voice: 间歇地问候，话里夹着非英语的句子，像同时在和好几个人说话；语气偶尔细微地反常、暧昧。
  goal: 鼓励特工唤回记忆；配合特工完成“任务”，在呓语中迎接“死亡”。
  knows:
  - 特工的来意
  - 被问“选择”时只摇头：“寻求选择的意义就是选择本身。”
  - 胡话里会出现特工的名字、“温妮”、“瓦普内克”
  - 在剧院中：可鼓励特工对抗，劝特工停止调查回到生活，或讲卡尔克萨的知识，几种态度可快速切换
  secrets:
  - 他早已在黑线行动中牺牲；现在的他是幻象
  - 特工遗忘的两段过去（悄悄透露）
