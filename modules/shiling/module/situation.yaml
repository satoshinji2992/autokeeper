mechanics:
- name: 腐化值
  rules: 腐化值＝个体＋环境＋时间，对玩家不可见；到原作所说的“末期”（如抵达海滨公园、e_paradox_arrive 时）才明示，并设 corruption_revealed。个体初值 1；调查本案每过一天
    +3；第一次目击黄印 +4；第一次向他人传递黄衣之王 +2，之后每次 +1；第一次进入剧院 +6；识破幻象 -2，失败 +2；服用精神抑制类药物临时 -5。环境：亚当森住所 3、皮特办公室 3、闹钟酒吧及地窖
    5、格林伍德宅邸 10、吉姆卧室 15、剧院与彼岸 30，其余现实地点 0；演出当晚中央广场和海滨公园原文只写“陡升”，由守秘人用 env 动作临时设定。时间：夜晚 18:00–06:00 +10（起止为
    AutoKeeper 补充），剧院与彼岸不计时间腐化。首次达到 10/20/25/30/35/40/60 时设对应 corr_ 标记，但幻象阈值按此刻数值判断。正文中散见的“腐化+X”由守秘人用
    add 动作记入，例如：看预告片 +1，反复观看或灵感认出自己 +2；进入酒吧、地窖、宅邸各 +1；哼唱或演奏富鲁格号乐谱 +3；听吉姆谈卡尔克萨 +2；听托马斯的结论 +2；向马蒂亚提供黄衣之王信息，双方各
    +2；随身听 +1；皮特的舞会 +1；和剧院里的“自己”交流 +2；造梦机每用一次 +4；第一次接触达夫 +5；注视达夫 +4；营救人员进入酒吧 +2。区间表现：1–5 几乎没有幻象；6–20 偶尔出现；21–40
    持续出现，见到幻想人物，开始注意到剧院；41–60 开始造访彼岸并与现实混淆；更高则难以离开彼岸。
  why: 全模组：决定酒吧开没开、地窖门、剧院通道、光带、幻象人物和终幕判定
  plugin: corruption
  runs: 插件
- name: 识破幻象
  rules: 特工怀疑眼前是幻象时：腐化 <40 做意志检定，加一个惩罚骰（原文意志*5-20）；腐化 ≥40 做意志困难检定（原文意志*5-40）。成功腐化 -2，失败 +2（用腐化插件记入）。幻象不真实存在，但会影响功能，例如幻象里手被割伤，现实中仍握不稳枪。腐化
    20 起部分幻象常驻（黑色巨石、上涨的湖水、天空光带）。
  why: 附录B 幻象；雨中交合中反抗用同一检定，造梦机戴眼镜也用意志检定加一个惩罚骰
  runs: 核心规则
- name: 腐化值检定
  rules: 掷 D100，不超过此刻腐化值为成功。用在：想主动离开剧院时（失败为“虚假的离场”，之后被揭穿时 SAN 0/1D4）；抵达海滨公园演出现场时做“腐化值+10%”检定，成功则腐化 +5，并被拉入彼岸的边缘；在现实中疯狂发作时，成功则意识再入彼岸或触发彼岸事件。
  why: 剧院“离开剧院”、终演 e_paradox_arrive、彼岸“现实中”
  plugin: corruption
  runs: 插件
- name: 心想事成
  rules: 在腐化之地中：简单愿望不需检定；主动或困难的愿望（如离开剧院）要过检定，技能值＝腐化值，且须持续想象。无论成败魔法值 -1D6、理智 0/1D2、腐化 +2。分阶段：前期特工尚未意识到这项能力时，守秘人暗中代掷，成功则以隐晦方式实现并伴随乏力眩晕，只扣魔法值；中期特工主动请求，仍由守秘人掷骰，但公示点数，不解释成败，直接描述结果，受完整惩罚；末期腐化值明示后由特工自己检定，完整惩罚。撑过八次鞭子（whipped）后检定
    +20。争夺叙事权（如地窖里吉姆召出蛇来捆绑）时，双方以“意志＋腐化值”对抗，特工无论如何都受完整惩罚。愿望总以意想不到的形式实现。NPC 的心想事成：吉姆 60、约瑟芬 35、皮特 20、达夫
    99。
  why: 剧院、彼岸、被困地窖、终演中吉姆的恢复
  plugin: corruption
  runs: 插件
- name: 幻象阈值与通道
  rules: 各处写的“阈值 X”指此刻腐化值的最低要求，要按当下数值判断，不按曾经达到的标记。达到 30：亚当森卧室、皮特办公室、酒吧铁门、宅邸书房、吉姆卧室窗户与储物间柜门都变成通往剧院的门，相应通路的
    blocked 由守秘人解除。腐化 <30 时去开酒吧铁门，它只是一幅钉在墙上的画，SAN 0/1D3，腐化 +2。地窖门的阈值是 25：低于 25 时它是一幅画着门的装饰画，掀开这幅画就变成木门，SAN
    0/1D3，腐化 +2。酒吧 ≤20 时看起来是倒闭的玩具店，执意进入 SAN 0/1D3，腐化 +2。巴特阈值 21，托马斯阈值 30；亚当森卧室里“他仍在这里”阈值 7。离开卧室后再回来时若腐化
    <7，尸体不翼而飞，准备的材料变成潦草的图画。
  why: 所有地点的守秘人须知与通路
  runs: 守秘人
- name: 离开剧院与彼岸
  rules: 剧院事件结束后可能被动离开（如“吉姆的幼年”之后进入现实中的吉姆卧室）。主动离开要过腐化值检定：成功后，下一个打开的包厢映出扭曲的现实光景，穿过即抵达希望去的地点；没有明确去处就回自己家、亚当森家或进入时的位置；只能回到造访过且已被腐蚀的现实地点。个体腐化
    >25 时可经剧院进入彼岸。彼岸只有两种离开办法：找到剧院站台登上停靠的剧院（要出示邀请函），或借造梦机回到现实。在剧院或彼岸中行动照样消耗现实时间（“走神”）；终幕只调彼岸与剧院事件的顺序，现实按客观时间走。可选的“时间的把戏”：出入时间不一致，向特工希望的方向偏移。
  why: 剧院、彼岸、终幕运行建议
  runs: 守秘人
- name: 造梦机
  rules: 尝试理解构造 SAN 0/1；每使用一次腐化 +4。戴上眼镜后被强制拉回“现实”继续行动，并做意志检定（加一个惩罚骰）：成功则清楚知道自己正在用机械观察，可以主动回到车厢。无论成败，现实剧情只前进半天，就被强行拉回车厢：“请植入一枚新的胶囊。”投入新胶囊后以对象的视角进入（同样过意志检定），最多两小时被弹出：“警告。胶囊匹配度过低，已弹出。”它不能逆算，遗传物质耗尽自动暂停。但丁以血液和一段回忆交换造梦机；要用胶囊体验，先得给他血。
  why: theatre_dream、other_station
  runs: 守秘人
- name: 八次鞭子
  rules: 连续鞭打 8 次，每两次受 1D2 伤害、SAN 0/1，并过体质检定，否则晕倒，醒来时三人已经不在；后背烙下黄印形的伤痕；腐化增加等于仪式中失去的理智总值。撑过后吉姆与约瑟芬邀请特工一同交媾，皮特摊手鼓励；完成整个仪式
    SAN 0/1D6、腐化 +2，设 whipped，此后心想事成 +20。发现身上刻的是黄印另 SAN 0/1D3、腐化 +2。特工可随时终止逃离，他们不阻拦。伤害、检定、理智按核心规则结算，腐化用插件记入。
  why: e_pleasure、被困地窖没能逃脱时
  runs: 守秘人
- name: 不死与复活
  rules: 闹钟酒吧和格林伍德宅邸中死亡的人，若腐化 >20，会以诡异姿态复活。剧院乘客不能真正被杀死，被破坏的部分以难解的形式恢复，伤口下是棉花和齿轮。尚与现实有关的人（特工、悖论）在剧院或其他严重腐蚀地之外死亡，会成为永远徘徊的乘客。达夫让吉姆在剧院或彼岸中不会死亡：攻击他只会让另一个可能性的吉姆替代（目击
    SAN 0/1D4）。只有在被腐蚀之地以外杀死吉姆，或在演出最后半小时之前于现场将他击杀，才能终止仪式。
  why: 酒吧、宅邸、剧院、二月十二日之夜、k_stop
  runs: 守秘人
- name: 达夫的特性
  rules: 第一次接触达夫腐化 +5。注视达夫：视线被黑线吸住无限放大，SAN 1/1D8、腐化 +4。攻击达夫进入“静止姿态”：特工以为自己已经攻击过，实际上什么也没做（弹夹仍满，人还在原地），察觉这个悖论
    SAN 0/1D4。在被腐蚀的空间里达夫有实体和绝对话语权，其他地方依附在吉姆身上；行为不受吉姆控制，但更倾向于吉姆的想法，特工可以尝试改变它，非常困难。
  why: 通往愉悦之路、二月十二日之夜、终演
  runs: 守秘人
- name: 终演时限与吉姆的恢复
  rules: 8 点 18 分开演，持续 2 小时；中央广场转播被切断则延长到 4 小时。外面无法向吉姆开枪，须挤入人群；挤进去后来到彼岸的边缘，配枪不知所踪，吉姆劝说特工，交谈后回到人群。参与者受攻击都不反抗。吉姆借心想事成恢复，起初抵消不了子弹等高杀伤武器，之后越来越快；进入最后半小时（jim_unkillable）后无法被击杀，只能等仪式结束。吉姆一死，仪式立即结束（performance_stopped），腐化在短时间内大幅下降。钟点由事件
    e_finale、e_unkillable_*、e_ritual_complete_* 触发。
  why: 终幕“终止演出”“射杀吉姆”
  runs: 守秘人
- name: 耗时与技能门槛
  rules: 耗时：狂热观众 1D6+2 小时后回复（每项信息各 50 美元）；市警协助认人约 1D6 小时；破解中控电脑密码要计算机使用（困难）检定加 1D4 小时；发现中控电脑在与远程交换数据 1D2
    小时，解除皮特控制或植入病毒再 1D2 小时；看懂劫持代码 1D3 小时；读《黄衣之王》1 小时、《无门之界》2D4 小时、《火车的历史》1D6+3 小时、《卡尔克萨王族食谱》2D6 小时；地窖转变为剧院约半小时。原文的技能门槛：艺术与手艺(音乐)
    ≥20 认出皮特的磁带，并让他分享随身听（也可用魅力检定）；计算机使用 ≥30 旁敲侧击出皮特懂计算机，以及看懂代码；历史 ≥20 辨出托马斯的埃及史；科学(物理) ≥20 认出热寂假说；科学(司法科学)
    ≥40 认出纸团笔迹；艺术与手艺(音乐) ≥20 听出铜管奏的是 SI 旋律。线索表里写成检定的，原文是门槛：达到即可。
  why: 调查悖论、中控室、地窖、酒吧人物、吉姆卧室、彼岸边缘
  runs: 守秘人
- name: 三角洲的怀疑与监视
  rules: 怪异行径（旷工太久）、主动联络暴露自己可能已被腐化，或表明自己“正在执行某项行动”，都会引起怀疑（delta_suspects）；后者是最高等级怀疑，可能被监视甚至处决。被怀疑后 3D4
    小时内外地调来的小队盯上特工；离开建筑时侦查检定可发现跟踪。小队几乎不干涉，发现“反常”的危险举动时镇压。终幕前已被监视的，终幕请求帮助时坎蒂立刻同意并挂断，整装的队伍出现但拒绝交流。试图甩掉或敌对：坎蒂召开新简报会暗中评估，必要时当场击杀；逃出则要避开组织已掌握的地点，不久小队可能闯入酒吧。要联系三角洲须有适当证据；以
    YouTube 视频和被修改的屏幕代码为由申请网络管理权限，要过说服检定。
  why: 附录C、坎蒂、end_delta
  runs: 守秘人
- name: 当患者被拘束
  rules: 借警方或精神病院拘束约瑟芬、皮特、吉姆，不超过两天，他们会在夜里打开新的剧院通道（窗户或门）消失，消息经官方渠道传给特工。在监视画面或摄像头里看到对方仿佛穿过媒介消失 SAN 0/1D3；腐化
    ≥30 的人看见通道生成过程 SAN 0/1D6、腐化 +3。
  why: 附录C；约瑟芬、皮特拒绝离开腐蚀地界
  runs: 守秘人
- name: 家人察觉与心理医生
  rules: 深夜出门会吵醒家人，他们可能看到特工对着空气比划，宽容地说“不会有事的，但你需要休息”。多次目睹后，家人会偷偷联络心理医生；医生傍晚来电“您明天有时间吗？或许我们可以聊聊。”，语气反映特工的腐化程度。特工做出费解之事或严重伤害亲密关系时，可能在街上发现伴侣背着自己做某些事。
  why: 叙述性诡计、附录C
  runs: 守秘人
- name: 结局奖励与后续
  rules: end_shadow：阻止最终演出 +2D6 理智，并减少等量腐化；另外成功阻止中央广场转播，再 +1D6 理智、减少等量腐化。end_delta：成功阻止转播 +1D6 理智、减少等量腐化。找到《黄衣之王》而没读的，腐化
    -1D8。end_delta 和 end_remember 按最终个体腐化分档（<25 / 25–50 / …，其余分档见原文）决定特工此后的生活。特工完全疯狂时，可让玩家短暂扮演失忆后的马蒂亚，以她的视角讲述结局。
  why: 结局
  runs: 守秘人
history:
- when: 1980 年至 1995 年
  text: 约瑟芬 1980 年嫁给马里亚诺，改姓格林伍德。马里亚诺 1976 年接手的家族油漆厂 1992 年破产，此后他酗酒，把屈辱以非暴力的方式发泄在约瑟芬身上，家里长年压抑。吉姆在卧室墙上乱画，借画画躲开这一切。
  who:
  - josephine
  - mariano_corpse
  - jim
  where: greenwood_mansion
- when: 1995 年 3 月 21 日起
  text: 10 岁的吉姆常去路边一家不起眼的书店，店主送他一本无名红皮小书（《黄衣之王》最早的英译本）。吉姆照着它画出绘本《瓦普内克剧院》，在宅邸里找到通往卡尔克萨的“剧院”。约瑟芬拿着绘本跑了好几家出版社，都以“对孩子心理不利”为由拒绝。约瑟芬是绘本的第一位读者。
  who:
  - jim
  - josephine
  where: greenwood_mansion
- when: 1995 年 11 月
  text: 吉姆经剧院的门进入父亲马里亚诺的书房，让喀巴奇·劳捆住马里亚诺，伪造自杀现场后开枪打死他，再从剧院离开，造成门窗反锁的密室。他的思想在无意中影响了这个空间，引导警方很快判为自杀。
  who:
  - jim
  - cabbage_king
  - mariano_corpse
  where: mansion_study
- when: 1995 年 11 月
  text: 马里亚诺死后，约瑟芬立刻明白这是吉姆干的，相信那是神迹、吉姆一定会回来。她协助警方草草结了自杀案，后来也让吉姆失踪案草草了结。
  who:
  - josephine
  - jim
  where: greenwood_mansion
- when: 1995 年末（自杀案结案后不久）
  text: 吉姆从自己的卧室消失，进入剧院，在卡尔克萨里长途旅行。约瑟芬报警，警方连续搜查数日一无所获，按失踪结案。
  who:
  - jim
  - josephine
  where: jim_bedroom
- when: 1996 年
  text: 约瑟芬恢复原名约瑟芬·莱特，卖掉马里亚诺除宅邸以外的全部遗产，买下辛普敦大厦负一楼的罗伯特书店，改成“凌晨十二点闹钟”酒吧，从此在酒吧里等吉姆回来。
  who:
  - josephine
  where: bar
- when: 1996 年至 2007 年
  text: 约瑟芬在纸团上一遍遍写“吉姆·格林伍德”，有的落了 1996 到 2007 年的日期。纸团堆在吉姆卧室的书桌上。
  who:
  - josephine
  where: jim_bedroom
- when: 2007 年 11 月 20 日至 12 月 24 日
  text: 坎蒂启动“黑线行动”，召集特工、亚当森、巴特三人小组调查斑衣笛手贩卖黑色致幻粉末一案。12 月 24 日，小组追到奥克兰郊区的废弃工厂，那里是陷阱：亚当森作前锋识破后通知特工撤离，随即爆炸，亚当森被倒塌的厂房掩埋，当场死亡；特工和巴特撤离时吸入毒气昏迷，被救援人员在工厂附近发现。
  who:
  - kandi
  - adamson
  - bart
- when: 2007 年 12 月底至 2008 年 1 月
  text: 黑线行动之后，后续追查移交其他小组，巴特被调离奥克兰；三角洲担心亚当森之死给特工留下心理创伤，暗中把她调离前线。三角洲处理掉亚当森的大部分材料，第九区前任负责人也被调走。
  who:
  - kandi
  - bart
  - former_chief
  where: nppd_office
- when: 2007 年 12 月底至 2008 年 1 月
  text: 特工亲自去第九区办公室收拾亚当森的东西。前任负责人交接时提醒，特工可能在和亚当森的共同任务中受了精神冲击，需要照顾。
  who:
  - former_chief
  where: adamson_office
- when: 亚当森牺牲后不久
  text: 亚当森的妻子温妮搬离奥克兰，临走托特工照看林登街的房子并交了钥匙。此后特工一直把那里当安全屋用（特工自己不记得）。
  who:
  - winnie
  where: adamson_home
- when: 黑线行动之后
  text: 组织把一张纸条转交给特工，上面用她和亚当森约定的加密法写着亚当森的电脑密码。
  who:
  - kandi
  where: adamson_bedroom
- when: 2007 年 12 月 25 日
  text: 吉姆在剧院中凭想象和对黄衣之王的崇拜创造了“兄弟”达夫·格林伍德（诞生于剧院婴儿床里马里亚诺尸体的子宫），随后与达夫一起回到现实，创立“芝诺悖论”，当天开始在 YouTube 发表现代舞。约瑟芬立刻和吉姆开始乱伦与性虐关系，每夜从吉姆的鞭子里获得快感，成为第二个读《黄衣之王》的人。
  who:
  - jim
  - josephine
  where: greenwood_mansion
- when: 2008 年 1 月初
  text: 伯莎·史密斯调任 NPPD 第九区负责人（原文另处写“一个月前”，她自己说“一两周”，原文矛盾）。上级告诉她亚当森死于一次针对网络恐怖分子的联合调查，并指示她不要随意回答与亚当森有关的问题。
  who:
  - bertha
  where: nppd_office
- when: 2007 年底至 2008 年 1 月 10 日
  text: 皮特原是约瑟芬的情人之一。吉姆回来后，他只能在白天与约瑟芬交欢。出于嫉妒，他跟踪约瑟芬，在宅邸对面窥视、偷拍母子的仪式（照片集中在开局前约一个半月），之后尾随二人穿过剧院，被邀请做仪式的见证者，见到了达夫，读完《黄衣之王》，成了信徒。1
    月 10 日他加入悖论。
  who:
  - peter
  - jim
  - josephine
  where: greenwood_mansion
- when: 2008 年 1 月 18 日起
  text: 皮特为悖论搭建私人网站，开始夜不归宿，筹划把演出连上互联网，并修改程序、劫持中央广场四块大屏。最近一两个月他工作心不在焉。
  who:
  - peter
  where: central_plaza
- when: 开局前约两周
  text: 中央广场的广告商要求更换广告，皮特一直没有落实，也开始忽视顾客的其他请求。
  who:
  - peter
  where: horn_media
- when: 2008 年 2 月 8 日
  text: 特工从悖论的网站嗅到非自然气息，开始用亚当森卧室里的电脑追查悖论。
  where: adamson_bedroom
- when: 2008 年 2 月 8 日夜
  text: 吉姆在闹钟酒吧和恐怖小说作家马蒂亚聊天，认可她的才华，建议她用“从脑海里浮现、却不知道含义的符号”写恐怖故事。马蒂亚随即动笔写小说《失灵》。
  who:
  - jim
  - mathia
  where: bar
- when: 2008 年 2 月 9 日起
  text: 特工没有按要求到第九区出勤。伯莎注意到了，但不会主动提起。
  who:
  - bertha
  where: nppd_office
- when: 2008 年 2 月 10 日夜
  text: 皮特经剧院回到鹿角传媒的办公室取走自己的电脑，为预演做准备。奥斯丁下班时听见里面有响动，敲门后皮特说顾客着急要处理。奥斯丁不知道当天没人看见皮特走进办公室。
  who:
  - peter
  - austin
  where: peter_office
- when: 2008 年 2 月 11 日
  text: 特工用钓鱼程序向 zeno@paradox.com 发邮件。皮特在夜里的混乱中点开，特工由此拿到他电脑的 IP（指向辛普敦大厦），并在那台电脑上留下后门。第二天白天，皮特觉得自己犯了错，心存侥幸，把当作网站服务器的电脑草草藏进酒吧地窖。
  who:
  - peter
  where: bar_cellar
- when: 2008 年 2 月 12 日夜
  text: SI 在闹钟酒吧预演，吉姆与达夫主舞，约瑟芬在场，皮特用藏起的摄像机录下全程。特工在准备不足时闯进来，目击了整场演出，在极度兴奋和疯癫中与剧院建立联系，之后因保护性失忆忘了这一切，把这段调查记忆嫁接到亚当森身上。现场多数观众同样忘了演出，却会下意识回到酒吧。
  who:
  - jim
  - josephine
  - peter
  where: bar
- when: 2008 年 2 月 13 日凌晨
  text: 皮特剪掉暴露位置和身份的片段，把 SI 预告片上传到 YouTube。
  who:
  - peter
  where: bar
agendas:
- npc: kandi
  goals:
  - 幻象中：让特工完成“停机行动”
  - 现实中：不让非自然事件扩大，必要时除掉被腐化的特工
  steps:
  - id: kandi_vision_followup
    text: 幻象中的坎蒂说过：特工带着足够线索联系他，他会考虑提供掩护或人手；被问到邮件真伪时保证邮件是真的
    meet: true
    once: false
    source: kandi；c_halting_brief
  - id: kandi_real_contact
    text: 特工联系真实的三角洲并当面出示证据（如 YouTube 视频、被改过的中央广场屏幕代码）申请网络管理权限：要过说服检定；他可以给出大部分黑线行动资料，包括亚当森已死
    meet: true
    once: false
    only_if: 特工实际向坎蒂出示了手里已有的证据；出示屏幕代码的前提是特工已经从皮特电脑里读到了劫持代码（c_laptop_code）
    source: 守秘人须知·联系三角洲；附录C
  - id: kandi_contact_result
    text: 说服检定的结果，以及他是否因特工的说法起疑（特工若声称自己“正在执行某项行动”，就是最高等级怀疑），由守秘人裁定，可能设 delta_contacted 或 delta_suspects
    ruling: true
    source: 守秘人须知·联系三角洲；规则·三角洲的怀疑与监视
  - id: kandi_suspect_tail
    text: 三角洲起疑后 3D4 小时内，外地调来的小队盯上特工；她离开建筑时可以过侦查检定发现跟踪。小队几乎不干涉，看到反常的危险举动时出手镇压
    when: flag:delta_suspects
    meet: false
    source: 规则·三角洲的怀疑与监视
  - id: kandi_suspect_hostile
    text: 特工想甩掉小队或与组织敌对：坎蒂召开新的简报会暗中评估，必要时当场击杀她；她逃脱后，不久小队可能闯进酒吧
    when: flag:delta_suspects
    only_if: 特工确实试图甩掉监视，或对小队、组织做出敌对举动
    ruling: true
    source: 规则·三角洲的怀疑与监视
  - id: kandi_finale_help
    text: 特工终幕前已经被监视、终幕时又请求帮助的：坎蒂立刻同意并挂断电话，一支整装的队伍随后出现，但拒绝和她交流
    meet: true
    once: true
    only_if: 特工在终幕当晚亲自打电话请求支援，并且之前已经处在三角洲监视下
    source: 规则·三角洲的怀疑与监视
  - id: kandi_exposure_kill
    text: 特工主动暴露非自然事件并被他得知时，他和伙伴会毫不犹豫出手歼灭特工
    only_if: 坎蒂通过实际的渠道（特工的报告、发给他的带黄印的图片等）得知特工在扩散或暴露非自然事件
    ruling: true
    source: kandi 秘密；附录A 奥德里奇
- npc: adamson
  goals:
  - 鼓励特工唤回记忆
  - 配合特工完成“任务”，在呓语中迎接“死亡”
  steps:
  - id: adamson_chair
    text: 腐化达到 7 时坐在卧室的椅子上，间歇地问候她，像同时在和好几个人说话；对她的来意了然于心，不反抗“处理”
    meet: true
    once: false
    source: adamson_bedroom 幻象“他仍在这里”；adamson
  - id: adamson_ghost_talk
    text: 交谈时间歇地说夹杂非英语的问候，像同时在和几个人说话，胡话里冒出特工的名字、“温妮”、“瓦普内克”；问到邮件里的“选择”只摇头：“寻求选择的意义就是选择本身。”守秘人可以让他的话变成一团乱麻，借此悄悄透露特工忘掉的两段过去（从
      2 月 8 日至 12 日追查悖论的经历中选取）
    meet: true
    once: false
    source: adamson_bedroom 幻象“他仍在这里”（阈值 7）；c_adamson_ghost
  - id: adamson_after_death
    text: 被“处理”以后，特工离开再回来时，腐化≥7 他仍平静地品味着死亡；腐化<7 尸体不翼而飞，准备好的材料变成潦草的图画
    when: flag:halting_done
    meet: true
    once: false
    source: adamson_bedroom·再会，亚当森
  - id: adamson_lure
    text: 随着腐化升高，他越来越脱离她理想中的形象，用性或好奇心引诱她；腐化≥30 时可在街上从背后拍她的肩（示例“雨中交合”）
    when: flag:corr_30
    only_if: 守秘人按此刻腐化≥30、特工独处或在室外时引入
    ruling: true
    source: 重要角色·亚当森；bar 示例“雨中交合”
  - id: adamson_theatre
    text: 在剧院里可以鼓励她对抗，也可以劝她停手回到生活，或者讲卡尔克萨的知识，几种态度之间快速切换
    meet: true
    once: false
    source: 剧院·迷途羔羊的羔羊
- npc: peter
  goals:
  - 让演出连上网络，转播到中央广场的大屏
  - 保护地窖里的电脑
  steps:
  - id: peter_day_corner
    text: 白天窝在酒吧角落听随身听、敲节奏，不想理人；被问到网站就装傻，自称磁带收藏家；有人跟他聊音乐、聊得在行，他愿意多说几句
    meet: true
    once: false
    source: peter；p27
  - id: peter_cellar_check
    text: 每天下午两点左右进地窖检查中央广场的程序，其余时间在大厅
    when: hour:14-15
    does: at:peter:bar_cellar
    source: p27
  - id: peter_back_hall
    text: 检查完回到大厅的角落
    when: hour:15-23
    does: at:peter:bar
    source: p27
  - id: peter_admit
    text: 拿出确凿证据证明他的身份，他就停下抖腿，承认自己是悖论成员，除了演出时间什么都不说；特工一有攻击性他就拒绝再提供信息，但愿意当中间人把她介绍给吉姆
    meet: true
    once: false
    source: p27；c_peter_admits
  - id: peter_tell_jim
    text: 起疑或身份暴露后不动手，照常行事，夜里把特工的事告诉吉姆
    when: hour:18-6
    meet: false
    only_if: 皮特在当面交谈中对特工起了疑，或身份已经被她揭穿
    source: p27
  - id: peter_notice_cellar
    text: 悖论成员发现特工进了地窖，就在她进去以后偷偷锁上门
    meet: false
    only_if: 皮特、约瑟芬或吉姆亲眼看见，或听员工说特工进了地窖
    source: bar_cellar；e_cellar_trapped
  - id: peter_ritual
    text: 午夜经剧院去宅邸，做吉姆与约瑟芬仪式的见证人，持续约两小时
    when: hour:0-2
    does: at:peter:mansion_playroom
    source: 格林伍德宅邸·监视；理解为三人都在场
  - id: peter_fix_screens
    text: 每天远程检查时发现屏幕被动过，就立刻离开酒吧赶去中央广场维修
    meet: false
    only_if: 特工在演出前解除了皮特对中控电脑的控制或植入了病毒，皮特在每天的远程检查中发现
    source: central_plaza；p20
  - id: peter_final_check
    text: 演出当天白天在中控室做最后检查
    when: D4 12:00
    does: at:peter:plaza_control
    source: p20；e_peter_plaza_check
  - id: peter_to_park
    text: 跟悖论一起经现实前往海滨公园
    when: D4 20:00
    does: at:peter:seaside_park
    source: p50；e_paradox_arrive
- npc: josephine
  goals:
  - 获取幸福
  - 帮吉姆完成理想
  steps:
  - id: jo_day
    text: 白天心不在焉，前言不搭后语，讲酒吧怎么经营，偶尔把特工当成前几天的情人，动手动脚；问起悖论、血迹、网站，就照她的谎话回答
    meet: true
    once: false
    source: josephine；p26
  - id: jo_cellar_ok
    text: 特工申请进地窖，她干脆地答应
    meet: true
    once: false
    source: bar_cellar
  - id: jo_night
    text: 夜里不再放荡，目光止不住地朝吧台旁的吉姆看
    when: hour:18-24
    meet: true
    once: false
    source: p26
  - id: jo_midnight
    text: 午夜从铁门溜进剧院
    when: hour:0-1
    does: at:josephine:theatre
    source: c_josephine_midnight
  - id: jo_ritual
    text: 在宅邸娱乐室与吉姆举行“爱之仪式”，约两小时
    when: hour:0-2
    does: at:josephine:mansion_playroom
    source: 格林伍德宅邸·监视；mansion_playroom
  - id: jo_back_bar
    text: 仪式结束后回到酒吧
    when: hour:2-24
    does: at:josephine:bar
    source: p26（约瑟芬日夜都在酒吧）
  - id: jo_cellar_visit
    text: 特工被锁在地窖里时，午夜和吉姆一起去地窖找她（见 e_cellar_trapped）
    when: flag:cellar_locked
    meet: false
    source: e_cellar_trapped
  - id: jo_to_park
    text: 跟悖论一起前往海滨公园
    when: D4 20:00
    does: at:josephine:seaside_park
    source: p50
- npc: jim
  goals:
  - 用 SI 统一众人的思想，把剧院推向永远即将抵达王的宴会的那一刻
  steps:
  - id: jim_bar_night
    text: 天黑后推开铁门走进酒吧，带着平静的微笑独自坐在吧台旁喝酒
    when: hour:18-24
    does: at:jim:bar
    source: p28
  - id: jim_talk
    text: 对谁都温和宽厚，不生气，还会出面阻止冲突；问到杀父、施虐，毫不犹豫地承认；问到目的就绕开话题，最后反问她能否构建永远幸福的生活
    meet: true
    once: false
    source: jim；p28
  - id: jim_ritual
    text: 午夜在宅邸娱乐室与约瑟芬举行仪式，约两小时
    when: hour:0-2
    does: at:jim:mansion_playroom
    source: 格林伍德宅邸·监视
  - id: jim_day_theatre
    text: 白天不出现在酒吧，在剧院或卡尔克萨中（白天的去处原文没写，是补写）
    when: hour:6-18
    does: at:jim:theatre
    source: 补写
  - id: jim_to_park
    text: 前往“很早以前就决定了的地方”海滨公园，8 点 18 分开演（见 e_finale）
    when: D4 20:00
    does: at:jim:seaside_park
    source: p50；c_camera_footage
  - id: jim_plea
    text: 特工挤进人群、来到彼岸的边缘时，吉姆欢迎她，由衷地劝她放弃阻挠；她接受，就离场或留下参与演出
    when: flag:finale_started
    meet: true
    once: true
    source: c_jim_plea；p52
- npc: mathia
  goals:
  - 成为优秀的恐怖小说作家
  steps:
  - id: mathia_help
    text: 出于好奇，答应帮特工分散店员的注意力；简单的警告反而勾起她的兴趣；特工遇险时她会伸手
    meet: true
    once: false
    source: mathia；p29
  - id: mathia_final_night
    text: 得到她的信任后，她可能在最后一夜协助特工阻止演出
    only_if: 特工在此前的接触中实际赢得了她的信任，并在最后一夜向她求助
    ruling: true
    source: p29
  - id: mathia_lost
    text: 特工没帮过她的，她渐渐被黄衣之王影响，在最后的演出中陷入疯狂与失忆
    when: D4 20:00
    does: at:mathia:seaside_park
    only_if: 特工一直没有帮助她、取得她的信任
    source: p29
- npc: bart
  goals:
  - 执行另一个现实里的“停机行动”，追踪特工 A
  steps:
  - id: bart_probe
    text: 腐化≥21 时出现在酒吧，不暴露身份，像特工一样主动向她提问；她拿出惊人一致的证据，他才交换信息
    meet: true
    once: false
    source: bart；p30
foreshadow:
- id: fs_knuckle_rhythm
  hint: 阿尔伯特看报时，指关节在茶几上一下一下敲着一段短促又不太规整的节奏，他自己好像没察觉。
  where: agent_home
  pays_off: e_plaza_broadcast
  stages:
  - hint: 早餐桌边，爱丽丝用勺子柄敲着盘沿，敲的是同一段节奏；问她，她说是“好听的歌”，却哼不出来。
    when: D2 08:00
  - hint: 街上、广场上，越来越多陌生人的手指在扶手、手机壳上敲着那段节奏，彼此并不看对方。
    when: D4 08:00
    where: central_plaza
- id: fs_kandi_papers
  hint: 坎蒂留下的那几张安眠药发票摸上去有点潮，印刷的字迹边缘发虚，像没干透的墨。
  where: agent_home
  pays_off: k_adamson_dead
  stages:
  - hint: 再翻出那叠材料，伪造遗书的一角已经洇成一团意义不明的线条，像小孩的涂鸦。
    when: D2 08:00
- id: fs_unconscious_notes
  hint: 床头柜上压着一张纸，字是你的笔迹，你却不记得写过，也读不太出来写的是什么。
  where: home_bedroom
  pays_off: k_agent_self
  stages:
  - hint: 衣柜深处挂着一件你从没买过的灰色粗布长袍，叠在下面的还有一样苍白、光滑的东西。
    when: flag:corr_20
    flag: sign_fs_unconscious_notes_1
- id: fs_wall_voice
  hint: 四下安静时，隔间的墙里像有人在很远很深的地方说话，带着浓重的回声，一个字也听不清。
  where: bar_restroom
  pays_off: k_stop
  stages:
  - hint: 墙里的声音近了些，语气急切，像在恳求什么人；中间夹着一下下液体滴落的声音。
    when: flag:corr_25
- id: fs_light_band
  hint: 晴朗的天上横着一道极淡的光，像有人用手指在天幕上抹过，路人谁也没抬头。
  where: adamson_home
  pays_off: k_site
  stages:
  - hint: 那道光带在头顶折了一个角，和另一道光带接上，朝城东海边的方向拖过去。
    where: horn_media
  - hint: 站在宅子前抬头，两道光带又在这里拐了个弯，比之前更亮，像地图上画出的折线。
    where: greenwood_mansion
- id: fs_plaza_water
  hint: 明明没下雨，广场的路面却积着一层薄水，水沟口卡着几片发白的碎贝壳。
  where: central_plaza
  pays_off: e_plaza_broadcast
  stages:
  - hint: 积水漫过了鞋面，有死去的小鱼贴着脚踝漂过，商场门口的人照常进出，鞋都是干的。
    when: D4 08:00
    flag: sign_fs_plaza_water_1
- id: fs_stale_ad
  hint: 东北角那块大屏还在循环放一则早就过期的情人节促销广告，日期停在上周。
  where: central_plaza
  pays_off: k_broadcast
  stages:
  - hint: 那则过期广告仍旧没换；屏幕下面的商场保安抬头看了一眼，嘟囔着“又没人管”。
    when: D3 08:00
