- id: theatre_dream
  name: 造梦机车厢
  within: theatre
  art: theatre_dream
  read_aloud: 车厢里立着一台蒸汽时代风格的机械：中央是一块古旧的二色曲面显示器，下方两个喇叭和一个投币口，右侧装着一根带圆球的扳手，上方一道窄缝里伸出一条很长的纸带，左侧挂着一副可以摘下来的、像望远镜一样笨重的眼镜。旁边放着一只箩筐。
  keeper: '尝试理解它的构造和功能 SAN 0/1。它运行一个微型世界（不一定是特工所处的那个），纸带影响运算，带遗传物质的胶囊决定模拟对象，戴上眼镜能以对象的身份体验并影响它；不能逆算，遗传物质耗尽自动暂停。使用一次腐化
    +4。

    运行：拉右侧拉杆，它以不稳定的频率摇晃，喇叭报“已匹配”后开始运作：吐出更多纸带，显示器图像变清晰，伴随刺耳音效。戴上眼镜会被强制拉回“现实”继续行动，并做意志检定（加一个惩罚骰，原文意志*5-20）：成功则在现实中清楚知道自己“正在使用某机械观察”，可以主动回到车厢。无论如何，现实剧情只前进半天就被强行拉回这间车厢，合成音说：“请植入一枚新的胶囊。”

    新胶囊：箩筐里有空白纸带和圆形透明小盒，各自标注某个对象的姓名、样貌和起始随机值编码，多为特工的重要之人或模组角色；科学检验可知是对应人物的染色体溶液。投入后模拟这些人在现实中的生活（被腐蚀的好友插科打诨、伴侣因亲密度下降而不忠等），大多是真的；戴眼镜以其视角进入（同样过意志检定），最多两小时就被强行拉回：“警告。胶囊匹配度过低，已弹出。”

