- id: greenwood_mansion
  name: 格林伍德宅邸
  art: greenwood_mansion
  read_aloud: 奥克兰东南部的罗伯勒多大道，紧邻一条穿过市中心的铁道。一栋三层楼的宅子，带独立车库和不太大的庭前花园。花园里不对称地立着两座大理石喷泉，杂草歪倒；米白的墙面喷了漆，正面门廊和对着花园的窗户雕花复杂，却久未打理。门窗紧闭，窗帘拉得死死的。
  keeper: '在都市里格格不入却无人注意。找到这里的途径：皮特办公室的偷拍照片（路牌）或调查约瑟芬的信息。腐化>30：光带在此形成折角。

    监视：昼夜门窗紧闭；白天没有人车进出；接近半夜灯亮了（悖论进入宅邸）；午夜后二楼主卧方向传来鞭打声和一女两男隐约的喊叫（和约瑟芬、皮特、吉姆交谈过就能分辨），持续约两小时。

    进入宅邸：环境腐化 10，进入时个体腐化 +1。一层门廊左侧是独立车库，门廊进去是一体式的厨房、餐厅和客厅；储物间在通往二楼的楼梯转角，卫生间隔壁。二楼有主卧、马里亚诺的书房、客卧、卫生间和与门廊同面的阳台。三楼有儿童卧室、娱乐室和露台。宅中死亡的人腐化>20
    时以诡异姿态复活。

    宅邸前往剧院（阈值 30）：吉姆卧室和书房的窗外不是街景，而是离地半米高的门；一层储物间的柜门也连着剧院。

    '
