- id: theatre_pleasure
  name: 通往愉悦之路
  within: theatre
  art: theatre_pleasure
  read_aloud: 车厢外就能听到鞭打声和嚎叫。推开门，里面几乎和宅邸的娱乐室一模一样。
  keeper: '若特工已经历过“八次鞭子”，建议略去这个事件。悖论三人在举行仪式：赤裸的约瑟芬和吉姆蹲坐在台球桌上纠缠，约瑟芬尖叫，血从佩戴金属饰品的伤口流出，她身上刻满不同形状的黄印；皮特以朝圣者的态度递上工具。三人血腥地交媾、喊叫、舞蹈直到筋疲力尽，不会意识到特工；受到攻击只会狂欢大叫。或者他们注意到闯入者，转入“八次鞭子”。目击暴力
    SAN 0/1D4。

    仪式结束后三人短暂呆滞；亚当森不知从哪冒出来，拽着特工往门外跑：“不能，他不能直视。”不离开的话：吉姆的身体里分裂出一个赤裸的男性，头部是一团跳动的黑线——达夫。目击最坏的一幕会瞬间回忆起自己遭遇的一切：SAN
    1/1D8，腐化 +4；吉姆主动介绍达夫·格林伍德，达夫没有反应。

    八次鞭子：吉姆盛情邀请特工加入与神联系的仪式：连续 8 次鞭打，每两次受 1D2 伤害、SAN 0/1，并须过体质检定，否则晕倒；后背烙下黄印形的伤痕；增加等于仪式中理智损失总值的腐化。撑过之后，吉姆和约瑟芬邀请特工一同交媾，皮特摊手鼓励；完成整个仪式
    SAN 0/1D6，腐化 +2。结束后可与平静的吉姆交流，剧院知识混乱地灌注进来，此后“心想事成”检定 +20。发现身上刻的是黄印额外 SAN 0/1D3，腐化 +2。特工可随时终止逃离，他们不阻拦；晕倒醒来时三人已经不在。

