- id: other_side
  name: 彼岸·奥克兰
  art: other_side
  read_aloud: 这里和奥克兰极其相似，只是整座城市完全浸没在湖水之下。维多利亚式装潢的铁制电车悬浮着驶过，摩天大楼的棱角上布满复杂的浮雕，天空中漂浮着一盏盏电灯，上面插满铜质的喇叭。没有白天，两轮月亮永恒地悬在水面之上。
  keeper: 'SI 预演孕育的新世界，理想主义，位于卡尔克萨又在其外；随正式演出推进而无限逼近王的宴会，永不抵达，时间尺度被拉长到无穷。它收留众多旅者，人们以抵达宴会为终极目标而欢悦，祝贺拿到邀请函、搭乘剧院的人。环境腐化
    30，不提供时间腐化。

    进入彼岸：现实记忆模糊，大量彼岸信息涌入；特工过着与现实区别不大的生活，不幸和矛盾尽数移除，自己不再是三角洲的一员（同尤里卡时刻）。极力渲染正常的氛围。

    琐事：邮箱里塞满同事的生日派对和婚礼邀请；街坊热情攀谈；路人拍肩拥抱：“听说你拿到了邀请函！我的天！祝贺你，祝贺你。祝福我们的王。”

    铜管声：每隔一段“时间”，若有若无的铜管声响起，随后所有电灯上的喇叭播放音乐，行人驻足高喊“祝福我们的王！”，特工发现自己嘴里也在喊；循着最初的声音可以走到彼岸的边缘。

    离开彼岸只有两种办法：找到剧院站台，进入停靠的剧院，按剧院的规则回到现实；或找到造梦机，借它回到现实。

    现实中：破碎的幻象干扰旅途；疯狂发作时做腐化值检定，成功则意识再入彼岸或触发彼岸事件，特殊场合也会引发。

