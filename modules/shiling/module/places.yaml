locations:
- id: agent_home
  name: 特工的家
  art: agent_home
  read_aloud: 楼下的客厅连着门廊，门上有猫眼。客厅一角立着书架，茶几上放着家里的座机电话。楼梯通往二楼的卧室，客厅一侧是书房的门。
  keeper: 特工与丈夫阿尔伯特、6 岁女儿爱丽丝的家（原文只写“特工的家”，具体陈设为 AutoKeeper 补充）。它是被腐蚀的地点之一，是地图上黄印的一个转折点，原文未给环境腐化值。家人会被深夜出门吵醒；多次目睹特工的怪异举动会偷偷联络心理医生（附录C）。剧院中无明确去处时主动离开，会回到这里或亚当森家。书架上可能找到《纸牌大学（第一卷）》。
  features:
  - 门廊与猫眼
  - 书架
  - 客厅的电话
  scene_root: true
  outdoors: false
  ground: building
  looks:
  - when: at:kandi:agent_home
    change: 门廊外的路边停着一辆熄了引擎和车灯的深色轿车
  views:
  - key: home_door_peephole
    label: 门廊的门与猫眼
    features:
    - 门廊与猫眼
    prompt: 深夜，客厅通往门廊的木门紧闭，门上一枚小小的猫眼，门缝底下透进一线路灯的冷光，门边挂着外套和钥匙。
  - key: home_living_phone
    label: 茶几上的座机
    features:
    - 客厅的电话
    prompt: 客厅茶几上一部家用座机电话，听筒搁在机座上，旁边有遥控器和几本杂志，台灯光线昏黄。
- id: adamson_home
  name: 亚当森的住所
  art: adamson_home
  read_aloud: 北奥克兰林登街 2441 号，一栋灰黑屋瓦、亮白墙面的两层临街小楼，夹在两条单行道之间。屋里的灯全关着，一进门就是通往二楼的楼梯。屋子有打扫过的痕迹，很多房间却像很久没人用，空气里有一股略带腐败的潮味。
  keeper: '房子现归亚当森的妻子温妮名下。亚当森牺牲后温妮搬离奥克兰，临走托特工照看并交了钥匙，特工一直把这里当安全屋（特工不记得）。特工会不假思索从包里拿出考克斯家的钥匙；被指出时答：“由于你和亚当森关系不错，不久前，温妮搬离这里的时候就拜托了你帮忙照看这栋屋子。”特工若执意去自己的安全屋，会发现那里已经有一段时间没用了；打算回家休息时，也可能不由自主走到这里。

    环境腐化 3，白天也能看见部分幻象。腐化>30：天空中两条巨大的光带在这里形成折角。腐化>25：桌上那摞书里有一本幻视为《瓦普内克剧院》。

    房子背面是一个小公园，有旧秋千和滑梯。

    可选：撞见温妮（建议放在后期）：她惊人地包容，“这不是你的错。你应该早点放下这件事”；特工上二楼她也不惊讶；问亚当森在做什么：“我不知道。我想他应该在做自己真正喜欢的事情。”

    '
  features:
  - 桌上一摞书
  - 门厅楼梯
  - 背面的小公园
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: adamson_book_stack
    label: 桌上的一摞书
    features:
    - 桌上一摞书
    prompt: 昏暗屋里的桌面上摞着几本书，最上面是一本小说集和一本纸牌魔术书的第二卷，桌面有擦拭过的痕迹，四周空气潮闷。
  - key: adamson_back_park
    label: 屋后的小公园
    features:
    - 背面的小公园
    prompt: 房子背面的小公园，一架掉漆的旧秋千和一座小滑梯，草地上没有人，灰白的天光。
  looks:
  - when: knows:players:clue:c_warpneck
    change: 那摞书里多出一本棉线装订的正方形手绘小画册，封面是黑色涂鸦字体，书页边缘露出狂躁的批注。
    'on': adamson_book_stack
- id: adamson_bedroom
  name: 亚当森的卧室
  within: adamson_home
  art: adamson_bedroom
  read_aloud: 二楼卧室。开灯后，纸张乱扔一地，一支笔尖歪掉的钢笔躺在四散的墨水里，快餐盒散发着恶臭。电脑歪斜地放在书桌上，电源线被粗暴地拔了出来。床被移到窗边，掀起来挡住了窗户。书桌上压着两张纸。
  keeper: '床是特工自己挪去挡窗的。书桌上的座机与电脑都能用。

    幻象“他仍在这里”（阈值 7）：亚当森坐在椅子上（见 NPC 亚当森）。示例：白天个体 1＋环境 3＝4，看得见邀请函，看不见亚当森，只听见不连续的呢喃；看过黄印后达到 8，亚当森悄无声息出现在角落。

    再会，亚当森：亚当森“死”后无人报案。特工离开后再回卧室时腐化<7：尸体不翼而飞，准备的材料变成潦草的图画，房间仍然混乱；否则与离开时无异，亚当森平静地品味着死亡。

    从这里进入剧院（阈值 30）：窗户变成木门，整面墙变成木质，推开是行驶中的火车走廊。

    '
  features:
  - 书桌上的第一张纸条
  - 书桌上的第二张纸条
  - 电脑
  - 座机
  - 挡住窗户的床
  outdoors: false
  ground: building
  views:
  - key: adamson_desk_notes
    label: 书桌上的两张纸
    features:
    - 书桌上的第一张纸条
    - 书桌上的第二张纸条
    prompt: 凌乱的书桌上压着一张皱巴巴的打印纸，上面是工整的手写乱码；旁边一支笔尖歪掉的钢笔躺在四散的墨水里，桌角堆着发臭的快餐盒。
  - key: adamson_unplugged_pc
    label: 拔了电源的电脑
    features:
    - 电脑
    prompt: 书桌上一台台式电脑歪斜地放着，电源线被粗暴地从插口扯出来垂在桌边，屏幕漆黑，旁边是一部座机。
  - key: adamson_bed_window
    label: 挡住窗户的床
    features:
    - 挡住窗户的床
    prompt: 一张床被拖到窗边竖着掀起，床板和床垫把整扇窗户挡得严严实实，地上散落着纸张，只有缝隙里漏进一点外面的光。
  looks:
  - when: knows:players:clue:c_invitation
    change: 打印纸旁边多了一张崭新精致的米色卡片，印着花卉卷草纹、一行网址和花体英文，结尾印着一个黑色的符号。
    'on': adamson_desk_notes
- id: nppd_office
  name: NPPD 第九区办公室
  art: nppd_office
  read_aloud: 国土安全部国家保护与计划局第九区的加州办公室。大厅里电话声此起彼伏，靠墙一排独立办公室隔着玻璃和百叶窗，其中一间的百叶窗拉着，门牌还没换。
  keeper: '用于塑造特工前期平静的日常。两个月前亚当森的大部分材料已被三角洲处理，前任负责人也被调走。调查需要现任负责人伯莎·史密斯许可。

    若特工也在第九区工作（预设调查员诺拉即是）：前任负责人交接时说过特工可能在和亚当森的共同任务中受了精神冲击，需要照顾；特工是老员工，受伯莎尊敬；问起亚当森时伯莎表示遗憾并明显回避；她注意到特工从
    9 号起没按要求出勤，但不会主动提（或特工已请假）。

    幻象“音容宛在”（阈值 16）：检查亚当森办公室时闪过混杂幻象的过去——椅子上埋头办公的“亚当森”，耳边一句“我来收拾你的东西了”，“亚当森”点头。（真实记忆与虚假认知杂糅：收拾东西的是特工自己，那时亚当森已死。）

    '
  features:
  - 大厅
  - 伯莎的办公室
  - 前任负责人的电话
  scene_root: true
  outdoors: false
  ground: building
- id: adamson_office
  name: 亚当森的办公室
  within: nppd_office
  art: adamson_office
  read_aloud: 独立办公室，与大厅隔着隔音很好的玻璃和百叶窗。桌上有一台个人电脑、一架飞机模型、一本日历、一堆散乱的文件，还有一张亚当森和温妮的合照。一切都摆在原处，却干净得过分。
  keeper: 原文前后矛盾：既列出这些物品又说“清理一空”。照录为物品都在，电脑已被格式化，文件里找不到任何有用材料。
  features:
  - 格式化的电脑
  - 散乱的文件
  - 和温妮的合照
  - 飞机模型与日历
  outdoors: false
  ground: building
  views:
  - key: adamson_office_desk
    label: 干净得过分的办公桌
    features:
    - 散乱的文件
    - 和温妮的合照
    - 飞机模型与日历
    - 格式化的电脑
    prompt: 玻璃隔间里的办公桌：一台个人电脑、一架飞机模型、一本台历、一堆散乱摊开的文件，还有一张一对夫妇的相框合照；桌面一尘不染，像是有人刻意清理过。
- id: horn_media
  name: 加州鹿角传媒公司
  art: horn_media
  read_aloud: 新地大厦第九层。办公区清爽明亮，小大厅里有四个客服卡座，两侧是独立办公室。进门的走廊挂着在职员工的照片墙。刚进门，就听见一个中年男人在打电话：“好的，我们会尽快派人员处理。嗯，是的。”电话一挂，他怒吼了一声：“该死的，他在哪里！”
  keeper: '2005 年在奥克兰成立的小型广告公司，业务是商圈电子屏广告位出租，不足 10 名员工；每块屏幕有专门的技术顾问，皮特是中央广场的技术顾问（网上可查）。照片墙上有皮特。

    腐化>30：天空的两条光带在这里形成折角。

    '
  features:
  - 员工照片墙
  - 客服卡座
  - 奥斯丁的办公室
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: horn_photo_wall
    label: 员工照片墙
    features:
    - 员工照片墙
    prompt: 写字楼进门走廊上一排装框的员工照片，每张下面贴着姓名和职务的小标签，背景是清爽明亮的办公区。
- id: peter_office
  name: 皮特的办公室
  within: horn_media
  art: peter_office
  read_aloud: 写字楼的一角，一面落地窗对着街景。靠窗的磁带架倒了，磁带散落一地。办公桌空荡得反常。
  keeper: '奥斯丁以私人空间为由婉拒特工进入；特工亮出警方等官方身份，他立刻同意，难掩担忧。据奥斯丁说，皮特的电脑不翼而飞。环境腐化 3。

    从这里进入剧院（阈值 30）：落地窗变成木质推拉门，推开直接进入剧院走廊。

    '
  features:
  - 办公桌抽屉
  - 散落的磁带
  - 落地窗
  outdoors: false
  ground: building
  views:
  - key: peter_empty_desk
    label: 空荡的办公桌
    features:
    - 办公桌抽屉
    prompt: 办公桌上空空荡荡，只剩显示器底座留下的印子和一截空的电源线，抽屉合着。
  - key: peter_fallen_tapes
    label: 倒下的磁带架
    features:
    - 散落的磁带
    - 落地窗
    prompt: 落地窗边一只磁带架翻倒在地，上百盒磁带散落一地，窗外是白天的街景。
  looks:
  - when: knows:players:clue:c_drawer_photos_b
    change: 拉开的抽屉里露出一沓照片，其中几张是夜里隔着窗户远远偷拍的、噪点很重，一张角落拍到了一块路牌。
    'on': peter_empty_desk
- id: central_plaza
  name: 奥克兰中央广场
  art: central_plaza
  read_aloud: 两条宽大的商业街在这里交汇，四角各立着一座体量不小的商城，每座大厦的腰部都挂着一块巨大的电子屏。这里曾是奥克兰最繁华的地方，如今势头不如当年。
  keeper: '四块屏幕是鹿角传媒最重要的资产，由皮特负责。白天播无趣的商业广告；夜晚大量行人休闲，各式小型歌舞演出，屏幕转播——是最热闹的时刻。这里将成为 SI 正式演出的转播主场地，是最可怕的威胁。2
    月 18 日前屏幕一切正常。

    统一的中控室平时上锁，商场管理人员、皮特、奥斯丁有钥匙。向商场管理人员出示相关材料，他们同意带特工进中控室检查，但站在一旁阻止修改广告内容（会造成合约损失）；一切正常时，除非官方勒令，要说服他们关屏难如登天。向奥斯丁展示官方材料也可拿到钥匙。闯入：锁匠检定开锁；内外监控毫无疏漏，未经允许须隐藏身份，否则会被起诉。

    皮特每天远程检查一次屏幕，发现端倪会立刻离开酒吧前来维修；演出当天白天他也在这里做最后检查。

    停止转播（终幕当日）：破坏四块巨幕，或闯入中控室破坏电脑、解除皮特的控制。那时管理人员不知发生了什么，一边照节奏敲电话按键一边慌乱地拨电话找皮特；说服检定成功（出示文件后的交涉）可让他们打开中控室的门。终止广场转播只能缓解燃眉之急，真正的演出在海滨公园继续，并顺着互联网蚕食现实（在
    YouTube 搜关键词即可发现）。

    '
  features:
  - 四块大屏
  - 广场人群
  - 商场管理处
  scene_root: true
  outdoors: true
  ground: street
  looks:
  - when: at:players:central_plaza & hour:18-24
    change: 广场上挤满散步休闲的行人，几处空地上有小型歌舞演出，四块大屏都在转播现场表演
  - when: flag:sign_fs_plaza_water_1
    change: 广场地面泛着一层反光的积水，倒映着四块大屏。
  views:
