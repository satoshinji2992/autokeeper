- id: theatre
  name: 剧院
  art: theatre
  read_aloud: 一列维多利亚式的豪华火车。靠窗是走廊，另一侧是一扇扇带小门的隔间，小门上绘着海底动植物的工笔画。红白图案的厚地毯铺满走廊。窗外是迟钝的液体，前方不知何处喷出蒸汽状的东西，在水里漂着，拖出模糊的黑色轨迹；车轴摩擦的“哐当”声在液体里规律地回荡。
  keeper: '永远穿梭于哈利湖底的蒸汽火车，无头无尾，车厢随意连接，围绕卡尔克萨王宫徒劳旋转。只有“受邀者”能发现通道。第一次进入 SAN 0/1D6，腐化 +6。轨道越往前越不规则，最终脱离地面在液体中自由飘动，车内却始终稳定。读过《卡尔克萨王族食谱》能认出门上的生物。

    对被腐蚀者而言剧院稳固：不再支离破碎，没有耳语，不疑神疑鬼，自洽而宁静；不饿不累，该有食物的地方总堆满食物。它禁锢乘客，又受乘客思想影响：被腐蚀者可以“心想事成”，总以意想不到的形式实现；改造剧院是更深一步。

    离开剧院：剧院事件后被动离开（如“吉姆的幼年”后进入现实中的吉姆卧室）；主动离开时，下一个打开的包厢映出扭曲的现实光景，穿过即回到“现实”——想离开时须过腐化值检定，失败则是“虚假的离场”。抵达希望去的现实地点；没有明确去处就回自己家、亚当森家或进入时的位置；只能回到造访过且被腐蚀的现实地点。个体腐化>25
    可经剧院进入彼岸。

    可选：时间的把戏（出入时间不一致，向特工希望的方向偏移）；老套平行时空（花店老板反复说“你这件衣服真好看，新买的吗？”，“啊，这样的吗？可能我忘记了。”），谨慎使用。

    乘客：来自诸多时空，是理性的残渣，带着无尽的空虚；不能真正被杀死（只是信息），被破坏的部分以难解的形式恢复，裸露的伤口下是棉花和齿轮（之外黑洞洞）。尚与现实有关的人（特工、悖论）在剧院或其他严重腐蚀地之外死亡，会成为永远徘徊的乘客。乘客在走廊走动、靠窗发呆、在包厢里满足欲望。找人：推荐去餐车或问“卷心菜国王”，并神秘地建议考虑好措辞。想离开：奇怪地说“因为世界除了‘这里’没有‘那里’了”。悖论成员各处可遇，应对同酒吧；酒吧的其他角色也可能出现。剧院中可遇到任何进入过或将要进入的角色。

    虚假的离场：想离开剧院时腐化值检定失败，并没有真的离开；来到与现实无异的地方，失真症消失，可以和亲友愉快地吃晚饭，甚至继续调查——直到一声鲸鱼的叫声贯穿天空，铁路从天边浮现，四周景象像画布一样投射到车厢墙面上，然后失色失声：一直没离开剧院。SAN
    0/1D4。

    '
