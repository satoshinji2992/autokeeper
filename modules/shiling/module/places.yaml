- id: theatre_scar
  name: 渐淡的伤疤
  within: theatre
  art: theatre_scar
  read_aloud: 门外是无边无尽的海床，一片废弃的工业园区坐落其上，围着这扇打开的门。视线正中是一座倒塌了一半的工厂，风压卷着沙石从闪烁的爆炸中心扑出来——一切都像被暂停了一样停在原处。只有水还在流动，却不涌进门里。从水底往上看，水面的波光组成一张飘动的网。
  keeper: '特工自己的思想与剧院融合的产物，是亚当森死亡的现场。爆炸中心附近，亚当森被炸得腾在空中；朝园区外走，园区门口有持枪待命的特工“自己”。二人被定在原处但能交流，可从他们口中得知大部分黑线行动的事实，交互逻辑同“迷途羔羊”。附录B：巴特也可能在这里出现。

    不久，远处传来朦胧模糊的救护车和消防车声，声音突然逼近，一阵眩晕后特工回到剧院。可借此回扣开头的梦境，重现救护人员把特工运出爆炸现场的真实场景。

