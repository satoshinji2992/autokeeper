  read_aloud: 你推开门，视线忽然变得低矮。你坐在一张狭小卧室的床上，怀里抱着一个玩偶，耳边是门刚被摔上的回响。你光着身子，衣服被丢在床的另一角。深蓝色的窗帘遮住整扇窗，月光透进来，把房间照成一种幽暗而宁静的蓝。楼下传来玻璃砸碎的声音，一个女人啜泣着咒骂，一个男人在哼哼。
  keeper: '特工进入 1995 年失踪前吉姆的视角，在夜间的格林伍德宅邸。引语：“我喜欢火车。它有自己的轨道，它的乘客都将抵达最开始的那个目的地——无论他们多么意见不合。乘客不能跳下火车，观看窗户外的景色直到终点是他们登上火车时就决定好了的事实。”

