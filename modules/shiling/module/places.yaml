- id: simpton_building
  name: 辛普敦大厦
  art: simpton_building
  read_aloud: 一栋建于 1985 年的旧大楼，临街一层是报刊亭、汉堡店和花店。通往负一楼的台阶下面，是一扇积着厚灰的临街玻璃门。
  keeper: '皮特电脑的 IP 指向这里；预告片提示酒吧在地下。

    腐化≤20（BAR NOT FOUND）：负一楼看上去是一家正在转让的老玩具店铺，存在感微妙，装潢俗套过时，临街玻璃积着厚灰。靠近能听见里面的架子鼓声和对话声，透过玻璃却空无一人、久未营业。凝视太久会注意到灰上被擦去的痕迹组成黄印（第一次目击黄印的腐化
    +4）。执意进入：一瞬间来到“热闹非凡”的酒吧，因无力感 SAN 0/1D3，腐化 +2。

    腐化>20：酒吧正在营业，透出温馨的气息；负一楼门面上一块有坏点的霓虹灯写着“12:00 a.m. Alarm”，下方的高脚杯霓虹灯条光线不均；正门是两扇对开木门，钉着刻有“1996”的金属铭牌；门内有交谈声和玻璃杯碰撞声。腐化>30：天空的光带在这里形成折角。

    问街道商户和行人：“有这么一个店吧？但是不是很早以前就倒闭了？”模棱两可。

    '
  features:
  - 负一楼的门面
