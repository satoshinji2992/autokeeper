- id: bar
  name: 凌晨十二点闹钟酒吧
  art: bar
  read_aloud: 一间长方形的大房间。木桌、沙发和隔断随意摆着，中间一小块舞池正对着贯穿整个酒吧的吧台，舞池旁有一套架子鼓。天花板上挂着几台电视，承重柱上的灯向下投出紫色和绿色的柔光。四面是光滑的水泥墙，低处贴着蓝黑相间的瓷砖，高处镶着颜色各异的金属块，不规律地挂着几幅笔触粗粝的油画肖像。
  keeper: '前身罗伯特书店，荷尔蒙与腐败的气息吸引着片区里的颓丧人士。它与剧院深刻相连，像从世界上割下来的一块碎片：纸质记录忠实，却从附近居民的认知中被抹除。2 月 12 日演出后保留了黄衣之王的影响，成为剧院的一部分，低腐化时看来尚算正常。环境腐化
    5；进入时个体腐化 +1。

    进门所见“热闹非凡”：老板在柜台后托着下巴懒散地看着闯入的客人，酒保在桌椅间穿梭，零星几个客人。连着员工办公室、后厨、卫生间和地窖（通往地窖的门隐藏在幻象中）。员工是老板加三名长期员工和一名临时员工。顾客连特工共
    13 人（吉姆、皮特、马蒂亚、托马斯、巴特每少一人减一）。

    人物分三类：悖论成员、SI 预演观众、经剧院来的乘客。预演观众占多数：个体腐化 12，白天 17、夜晚 27；可以离开但下意识会回来，直到成为剧院居民；白天保留现实思维，忘了演出，有人隐约记得见过特工却想不起时间；晚上混乱，言语神经质，掺着“邀请函”“舞会”之类卡尔克萨用语。剧院来客是其他时空的被腐蚀者（精神病院病人、三角洲行动中失踪的特工、出演黄衣之王舞台剧的演员，甚至未来的特工自己），要一定腐化才看得见。酒吧中死亡的人在腐化>20
    时都以诡异的姿态复活。

    可以塞进违和元素：不属于这个世界的人头钞票、泡着巨型甲虫的果汁。

    监视酒吧：白天没有顾客，日落后零星有客人进入，次日日出才稀稀拉拉离开（数量比进去的少）。夜晚腐化>20 时灯光渐亮，窗户映出移动的人影，尽管没看见任何人进入。监视中看不到约瑟芬、皮特、吉姆离开（他们都经剧院移动）。

    幻象“他/我造访过这里”（阈值 10）：幻视第一次进入酒吧（2 月 12 日）；进门一瞬，门上玻璃的倒影是亚当森的脸，嘴一张一合，SAN 0/1，随即消失。灵感成功能理解镜中亚当森在说什么，守秘人可借此放出暗示记忆的信息。

    幻象“他/我闯了进去”（阈值 15）：约黄昏时，监视中看到一个很像亚当森的人小心翼翼、左顾右盼地进入酒吧——那是当时自己进入的情形。

    示例“雨中交合”（腐化≥30）：无云的天空下着雨，街道积水，腐坏的贝壳和死鱼虾流过靴边；有人从后面拍肩，是幻象亚当森，在耳边说：“你不能从那个夜晚逃脱自己的命运，如果没有我。你欠我很多东西。”不反抗则缠绵合二为一；反抗须过意志检定（加一个惩罚骰，原文意志*5-20），失败则像被固定在泥潭里动弹不得。次日醒来赤身裸体躺在随便什么地方，带着特殊的疼痛和性器官被粗暴使用的痕迹（沾血的树枝、刮着血的墙缝、井盖的洞眼）。SAN
    1/1D6，腐化 +2。

    可选“皮特的舞会”：夜里皮特更活跃，进舞池找舞伴、高唱、跳滑稽的舞步，预告片的节奏回响，引来其他客人加入；腐化 +1；可诱发失真症发作，作为第一次进入剧院的契机。

    前往剧院（阈值 30）：一扇时不时有人进出的铁门，偶尔有顾客端着酒杯直接走进去。腐化<30 时试图开门，它只是钉在墙上的一幅画，SAN 0/1D3，腐化 +2。

    '
