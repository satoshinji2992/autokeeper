locations:
  - id: cemetery
    name: 埃森公墓
    art: cemetery
    weather: [rain]
    aliases: [墓园, 葬礼现场]
    public: true
    read_aloud: 雨中的公墓，黑伞围着新挖的墓穴，一口沉重的橡木棺材停在穴边，花圈被雨打得耷拉下来。
    keeper: |
      开场地点。葬礼进行中，沃德蒙特主持；洛特道别时棺材会自燃（e_coffin_fire）。火熄后可检查残骸，原文未写检定。
      棺材是阿克塞尔的：守灵夜艾伯哈德把约兰的骨灰撒了进去并施放熔铸之血，棺里留下一把刻着熔铸之血咒文的匕首。
    features: [烧过的棺材残骸, 棺底的骨灰, 棺里的匕首]
    scene_root: true
    outdoors: true
    ground: graveyard
    views:
    - key: cemetery_coffin_wreck
      label: 烧过的棺材残骸
      features:
      - 烧过的棺材残骸
      - 棺底的骨灰
      prompt: 雨里冒着细烟的焦黑橡木棺材残骸，棺板烧塌、边缘炭化，棺内是一副烧得干干净净的骨架，骨架下面和棺底积着厚厚一层灰白的骨灰，雨水打在灰上溅出小坑，没有油迹
    - key: cemetery_coffin_ash_bed
      label: 棺底的灰堆
      features:
      - 棺里的匕首
      prompt: 焦黑棺板之间堆着湿透的灰白骨灰，碎炭和烧弯的铜钉散在灰里
    looks:
    - when: knows:players:clue:c_coffin_bones
      change: 骨头断面和关节处夹着金属光泽，摸上去冰冷坚硬，像金属
      'on': cemetery_coffin_wreck
    - when: knows:players:clue:c_dagger
      change: 灰里露出一把做工精致的匕首，柄上刻着和配枪握柄一面相近的花纹，刻痕明显是手工雕的
      'on': cemetery_coffin_ash_bed
  - id: manor
    name: 赫施伯格庄园
    art: manor
    aliases: [赫施伯格家, 庄园, 沃德蒙特家]
    public: true
    entry: manor_hall
    scene_root: true
    read_aloud: 赫施伯格家的庄园。
    outdoors: false
    ground: building
    looks:
    - when: at:soldier:manor_hall
      change: 庄园门前的车道上停着一辆黑色梅赛德斯，穿灰制服的司机站在车边淋着雨等候
  - id: manor_hall
    name: 庄园大厅
    within: manor
    art: manor_hall
    weather: [flicker]
    read_aloud: 挂着黑纱的大厅，壁炉烧得很旺，角落里立着一架三角钢琴，仆人们压低声音来来去去。
    keeper: |
      家人和仆人在这里。仆人会抱怨艾伯哈德守灵夜偷跑出去；打听艾伯哈德异常行为可得知三年前的农场。
      守秘人认为合适时，艾伯哈德会穿着改版的兰伯特制服在这里迎接调查员（c_uniform）。沃德蒙特死后小女孩一幕也在这里（e_daughter）。
    features: [三角钢琴, 守灵用过的灵堂]
    outdoors: false
    ground: building
    views:
    - key: manor_grand_piano
      label: 角落里的三角钢琴
      features:
      - 三角钢琴
      prompt: 黑漆三角钢琴立在挂着黑纱的大厅角落，琴盖半开，谱架上摊着乐谱，琴凳上搭着一条孩子的小披肩，壁炉的火光映在琴身上
    - key: manor_wake_room
      label: 守灵用过的灵堂
      features:
      - 守灵用过的灵堂
      prompt: 撤走棺材后空出来的灵堂，黑布罩着的长桌，烧到底的蜡烛残根，凋萎的白花圈靠在墙边，几把椅子还摆成守夜时的样子
  - id: eberhard_room
    name: 艾伯哈德的卧室
    within: manor
    art: eberhard_room
    read_aloud: 卧室里香水味浓得呛人，梳妆台上摆满瓶瓶罐罐，衣柜门半掩着，床上扔着几件丝绸衣物。
    keeper: |
      衣柜里是黑丝、紧身胸衣、高跟皮靴、各种假发和化妆品、假胸，其中有符合相关案件目击证人描述的衣服。
      银行保险柜的钥匙在这个房间里。打字转录本与图册也可能放在这里（AutoKeeper 默认放在塞格利办公室，守秘人可改放此处）。
    features: [衣柜, 梳妆台]
    outdoors: false
    ground: building
    views:
    - key: eberhard_wardrobe
      label: 半掩的衣柜
      features:
      - 衣柜
      prompt: 半掩的雕花衣柜门缝里露出丝绸裙摆和蕾丝花边，柜门上挂着一件深色外套，地上散着香水瓶
    - key: eberhard_vanity
      label: 摆满瓶罐的梳妆台
      features:
      - 梳妆台
      prompt: 梳妆台镜子前挤满香水瓶、粉盒、口红和眼线笔，粉扑上沾着脂粉，几个小抽屉半开着
    looks:
    - when: knows:players:clue:c_wardrobe
      change: 衣柜敞开：成排的黑丝袜、紧身胸衣、高跟皮靴、几顶假发和一副假胸，挂着几件艳俗的女式外衣
      'on': eberhard_wardrobe
    - when: knows:players:clue:c_key_found
      change: 抽屉里躺着一把带编号牌的银行保险柜钥匙
      'on': eberhard_vanity
  - id: waldemont_room
    name: 沃德蒙特的书房与卧室
    within: manor
    art: waldemont_room
    read_aloud: 整洁的书房连着卧室，书架上是会计和工业年鉴，书桌收拾得一丝不苟。
    keeper: 办公室和卧室都找不到他偷拍文件的任何线索。侦查可在书桌下方找到一把手枪，他会解释为防身。
    features: [书桌下方, 书架]
    outdoors: false
    ground: building
    views:
    - key: waldemont_desk_under
      label: 书桌下方
      features:
      - 书桌下方
      prompt: 一丝不苟的书桌，桌下暗处是整齐的抽屉柜和桌腿，地毯平整
    - key: waldemont_bookshelf
      label: 会计与工业年鉴的书架
      features:
      - 书架
      prompt: 书架上整齐排列着会计账册和工业年鉴，书脊按年份排好，没有一本放歪
    looks:
    - when: knows:players:clue:c_desk_gun
      change: 桌面下方的暗处卡着一把手枪
      'on': waldemont_desk_under
  - id: steelworks
    name: 赫施伯格钢铁厂
    art: steelworks
    aliases: [钢铁厂, 兵工厂, 军工厂]
    public: true
    entry: works_office
    scene_root: true
    read_aloud: 赫施伯格钢铁厂。
    outdoors: false
    ground: building
  - id: works_office
    name: 钢铁厂办公楼
    within: steelworks
    art: works_office
    read_aloud: 办公楼里打字机响个不停，走廊尽头是财务部和档案室，窗外烟囱冒着黑烟。
    keeper: |
      员工会说沃德蒙特此前是财务部长、常参与其他部门事务、带文件回家；被问到配枪花纹只会说是防滑和美观，是塞格利提出的；
      也可能有人提到塞格利在地下层有实验室。档案室可查供应链记录。
    features: [档案室的供应链记录, 财务部]
    outdoors: false
    ground: building
    views:
    - key: works_supply_archive
      label: 档案室的供应链记录
      features:
      - 档案室的供应链记录
      prompt: 档案室里成排的铁皮文件柜，一本本按日期装订的生产与交付登记簿，摊开的一页上是密密麻麻的批号和日期
  - id: segli_office
    name: 总工程师办公室
    within: steelworks
    art: segli_office
    read_aloud: 堆满图纸和计算尺的办公室，墙上钉着冲压模具的设计图，书柜里塞得满满当当。
    keeper: 书柜里压着拉丁语打字转录本和塞格利手绘的图册。原文说转录本也可能在艾伯哈德卧室或塞格利卧室。
    features: [书柜里的打字稿与图册, 墙上的模具设计图]
    outdoors: false
    ground: building
    views:
    - key: segli_bookcase
      label: 塞满的书柜
      features:
      - 书柜里的打字稿与图册
      prompt: 塞得满满当当的书柜，工程手册、期刊和图纸卷筒挤在一起，下层压着成沓的纸
    - key: segli_die_drawings
      label: 墙上的模具设计图
      features:
      - 墙上的模具设计图
      prompt: 墙上钉着冲压模具的设计图，标注精细的尺寸线中间画着繁复的花纹，旁边夹着计算尺和铅笔
    looks:
    - when: knows:players:clue:c_transcript
      change: 抽出一沓没有封面、翻得卷边的拉丁语打字稿，满页德语批注，下面压着一本手绘图册，画着装置和怪异符号，每张图都标了页码
      'on': segli_bookcase
  - id: factory_floor
    name: 生产车间
    within: steelworks
    art: factory_floor
    weather: [embers]
    read_aloud: 巨大的车间里冲压机一下下砸落，传送带上排着成箱的手枪握把，远处吊机吊着坦克车体的外壳。
    keeper: 多条产线（包括坦克）装着刻花纹的冲压模具，塞格利会坦诚说这是钢铁厂的特色标识。
    features: [冲压机和模具, 坦克壳体]
    outdoors: false
    ground: building
    views:
    - key: factory_stamp_press
      label: 冲压机和模具
      features:
      - 冲压机和模具
      prompt: 冲压机的锤头一下下砸落，模具表面刻着繁复的花纹，传送带上一排排刚压好的手枪握把带着同样的纹路
    - key: factory_tank_hull
      label: 吊着的坦克壳体
      features:
      - 坦克壳体
      prompt: 吊机钢索吊着一具空的坦克车体外壳，舱口敞开，钢板接缝处压着同样的花纹，下面是油污的地面
  - id: lab_corridor
    name: 地下层走廊
    within: steelworks
    art: lab_corridor
    weather: [flicker]
    read_aloud: 地下层的走廊又潮又暗，灯泡嗡嗡作响，尽头是一扇沉重的铁门。
    keeper: 铁门锁是焊死的，要求仔细观察或试图撬锁就能看出。强闯不行；用切割机可行，但艾伯哈德会赶来（设 lab_door_cutting）。
    features: [沉重的铁门]
    outdoors: false
    ground: building
    looks:
    - when: at:players:lab_corridor & flag:lab_door_cutting
      change: 铁门前架着一台切割机，地上溅满火花和焊渣，门板上切出一道没切完的口子
    - when: knows:players:clue:c_welded_lock
      change: 凑近看，锁孔和门缝被焊料封得严严实实，根本插不进钥匙
      'on': lab_iron_door
    views:
    - key: lab_iron_door
      label: 沉重的铁门
      features:
      - 沉重的铁门
      prompt: 潮湿昏暗的走廊尽头一扇厚重的铁门，门板上有锈迹，一把锁嵌在门上，头顶灯泡嗡嗡作响
  - id: lab
    name: 地下实验室
    within: steelworks
    art: lab
    weather: [embers]
    read_aloud: 门后是冶炼和锻造的设备，却没有连接任何供能装置；一座巨大的焚尸炉占据了一面墙，旁边立着两个柜子。
    keeper: |
      终战地点。两个存放赤钢的柜子：一个放动物实验得到的赤钢；另一个放三个金发受害者的福尔马林头罐，和用他们（以及三个犹太受害者）的尸体烧炼的金属，贴着花体字姓名标签。
    features: [存放赤钢的柜子, 焚尸炉, 冶炼锻造设备]
    outdoors: false
    ground: building
    views:
    - key: lab_cabinets
      label: 存放赤钢的柜子
      features:
      - 存放赤钢的柜子
      prompt: 焚尸炉旁并排立着两个关着门的金属柜子，柜门上贴着花体字的标签
    - key: lab_furnace
      label: 巨大的焚尸炉
      features:
      - 焚尸炉
      - 冶炼锻造设备
      prompt: 占据整面墙的巨大焚尸炉，炉门紧闭，旁边是冶炼和锻造设备，没有接任何电线或燃料管
    looks:
    - when: knows:players:clue:c_lab_heads
      change: 一个柜子里堆着银白色的金属；另一个柜子里是三个泡在福尔马林里的金发男人头颅，和一块块金属放在一起，各贴着花体字姓名标签
      'on': lab_cabinets
  - id: sd_office
    name: 保安处埃森办事处
    art: sd_office
    aliases: [办事处, 盖世太保办事处, 保安处]
    public: true
    read_aloud: 办事处的走廊里挂着元首像，值班的士兵见了你立刻立正，院子里停着几辆黑色的梅赛德斯。
    keeper: |
      调查员的工作据点：可调档案（兰伯特的失踪记录、瓦尔德玛案卷、犹太人登记、希尔德与兰伯特的档案）、给柏林打电话按序列号追查配枪、顺走座车和小兵。
      兰伯特最后一次被人见到就在这里。
    features: [档案室, 电话, 院子里的座车]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: sd_archive
      label: 办事处档案室
      features:
      - 档案室
      prompt: 档案室里一排排编号的木档案柜，桌上摞着牛皮纸卷宗，台灯下摊开一份盖着鹰徽的表格
    - key: sd_telephone
      label: 值班室的电话
      features:
      - 电话
      prompt: 黑色转盘电话摆在值班桌上，旁边是记录本和铅笔，墙上贴着柏林各部门的分机号
  - id: restaurant
    name: 高档餐厅单间
    art: restaurant
    aliases: [餐厅]
    weather: [flicker]
    read_aloud: 埃森最好的餐厅，侍者领你穿过铺着白桌布的大堂，推开一间挂着丝绒帘子的单间。
    keeper: 艾伯哈德用女人的名字订下单间（e_dinner）。
    features: [丝绒帘子后的餐桌]
    scene_root: true
    outdoors: false
    ground: building
    looks:
    - when: at:eberhard:restaurant
      change: 单间桌上摆好两副餐具，点着烛台，冰桶里插着一瓶香槟
    views:
    - key: restaurant_private_table
      label: 丝绒帘子后的餐桌
      features:
      - 丝绒帘子后的餐桌
      prompt: 丝绒帘子后的小单间，白桌布上摆着银餐具、烛台和两只高脚杯，一瓶开好的红酒，桌上一张手写的预订卡
  - id: hilde_apartment
    name: 希尔德的公寓
    art: hilde_apartment
    aliases: [莱费尔夫人的公寓, 情人的公寓]
    read_aloud: 公寓不大，收拾得很雅致，卧室里一张大床，床头柜上一盏黄铜台灯。
    keeper: 床底一块被加尔文撬开的地板、沃德蒙特送的台灯空灯座，都能放巴掌大的薄物。极难侦查或花费足够多的时间可发现，里面没有任何东西。
    features: [床底的地板, 黄铜台灯]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: hilde_bed_floor
      label: 床底的地板
      features:
      - 床底的地板
      prompt: 大床下的暗处是拼接整齐的木地板，积着薄灰，床单垂下来遮住一半
    - key: hilde_brass_lamp
      label: 床头的黄铜台灯
      features:
      - 黄铜台灯
      prompt: 床头柜上一盏擦得锃亮的黄铜台灯，灯座又圆又厚，旁边放着手帕和香水瓶
    looks:
    - when: knows:players:clue:c_floor_hide
      change: 一块地板被撬开过，掀起来下面是个巴掌大的扁平空洞，空无一物
      'on': hilde_bed_floor
    - when: knows:players:clue:c_lamp_hide
      change: 灯座底盖拧下后是空心的，里面能放巴掌大的薄物，什么也没有
      'on': hilde_brass_lamp
  - id: bank
    name: 银行
    art: bank
    aliases: [保险柜]
    public: true
    read_aloud: 大理石柜台后面的职员抬头看见你的制服，脸色一下子白了。
    keeper: 艾伯哈德的保险柜在这里。用偷来的钥匙打开，或穿着制服拿着证件以国家安全为由恐吓职员打开（设 safe_opened；恐吓则同时设 safe_forced）。
    features: [保险柜库房]
    scene_root: true
    outdoors: false
    ground: building
    views:
    - key: bank_vault
      label: 保险柜库房
      features:
      - 保险柜库房
      prompt: 厚重的库房门后一面墙的黄铜编号保险柜小门，中间一张铺绒布的桌子
    looks:
    - when: knows:players:clue:c_vault
      change: 打开的柜格里放着一本拉丁文古书和一把瓦尔特 PPK，握柄花纹带着明显的手工刻痕
      'on': bank_vault
  - id: jolan_grave
    name: 约兰迁移后的坟墓
    art: jolan_grave
    weather: [rain]
    aliases: [约兰的墓]
    read_aloud: 偏僻墓园角落里一座不起眼的墓，墓碑上的名字被青苔盖了一半。
    keeper: 被挖开的坟墓和几乎是空的骨灰罐；侦查成功或要求仔细检查可发现一小片断裂的红色延长甲。地点由麦克斯纳告知。
    features: [被挖开的坟墓, 坟土里]
    scene_root: true
    outdoors: true
    ground: graveyard
    views:
    - key: jolan_open_grave
      label: 被挖开的坟
      features:
      - 被挖开的坟墓
      - 坟土里
      prompt: 青苔半掩的墓碑前，坟被挖开，湿土堆在一边，坑底一只敞着盖的骨灰罐几乎是空的
    looks:
    - when: knows:players:clue:c_nail
