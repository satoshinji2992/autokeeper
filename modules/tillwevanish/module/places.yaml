  - id: weber_street
    name: 韦伯旧居一带
    art: weber_street
    aliases: [瓦尔德玛家附近, 韦伯家]
    read_aloud: 一条灰扑扑的工人街区，两栋挨着的小楼，一栋窗户钉了木板，另一栋门口坐着个裹着披肩的老太太。
    keeper: 瓦尔德玛和韦伯曾是邻居。瓦尔德玛的家人朋友、韦伯的另一个邻居老太太都在这一带。
    features: [钉了木板的韦伯家]
    scene_root: true
    outdoors: true
    ground: street
    views:
    - key: weber_boarded_house
      label: 钉了木板的韦伯家
      features:
      - 钉了木板的韦伯家
      prompt: 灰扑扑的小楼窗户被木板钉死，门上的油漆剥落，门牌歪着，台阶上积着落叶
  - id: weber_woods
    name: 街区外的小树林
    art: weber_woods
    weather: [fog]
    aliases: [小树林]
    read_aloud: 光秃秃的桦树林，地上是湿透的落叶，林子边缘有一小块土被翻过又填平。
    keeper: 老太太在这里发现韦伯被枪击的尸体，也想就近把他埋了。困难侦查可找到当时留下的弹壳。
    features: [发现尸体的地方, 韦伯的坟]
    outdoors: true
    ground: woods
    views:
    - key: weber_woods_spot
      label: 发现尸体的地方
      features:
      - 发现尸体的地方
      prompt: 光秃秃的桦树之间，一片湿透的落叶，看不出什么特别
    - key: weber_grave
      label: 韦伯的坟
      features:
      - 韦伯的坟
      prompt: 林子边缘一小块翻过又填平的土，没有墓碑，土面上有一圈发黑的焦痕
    looks:
    - when: knows:players:clue:c_shell
      change: 拨开落叶，下面有一枚旧弹壳
      'on': weber_woods_spot
  - id: farm
    name: 郊区的农场
    art: farm
    aliases: [农场, 艾伯哈德的农场]
    read_aloud: 埃森郊外的一片农场，泥地里立着两座金属板搭的结实畜棚，畜棚后面是一个砖砌的大炉子。
    keeper: 艾伯哈德三年前买下、不到一年卖掉的农场。他和塞格利在这里用动物做研究测试，储存了大量 MP。现在的农场主和周边农户可问。
    features: [金属板畜棚, 大炉子]
    scene_root: true
    outdoors: true
    ground: fields
    views:
    - key: farm_metal_barn
      label: 金属板畜棚
      features:
      - 金属板畜棚
      prompt: 金属板拼成的结实畜棚，铆钉密实，里面空荡荡的，地面干净得不像养过牲畜
    - key: farm_brick_furnace
      label: 砖砌的大炉子
      features:
