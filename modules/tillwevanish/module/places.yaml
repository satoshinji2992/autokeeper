      prompt: 畜棚后面一座砖砌的大炉子，炉膛宽得能塞进一头牛，里面烧得干干净净，几乎没有灰
  - id: jewish_quarter
    name: 失踪犹太人的旧住址
    art: jewish_quarter
    aliases: [未登记犹太人的住址]
    read_aloud: 几处旧公寓，门牌上的名字被刮掉了，邻居们隔着门缝打量你的制服。
    keeper: 按犹太人重新登记档案找到的旧住址，邻居可问。
    features: [刮掉名字的门牌]
    scene_root: true
    outdoors: true
    ground: street
    views:
