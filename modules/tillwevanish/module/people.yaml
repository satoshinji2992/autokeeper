npcs:
  - id: waldemont
    name: 沃德蒙特·冯·赫施伯格
    role: 赫施伯格钢铁厂新任董事长，阿克塞尔的长子
    called: 主持葬礼的苍白男子
    look: 黑色丧服，脸色苍白，眼睛布满血丝
    personality: 谨慎、体面，努力表现忠诚；身体一天比一天差
    voice: 语调飘忽，偶尔说出前言不搭后语的怪话；被问到过去时会说“年轻时候不懂事”
    goal: 保住钢铁厂和家人，不让间谍身份暴露
    knows:
      - 自己早年参加过左派运动，1934 年入党
      - 自己身体不适；之后每次见面更憔悴神经质，可能如实说浑身刺痛、像有人拿火烤他的骨头
      - 书桌下的手枪是他防身用的
      - 每隔一周的周六下午去希尔德·莱费尔的公寓，第二天早上回来；上一次去已是至少两周前
    secrets:
      - 他是苏联间谍，约半年前在一次工业贸易会议上被英国外交官加尔文·考克斯发展为下线
      - 他借职务之便偷拍军方订单文件，把胶卷藏在希尔德公寓里交给加尔文
    lies:
      - 不否认意识形态问题，只说年轻时候不懂事，再说一堆效忠的空话
    clues: [c_waldemont_unwell]
    location: cemetery
    portrait: waldemont
    important: true
    looks:
      - {when: "flag:waldemont_dead", change: 被火焰烧成一具焦黑的骷髅}
  - id: lotte
    name: 洛特·冯·赫施伯格
    role: 阿克塞尔的遗孀，续弦
    called: 用手帕捂脸的遗孀
    look: 黑纱丧服，手帕不离手
    personality: 悲伤、虚弱
    voice: 声音很轻，常被哭声打断
    goal: 体面地送走丈夫
    knows: [丈夫 2 月 6 日去世]
    location: cemetery
    portrait: lotte
  - id: eberhard
    name: 艾伯哈德·冯·赫施伯格
    role: 阿克塞尔的小儿子
    called: 画眼线的瘦高青年
    look: 瘦高，黑色头发梳得服帖，眉毛挑得很高，蓝宝石一样的眼睛，画了眼线和睫毛；常穿女装，也会换西装或高领羊毛衫
    personality: 被宠坏的少爷，礼貌得尖酸刻薄；狂热的纳粹拥趸和克图格亚邪教徒；对高大的金发碧眼帅哥毫无节制地示爱，偶尔露出种族主义的残忍
    voice: 雌雄难辨的破锣嗓子，张口闭口“亲爱的长官”“我的好先生”；会在撒娇中突然板起脸一本正经地胡扯
    goal: 借附魔武器在战争里“净化欧洲”，烧死所有人；在那之前尽情享受生活，也许把调查员的头收藏起来
    knows:
      - 沃德蒙特的情人叫希尔德·莱费尔，住在哪里，沃德蒙特每隔一周的周六下午去、第二天早上回来
      - 熔铸之血、生命薪柴的全部原理和附魔武器的去向
      - 调查员的配枪已经激活
    secrets:
      - 他与塞格利依据《马克西米利安的炼金指南》制造附魔武器
      - 他杀了三个犹太人和三个金发德国男人（包括兰伯特上尉），头颅收藏在地下实验室
      - 他怂恿瓦尔德玛射杀韦伯
      - 守灵夜他挖出约兰的骨灰撒进父亲棺材并施放熔铸之血，2 月 9 日又对沃德蒙特施法
      - 他在银行有一个保险柜，钥匙在自己房间里
    lies:
      - 一切都好，花纹只是钢铁厂的标识
      - 被问到制服上的肩章勋章，暧昧地说是情人分别前送的
    clues: [c_mistress]
    location: cemetery
    portrait: eberhard
    important: true
    stats: {力量: 70, 体质: 90, 体型: 60, 敏捷: 50, 智力: 80, 意志: 125, 外貌: 75, 教育: 80, 生命: 15, 魔法值: 25, 格斗(斗殴): 80, 格斗(斧): 80, 闪避: 25, 移动: 8, 图书馆使用: 80, 取悦: 60, 话术: 50, 心理学: 50, 乔装: 80, 机械维修: 50}
    attacks:
      - 格斗(斗殴) 80%，伤害 1D3+DB
      - 格斗(斧) 80%，伤害 1D8+2+DB
  - id: segli
    name: 塞格利·普拉斯特
    role: 赫施伯格钢铁厂总工程师，慕尼黑工业大学博士
    called: 戴眼镜的腼腆青年
    look: 弱不禁风，戴眼镜，总是微笑
    personality: 怕生腼腆、很有礼貌；天赋惊人又勤勉；对艾伯哈德言听计从
    voice: 说话轻声细语，带着微笑
    goal: 让艾伯哈德高兴
    knows:
      - 许多产线（包括坦克）都装了刻这种花纹的冲压模具，当作钢铁厂的特色标识
      - 手枪握柄的花纹是他提出的，对外说是防滑和美观
      - 赤钢用于工业生产效益极低，常规钢材对武器已经足够
    secrets:
      - 冲压模具刻的是熔铸之血与生命薪柴的咒文
      - 地下层的实验室只有他和艾伯哈德能进
    lies: [花纹只是为了防滑和美观]
    clues: [c_stamp_lines]
    location: segli_office
    portrait: segli
    important: true
    stats: {力量: 45, 体质: 40, 体型: 50, 敏捷: 50, 智力: 90, 意志: 80, 外貌: 70, 教育: 90, 生命: 9, 魔法值: 16, 闪避: 25, 移动: 7, 图书馆使用: 80, 机械维修: 60, 电气维修: 60}
  - id: meisner
    name: 麦克斯纳先生
    role: 赫施伯格家的老管家
    called: 撑伞张望的老管家
    look: 白发，背有些驼，衣着一丝不苟
    personality: 忠心，胆小，非常不安
    voice: 说话又快又低，像怕被人听见
    goal: 把憋在心里的事告诉当局的人，求个安心
    knows:
      - 沃德蒙特的生母是阿克塞尔的犹太前妻约兰，难产而死；当局帮忙掩盖，档案里生母写成洛特
      - 阿克塞尔当年立场摇摆，这段婚姻和沃德蒙特的安全成了纳粹与他谈判的筹码；之后约兰的坟墓被迁到别处
      - 约兰迁移后的坟墓在哪里
      - 沃德蒙特死后他想去看看约兰，发现骨灰被挖了
      - 艾伯哈德平时的财产都交给他管
    secrets:
      - 艾伯哈德在银行有一个保险柜，钥匙在艾伯哈德房间里（被坚持追问艾伯哈德的秘密时才想起来）
    clues: [c_jolan_ashes, c_safe_key]
    location: manor
    portrait: meisner
  - id: servants
    name: 庄园的仆人们
    role: 赫施伯格庄园的仆人
    called: 压低声音的仆人
    look: 黑白制服，手里总拿着托盘或抹布
    personality: 怕事，爱嚼舌根
    voice: 说到少爷就支支吾吾
    knows:
      - 艾伯哈德守灵夜偷跑出去过，支吾着暗示是见不得人的癖好
      - 三年前艾伯哈德要钱买地开农场，不到一年就卖了；知道农场在哪、现在的农场主是谁
    clues: [c_wake_sneak, c_farm_history]
    location: manor
    portrait: servants
    goal: 保住差事，不被卷进少爷们和当局的麻烦里
  - id: daughter
    name: 沃德蒙特的女儿
    role: 沃德蒙特的小女儿（原文无姓名）
    called: 黑裙子的小女孩
    look: 穿黑裙子的小女孩
    personality: 懵懂，喜欢和叔叔玩
    voice: 小声，怯生生
    knows: [父亲死了，妈妈病倒了]
    location: manor
