  - id: works_staff
    name: 钢铁厂的员工们
    role: 办公楼的职员和工头
    called: 办公楼的职员
    look: 衬衫袖套，夹着文件
    personality: 规矩，有问必答
    voice: 公事公办
    knows:
      - 沃德蒙特此前是财务部长，常参与其他部门事务、翻阅文档、把文件带回家，没人在意
      - 枪上的花纹据说是为了防滑和美观，是塞格利提出的
      - 塞格利在地下层有个实验室，只有他和艾伯哈德有钥匙；有人记得前年艾伯哈德帮塞格利“搬一批设备”
    clues: [c_staff_waldemont, c_pattern_reason, c_lab_rumor]
    location: works_office
    portrait: works_staff
    goal: 照章办事，不惹柏林来的长官不快
  - id: huebner
    name: 休布纳·莱费尔
    role: 外交官，希尔德的丈夫
    called: 西装笔挺的外交官
    look: 西装笔挺，举止圆滑
    personality: 有绿帽癖，对妻子的情人们了如指掌
    voice: 外交辞令，笑里有话
    knows:
      - 妻子的两个情人都是他介绍的：沃德蒙特，和英国外交官加尔文·考克斯
      - 加尔文约两年前调来德国，约半年前在一次工业贸易会议上发展了沃德蒙特，用希尔德当不知情的中间人
      - 加尔文是军情六处的人，同时是苏联间谍
    secrets: [他对整件事完全知情]
    clues: [c_calvin]
    location: hilde_apartment
    portrait: huebner
    goal: 维持妻子与情人们的这层关系，同时保住自己外交官的体面
