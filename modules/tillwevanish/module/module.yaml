id: tillwevanish
title: 直到我们灰飞烟灭
subtitle: Till We Vanish
system: CoC7
era: 1939 年 2 月（纳粹德国）
setting: 德国鲁尔区埃森市，赫施伯格钢铁厂所在地
players: 1-4 人（原作建议单人）
duration: 约 1-2 次跑团
source: 《直到我们灰飞烟灭》，作者 逐日之蛆，插画 mhs@jkit
license: 原作者保留权利
hook: |
  1939 年 2 月 11 日，阴雨。你是帝国保安处负责国内安全的人员，从柏林被派到埃森。
  德国军方的武器供应商赫施伯格钢铁厂的董事长阿克塞尔·冯·赫施伯格刚刚去世，按遗嘱由大儿子沃德蒙特继承家业。
  沃德蒙特早年参与左派运动、同情布尔什维克，虽然 1934 年入了党，当局仍不信任他。
  你的任务是确保钢铁厂的新主人可靠、与他打好关系；当局并不打算让有共产党履历的人掌控这样的军工企业，
  所以真正的任务是找到或制造沃德蒙特的把柄，并通过看上去合法的手续扳倒他。
  小儿子艾伯哈德在官方眼中只是个脑子有问题的性变态，档案里甚至有他与一名身份不明的男人亲热的照片，预计相当好控制。
  上级已提前通知钢铁厂你的到来。你带着出发前在柏林领到的配枪（握柄上刻着奇怪的花纹）乘火车抵达埃森，刚好赶上老董事长的葬礼。
truth: |
  阿克塞尔的前妻约兰是犹太人，难产而死，留下半犹太血统的长子沃德蒙特；纳粹当局出于赫施伯格家族的地位帮忙掩盖了此事，档案里沃德蒙特的生母写成续弦洛特。
  沃德蒙特的确是苏联间谍：约半年前被英国外交官（军情六处兼苏联间谍）加尔文·考克斯发展为下线，经由不知情的希尔德·莱费尔的公寓传递胶卷。
  真正危险的是小儿子艾伯哈德：狂热的纳粹拥趸、疯癫的克图格亚邪教徒、喜欢扮女装的同性恋。他与好友、钢铁厂总工程师塞格利·普拉斯特
  依据《马克西米利安的炼金指南》，在武器上冲压两条咒文：生命薪柴吸取被命中者的生命力化为 MP，熔铸之血在 MP 足够后激活，
  此后用该武器造成伤害时，使用者和被命中者都会在几天内被克图格亚的火焰烧成灰。附魔武器已全线量产交付军方，艾伯哈德意在借战争“净化欧洲”，无差别烧死所有人。
  24 个月前的测试里，艾伯哈德杀了三个犹太人和三个金发碧眼的德国帅哥（其中之一是调查失踪案的保安处上尉兰伯特），头颅收藏在实验室；
  他还怂恿希特勒青年团的瓦尔德玛用样枪射杀犹太邻居韦伯，几天后两人同时自燃。
  集中营军官谢尔曼两周前被自己的配枪烧死，那把已激活的瓦尔特 PPK 被回收后重新发给了调查员：调查员只要用它打中活物就必死。
  2 月 6 日阿克塞尔死后，艾伯哈德在守灵夜挖出约兰的骨灰撒进父亲的棺材，并对父亲尸体施放熔铸之血；2 月 9 日又对沃德蒙特施法，他正在走向自燃。
keeper_notes: |
  【原作】CoC 7 版原生模组，机制照原文。定位为黑色幽默猎奇邪典喜剧，克系恐怖、历史惊悚与猎奇喜剧三者平衡；作者说明“折磨调查员的前提是让玩家高兴”。
  【权力】调查员是盖世太保式的帝国保安处人员（原作注：模组里“盖世太保”指经典德三制服反派形象，不是史实具体职位）。除艾伯哈德和塞格利外，所有 NPC 至少表面上无条件配合；
  可以使唤小兵干脏活、以通用理由处置没有特殊身份的 NPC；对有特殊身份的 NPC 需要更合法的借口和看起来像那么回事的证据；与官职军衔更大的人打交道另算。
  【小兵与座车】调查员可在埃森办事处顺走一辆梅赛德斯，带几个小兵当司机和保镖；要对他们的性命负责，死了会受严肃质问，而他们几乎一定会死。
  【建议】原作理论上容纳 2-4 人，建议单人；建议守秘人选开 pulp 扩展的双倍血条、光荣谢幕等一切防止调查员暴毙的规则。
  【理智】调查员目击针对人类、不明显涉及神话的极端暴力场面时只扣最低理智值（车卡代价见 creation）。
  【沃德蒙特自燃】守秘人认为合适时设 waldemont_ignites，事件 e_waldemont_burns 演出。开始自燃时与他有肢体接触的调查员或守秘人认为重要的 NPC 受 1D8 火焰伤害，不重要的可直接烧死（例：动手逮捕他的小兵当场烧死）。
  熔铸之血生效时间按血量计算、守秘人可灵活调整；调查员初次与他交谈时他面色不佳、偶说怪话，之后每次见面都更憔悴神经质，可能如实说浑身刺痛、像有人拿火烤骨头。
  【之后】两人接连自燃，上级疑心境外势力，会要求调查员查明情况；沃德蒙特死后由艾伯哈德继承，调查员需确认他除同性恋外没有威胁国家利益的问题并与他打好关系。
  艾伯哈德不搞暗杀（引人注意），只会哄骗调查员一切都好，最坏时把事情闹得足够大足够莫名其妙，让人忽视区区几个花纹。
  【引诱开枪】本模组终战前没有太多不得不开枪的机会。原作给出两种：沃德蒙特死后的小女孩一幕（e_daughter）；晚餐后可能出现的刺客（e_assassin，英国或苏联间谍，配枪型号产地暗示身份，被控制即吞氰化物自杀）。
  【不存在的灵魂】持续接触附有已激活熔铸之血的物品会导致幻觉（挥之不去的硝烟味、嘶嘶作响的头发、谈话的人眨眼间燃烧……），守秘人自定内容，按强度让调查员做最高不超过 1/1D4 的理智检定。
  用刻有熔铸之血的武器命中任何会流血的生物，会瞥见克图格亚的一角（朗读见 mechanics），触发后 1D3/1D8 理智，至多几天后在永生不死的幻觉中燃烧死亡。由插件 bloodforge 记录。
  【换枪】申请更换配枪要过幸运检定，失败则换来的仍是附魔枪（未激活，打空一个弹夹都安全，调查员无法确定）；频繁申请会显得脑子不太好。拿走手下人的枪同样要过幸运检定，否则这些枪全都带熔铸之血。
  无论如何最后都会有倒霉蛋被这把枪烧死。多名调查员时，AutoKeeper 按原文“调查员的配枪”处理为每人的配枪都已激活（原作按单人写，只明确谢尔曼那一把）。
  【抗寒冷知识】刻有有效克图格亚咒文的物品带微弱抗严寒力场，艾伯哈德和塞格利尚未发现。
  【实验室门】铁门锁焊死，赤钢锁芯、门内刻材料变温咒文，两人每次进出各花 2MP 开、焊。强闯除非炮轰不行；不建议在危险品工厂地下用炮或爆破。切割机可行，但找到切割机和操作工的时间足够艾伯哈德赶来（e_cutting）。
  【爱的誓言（终战）】触发：调查阶段基本结束、调查员准备弄死艾伯哈德、艾伯哈德得知保险柜被开、艾伯哈德高兴或不高兴、守秘人高兴或不高兴。终战一定在钢铁厂地下的实验室。
  建议让艾伯哈德不择手段死缠烂打，直到调查员暴起伤人。举例：1 调查员最后调查钢铁厂时，塞格利邀他去实验室，只穿女式蕾丝内衣、吊带黑丝、大腿绑纳粹袖标的艾伯哈德在那里等；
  2 调查员收集到大部分线索或计划弄死他时，艾伯哈德主动邀请“到自己的秘密基地看看”，到了就全脱，露出黑丝大腿纳粹标；
  3 以恐吓柜员的方式打开保险柜后，他穿正常西装到保安处埃森办事处等调查员（e_bank_alarm），之后邀去实验室。守秘人设 finale_invited 表示受邀。
  一旦调查员打算对他下手或表现出撤退意图，设 finale_turns（e_fireball）：他用几乎全部 MP 以普通火球术点燃在场除他、塞格利和调查员以外的所有 NPC（1/1D6），调查员过敏捷检定否则受 1D8 溅射火焰伤害；
  之后若召唤克图格亚或炎之精，两者成功率相加不超过 60。随后一对一决斗（塞格利是技术人员不算）。他倾向先缴械再近身互殴。兵工厂里有无数附魔大枪、坦克、爆炸物和机械，守秘人与调查员都可就地取材。
  虐杀方式：斧子削头；掐死；按在机床上打铁（一轮对抗制服、一轮对抗卡死，连续两轮对抗失败后每轮一个极难力量，成功挣脱受 1D6+2，失败每轮 2D6+4，直到死亡或挣脱）；
  挂上吊机（同上，可用力量或敏捷对抗，挣脱受 1D6+2 摔落伤害，否则每轮 2D6+4 窒息伤害）；调查员半血时拖进坦克壳子（两轮力量对抗，失败需极难力量脱困，否则他手动触发一次熔铸之血，坦克壳成为防火棺材）；
  用实验室库存材料和 MP 现场召唤克图格亚或炎之精（核心书与怪物之锤）。作者说明：调查员单挑赢面其实很大，他基本是近战 80 有伤害加值的人类，打铁和吊机要几轮蓄力，召唤也要两人配合拖延几轮。
  守秘人可以把终战定在 2 月 14 日。原作推荐终战 BGM：Sam Smith/Kim Petras - Unholy (Orchestral Version)。
  【克图格亚】原作未给数值，“详见核心书”。若召唤成功，按规则书克图格亚条目处理，AutoKeeper 未登记为可战斗生物。
  【忠诚是你的奖赏】调查员若认定一切是元首旨意而撒手不管，可逃过终战。守秘人可尝试让塞格利暗示赤钢工业化完全是无稽之谈，或让艾伯哈德表现出并不真心效忠、只把元首当作可随意解读的符号。
  仍转不过弯就随他去，设 gave_up。
  【结局后续】触发爱的誓言并活着出来后，即便两人死了军工厂照常运转，调查员要收拾烂摊子，原作给出六种方案，见 endings。本模组没有奖励。
  【AutoKeeper 补充】开场钟点 D1 14:00 与棺材起火 14:20 为补充（原文只写“下午”）；沃德蒙特一家住在赫施伯格庄园、小女孩一幕放在庄园大厅为补充（原文只写“沃德蒙特家里”和捉迷藏、弹钢琴）；
  各地点路程分钟数、银行、餐厅、韦伯旧居一带等地点的具体样子为补充；两名预设调查员为补充；打字转录本的批注内容取自原文“典籍与法术”一节的手写批注，作为玩家可读的节选。
  【典籍】《马克西米利安的炼金指南》拉丁文，西蒙·沃伦斯坦著，15 世纪。理智损失 3D10，克苏鲁神话 +7/+15%，神话等级 60，学时 108 周。法术：生命薪柴、熔铸之血、材料变温（全文见 mechanics）。
