start: cemetery
start_time: D1 14:00
opening: |
  柏林来的火车在埃森站停下时，雨就没停过。办事处派来的车把你直接送到了公墓——赫施伯格家的老董事长阿克塞尔今天下午下葬，钢铁厂方面已经知道你要来。
  黑伞挤在墓穴周围，泥水顺着鞋跟往下淌。新董事长沃德蒙特站在棺材前主持葬礼，脸色苍白，眼睛布满血丝，说话的语调飘忽不定。
  他身边的遗孀洛特夫人用手帕捂着脸。人群里一个瘦高的年轻人时不时朝你投来莫名其妙的目光——在这种日子，他画了眼线。
  老管家撑着伞在墓园门口张望，似乎在找柏林来的客人。
