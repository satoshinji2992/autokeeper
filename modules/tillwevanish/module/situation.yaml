  hook: 调查员的父亲或兄弟上一场大战里扛过赫施伯格钢铁厂造的枪炮，或者在鲁尔区的钢厂做过工；对调查员来说，这座冒黑烟的工厂既熟悉又沉重（补充；只适用于鲁尔区或工人家庭出身的背景）。
  place: factory_floor
  fits:
  - 意义非凡之地
  - 重要之人
- id: tie_ruhr_hometown
  hook: 如果调查员就是埃森或鲁尔区人，郊外那片农场一带正是他小时候走过的乡下，邻近的农户可能还认得他家里人，闲话会说得更随便（补充；农户知道的仍然只有原作里那些）。
  place: farm
  fits:
  - 意义非凡之地
- id: tie_hitler_youth_leader
  hook: 调查员年少时在希特勒青年团当过小队长，一眼就能看穿韦伯旧居一带那帮欺软怕硬的少年；他们也会抢着在“老前辈”面前表现（补充；他们知道的仍然是原作里瓦尔德玛那些事）。
  npc: waldemar_friends
  fits:
  - 职业
  - 思想与信念
- id: tie_old_jewish_acquaintance
  hook: 调查员年少时有过一个犹太邻居或同学，这段往事在 1939 年只能藏着。在失踪犹太人旧住址门缝后的那些面孔，或者重新登记名单上的某个姓名，可能会勾起这段回忆（补充；只适用于背景里有这段往事的调查员。不改变邻居们的知情范围和害怕制服的态度）。
  place: jewish_quarter
  fits:
  - 重要之人
  - 思想与信念
- id: tie_fuhrer_faith
  hook: 对把效忠元首当作信念的调查员，艾伯哈德会热烈地附和这份信念，再把它扭曲成用烈火“净化欧洲”的说法；原作“忠诚是你的奖赏”那条撒手不管的路线，也正好接在这份信念上（补充；只是演法上的牵连，不替调查员下结论）。
  npc: eberhard
  fits:
  - 思想与信念
- id: tie_superior_mentor
  hook: 电话那头的柏林上级是一手提拔调查员的人，所以调查员愿意替他干这种“找到或制造把柄”的脏活；可他明知沃德蒙特的血统真相，却觉得调查员没必要知道（补充；上级的态度和知情范围照原作不变）。
  npc: superior
  fits:
  - 职业
  - 重要之人
- id: tie_lotte_family
  hook: 续弦洛特出身“血统更高贵”的体面人家，调查员的家族可能在社交圈里和她娘家有些往来；她在葬礼上认出调查员，会轻声道谢（补充；她所知的仍然只有丈夫的死期）。
  npc: lotte
  fits:
  - 重要之人
- id: tie_meisner_old_service
  hook: 老管家麦克斯纳年轻时在调查员的家族或亲戚家帮过佣，后来才去了赫施伯格家；他认得调查员，所以更急着向当局的这位熟面孔一吐为快（补充；他吐露什么、什么时候吐露，仍然照原作的条件，比如约兰骨灰的事要在沃德蒙特死后才说）。
  npc: meisner
  fits:
  - 重要之人
history:
- when: 纳粹上台以前（二十多年前）
  text: 阿克塞尔与犹太女人约兰自由恋爱结婚，约兰难产而死，留下有一半犹太血统的长子沃德蒙特；阿克塞尔后来续娶洛特。
  known_by:
  - meisner
  - superior
  - eberhard
- when: 纳粹势力壮大的那几年
  text: 纳粹当局看在赫施伯格家族的地位上，帮忙掩盖了沃德蒙特的血统，档案里把他的生母写成洛特。上级认为调查员没必要知道这件事。
  known_by:
  - meisner
  - superior
- when: 纳粹势力壮大的那几年
  text: 阿克塞尔当时立场摇摆，他和约兰的婚姻以及沃德蒙特的人身安全成了纳粹和他谈判的筹码；之后约兰的坟被迁到偏僻墓园的一角。
  where: jolan_grave
  known_by:
  - meisner
- when: 三年前
  text: 艾伯哈德向阿克塞尔要钱，在埃森郊区买地开农场，不到一年就痛快地卖给了现在的农场主。
  who:
  - eberhard
  - farmer
  where: farm
  known_by:
  - servants
- when: 三年前到两年多前
  text: 艾伯哈德和塞格利在农场里用运进来的牲畜做研究和测试，储存了大量 MP，畜棚用金属板搭建是为了防火，最后用炉子把一切烧干净。
  who:
  - eberhard
  - segli
  where: farm
- when: 约两年前
  text: 英国外交官加尔文·考克斯（军情六处的人，同时是苏联间谍）调来德国，与休布纳有工作往来，在休布纳认可下成了希尔德的情人，两人常在那间固定的公寓幽会。
  who:
  - calvin
  - huebner
  - hilde
  where: hilde_apartment
- when: 约 24 个月前（36 年末前后）
  text: 艾伯哈德扮成妓女模样的高个子女人跟踪金发碧眼的医生安森和律师雷纳德，用附魔瓦尔特 PPK 样枪杀了他们，并成对杀了犹太人；负责调查此案的保安处上尉兰伯特最后在埃森办事处露面后也被他杀害，为补足
    MP 他又杀了第三个犹太人。三个金发男人的头被他割下收藏，尸体和犹太人的一起被烧炼成金属。
  who:
  - eberhard
  - segli
- when: 兰伯特遇害后
  text: 艾伯哈德扒下兰伯特的制服，改成恶俗的版型，保留了上尉肩章和勋章，留着自己穿。
  who:
  - eberhard
- when: 约两年前（前年）
  text: 艾伯哈德以“搬一批设备”为名，帮塞格利把受害者的遗体运进钢铁厂地下层的实验室。塞格利换了用第一对受害者铸成的赤钢锁芯，在门内刻了材料变温咒文，两人每次进出各花 2MP 开门、焊门。
  who:
  - eberhard
  - segli
  where: lab
- when: 约两年前（37 年初）
  text: 艾伯哈德扮成女人接近体弱多病的希特勒青年团成员瓦尔德玛，怂恿他用已激活的附魔样枪射杀犹太邻居韦伯。瓦尔德玛把韦伯骗进小树林里射杀后丢掉了枪，艾伯哈德把枪捡了回去；几天后瓦尔德玛和韦伯的尸体同时起火。
  who:
  - eberhard
  - waldemar_friends
  - old_woman
  where: weber_woods
  known_by:
  - segli
- when: 18 个月前
  text: 塞格利利用总工程师的权限，在包括坦克在内的多条产线上加装刻有熔铸之血和生命薪柴咒文的冲压模具，样枪升级为正式版准备量产。
  who:
  - segli
  - eberhard
  where: factory_floor
- when: 6 个月前
  text: 附魔武器全线量产，首批未激活的正式版已交付军方，发给士兵和军官。
  who:
  - segli
  - eberhard
- when: 6 个月前
  text: 艾伯哈德在银行开了保险柜，存进《马克西米利安的炼金指南》拉丁文原件和已激活的附魔样枪，钥匙放在自己房间里。
  who:
  - eberhard
  where: bank
- when: 约半年前
  text: 加尔文在一次工业贸易会议上把沃德蒙特发展为下线，经休布纳介绍让沃德蒙特成了希尔德的情人，把不知情的希尔德当作中间人。沃德蒙特此后每隔一周的周六下午去公寓，把偷拍的军方订单文件胶卷藏进床底被撬开的地板或他送的台灯空灯座里，由加尔文下次来时取走。
  who:
  - calvin
  - waldemont
  - huebner
  where: hilde_apartment
- when: 至少两周前
  text: 沃德蒙特最后一次去希尔德的公寓（葬礼当天本该是他去的日子，他没去）。
  who:
  - waldemont
  - hilde
  where: hilde_apartment
- when: 沃德蒙特最后一次去公寓之后
  text: 加尔文去过公寓一次，藏物处就算有情报也已经被他取走，现在两处都是空的。
  who:
  - calvin
  where: hilde_apartment
- when: 两周前
  text: 集中营军官谢尔曼用未激活的附魔瓦尔特 PPK 正式版射杀太多囚犯，熔铸之血被触发，他被自己的配枪烧死；当天集中营的一处尸体掩埋点也莫名起火。那把已激活的枪被回收，后来重新发给了调查员。
- when: 2 月 6 日
  text: 阿克塞尔因动脉夹层抢救无效去世。
  who:
  - lotte
  - waldemont
  - eberhard
  - meisner
  where: manor
  known_by:
  - servants
- when: 2 月 6 日之后的守灵夜
  text: 艾伯哈德照例打扮得花枝招展、戴着红色延长甲偷跑出去，挖出约兰的骨灰撒进阿克塞尔的棺材，对父亲的尸体施放熔铸之血，并把一把刻有咒文的匕首留在了棺里。挖坟时他弄断了一片指甲，留在坟土里，回来后一气之下把其他指甲也拆掉扔了。
  who:
  - eberhard
  where: jolan_grave
- when: 2 月 9 日
  text: 艾伯哈德对沃德蒙特施放熔铸之血，沃德蒙特从此开始谵妄、发病，正在走向自燃。
  who:
  - eberhard
foreshadow:
- id: fs_coffin_dry_lid
  hint: 雨下得这么密，那口橡木棺材的盖子上却挂不住水珠，落上去的雨点很快就没了，棺盖缝边偶尔飘起一丝像是雾气的白。
  where: cemetery
  pays_off: e_coffin_fire
- id: fs_bare_nails
  hint: 画眼线的瘦高青年妆容精致，十根手指的指甲却光秃秃的，没涂颜色，几个指尖边缘还有撕扯过的红印子，跟他这一身打扮很不相称。
  where: cemetery
  pays_off: k_jolan
- id: fs_waldemont_heat
  hint: 二月的冷雨里，主持葬礼的苍白男子却一次次拉松领口，伞下的雨水好像一沾上他的肩膀就淡了。
  where: cemetery
  pays_off: e_waldemont_burns
  stages:
  - hint: 大厅里人人都往壁炉边凑，只有他站得离火最远，袖口挽了起来，手背泛着不正常的红，还在擦汗。
    where: manor_hall
  - hint: 再见到他时，他身边若有若无地飘着一股焦糊味，手里攥的手帕上沾着几点像是烫出来的褐色小斑。
    when: D2 08:00
    where: manor_hall
- id: fs_warm_grip
  hint: 雨里站了这么久，手指都冻僵了，腰间那把配枪的握柄摸上去却一点也不冰，好像刚被谁握过。
  where: cemetery
  pays_off: k_guns
  stages:
  - hint: 在办事处里，你总闻到一股淡淡的硝烟味，可这把枪从领到手起一发都没开过。
    when: D1 18:00
    where: sd_office
  - hint: 安静的时候，耳边像有头发被火燎着的那种细细的嘶嘶声，一凑近腰间的枪就更清楚。
    when: D2 08:00
    where: sd_office
  - hint: 值班士兵立正向你报告时，有那么一眨眼，你看见他整个人着了火；再定睛一看，他还好好地站着，问你是不是没睡好。
    when: D3 08:00
    where: sd_office
- id: fs_warm_door
  hint: 地下层又冷又潮，走到尽头那扇铁门跟前，空气却明显暖了一些，还有一股像是烧热的金属的气味，可附近没有任何炉子或管道。
  where: lab_corridor
  pays_off: k_lab
