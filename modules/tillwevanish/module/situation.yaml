  - npc: eberhard
    goals: [让附魔武器在战场上烧死所有人, 得到调查员]
    steps:
      - {id: dinner, text: 沃德蒙特死后邀请调查员共进晚餐, when: "flag:waldemont_dead", meet: false, source: 守秘人须知}
      - {id: coax, text: 哄骗调查员一切都好，不搞暗杀；最坏时把事情闹大，让人忽视花纹, meet: true, once: false, source: 守秘人须知}
      - {id: lab_invite, text: 调查员收集到大部分线索或计划弄死他时，邀请调查员“到自己的秘密基地看看”, meet: true, once: true, ruling: true, source: 守秘人须知}

mechanics:
  - name: 熔铸之血
    runs: 守秘人
    why: 调查员的配枪、匕首、保险柜里的 PPKdemo 与全线量产的附魔武器
    rules: |
      调查员柏林出发前领到的配枪已经激活（前主人谢尔曼被烧死的过程也算被命中，MP 自给自足）。每次用这把枪成功造成伤害都释放一次熔铸之血：用这把瓦尔特打中活物，调查员一定会死。
      用刻有熔铸之血的武器命中任何会流血的生物，会瞥见克图格亚的一角，朗读：“深暗的宇宙和刺骨的严寒将调查员包围，克图格亚作为唯一的炽热的太阳崩塌坠落，升腾的热力将调查员像一具死尸一样卷走，与卷走一捧灰烬无异。这就是生命一直以来与生成它们的宇宙所分享的力量，人的智慧与贪婪从跃跃欲试的火苗中诞生，现在你要与这无情的烈焰共舞与它融为一体，直面你的来处与归处。说到底，精神和意志只是毫无生气的肉团，在颅骨这口狭窄的坩埚里翻滚。灵魂不过是被沥干的虚无，它与物质是同一种东西。唯有金属永恒，唯有物质不灭，现在接受你那回归矿物灰和金属元素的命运，接受这来自宇宙的赐福与冷峻的爱，你是永恒不死的物质。”
      触发熔铸之血后理智检定 1D3/1D8。至多几天后，调查员在永生不死的幻觉中燃烧死亡（生效时间按血量计算，守秘人可灵活调整）。被命中者同样会被烧死。
      子弹算枪支的一部分；枪托钝击同样有效但转化效率一般；只对哺乳动物有效。
      持续接触附有已激活熔铸之血的物品会产生幻觉，守秘人按强度让调查员做最高不超过 1/1D4 的理智检定。
      申请换枪需过幸运检定，失败则换来的是附魔但未激活的枪（打空一个弹夹都安全，调查员无法确定）；拿走手下人的枪同样要过幸运检定，否则这些枪全都带熔铸之血。
  - name: 法术原文
    runs: 守秘人
    why: 《马克西米利安的炼金指南》与艾伯哈德、塞格利的法术
    rules: |
      生命薪柴：消耗与所得 MP 成正比的 HP，转化比例取决于武器材质；锻造武器无消耗。在精炼金属制成的匕首上刻咒文，致生物流血时吸取其生命力储存。
      熔铸之血：消耗 (5MP+1D4 理智)/每升血，生效时间按血液体积 24 小时/升。以足量血液完全浸泡骨质器具并注入魔力，血液燃烧、骨质物品转化为光滑的银白色赤钢。两种咒文形式，分别用生命薪柴或施法者自身 MP。赤钢是召唤克图格亚的关键材料。
      材料变温：按材料性质和体积（毫升）消耗 MP，对金属或热塑性材料局部加热或降温；对赤钢消耗最小。实验室铁门进出各花 2MP。
      艾伯哈德还会克图格亚请神术、炎之精召唤术、炎之精束缚术（规则书条目）。
