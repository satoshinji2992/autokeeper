  within: ferguson_house
  keeper: 唐纳德被打了镇静剂关在这里，是双胞胎的解剖对象；镇静剂麻痹了他的痛觉，在街上不大听得见惨叫。双胞胎很快会需要更多标本，拘禁的调查员也可能被关到这里。之后可能起火，整座房子烧毁。
