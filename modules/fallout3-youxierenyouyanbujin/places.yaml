- id: steakhouse_kitchen
  name: 牛排馆后厨
  read_aloud: 后厨里油烟呛人，几个厨工低头忙活，没人说话。水槽边一个胖大的男人围裙湿透，一遍遍洗着同一摞盘子。
  within: steakhouse
  keeper: 崩溃者奴隶在这里当厨师、洗碗工（阿诺德烹制青豆和秘酱，原店主伦纳德反复洗那点盘子）。除点单外的问题都会让店员非常紧张，谁被菲利克斯怀疑乱说话就会被暗中痛殴；奴隶们知道走漏教授和望远镜的事，亲朋就会遭报复。
