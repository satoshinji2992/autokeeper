locations:
- id: meeting_house
  name: 聚会的小屋
  art: meeting_house
  weather:
  - flicker
  public: true
  aliases:
  - 小屋
  - 调查员家
  - 聚会的地方
  read_aloud: 一间带门廊的木板小屋，客厅里摆着旧沙发和茶几，厨房的炉子上煮着咖啡。后门通向院子，卫生间在走廊尽头。窗外是大街的路灯。
  keeper: AutoKeeper 补充的开局地点（原文只说“某调查员家”）。开局麦克迪会绕屋找没关的门窗突入，先对落单者（煮咖啡、上厕所）动手；聆听成功可发现有人入室。之后可在这里歇脚、商量、打电话。
  features:
  - 门窗
  - 厨房
  - 电话
  - 门廊
  scene_root: true
  outdoors: false
  ground: building
  views:
  - key: meeting_porch_body
    label: 门廊上的尸体
    features:
    - 门廊
    prompt: 木板小屋的门廊，门灯亮着，几级木台阶通向大街，栏杆边堆着旧花盆，门虚掩着。
  looks:
  - when: knows:players:clue:c_mccurdy_body
    change: 门廊地板上躺着一具衣衫褴褛、满身污秽和伤疤的男尸，眼睛还睁着。
    'on': meeting_porch_body
- id: main_street
  name: 斯托威尔大街
  art: main_street
  public: true
  aliases:
  - 大街
  - 主街
  - 镇中心
  - 街上
  read_aloud: 斯托威尔的大街两旁是面包店、杂货店、药店、糖果店和五金店，阿尔的顶级车行的橱窗里摆着新福特。高高的电话线杆一路排开，街角有人在发传单。
  keeper: 枢纽地点，可问路。老头皮尔森常坐在电话线杆顶上窃听，对路人微笑挥手。可能遇到眼部带伤、喃喃说“天上的眼睛”的崩溃者，也可能遇到布拉德和托德在争论物理。
  features:
  - 电话线杆
  - 街角传单
  - 商店橱窗
  - 路过的镇民
  looks:
  - when: flag:chaos_dawn
    change: 大街上一片狼藉：橱窗破碎，门板被砸开，路上散落着翻倒的杂物
  - when: flag:sign_pole_tapping_1
    change: 电话线杆上多了一只悬挂的面包篮。
  - when: at:jensen:main_street
    change: 街边停着一辆沾满干泥的旧轿车，车门没锁，车头还挂着草屑。
  chase:
  - id: poles
    name: 电话线杆下
    look: 街边的电话线杆一根接一根
    place: main_street
  - id: barricade
    name: 筑起街垒的小巷
    look: 有人用家具和门板把小巷堵了一半
    obstacle:
      kind: hazard
      what: 街垒后面的守卫者
      skill: 闪避
      harm: 1D3
      methods:
      - id: dodge
        label: 躲着冲过去
        skill: 闪避
  - id: dogs
    name: 放出饿狗的院子
    look: 院门开着，狗链拖在地上
    obstacle:
      kind: hazard
      what: 见人就咬的饿狗
      skill: 闪避
      harm: 1D6
      methods:
      - id: dodge
        label: 躲开狗嘴
        skill: 闪避
  - id: sniper
    name: 屋顶下的路口
    look: 对面屋顶上坐着一个端枪的人
    obstacle:
      kind: hazard
      what: 屋顶上的狙击手
      skill: 幸运
      harm: 1D6
      methods:
      - id: luck
        label: 低头跑过去
        skill: 幸运
  - id: fire
    name: 街上的火障
    look: 街当中烧着一道火障
    obstacle:
      kind: hazard
