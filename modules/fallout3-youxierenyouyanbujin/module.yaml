start: meeting_house
start_time: D1 19:00
opening: '2 月 28 日，星期二，傍晚。斯托威尔镇的街灯一盏盏亮起，看上去和往常没什么两样。

  你们几个老同学聚在镇上一间小屋里，壶里煮着咖啡。最近几天，每个人都碰上了说不清的怪事：不接电话的亲人、莫名其妙的解雇、讲台上说着奴隶制的牧师、一夜之间翻脸的银行……你们想趁今晚把事情摊开说说。

  窗外很安静，安静得有点过头。

  '
