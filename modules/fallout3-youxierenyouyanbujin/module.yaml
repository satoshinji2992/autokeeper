id: fallout3-youxierenyouyanbujin
title: 有些人油盐不进
subtitle: 斯托威尔镇的望远镜
system: CoC7
era: 1920 年代
setting: 美国小镇斯托威尔（Stowell）
players: 2-6 人
duration: 一次到两次团
source: Paul Fricker 著，fallout3 译，秋叶 Exodus 供稿
license: 仅供个人跑团使用
hook: 你们都是斯托威尔镇上长大的同窗。这几天，镇上一个接一个的熟人变了样——有人不接电话，有人丢了工作，有人一夜之间变得冷漠或狂热。今晚你们聚在一起，想弄清楚到底出了什么事。
truth: '镇西的业余天文家梅尔文·哈特教授两周前用自制的新透镜，在昴星团附近发现一个暗弱星体，并借此接触到一个有意识的存在“大智慧”。通过望远镜看过大智慧的人，一半成为“有福者”：技能突飞猛进、彼此一眼认出、一心钻研各自的专长；另一半成为“崩溃者”：痴呆、驯顺或狂暴，被有福者奴役、关押、做实验或献祭。

  菲茨杰拉德牧师在会众中挑人，半夜“特别弥撒”后送去教授家看望远镜。副警长斯坦利·亚历山大操纵警察维持一切正常的假象，农民弗雷迪·詹森带匪帮替有福者干脏活。

  只要每晚至少一人看望远镜，联系就不会断。一旦望远镜被毁或教授一夜无法操作，次日黎明联系彻底断开：有福者发疯，失去神话技能和人性，24 小时内追杀一切无福者，第二天早晨最后挣扎后爆裂而死；崩溃者日出时昏倒，没被杀的几小时后恢复正常。

  '
keeper_notes: '【结构】洋葱式调查：表层（发觉异常的镇民）→ 崩溃者（话里有“天上的眼睛”“星星来的害怕”“大智慧！”，眼部有外伤病变）→ 有福者（对研究型有福者用话术/魅惑/恐吓/说服，建议极难，才说出教授和望远镜）→
  无妄之灾 → 有福者出击（警察与詹森匪帮搜捕，被俘者关警局、做实验、送詹森帮或送去看望远镜）→ 追根究底（一切指向教授家，但还不知望远镜）→ 洋葱心：教授家（全天有有福者和崩溃者守卫，发现闯入会抵挡并呼叫增援）。

  【开局】原文只说“把调查员召集到某调查员家讨论镇上情况”。AutoKeeper 补充：聚会地点定为镇上一处调查员租住的小屋（meeting_house），时间定为 D1（2 月 28 日，周二）晚上。开局事件（麦克迪突袭、副警长击毙、詹森收尸）按原文必然发生。

  【开局战斗】麦克迪属性同典型崩溃成人，想抓走一名调查员，先挑落单者；聆听成功发现有人入室，否则措手不及。约两三轮后斯坦利从背后开三枪击毙（必杀不掷骰）。守秘人应避免开幕死人。

  【催促玩家】玩家按兵不动时，可用各调查员背景事件加压（见各 NPC 与 events）：格兰达暂时清醒来电求救；唐纳德逃出地下室在街上觅食；弗格森家地下室起火，双胞胎一死一存，幸存者找调查员要求抚养；詹森开阿诺德的车进镇；阿诺德从牛排馆后门运垃圾；格拉迪斯逃出农场找丈夫；牧师帮警察制造冤案、赞成不审判就枪毙囚徒；路口姑娘发传单说雷蒙德将弹管风琴；伯奇认识的一名会众与牧师谈话后痴呆游荡，右眼血红、瞳孔散大；教堂音乐会（有福者通泰，崩溃者见奇形异色，常人觉刺耳）；全镇收音机只收到雷蒙德的音乐，电话交换台全天播放（有福者打电话时暂停）；被炒的牛排馆同事计划示威；伦纳德提斩肉刀和菲利克斯的人头追出牛排馆；银行执行员贴条“12
  小时内搬离”，12 小时后武装驱逐，可能枪战波及路人。

  【红鲱鱼】贝克妈妈菜的新菜好评如潮，但不是问题根源。

  【赫尔曼·谢伊】变装大师，可伪装成镇上任何人：扮成只是脸熟的镇民需极难侦查识破，扮成调查员更熟悉的人需常规侦查识破。

  【政府巡视员（可选）】深色套装、称卫生部门，采血量血压，话少官僚，无武装，受威胁找本地警察；无人干预最终会去见教授看望远镜。

  【调查员看望远镜】建议：自动崩溃，损失 1D8 理智，退出本次调查。可选内讧：投理智，失败失 1D8 并崩溃；成功则受福，获得 1D10 克苏鲁神话并失去等量理智，成为内奸（慎用）。

  【毁望远镜】有福者不惜代价保护但多数忙于研究。中断后有福者先混乱，再试图修复（教授需自家工作室大量备件，有备件一天内可造新镜）。可选延长：被毁后每过一小时，知情有福者发现新联系方式的几率 +1%；若无人发现望远镜被毁，次日黎明剧情自动发生。若调查员切断联系后想在黎明前离镇，守秘人应全力阻止；仍逃走则让玩家改用转用角色体验后续。

  【混沌黎明】一整夜无人看望远镜→黎明连接断开，有福者发疯，切断电话线，24 小时追猎；崩溃者昏睡，大量在睡梦中遇害。浓缩为几个场景：躲藏、逃走或杀出重围。各处调查员若分散且无约定集结点，用纸条分别汇报行动。躲藏、杀出重围、离镇与追逐障碍的规则见插件
  stowell_survival（规则全文亦附于下）。

  【追逐障碍】镇内：街垒（闪避）、饿狗（闪避）、屋顶狙击手（幸运不引起兴趣，伤害最多 1D6）、火障（跳跃）、暴雨浊流（敏捷）。车辆：倒树堵路（体格 6 以上车辆才能顶开或拖走；暴雨中汽车驾驶防掉沟撞树）、伪装难民堵路（汽车驾驶躲开，否则承受撞击）、斯坦利的警用路障（15
  点耐久）、道路狭窄弯曲需不停作汽车驾驶检定。

  【转用角色】调查员离镇或死亡后可改用格兰达、阿诺德、格拉迪斯、露希尔、伦纳德或清醒的詹森爪牙（属性见原文附录 A，玩家另选四项技能为基本值+20%）。

  【人物关系图】原图标有谁有福、谁崩溃，只在调查员弄清有福者/崩溃者之分后作为手稿给出。

  【原文出入】宾汉和弗格森一家受福日期，大事记写 2 月 25 日，镇民一节写 2 月 26 日，以大事记为准；转用角色一节把格兰达误写为“阿诺德·弗格森的妻子”，应为唐纳德。

  '
