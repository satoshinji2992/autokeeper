foreshadow:
- id: backdoor_latch_scratches
  hint: 后门的门闩上有几道新刮痕，像是有人从外面拿薄刀片一下下拨过；院子泥地里一个膝盖印还湿着，印子朝门口。
  where: meeting_house
  pays_off: e_mccurdy_attack
- id: pole_tapping
  hint: 街角的电话线杆上蹲着老头皮尔森，他把一只铜夹子夹在线上，凑着耳机直笑；你们经过时他朝你们挥手，又比了个“嘘”。
  where: main_street
  pays_off: k_blessed
  stages:
  - hint: 线杆上多挂了一只装着面包的篮子，皮尔森腾出一只手吃东西，另一只手始终按着耳机。
    flag: sign_pole_tapping_1
- id: side_door_three
  hint: 礼拜散场后，牧师把最后一排的三个人留下，领进侧门；他们再出来时右眼发红、瞳孔散得很大，彼此不说话，只点点头就各自走了。
  where: church
  pays_off: k_church
- id: empty_doghouse_counting
  hint: 门口的狗窝空着，铁链还挂在桩上；屋后窗里两个孩子一唱一和地数数：“一、二、三……你说青蛙的心有几个腔？”
  where: ferguson_house
  pays_off: k_blessed
  stages:
  - hint: 格兰达端着蛋糕走到屋后窗下，孩子们谁也没伸手接，她便一直端着，直到蛋糕上的热气散尽。
- id: steakhouse_back_door
  hint: 牛排馆后门的小巷里，一个戴厨师帽的人拖着两桶垃圾出来，听见脚步声就把帽檐压低，倒完桶匆匆退回门里，始终没抬头。
  where: steakhouse
  pays_off: k_broken
  stages:
  - hint: 店门口聚着几个被辞退的服务员和厨工，凑在一起低声商量，说要在店门前示威、讨回工钱；见了熟人，就招手让对方也来。
    when: flag:town_stage_2
