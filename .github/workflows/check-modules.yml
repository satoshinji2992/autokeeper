name: Check module contributions
on:
  pull_request:
    branches: [mod_library]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'autokeeper>=0.0.9.7'
      - name: Validate modules
        shell: bash
        run: |
          set -euo pipefail
          for module in modules/*/module; do
            autokeeper check "$module"
          done
          python tools/catalog.py .
