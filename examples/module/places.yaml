locations:
  - id: square
    name: 广场
    art: square
    weather: [fog]
    read_aloud: 广场中央立着钟楼，告示栏上贴着一张泛黄的告示。
    keeper: 枢纽地点，去哪儿都从这里走。
    features: [告示栏, 钟楼大门]
    scene_root: true                  # 主持区域的边界：广场和立在广场上的钟楼由同一位守秘人主持
    outdoors: true
    ground: street
  - id: tower
    name: 钟楼
    within: square
    read_aloud: 楼梯又窄又陡，顶上的齿轮间里传来咔哒声。守钟人坐在楼梯口打盹。
    keeper: 齿轮间里藏着东西。守钟人不愿多说。
    features: [齿轮间, 守钟人的柜子]
    outdoors: false
    ground: building
  - id: office
    name: 报社
    read_aloud: 报社档案室里堆满了旧报纸。
    features: [旧报合订本]
    scene_root: true                  # 报社另成一处现场
    # 追逐路线：从报社（和它里面的地方）起跑的追逐沿这条路跑。一段接着下一段；links 是岔路；
    # exit 是能脱身的地方，也是一条岔路的尽头，列在它后面的段要由 links 连过来。
    chase:
      - id: archive
        name: 档案室
        look: 旧报纸堆到天花板
        place: office
      - id: office_stairs
        name: 报社的楼梯
        look: 楼梯上也堆着一捆捆旧报
        place: office
        obstacle:                     # 险阻：边跑边过，失败耽搁、可能受伤，人还是下去了
          kind: hazard
          what: 堆着报纸的楼梯
          skill: 敏捷
          harm: 1D3
          methods:
            - {id: run, label: 冲下去, skill: 敏捷}
            - {id: slide, label: 顺着扶手滑下去, skill: 攀爬}
      - id: office_door
        name: 报社大门
        place: office
        obstacle:                     # 路障：过了检定才过得去
          kind: barrier
          what: 锁上的大门
          skill: 锁匠
          hp: 15                      # 规则书：坚固的外门 15
          methods:
            - {id: pick, label: 撬锁, skill: 锁匠, opens: true}
            - {id: shove, label: 撞开, skill: 力量, opens: true}
      - id: lamp_street
        name: 去广场的街
        look: 路灯一盏接一盏
        links: [back_alley]
      - id: fog_square
        name: 雾里的广场
        look: 告示栏在雾里只剩一个影子
        place: square
        exit: true
      - id: back_alley
        name: 报社后巷
        look: 垃圾桶挤在墙根，雾浓得看不见三步以外
        exit: true
    outdoors: false
    ground: building

# 通路：地点之间唯一的连通资料。within 只说包含，不代表走得通；门、楼梯、走廊和道路都写在这里。
# minutes 是普通经过的分钟数，室内几步路写 0；有门才写 gate（开团后的开闭只记在本局记录里）。
passages:
  - {id: square__tower, a: square, b: tower, kind: door, minutes: 0, gate: {open: true}}
  - {id: square__office, a: square, b: office, kind: road, minutes: 10}

# 建筑平面图：楼层和房间由编译期的「建筑内部」一步整理，layout（每样东西在哪）由「平面布局」一步定，不必手写。
# layout 的坐标单位是米，全楼各层同一张格子：x 由西向东、y 由北向南（和全镇地图一样上北下南）；墙是线，
# 两间并排时一间的东墙 x+w 就是另一间的西墙 x。门、窗的 at 是它在墙线上的中点。
plans:
  - building: office
    floors:
      - name: 一层
        rooms:
          - {place: office, label: 档案室}
    basis: 格式样例，手写
    layout:
      rooms:
        - {place: office, x: 0, y: 0, w: 8, h: 6}
      doors:
        - {passage: square__office, at: [0, 3], main: true}   # 正门开在西墙正中，朝着广场
        - {room: office, at: [8, 4.5]}                         # 原文没有通路的后门：写 room
      windows:
        - {room: office, at: [2, 6], width: 1.5}
        - {room: office, at: [5.5, 6], width: 1.5}
      fixtures:                                                # 每一项可调查的东西一条，feature 逐字照抄
        - {room: office, feature: 旧报合订本, label: 旧报合订本, sketch: shelf, x: 1, y: 0, w: 6, h: 0.5}
        - {room: office, label: 编辑桌, sketch: desk, x: 3, y: 2.5, w: 1.5, h: 0.8}   # 原文写到的家具，feature 留空
      sides:                                                   # 四面外面是什么，和全镇地图一致
        - {side: w, faces: 广场, place: square}
        - {side: n, faces: 树林}
        - {side: e, faces: 后巷}
        - {side: s, faces: 邻居的店铺}
      basis: 格式样例，手写

# 全镇地图：编译期的「全镇地图」一步按原书地图或原文方位定，不必手写。坐标 [x, y] 都在 0..1，
# x 由西向东、y 由北向南；地图宽是高的 1.5 倍。只写镇一级地点（within 为空的），房间有自己的平面图。
geography:
  title: 钟楼镇
  subtitle: 一九二〇年代
  minutes_across: 38                  # 编译时按通路分钟数和坐标算出
  places:
    - {place: square, at: [0.42, 0.5], glyph: street}
    - {place: office, at: [0.68, 0.42], glyph: public}
  ways:
    - {id: high_street, kind: main, street: square, points: [[-0.05, 0.56], [0.2, 0.54], [0.42, 0.5], [0.62, 0.5], [1.05, 0.47]]}
    - {id: square__office, kind: lane, passage: square__office, points: [[0.62, 0.5], [0.66, 0.46], [0.68, 0.42]]}
  regions:
    - {kind: woods, near: office, shape: [[0.74, 0.18], [0.9, 0.16], [0.93, 0.3], [0.78, 0.34]]}
  houses:
    - {along: high_street, span: [0.3, 0.7], density: dense}
  basis: 格式样例，手写
