locations:
  - id: square
    name: 广场
    art: square
    weather: [fog]
    read_aloud: 广场中央立着钟楼，告示栏上贴着一张泛黄的告示。
    keeper: 枢纽地点，去哪儿都从这里走。
    features: [告示栏, 钟楼大门]
    exits: [tower, office]
  - id: tower
    name: 钟楼
    within: square
    read_aloud: 楼梯又窄又陡，顶上的齿轮间里传来咔哒声。守钟人坐在楼梯口打盹。
    keeper: 齿轮间里藏着东西。守钟人不愿多说。
    features: [齿轮间, 守钟人的柜子]
    exits: [square]
  - id: office
    name: 报社
    read_aloud: 报社档案室里堆满了旧报纸。
    features: [旧报合订本]
    exits: [square]
