    performance: 把调查员今天做过的事编进布道词里，最后说“钟声会替我们作证”。
    read_aloud: 布道者登上台阶，所有人都抬头看钟。
    sanity: 0/1D3
    text: 布道者登台。
  - id: e_finale
    title: 午夜
    when: D1 22:00
    text: 钟多敲了一下。
    ending: toll
endings:
